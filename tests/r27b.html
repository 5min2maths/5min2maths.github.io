<script>
/* Revue des élèves joués du 27.11 (tools/revue_eleves_claude_27-11.md) : contrôles des 8 corrections (agent r27b).
   Les contrôles des points graves (1, 2) et moyens (3, 4) échouent sans la correction. */
const out = [], fail = [], ok = (c, m) => (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + m);
const fresh = (prof, o = {}) => { state = Engine.newState(prof); Engine.autoInit(state); state.placed = true; Object.assign(state, o); save(); return state; };
const _rq = renderQuestion; renderQuestion = function (q, opt) { window.__q = q; window.__o = opt; return _rq(q, opt); };
const P9 = { system: "CH", grade: 9, track: "college", minutes: 5 }, P10 = { system: "CH", grade: 10, track: "college", minutes: 5 };
const weak = () => { state.placeMiss = 3; state.last1 = [0, 1]; };
const sess = (fmt, plan, o = {}) => (session = Object.assign({ fmt, plan, i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), pinged: true }, o));
const answer = (solved, tries = solved ? 1 : 2) => { __o.onDone({ solved, tries, dontKnow: false }); __o.onNext(); };
const idOf = (e) => String(e).split("|")[0];
const yearOf = (id) => { const n = NOTIONS.find((x) => x.id === id), pl = n && placeOf(n, state.profile); return pl ? pl[0] : null; };
try {
  /* 1. Rejouer avec un chapitre « en classe » : la notion suivante (du chapitre, leçon pas vue) est posée sans leçon */
  fresh(P9); weak();
  const el = Object.keys(state.notions).filter((id) => GEN[id] && ["vu", "encours"].includes(state.notions[id].status));
  const [a1, a2] = el;
  Object.assign(state.notions[a1], { lessonSeen: true, seen: 2, m: 0.3 }); Object.assign(state.notions[a2], { lessonSeen: false, status: "encours", m: 0.4 });
  Engine.setNow(state, [a1, a2]);
  ok(Engine.lessonDue(state, a2) && Engine.struggling(state), "1. préalable : notion suivante du chapitre, leçon due (" + a2 + ")");
  const pr = Object.assign([a1 + "|2|rev", a2 + "|1|rev", a1 + "|1|rev"], { noLesson: true });
  ok(Engine.replayNext(state, pr, 0, a1, 2, "rev", { noLesson: true, fmt: "revision" }) === a1 + "|1|rev", "1. Révision sans leçon : la question ratée est rejouée");
  sess("revision", pr.slice(), { noLesson: true }); session.plan.noLesson = true; nextQuestion(); answer(false);
  ok(session.plan[1] === a1 + "|1|rev" && session.replayUsed, "1. dans l'app (Révision, chapitre en classe) : rejouée (" + session.plan.join(" ") + ")");
  ok(Engine.replayNext(state, [a1 + "|2|app", a2 + "|1|app"], 0, a1, 2, "app", { lessonAt: null, lessonDone: false, fmt: "app" }) === null, "1. la suivante ouvre vraiment une leçon : pas de reprise à sa place");
  ok(Engine.replayNext(state, [a1 + "|2|app", a2 + "|1|app"], 0, a1, 2, "app", { lessonAt: 0, lessonDone: true, fmt: "app" }) === a1 + "|1|app", "1. leçon de la séance déjà vue : la suivante n'en montrerait pas, rejouée");

  /* 2. 9e très faible sans chapitre, une seule notion travaillée : pas plus de 2 fois la même notion */
  const solo = () => { fresh(P9); for (const [id, s] of Object.entries(state.notions)) if (id !== "decread") s.status = "avenir";
    Object.assign(state.notions.decread, { status: "vu", seen: 4, m: 0.25, fails: 2, lessonSeen: true, due: day() }); state.elo.r = 890; state.placeMiss = 3; state.last1 = [0, 0, 0, 1, 0, 0]; state.strugDays = [addDays(day(), -1)]; };
  solo();
  let worst = 0, primS = 0;
  for (let k = 0; k < 10; k++) { solo(); const p = Engine.planSession(state, "auto"), c = p.filter((e) => idOf(e) === "decread").length; worst = Math.max(worst, c); if (p.some((e) => PRIM.isPrim(e))) primS++; }
  ok(worst <= 2 && primS === 10, "2. série d'automatismes d'un 9e en grande difficulté, une seule notion ouverte : au plus 2 fois decread (" + worst + "), rappels de primaire en complément (" + primS + "/10)");
  solo(); state.last1 = [1, 1, 1, 1, 1, 1, 1, 0]; state.placeMiss = 0; state.elo.r = 1000;
  const pm = Engine.planSession(state, "auto");
  ok(!pm.some((e) => PRIM.isPrim(e)), "2. élève qui n'est pas en grande difficulté : jamais de primaire (" + pm.join(" ") + ")");

  /* 3. Rappels de primaire : Mathélo 880–899, moins de 8 réponses récentes */
  solo(); state.last1 = [0, 0]; state.elo.r = 895; state.strugDays = [];
  ok(PRIM.applies(state), "3. Kevin (jour 2 : positionnement arrêté sur 3 ratés, 2 réponses, Mathélo 895, 1er jour en grande difficulté) : rappels de primaire");
  ok(Engine.planSession(state, "app").some((e) => PRIM.isPrim(e)), "3. … servis dans la séance");
  solo(); state.placeMiss = 0; state.last1 = [0, 1, 0, 0, 1, 0]; state.elo.r = 895; state.strugDays = [addDays(day(), -1)];
  PRIM.note && PRIM.note(state);
  ok(PRIM.applies(state), "3. 6 réponses, 33 %, 2e jour en grande difficulté, Mathélo 895 : rappels de primaire");
  solo(); state.placeMiss = 0; state.last1 = [0, 1, 0, 0, 1, 0]; state.elo.r = 895; state.strugDays = [];
  PRIM.note && PRIM.note(state);
  ok(!PRIM.applies(state), "3. premier jour en grande difficulté, Mathélo 895 : pas encore");
  solo(); state.placeMiss = 0; state.last1 = [1, 0, 1, 1, 0, 1, 1, 0, 1, 1]; state.elo.r = 870; state.strugDays = [addDays(day(), -1), day()];
  ok(!PRIM.applies(state), "3. élève moyen (70 %) : jamais de primaire");
  solo(); state.placeMiss = 0; state.last1 = [1, 0, 1, 0, 0, 1]; state.elo.r = 870; state.strugDays = [addDays(day(), -1), day()];
  ok(!PRIM.applies(state), "3. élève en mauvaise passe à 50 % : pas de primaire");

  /* 4. 10e moyen sans chapitre : au moins une notion propre à l'année par séance */
  const y10 = () => { fresh(P10); Engine.unlock(state, new Date("2026-11-27T12:00:00"));
    for (const id of Engine.eligible(state)) if (yearOf(id) < 10) Object.assign(state.notions[id], { seen: 3, m: 0.65, lessonSeen: true, status: "vu", due: day(), fails: 0 });
    /* 27.11 soir (décision n° 33) : ownYear ne pose qu'une notion de l'année déjà travaillée : les notions de 10e ouvertes l'ont été une fois */
    for (const id of Engine.eligible(state)) if (yearOf(id) === 10) Object.assign(state.notions[id], { seen: 1, m: 0.5, lessonSeen: true }); };
  y10();
  const ownN = Engine.eligible(state).filter((id) => yearOf(id) === 10).length;
  let have = 0, tot = 0, ownLes = 0;
  for (const f of ["revision", "auto", "app", "mixte"]) for (let k = 0; k < 6; k++) { y10(); const p = Engine.planSession(state, f); tot++; const o = p.filter((e) => yearOf(idOf(e)) === 10); if (o.length) have++; if (f !== "auto" && !p.noLesson) ownLes += p.filter((e) => Engine.lessonDue(state, idOf(e))).length > 1 ? 1 : 0; }
  ok(ownN >= 3 && have === tot, "4. 10e, novembre, sans chapitre : notion propre à l'année dans " + have + "/" + tot + " séances (" + ownN + " ouvertes)");
  ok(ownLes === 0, "4. jamais deux leçons dans une séance");
  y10(); Engine.setNow(state, Engine.eligible(state).filter((id) => yearOf(id) < 10).slice(0, 2));
  ok(Engine.ownYear && Engine.ownYear(state, ["x|1|rev", "y|1|rev", "z|1|rev"], "revision").join() === "x|1|rev,y|1|rev,z|1|rev", "4. chapitre « en classe » choisi : rien ne change");

  /* 5. Recorde pas en 9e */
  const kR = HISTOIRE.findIndex((H) => /1557/.test(H.titre));
  ok(kR >= 0 && !Histoire.ok(HISTOIRE[kR], { profile: P9 }) && Histoire.ok(HISTOIRE[kR], { profile: P10 }), "5. récit de Recorde : 10e oui, 9e non");

  /* 6. Série perdue : pas de « 0 j » */
  fresh(P9, { streak: { count: 3, last: addDays(day(), -4), best: 5 } }); screenHome();
  const chip = (app.querySelector(".streak-chip") || {}).textContent || "";
  ok(!/0\s*j/.test(chip) && /✏️/.test(chip), "6. en-tête après une absence : « " + chip.trim() + " »");
  fresh(P9, { streak: { count: 3, last: day(), best: 5 } }); screenHome();
  ok(/3\s*j/.test((app.querySelector(".streak-chip") || {}).textContent), "6. série en cours : « 3 j »");

  /* 7. Carnet : 3 questions en grande difficulté ; bilan juste */
  fresh(P9); weak(); state.carnet = el.slice(0, 5).map((id, i) => ({ id, d: 1, code: "c" + i, date: day(), ok: 0 }));
  ok(/\(3 questions\)/.test(carnetCard(true)), "7. grande difficulté : « Effacer mes erreurs (3 questions) »");
  Object.values(state.notions).forEach((n) => (n.lessonSeen = true)); startCarnet();
  ok(session.plan.length === 3, "7. séance du Carnet : 3 questions (" + session.plan.length + ")");
  fresh(P9); state.carnet = el.slice(0, 5).map((id, i) => ({ id, d: 1, code: "c" + i, date: day(), ok: 0 }));
  ok(/\(5 questions\)/.test(carnetCard(true)), "7. autre élève : 5 questions");
  fresh(P9); Object.values(state.notions).forEach((n) => (n.lessonSeen = true)); state.carnetOut = [day(), day()];
  state.carnet = el.slice(0, 3).map((id, i) => ({ id, d: 1, code: "c" + i, date: day(), ok: 0 }));
  startCarnet(); answer(true, 2); answer(false); answer(false);
  const h7 = (app.querySelector("h2") || {}).textContent || "", body7 = app.textContent;
  ok(/1 question réussie, pas encore effacée/.test(h7) && !/cette semaine/i.test(body7), "7. bilan du Carnet : « " + h7 + " », sans ligne « cette semaine »");

  /* 8. Leçon d'abord ; variété entre les jours */
  fresh(P9); Object.values(state.notions).forEach((n) => (n.lessonSeen = true));
  Object.assign(state.notions[a2], { lessonSeen: false, status: "encours", m: 0.3 });
  const pl8 = [a1 + "|1|drill", el[2] + "|1|app", a2 + "|2|defi"];
  ok(lessonAtStart(pl8) === 0 && idOf(pl8[0]) === a2, "8. leçon due en 3e position : sa question passe en tête, leçon d'abord (" + pl8.join(" ") + ")");
  fresh(P9); const e8 = Engine.eligible(state).filter((id) => GEN[id]); e8.forEach((id) => Object.assign(state.notions[id], { lessonSeen: true, status: "vu", m: 0.6, seen: 2, box: 1, due: addDays(day(), 1) })); Engine.setNow(state, e8.slice(0, 2));
  const tgt = e8[0]; let hit0 = 0, hit1 = 0;
  for (let k = 0; k < 30; k++) { if (Engine.planSlots(state, ["app"])[0].startsWith(tgt + "|")) hit0++; }
  state.notions[tgt].last = addDays(day(), -1);
  for (let k = 0; k < 30; k++) { if (Engine.planSlots(state, ["app"])[0].startsWith(tgt + "|")) hit1++; }
  ok(hit1 < hit0 || hit0 === 0, "8. notion réussie hier : moins souvent choisie aujourd'hui (" + hit0 + " → " + hit1 + " sur 30)");
  Object.assign(state.notions[tgt], { box: 0, due: day() }); let hit2 = 0;
  for (let k = 0; k < 30; k++) { if (Engine.planSlots(state, ["app"])[0].startsWith(tgt + "|")) hit2++; }
  ok(hit2 >= hit1, "8. notion ratée hier (due) : revient comme prévu (" + hit2 + " sur 30)");
} catch (e) { fail.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(0, 3).join(" ")); }
document.getElementById("out").textContent = fail.concat(out).join("\n") + "\n" + (fail.length ? fail.length + " ÉCHEC(S)" : "tout ok");
</script>
