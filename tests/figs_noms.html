<script>
const out=[], seen={};
const figLabels=(svg)=>{const L=new Set();for(const m of String(svg).matchAll(/<text[^>]*>([^<]{1,3})<\/text>/g)){const t=m[1].trim();if(/^[A-Z][′']?$/.test(t))L.add(t[0]);}return L;};
const textLetters=(q)=>{const L=new Set();const s=String(q).replace(/\\text\{[^}]*\}/g,"").replace(/\\(frac|sqrt|cdot|mathbf|left|right|widehat|overline|hat|vec|angle|parallel|perp|in|times|div|approx|pi|Delta|alpha|beta|gamma|circ|mathrm|quad|text)/g," ");
  for(const m of s.matchAll(/\\\((.*?)\\\)/g)) for(const c of m[1].matchAll(/[A-Z]/g)) L.add(c[0]);
  for(const m of s.replace(/\\\(.*?\\\)/g," ").matchAll(/(?:^|[^A-Za-zÀ-ÿ])([A-Z]{2,4})(?=[^A-Za-zÀ-ÿ]|$)/g)) for(const c of m[1]) L.add(c);
  for(const m of s.replace(/\\\(.*?\\\)/g," ").matchAll(/(?:point|sommet|angle|en|centre|côté|segment|droite)\s+([A-Z])(?![A-Za-zÀ-ÿ])/g)) L.add(m[1]);
  return L;};
let n=0;
for(const N of NOTIONS){ for(const lv of [1,2,3,4]){ for(let k=1;k<=25;k++){ let q; try{q=Engine.build(N.id,lv,k*389+lv);}catch(e){continue} if(!q||!q.fig) continue; n++;
  const F=figLabels(q.fig); if(F.size<2) continue; const T=textLetters(q.q+" "+(q.parts||[]).map(p=>p.label).join(" "));
  const extra=[...F].filter(x=>!T.has(x)), missing=[...T].filter(x=>!F.has(x));
  if(T.size&&extra.length){ const key=N.id+"-"+lv+":"+[...F].sort().join("")+"/"+[...T].sort().join(""); if(seen[key])continue; seen[key]=1;
    out.push(q.code+"  figure "+[...F].sort().join("")+"  énoncé "+[...T].sort().join("")+"  | "+String(q.q).replace(/<[^>]+>/g,"").slice(0,110)); }
  else if(!T.size&&F.size>=3){ const key=N.id+"-"+lv+":nonames"; if(seen[key])continue; seen[key]=1; out.push("(noms sur la figure, aucun dans l'énoncé) "+q.code+" figure "+[...F].sort().join("")+" | "+String(q.q).replace(/<[^>]+>/g,"").slice(0,100)); }
}}}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+n+" questions avec figure\n"+out.join("\n")+"</pre>");
</script>
