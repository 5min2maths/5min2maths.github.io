<!doctype html><meta charset="utf-8"><pre id="out">en cours</pre>
<script>window.MathJax={typesetPromise:()=>Promise.resolve()};</script>
<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script><script src="../src/expr.js"></script><script src="../src/figures.js"></script><script src="../src/geo.js"></script><script src="../src/generators.js"></script><script src="../src/gen2.js"></script><script src="../src/gen3.js"></script><script src="../src/variantes.js"></script><script src="../src/competences.js"></script><script src="../src/badges.js"></script><script src="../src/backup.js"></script><script src="../src/qr.js"></script><script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/dyn.js"></script><script src="../src/active.js"></script><script src="../src/sujet.js"></script><script src="../src/engine.js"></script><script>
// Banc de contrôle des variantes (14.11) : chaque modèle, 60 tirages. Réponse attendue acceptée (règle « résultat final »
// du CO comprise), pas de NaN / undefined, pas de question triviale. #ids=a,b pour filtrer.
try {
const SHOW = location.hash.includes("show"); const only = decodeURIComponent(location.hash.slice(1)).replace("show","").replace("last","").split(",").filter(Boolean), out = [], bad = [];
const toFrac = (v) => { for (let d = 1; d <= 400; d++) { const n = Math.round(v * d); if (Math.abs(n / d - v) < 1e-9) return (n < 0 ? "-" : "") + Math.abs(n) + (d > 1 ? "/" + d : ""); } return null; };
const sqf = (n) => { for (let k = 2; k * k <= n; k++) if (n % (k * k) === 0) return false; return true; };
const answerOf = (sp) => { if (sp.kind === "expr") return sp.expr;
  if (sp.kind === "set" || sp.kind === "pair") { const vs = sp.values.map((v) => (isTerm(v) ? String(+(+v).toFixed(8)).replace(".", ",") : toFrac(v))); return vs.length ? vs.join(" ; ") : "aucune"; }
  if (sp.kind === "value" && sp.sci) { const v = sp.value, e = Math.floor(Math.log10(Math.abs(v)) + 1e-9), m = +(v / 10 ** e).toFixed(6); return (Math.abs(v) >= 1 && Math.abs(v) < 10) ? String(+v.toFixed(6)).replace(".", ",") : String(m).replace(".", ",") + "*10^(" + e + ")"; }
  if (sp.kind === "value" && sp.radical) { const v = sp.value; if (isTerm(v)) return String(Math.round(v)); for (let b = 2; b < 400; b++) if (sqf(b)) { const a = v / Math.sqrt(b); if (Math.abs(a - Math.round(a)) < 1e-9) return (Math.round(a) === 1 ? "" : Math.round(a)) + "√" + b; } return null; } if (sp.kind === "value") { const v = sp.value; if (isTerm(v)) return String(+(+v).toFixed(8)).replace(".", ","); return toFrac(v) || String(v).replace(".", ","); } return null; };
const isTerm = (v) => Math.abs(v * 1e6 - Math.round(v * 1e6)) < 1e-6;
let nModels = 0, nDraws = 0;
for (const id of Object.keys(VAR)) { if (only.length && !only.includes(id)) continue;
  for (const lv of Object.keys(VAR[id])) VAR[id][lv].forEach((f, k) => { nModels++; let triv = 0, errs = new Set();
    for (let r = 0; r < 60; r++) { nDraws++; R.seed(r * 7919 + k * 31 + +lv * 104729 + id.length);
      let q; try { q = f(); } catch (e) { errs.add("exception " + e.message); continue; }
      const txt = String(q.q) + " " + String(q.sol);
      if (/NaN|undefined|Infinity|\[object/.test(txt)) errs.add("NaN/undefined : " + txt.slice(0, 120));
      if (!q.spec) { errs.add("pas de spec"); continue; }
      const sp = Object.assign({}, q.spec, q.spec.kind === "value" && !q.spec.round && !q.spec.sci && !["sci", "scicalc", "puiss"].includes(id) ? { final: true } : {}), a = q.canon && sp.kind === "expr" ? q.canon : answerOf(sp);
      if (a !== null) { const c = checkAnswer(sp, a); if (c.status !== "correct") errs.add("réponse « " + a + " » → " + c.status + " " + (c.message || "") + " | " + String(q.q).slice(0, 90)); }
      if (SHOW && r === 0 && lv !== "4" && (!location.hash.includes("last") || k === VAR[id][lv].length - 1)) out.push(id + " N" + lv + "." + (k + 1) + " | " + String(q.q).replace(/\\\(|\\\)/g, "").replace(/\\cdot/g, "·").replace(/\{,\}/g, ",").slice(0, 150) + "  ⇒ " + (q.spec.kind === "value" ? +(+q.spec.value).toFixed(6) : q.spec.expr));
      const tq = trivialQ(q, 0); if (tq) { triv++; if (triv === 4) errs.add("motif : " + tq + " | " + String(q.q).slice(0, 110)); }
    }
    if (triv > 3) errs.add("triviale " + triv + "/60");
    if (errs.size) bad.push(id + " N" + lv + " modèle " + (k + 1) + " : " + [...errs].slice(0, 3).join(" ;; "));
  });
}
out.push(nModels + " modèles, " + nDraws + " tirages, " + bad.length + " modèle(s) en défaut");
document.getElementById("out").textContent = out.concat(bad).join("\n");
} catch (e) { document.getElementById("out").textContent = "ERR " + e.stack; }
</script>
