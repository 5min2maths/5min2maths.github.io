<script>
/* Mesures du rapport tools/adaptivite_26-11.md (hors suite) : #part=robots&classes=9e,11e&semaines=14 ou #part=testeur */
(async function () {
  const H = decodeURIComponent(location.hash), opt = (k, d) => ((new RegExp(k + "=([^&]+)").exec(H) || [])[1] || d);
  const out = []; const t0 = _D.now();
  try {
    if (opt("part", "robots") === "robots") {
      const profs = opt("profils", "fort,moyen_regulier,faible_regulier,lent_jnsp,irregulier,difficulte").split(",");
      for (const cl of opt("classes", "9e,11e").split(","))
        for (const p of profs) for (const c of opt("classe", "0,1").split(",")) {
          const tr = opt("trace", "") ? [] : null;
          const r = SimEleves.simulate(cl, p, { semaines: +opt("semaines", 14), classe: c === "1", graine: +opt("graine", 7), trace: tr });
          if (tr) out.push(...tr);
          out.push(SimEleves.line(r) + (r.err.length ? " ERR " + r.err.join(";") : ""));
        }
    } else {
      window.Date = _D;
      /* #qui=Yanis : détail des questions posées (niveau, score de la question, ancienne ou non) */
      const qui = opt("qui", ""), trace = [];
      if (qui) { const ps = Engine.planSession.bind(Engine); Engine.planSession = (st, f) => { const pl = ps(st, f); trace.push(f + ":" + pl.map((e) => { const [id, d] = e.split("|"); return id + "|" + d + "|" + itemRating(st.profile, id, +d) + (Engine.isRecent(st, id) ? "" : "|anc"); }).join(",") + "|t" + (st.tadj || 0) + "|e" + st.elo.r + "|r" + Engine.recentRate(st) + "|n" + [...Engine.oldNeed(st)].length); return pl; }; }
      const R = await simulateClass({ seeds: opt("graines", "1,7,13,29,101").split(",").map(Number), students: qui ? [{ Yanis: { n: "Yanis", d: "", off: -50, days: (i) => ([0, 2, 3].includes(i) ? 1 : 0), pDK: 0.4, pEasy: 0.3, quit: null }, Lucas: { n: "Lucas", d: "", off: -250, days: (i, r) => (r() < 0.9 ? 1 : 0), pDK: 0.1, pEasy: 0, quit: null } }[qui]] : undefined });
      if (qui) out.push(trace.join(" "));
      out.push(...R.table.map((x) => JSON.stringify(x)), "erreurs " + JSON.stringify(R.errors));
    }
  } catch (e) { out.push("EXC " + e.message + " " + e.stack); }
  document.getElementById("out").textContent = out.join("\n") + "\n" + Math.round((_D.now() - t0) / 1000) + " s";
})();
</script>
