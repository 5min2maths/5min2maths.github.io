<!-- SECONDE MOITIÉ (notions de rang impair) : copie de tests/recalcul.html, seule la meta « part » change ; garder les deux pages identiques.
     Recalcul indépendant (26.11, après la canette « hauteur minimale » acceptée à 9,6 au lieu de 9,7) : chaque énoncé
     reconnu par un oracle (tests/recalc_oracles.js) est recalculé à partir des nombres de l'énoncé et comparé à la réponse
     attendue, à l'arrondi demandé (sens compris) et au corrigé. Échec = tout désaccord (code de la question).
     Passe 1 : toutes les notions, niveaux 1 à 3, graines 1 à 15 (repérage des notions reconnues, ≥ 20 % à un niveau, et
     contrôle « valeur exacte arrondie » partout). Passe 2 : notions reconnues, graines 16 à 100 (100 énoncés par notion et
     niveau). Puis exercices riches et défis (parties reconnues). Contre-épreuve : sur les 3 premières graines, la réponse
     attendue est faussée et l'oracle doit protester. Couverture : tools/recalcul.md.
     #n=100 ; #ids=pct,vitesse ; #detail : taux de reconnaissance par notion et niveau ; #mutant : contre-épreuve partout. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 100), N1 = Math.min(15, N), DET = P.has("detail"), MUTALL = P.has("mutant");
  const GR = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", theta: "θ", varphi: "φ", phi: "φ" };
  const prep = (s) => String(s == null ? "" : s).replace(/\\(alpha|beta|gamma|delta|theta|varphi|phi)\b/g, (m, g) => GR[g]).replace(/\\(sin|cos|tan)\b/g, "$1");
  const item = (q, id, d) => ({ id, d, code: q.code, raw: String(q.q || ""), fig: q.fig || "", txt: VRAI.plain(prep(q.q)), sol: VRAI.plain(prep(q.sol)), rawSol: String(q.sol || ""), spec: q.spec && q.spec.kind !== "multi" ? q.spec : null,
    parts: (q.parts || []).map((p) => ({ label: VRAI.plain(prep(p.label)), spec: p.spec || null })) });
  const mutate = (sp) => !sp ? sp : sp.kind === "value" ? { ...sp, value: Math.abs(sp.value * 0.2 + 0.7) < 1e-9 ? sp.value + 1 : sp.value * 1.2 + 0.7 } /* 26.11 : −3,5 est point fixe de v → 1,2v + 0,7 */ : sp.kind === "set" ? { ...sp, all: false, values: sp.all ? [1] : sp.values.length ? [sp.values[0] + 1, ...sp.values.slice(1)] : [1] } : sp.kind === "pair" ? { ...sp, values: [sp.values[0] + 1, ...sp.values.slice(1)] } : sp.kind === "ineq" ? { ...sp, value: sp.value + 1 } : sp.kind === "expr" ? { ...sp, expr: "(" + sp.expr + ")+1" } : sp.kind === "solset" ? { ...sp, ivs: sp.ivs.length ? sp.ivs.map((iv, i) => i ? iv : iv.map((e, j) => (j % 2 === 0 && e !== null && isFinite(e) ? e + 1 : e))) : [[0, true, 1, true]] } : sp;
  /* 26.11 soir (agent defis2) : 316 s sous charge après l'extension → deux pages. <meta name="part"> : 1 = notions de rang
     pair + exercices riches (recalcul.html), 2 = notions de rang impair + défis (recalcul2.html) ; sans meta ou avec #ids : tout. */
  const PART = +((document.querySelector('meta[name="part"]') || {}).content || 0);
  const t0 = performance.now(), ids = P.get("ids") ? P.get("ids").split(",") : PART >= 3 ? Object.keys(GEN).filter((id) => RECALC.IDS34.has(id)).filter((_, i) => i % 2 === PART - 3) /* pages 3 et 4 */ : Object.keys(GEN).filter((id, i) => !PART || (i % 2 === PART - 1 && !RECALC.IDS34.has(id) && !RECALC.IDSFRL.has(id) /* 27.11 (agent recalcfr) : notions propres au lycée français en page recalcul_frl.html */)) /* 27.11 (agent recalc34) : notions de tests/recalc_oracles34.js en page 3 */;
  const stat = {}, fails = [], exc = [];
  let nq = 0, nk = 0, nm = 0, nr = 0, nrk = 0; const rk = [];
  function run(id, d, k) {
    const s = (stat[id + "-" + d] = stat[id + "-" + d] || { n: 0, k: 0 });
    let q; try { q = Engine.build(id, d, k); } catch (e) { exc.push(id + "-" + d + "-" + k + " : " + e.message); return; }
    s.n++; nq++;
    const it = item(q, id, d);
    for (const sp of [q.spec, ...(q.parts || []).map((p) => p.spec), ...(q.guide || []).map((g) => g.spec)]) { const t = RECALC.truncSpec(sp); if (t) fails.push(q.code + " [valeur tronquée] " + t); }
    let r; try { r = RECALC.check(it); } catch (e) { exc.push(q.code + " (oracle) : " + e.message); return; }
    if (!r.length) return;
    s.k++; nk++;
    for (const c of r) if (c.msg) fails.push(q.code + " [" + c.rule + "] " + c.msg);
    if ((MUTALL || k <= 3) && it.spec && r.every((c) => !c.msg)) { /* contre-épreuve */
      nm++; let r2; try { r2 = RECALC.check({ ...it, spec: mutate(it.spec), parts: it.parts.map((p) => ({ ...p, spec: mutate(p.spec) })) }); } catch (e) { r2 = []; }
      if (!r2.some((c) => c.msg)) fails.push(q.code + " : contre-épreuve — réponse attendue faussée non détectée [" + r.map((c) => c.rule).join(", ") + "]");
    }
  }
  for (const id of ids) for (const d of [1, 2, 3]) for (let k = 1; k <= N1; k++) run(id, d, k);
  const rate = (id) => Math.max(...[1, 2, 3].map((d) => { const s = stat[id + "-" + d]; return s && s.n ? s.k / s.n : 0; }));
  const covered = ids.filter((id) => rate(id) >= 0.2);
  for (const id of covered) for (const d of [1, 2, 3]) for (let k = N1 + 1; k <= N; k++) run(id, d, k);
  /* exercices riches et défis (niveau 4) : parties reconnues */
  /* 26.11 soir (agent defis3) : 237 s sous charge avec 42 défis de plus → exercices riches en page 1, défis en page 2. */
  for (const x of VRAI.items({ n: Math.min(N, 20), src: PART === 1 ? ["riche"] : PART === 2 ? ["defi"] : PART >= 3 ? [] : ["riche", "defi"], ids: P.get("ids") ? ids : null }).items) {
    nr++;
    const it = { id: x.id, d: x.d, code: x.code, raw: x.raw, fig: x.fig, txt: x.txt, sol: x.sol, rawSol: "", spec: x.spec && x.spec.kind === "multi" ? null : x.spec, parts: x.parts };
    for (const sp of [x.spec, ...x.parts.map((p) => p.spec)]) { const t = RECALC.truncSpec(sp); if (t) fails.push(x.code + " [valeur tronquée] " + t); }
    let r; try { r = RECALC.check(it); } catch (e) { exc.push(x.code + " (oracle) : " + e.message); continue; }
    if (r.length) { nrk++; if (DET) rk.push(x.code); }
    for (const c of r) if (c.msg) fails.push(x.code + " [" + c.rule + "] " + c.msg);
    if (r.length && r.every((c) => !c.msg)) { nm++; let r2; try { r2 = RECALC.check({ ...it, spec: mutate(it.spec), parts: it.parts.map((p) => ({ ...p, spec: mutate(p.spec) })) }); } catch (e) { r2 = []; }
      if (!r2.some((c) => c.msg)) fails.push(x.code + " : contre-épreuve — réponse attendue faussée non détectée"); }
  }
  const uniq = [...new Set(fails)];
  const out = [(uniq.length || exc.length ? "ÉCHEC " : "ok ") + nq + " énoncés, " + nk + " recalculés, " + covered.length + " notions couvertes (≥ 20 % reconnus à un niveau, 100 énoncés par niveau), " + nrk + "/" + nr + " exercices riches ou défis recalculés, " + nm + " contre-épreuves, " + uniq.length + " désaccord(s), " + exc.length + " exception(s), " + Math.round(performance.now() - t0) + " ms"];
  for (const f of uniq.slice(0, 200)) out.push("  " + f);
  if (exc.length) out.push("EXC :\n  " + exc.slice(0, 30).join("\n  "));
  if (DET) out.push("  riches/défis recalculés : " + [...new Set(rk)].join(", "));
  if (DET) for (const id of ids.slice().sort((a, b) => rate(b) - rate(a))) out.push("  " + id + " : " + [1, 2, 3].map((d) => { const s = stat[id + "-" + d]; return s ? s.k + "/" + s.n : "-"; }).join("  "));
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
