<!-- Audit de vraisemblance (26.11) : tirages par notion et par niveau (GEN 1 à 3, défis, exercices riches, curieuses, histoire),
     contrôles automatiques de tests/vrai_checks.js. Grave (échec) : valeur cassée, triangle impossible, probabilité hors [0 ; 1],
     effectif non entier, grandeur négative, arrondi demandé sans tolérance, vitesse/âge/température invraisemblable…
     #n=40 (graines) ; #detail : tous les cas ; #ids=pyth,vitesse. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 40), DET = P.has("detail");
  const MINEUR = new Set(["montant à 1 décimale (mineur)"]);
  /* Cas relus et acceptés (clé|notion) : la vraisemblance a été jugée par l'auteur ou l'énoncé l'explique. */
  const OK = new Set(["point décimal|algopy" /* code Python : le point décimal est voulu */]);
  const t0 = performance.now();
  const { items, errs } = VRAI.items({ n: N, ids: P.get("ids") ? P.get("ids").split(",") : null });
  const byKey = {}, ex = {};
  for (const x of items) for (const [k, m] of VRAI_CHECK(x)) {
    if (OK.has(k + "|" + x.id)) continue;
    const kk = k + " | " + x.id + "-" + x.d; byKey[kk] = (byKey[kk] || 0) + 1; if (!ex[kk]) ex[kk] = x.code + " : " + m;
  }
  const keys = Object.keys(byKey).sort(), grave = keys.filter((k) => !MINEUR.has(k.split(" | ")[0]));
  const out = [(grave.length || errs.length ? "ÉCHEC " : "ok ") + items.length + " énoncés tirés (" + N + " graines), " + grave.length + " problème(s) grave(s), " + (keys.length - grave.length) + " mineur(s), " + errs.length + " exception(s), " + Math.round(performance.now() - t0) + " ms"];
  for (const k of keys) if (DET || !MINEUR.has(k.split(" | ")[0])) out.push((MINEUR.has(k.split(" | ")[0]) ? "  (mineur) " : "  ") + k + " ×" + byKey[k] + "  ex. " + ex[k]);
  if (errs.length) out.push("EXC :\n  " + errs.slice(0, 30).join("\n  "));
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
