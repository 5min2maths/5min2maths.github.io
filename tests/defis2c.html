<script>
// Défis propres à la 2e Collège (25.11, src/defis_2c.js) : 19 notions, 40 tirages chacune ; structure, valeurs finies et
// non triviales, réponse attendue acceptée par checkAnswer (forme comprise), code reproductible ; réservés à la 2e Collège.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const IDS = ["polydiv", "polyfact", "eqrat", "recip", "homog", "cercle", "modexp", "compo", "fracetage", "probrat", "bijection", "decomp", "polyexpr", "homogrec", "logbase", "cercletan", "expfrac", "vecteurs", "ineqpoly"];
const answer = (sp) => sp.kind === "value" ? String(sp.value) : sp.kind === "set" ? (sp.values.length ? sp.values.join(" ; ") : "aucune") : sp.kind === "pair" ? sp.values.join(" ; ") : sp.kind === "solset" ? SolSet.show(sp.ivs, false) : sp.expr;
try {
  const ids = Object.keys(PROBX).filter((id) => PROBX[id].some((f) => { const p = f(); return p.co && p.co[0] === 13; }));
  ok(IDS.every((id) => ids.includes(id)), "notions sans défi de 2e : " + IDS.filter((id) => !ids.includes(id)));
  let nq = 0;
  for (const id of IDS) {
    for (let s = 1; s <= 40; s++) {
      let q; try { q = Engine.build(id, 4, s); } catch (e) { fails.push(id + " " + s + " : EXC " + e.message); continue; }
      nq++;
      ok(q && q.parts && q.parts.length >= 2 && q.q && q.sol && q.hints && q.hints.length >= 2, id + " " + s + " : structure");
      const txt = q.q + " " + q.sol + " " + q.parts.map((p) => p.label).join(" ") + " " + q.hints.join(" ");
      ok(!/undefined|NaN|Infinity|null|\[object/.test(txt), id + " " + s + " : texte « undefined/NaN »");
      ok(!/[+-] -\d|\+ \+|- \+ /.test(txt.replace(/\\[a-z]+/g, "")), id + " " + s + " : signes doublés « " + (txt.match(/.{20}[+-] -\d.{10}/) || [""])[0] + " »");
      for (const p of q.parts) {
        const sp = p.spec, tag = id + " " + s + " " + p.label.slice(0, 30);
        if (sp.kind === "value") { ok(Number.isFinite(sp.value), tag + " : valeur non finie"); ok(!(sp.value === 0 || Math.abs(sp.value) === 1), tag + " : valeur triviale " + sp.value); }
        else if (sp.kind === "set" || sp.kind === "pair") ok(sp.values.every((v) => Number.isFinite(v) && v !== 0), tag + " : valeurs " + sp.values);
        else if (sp.kind === "solset") ok(sp.ivs.length >= 1 && sp.ivs.every((iv) => iv.length === 4 && !isNaN(iv[0]) && !isNaN(iv[2])), tag + " : intervalles");
        else if (sp.kind === "expr") { let v = NaN; try { const t = Expr.parse(sp.expr); v = [0.6, 2.2, -1.3, 4.1, -3.7].map((x) => Expr.evaluate(t, { x })).filter(Number.isFinite).length; } catch (e) {} ok(v >= 2, tag + " : expression " + sp.expr); }
        else ok(false, tag + " : genre " + sp.kind);
        let r; try { r = checkAnswer(sp, answer(sp)); } catch (e) { r = { status: "EXC " + e.message }; }
        ok(r.status === "correct", tag + " : réponse attendue refusée (" + answer(sp) + " → " + r.status + ")");
      }
      ok(Engine.fromCode(q.code).q === q.q, id + " " + s + " : code reproductible");
    }
    const st = (g, tr) => Engine.newState({ system: "CH", grade: g, track: tr, minutes: 5 });
    const q13 = Engine.make(st(13, "college"), id, 4), q12 = Engine.make(st(12, "college"), id, 4);
    ok(q13.co && q13.co[0] === 13, id + " : en 2e Collège, le niveau 4 est un défi de 2e");
    ok(!(q12.co && q12.co.includes(13)), id + " : pas de défi de 2e en 1re");
    const q14 = Engine.make(st(14, "college"), id, 4);
    ok(q14 && q14.q, id + " : en 3e, le niveau 4 donne une question (défi de 2e possible, 25.11)");
  }
  log.push(IDS.length + " notions, " + nq + " tirages");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC (" + fails.length + ") " + fails.slice(0, 25).join("\n") : "ok défis 2e Collège : " + log.join(" | ");
</script>
