<main id="app"></main><pre id="out">en cours</pre>` }, function () {
/* 27.11 (robustesse, mises à jour) : « Nouvelle version prête — Recharger » seulement à l'accueil et au bilan, jamais
   pendant une question ; rechargement automatique au retour dans l'app seulement sur l'accueil ou le bilan sans activité
   en cours ; recherche de mise à jour au plus toutes les 30 min. */
const fails = [], ok = (c, m) => { if (!c && fails.length < 30) fails.push(m); };
Element.prototype.scrollIntoView = function () {};
let reloads = 0;
try {
  Upd.reload = () => reloads++;
  statsSet(false);
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true;
  homeTab = "today"; screenHome();
  ok(!app.querySelector(".upd-line"), "rien à l'accueil sans mise à jour");
  ok(Upd.visible() === false && reloads === 0, "pas de rechargement sans mise à jour");
  /* mise à jour trouvée pendant que l'élève est à l'accueil */
  Upd.found();
  const L = app.querySelector(".upd-line");
  ok(L && L.getAttribute("role") === "status" && /Nouvelle version prête/.test(L.textContent) && document.getElementById("updgo"), "ligne affichée à l'accueil");
  ok(L && L.offsetHeight > 0 && L.offsetHeight < 130 && getComputedStyle(L).backgroundColor !== getComputedStyle(document.body).backgroundColor, "bandeau bleu bien visible, titre et phrase rassurante (" + (L && L.offsetHeight) + " px) — 27.11 : décision de l'enseignant, bleu plein");
  ok(app.scrollWidth <= app.clientWidth + 1, "ligne sans débordement");
  document.getElementById("updgo").click(); ok(reloads === 1, "« Recharger » recharge");
  /* pendant une question : rien */
  const q = Engine.finalize(state, "rel", Engine.build("rel", 2, 11));
  renderQuestion(q, { eyebrow: "Test", onDone: () => 3, onNext: () => 0, track: "" });
  ok(!app.querySelector(".upd-line"), "ligne affichée pendant une question");
  ok(Upd.visible() === false && reloads === 1, "rechargement pendant une question");
  /* retour à l'accueil, puis retour dans l'app : rechargement automatique */
  screenHome(); ok(app.querySelector(".upd-line"), "ligne de retour à l'accueil");
  ok(Upd.visible() === true && reloads === 2, "rechargement automatique au retour dans l'app (accueil)");
  /* séance en cours (accueil ouvert au milieu d'une séance) : pas de rechargement */
  let cap = null; const _rq = renderQuestion; renderQuestion = (qq, o) => { cap = { q: qq, o }; _rq(qq, o); };
  state.today = { date: day(), f: "auto" }; startSession();
  for (let g = 0; g < 3 && !cap; g++) { const go = document.getElementById("go"); if (!go) break; const pc = app.querySelector("#pc button"); if (pc) pc.click(); go.click(); }
  if (cap) { cap.o.onDone({ tries: 1, solved: true, dontKnow: false, ans: "1" }); session.answered = Math.max(1, session.answered || 0); }
  const keep = session; screenHome(); session = keep;
  ok(!homeBusy() || Upd.visible() === false, "rechargement au milieu d'une séance");
  /* bilan : ligne affichée, rechargement possible */
  session = null; cap = null; state.today = { date: day(), f: "auto" }; startSession();
  for (let g = 0; g < 30; g++) {
    if (app.querySelector(".lesson-card")) { const pc = app.querySelector("#pc button"); if (pc) pc.click(); const go = document.getElementById("go"); if (!go) break; cap = null; go.click(); continue; }
    if (!cap || !document.querySelector(".qtext")) break; const { o } = cap; cap = null; ok(!app.querySelector(".upd-line"), "ligne pendant la séance"); o.onDone({ tries: 1, solved: true, dontKnow: false, ans: "1" }); o.onNext(false);
  }
  renderQuestion = _rq;
  ok(document.getElementById("home") && app.querySelector(".upd-line"), "ligne au bilan");
  const r0 = reloads; Upd.visible(); ok(reloads === r0 + 1, "rechargement automatique depuis le bilan");
  /* recherche de mise à jour : au plus toutes les 30 min */
  let n = 0; Upd.reg = { update: () => { n++; return Promise.resolve(); } }; Upd.lastCheck = 0;
  const t = 1e12; ok(Upd.check(t) && n === 1, "recherche au retour"); ok(!Upd.check(t + 60000) && n === 1, "pas de 2e recherche avant 30 min"); ok(Upd.check(t + 31 * 60000) && n === 2, "recherche après 30 min");
  Upd.ready = false; Upd.lastCheck = 0; screenHome(); Upd.visible(); ok(n === 3 && !app.querySelector(".upd-line"), "retour sans mise à jour : recherche seulement");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(1, 3).join(" ")); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC mises à jour\n" + fails.join("\n") : "ok mises à jour : ligne à l'accueil et au bilan seulement, rechargement automatique au retour, recherche toutes les 30 min au plus";

/* 27.11 (robustesse, migrations de données). Profils enregistrés par des versions anciennes de l'app, reconstitués d'après
   l'historique du dépôt (forme de l'état à chaque époque) : ils doivent passer par bootState (démarrage de l'app) sans
   exception et sans perte (série, Mathélo, historique, notions vues, carnet, réglages, chapitre en classe, test),
   devenir de la version STATE_V, rester stables à un 2e démarrage, puis jouer une séance complète jusqu'au bilan. */
const fails = [], ok = (c, m) => { if (!c && fails.length < 40) fails.push(m); };
Element.prototype.scrollIntoView = function () {};
const T = day(), D = (n) => addDays(T, -n), clone = (x) => JSON.parse(JSON.stringify(x));
/* notions réelles du catalogue actuel (un profil ancien n'a que des notions qui existaient alors ; celles qui ont disparu
   du catalogue sont retirées par Engine.migrate, ce n'est pas une perte) */
function notionsOf(profile, k = 14) {
  const cat = Engine.catalog(profile), out = {}, cur = cat.filter((c) => c.current), old = cat.filter((c) => !c.current);
  old.slice(0, 6).forEach((c, i) => (out[c.id] = { status: "vu", m: 0.55 + 0.05 * i, box: 1 + (i % 3), due: D(i - 2), seen: i, ok: Math.max(0, i - 1) }));
  cur.slice(0, k - 6).forEach((c, i) => (out[c.id] = i < 3 ? { status: "encours", m: 0.4 + 0.1 * i, box: i, due: D(1), seen: 2 + i, ok: 1 + i } : i < 5 ? { status: "nonvu", m: 0, box: 0, due: D(3), seen: 0, ok: 0 } : { status: "avenir", m: 0, box: 0, due: T, seen: 0, ok: 0 }));
  return out;
}
const hist = (n) => Array.from({ length: n }, (_, i) => ({ date: D(n - i), n: 5 + (i % 3), score: 3 + (i % 2) }));
const P11 = { system: "CH", grade: 11, track: null, minutes: 5 }, P1C = { system: "CH", grade: 12, track: "college", minutes: 5 },
  PMP2 = { system: "CH", grade: 13, track: "mp", minutes: 5 }, P9 = { system: "CH", grade: 9, track: "college", minutes: 5 },
  PFR = { system: "FR", grade: 8, minutes: 5 }, PMP1 = { system: "CH", grade: 12, track: "mp", minutes: 5 };
const PROFILS = [
  /* 13.11 : premières versions (pas de compétences, de carnet, de chapitre en classe, de grades de l'année ; « pas encore » coché = nonvu ; voie vide au CO) */
  ["13.11 — 11e, premiers jours", { v: 1, profile: P11, notions: notionsOf({ ...P11, track: "college" }), streak: { count: 4, last: D(1) }, history: hist(6), created: D(14), elo: { r: 1180, n: 37, log: [[D(3), 1150], [D(1), 1180]] }, placed: true, votes: { "eq1-3-ab": "up" } }],
  /* 19.11 : compétences, badges, chapitre en classe (now), préparation de test ; pas encore de carnet ni de grades de l'année */
  ["19.11 — 1re Collège, avant le carnet", { v: 1, profile: P1C, notions: notionsOf(P1C), streak: { count: 9, last: T, best: 9 }, history: hist(10), created: D(10), elo: { r: 1420, n: 120, log: [[D(2), 1400]] }, placed: true,
    comps: { "eq1:0": { r: [1, 0.5, 1], n: 3, last: D(1) } }, badges: { first: D(9) }, badgesNew: [], now: { ids: Object.keys(notionsOf(P1C)).slice(6, 8), since: D(2) }, weeklyDone: "", freeScope: "all" }],
  /* 22.11 : carnet d'erreurs, instantanés ; avant les grades de l'année (yp) et placedOn ; MP 2e */
  ["22.11 — MP 2e, avant les grades de l'année", { v: 1, profile: PMP2, notions: notionsOf(PMP2), streak: { count: 2, last: D(1) }, history: hist(4), created: D(6), elo: { r: 1300, n: 44, log: [] }, placed: true,
    comps: {}, carnet: [{ id: Object.keys(notionsOf(PMP2))[6], d: 2, code: "x-2-ab12", date: D(1), ok: 0 }, { id: Object.keys(notionsOf(PMP2))[7], d: 1, code: "y-1-cd34", date: D(2), ok: 1, m: "signe oublié", a: "-3" }], carnetOut: [D(5)], snaps: [{ d: D(1), c: {}, k: [] }], tourDone: true, homeMode: "classe" }],
  /* 25.11 : grades de l'année (yp), réglages de lecture ; avant placedOn (série courte du 1er jour) ; 9e */
  ["25.11 — 9e, avant placedOn", { v: 1, profile: P9, notions: notionsOf(P9), streak: { count: 1, last: D(1) }, history: hist(2), created: D(2), elo: { r: 950, n: 12, log: [] }, placed: true, a11y: { fs: 1.15, font: 1, hc: 0 },
    yp: { k: ypKey(P9, T), c: "9e", pts: 57, d: D(1), dp: 20, ds: 1, past: [] }, gradeNo: { Pousse: 12 }, carnet: [], tourDone: true }],
  /* profil France (aperçu enseignant) avec préparation de test */
  ["France 4e", { v: 1, profile: PFR, notions: notionsOf(PFR), streak: { count: 3, last: D(1) }, history: hist(3), created: D(3), elo: { r: 1100, n: 30, log: [] }, placed: true, placedOn: D(3),
    prep: { ids: Object.keys(notionsOf(PFR)).slice(6, 8), date: addDays(T, 5) }, a11y: { fs: 1, font: 0, hc: 1 } }],
  /* MP 1re avec des champs abîmés (série et historique incomplets, notion sans nombres) ; et voie MP gardée au CO */
  ["MP 1re abîmé", { v: 1, profile: PMP1, notions: Object.assign(notionsOf(PMP1), { [Object.keys(notionsOf(PMP1))[0]]: { status: "vu" } }), history: [null, { date: D(1), n: 4, score: 2 }, { n: 3 }], created: D(4), elo: { r: 1250 }, placed: true }],
  ["MP gardée en 10e", { v: 1, profile: { system: "CH", grade: 10, track: "mp", minutes: 5 }, notions: notionsOf({ system: "CH", grade: 10, track: "college" }), streak: { count: 0, last: null }, history: [], created: D(1), elo: { r: 900, n: 0, log: [] }, placed: true }],
];

let cap = null; const _rq = renderQuestion; renderQuestion = (q, o) => { cap = { q, o }; _rq(q, o); };
function play(label) {
  cap = null; session = null; state.today = { date: T, f: "auto" }; startSession();
  let guard = 0, nq = 0;
  while (guard++ < 40) {
    if (app.querySelector(".lesson-card")) { const pc = app.querySelector("#pc button"); if (pc) pc.click(); const go = document.getElementById("go"); if (!go) break; cap = null; go.click(); continue; }
    if (!cap || !document.querySelector(".qtext")) break;
    const { o } = cap; cap = null; nq++;
    o.onDone({ tries: 1, solved: nq % 3 !== 0, dontKnow: false, ans: "1" }); o.onNext(false);
  }
  ok(nq >= 2, label + " : séance de " + nq + " questions");
  ok(!!document.getElementById("home"), label + " : pas de bilan en fin de séance (" + ((app.querySelector("h2") || {}).textContent || app.textContent.slice(0, 60)) + ")");
  return nq;
}
let nS = 0;
try {
  SYSTEMS.FR = SYSTEMS.FR || SYSTEMS_HIDDEN.FR;
  for (const [lab, P0] of PROFILS) {
    const raw = clone(P0);
    let s = null;
    try { s = bootState(clone(raw), false); } catch (e) { fails.push("EXC " + lab + " (démarrage) : " + e.message); continue; }
    ok(s && s.profile, lab + " : état perdu au démarrage");
    if (!s) continue;
    ok(s.v === STATE_V, lab + " : version " + s.v);
    ok(Engine.upgrade(s) === false, lab + " : 2e démarrage modifie encore l'état");
    /* sans perte */
    if (raw.streak) ok(s.streak.count === raw.streak.count && s.streak.last === raw.streak.last && (s.streak.best || 0) === (raw.streak.best || 0), lab + " : série " + JSON.stringify(s.streak));
    else ok(s.streak && s.streak.count === 0, lab + " : série par défaut");
    ok(s.elo.r === raw.elo.r && s.elo.n === (raw.elo.n || 0), lab + " : Mathélo " + JSON.stringify(s.elo));
    const hv = (raw.history || []).filter((x) => x && x.date && typeof x.n === "number");
    ok(s.history.length === hv.length && hv.every((x, i) => s.history[i].date === x.date && s.history[i].n === x.n), lab + " : historique");
    ok(s.created === raw.created, lab + " : date de création");
    for (const [id, n] of Object.entries(raw.notions)) {
      const m = s.notions[id];
      if (!m) { fails.push(lab + " : notion perdue " + id); continue; }
      /* une notion à venir peut s'ouvrir (Engine.unlock : statut « en cours », maîtrise de départ) : ce n'est pas une perte */
      if (typeof n.m === "number" && (n.seen > 0 || n.status === "vu")) ok(m.m === n.m && m.seen >= n.seen && m.ok === n.ok && m.box >= n.box, lab + " : notion " + id + " " + JSON.stringify(n) + " → " + JSON.stringify(m));
      ok(["vu", "encours", "avenir"].includes(m.status) || (m.status === "nonvu" && m.retry), lab + " : statut " + id + " " + m.status);
      ok([m.m, m.box, m.seen, m.ok].every((x) => typeof x === "number" && isFinite(x)), lab + " : nombres de " + id);
    }
    ok(Object.values(s.notions).filter((x) => x.seen > 0).length >= Object.values(raw.notions).filter((x) => x.seen > 0).length, lab + " : notions vues perdues");
    for (const k of ["carnet", "carnetOut", "a11y", "now", "prep", "comps", "badges", "gradeNo", "votes", "placedOn", "homeMode", "tourDone"]) if (raw[k] !== undefined) ok(JSON.stringify(s[k]) === JSON.stringify(raw[k]), lab + " : " + k + " " + JSON.stringify(raw[k]) + " → " + JSON.stringify(s[k]));
    if (raw.profile.track === "mp" && raw.profile.grade < 12) ok(s.profile.track === "college", lab + " : voie MP au CO");
    else if (raw.profile.system === "CH") ok(s.profile.track === (raw.profile.track || "college") && s.profile.grade === raw.profile.grade, lab + " : profil " + JSON.stringify(s.profile));
    else ok(JSON.stringify(s.profile) === JSON.stringify(raw.profile), lab + " : profil France " + JSON.stringify(s.profile));
    /* grades de l'année : reconstitués depuis l'historique (avant le 25.11) ou gardés */
    state = s; const y = ypSync(s);
    ok(y && y.pts >= 0 && (raw.yp ? y.pts >= raw.yp.pts : true), lab + " : points de l'année " + JSON.stringify(y));
    if (!raw.yp && hv.some((x) => x.date >= schoolYear(T) + "-" + YP.start)) ok(y.pts > 0, lab + " : points de l'année non reconstitués");
    /* réglages appliqués, accueil, code de sauvegarde */
    try { uiApply(); homeTab = "today"; screenHome(); ok(!!app.querySelector(".hub"), lab + " : accueil"); } catch (e) { fails.push("EXC " + lab + " (accueil) : " + e.message + " " + String(e.stack).split("\n")[1]); }
    if (raw.a11y) ok(JSON.stringify(a11yOf(s)) === JSON.stringify(raw.a11y), lab + " : réglages de lecture " + JSON.stringify(a11yOf(s)));
    try { const b = Backup.unpack(JSON.parse(JSON.stringify(Backup.pack(s)))); ok(b.streak.count === s.streak.count && b.elo.r === s.elo.r, lab + " : code de sauvegarde"); } catch (e) { fails.push("EXC " + lab + " (sauvegarde) : " + e.message); }
    /* enregistrement réel : Store → bootState (démarrage) → Store */
    Store.save(clone(raw)); const s2 = bootState(Store.load()); ok(s2 && Store.load().v === STATE_V, lab + " : état migré non enregistré");
    /* séance complète */
    const h0 = s.history.length, today0 = (s.history.find((x) => x.date === T) || { n: 0 }).n, st0 = s.streak.count;
    try { play(lab); nS++; } catch (e) { fails.push("EXC " + lab + " (séance) : " + e.message + " " + String(e.stack).split("\n").slice(1, 3).join(" ")); continue; }
    const ht = state.history.find((x) => x.date === T);
