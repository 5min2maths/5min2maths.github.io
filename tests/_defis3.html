<script>
(function(){try{
 const P=new URLSearchParams(location.hash.slice(1)),N=+(P.get("n")||150),SH=+(P.get("show")||2),ids=P.get("ids").split(",");
 const out=[];
 for(const id of ids){const S=new Set(),C={};let ex=[];const shown={};
  for(let s=1;s<=N;s++){let q;try{q=Engine.build(id,4,s);}catch(e){ex.push(s+": "+e.message);continue;}
   const key=q.q+" | "+(q.parts||[]).map(p=>p.label).join(" | ");S.add(key);const c=q.ctx||"?";C[c]=(C[c]||0)+1;
   const bad=(q.parts||[]).filter(p=>!p.spec||(p.spec.kind==="value"&&!isFinite(p.spec.value)));
   if(bad.length) ex.push(s+": valeur cassée "+bad.map(p=>p.label).join(";"));
   if((shown[c]||0)<SH){shown[c]=(shown[c]||0)+1;out.push("["+id+" "+c+" s"+s+"] "+VRAI.plain(q.q)+"\n   "+(q.parts||[]).map(p=>VRAI.plain(p.label)+" = "+(p.spec.kind==="value"?p.spec.value+(p.spec.round?" ±"+p.spec.round:""):JSON.stringify(p.spec))).join("\n   ")+"\n   SOL: "+VRAI.plain(q.sol));}
  }
  /* oracles */
  const {items}=VRAI.items({n:N,ids:[id],src:["defi"]});let nk=0,np=0,fails=[];
  for(const x of items){const it={id:x.id,d:x.d,code:x.code,raw:x.raw,fig:x.fig,txt:x.txt,sol:x.sol,rawSol:"",spec:null,parts:x.parts};
   let r;try{r=RECALC.check(it);}catch(e){fails.push(x.code+" EXC "+e.message);continue;}
   np+=x.parts.filter(p=>p.spec&&p.spec.kind==="value").length;nk+=r.length;for(const c of r)if(c.msg)fails.push(x.code+" ["+c.rule.slice(0,30)+"] "+c.msg);}
  out.push("== "+id+" : "+S.size+" énoncés, ctx "+JSON.stringify(C)+", oracles "+nk+"/"+np+" parties, "+fails.length+" désaccords, exc "+ex.length);
  out.push(...[...new Set(fails)].slice(0,8).map(f=>"   ! "+f),...ex.slice(0,5).map(e=>"   EXC "+e));
 }
 document.getElementById("out").textContent=out.join("\n");
}catch(e){document.getElementById("out").textContent="EXC "+e.stack;}})();
</script>
