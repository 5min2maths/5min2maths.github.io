<script>
const fails = [], log = [], ok = (c, m) => { if (!c && fails.length < 80) fails.push(m); };
try {
  const cat = (g) => Engine.catalog({ system: "FR", grade: g, track: "college" });
  /* Classe où la notion est apprise (FR[0]) : programme officiel en vigueur en 2026-2027. */
  const PLACE = {
    10: ["ensembles", "ineq", "absval", "racinv", "affzero", "cart", "droites", "droitesinter", "stats", "tabsignes", "tauxevol", "vect3e", "fref", "probcond", "algopy", "probaxiomes", "tabvar", "compdiff", "formule"],
    11: ["eq2disc", "f2", "f2formes", "trinfact", "ineq2", "inter", "optim", "suitedef", "suitearith", "suitegeo", "suitesomme", "tauxvar", "nbderive", "derivref", "derivregles", "derivprodquot", "tangente", "variations", "optimderiv", "posrelc",
      "expfn", "expderiv", "trigrad", "pscal", "droitenorm", "cercle", "probtot", "probarbre", "condbayes", "vaesp", "varalea"],
    12: ["suitelim", "recurrence", "limites", "limitinf", "asymptotes", "continuite", "tvi", "derivcomp", "derivseconde", "etudefct", "lnexp", "lnfr", "etudelnexp", "croissance", "trigfr",
      "primitives", "eqdiff", "integrale", "aireint", "intmaj", "intparties", "suiteint", "denombr", "combi", "binom", "binomiale", "sommeva", "vect3d", "colin", "droite3d", "plans", "posrel", "pscal3d", "distances", "compo"],
  };
  for (const [g, ids] of Object.entries(PLACE)) for (const id of ids) { const n = NOTIONS.find((x) => x.id === id); ok(n && n.FR && n.FR[0] === +g, id + " : classe FR " + (n && JSON.stringify(n.FR)) + " au lieu de " + g); }
  /* Notions « de l'année » : celles de la classe, plus les automatismes repris (againFR) ; jamais une notion d'une classe supérieure. */
  for (const g of [10, 11, 12]) { const c = cat(g);
    for (const x of c) { const n = NOTIONS.find((y) => y.id === x.id); ok(n.FR[0] <= g, g + " : notion d'une classe supérieure au catalogue : " + x.id); }
    for (const id of PLACE[g]) ok(c.some((x) => x.id === id && x.current), g + " : " + id + " n'est pas « de l'année »");
    log.push(["2nde", "1re", "Tle"][g - 10] + " : " + c.length + " notions, " + c.filter((x) => x.current).length + " de l'année"); }
  /* Hors programme français (ou écrites à la suisse) : jamais au catalogue du lycée */
  const HP = ["vecteurs", "sinlaw", "recip", "expo", "modexp", "trigcercle", "trigassoc", "trigfn", "trigeq", "log", "sys2", "sys3", "sysprob", "sysgraph"];
  for (const g of [10, 11, 12]) for (const id of HP) ok(!cat(g).some((x) => x.id === id), g + " : hors programme au catalogue : " + id);
  /* Second degré (sommet, discriminant, intersection parabole–droite) : pas en 2nde */
  for (const id of ["optim", "inter", "eq2disc", "f2", "trinfact", "pscal", "cercle"]) ok(!cat(10).some((x) => x.id === id), "2nde : " + id + " (1re) au catalogue");
  /* Vecteurs de 2nde : coordonnées, somme (Chasles), combinaison, colinéarité, alignement, norme ; distance et milieu (cart) */
  { const st = { profile: { system: "FR", grade: 10, track: "college" } }, cx = new Set();
    for (const d of [1, 2, 3]) for (let s = 1; s <= 60; s++) cx.add(Engine.make(st, "vect3e", d, s).ctx);
    for (const k of ["ab", "chasles", "combinaison", "norme", "determinant", "alignement"]) ok(cx.has(k), "vect3e : forme « " + k + " » absente en 2nde");
    const cc = new Set(); for (const d of [1, 2]) for (let s = 1; s <= 40; s++) cc.add(Engine.make(st, "cart", d, s).ctx);
    ok(cc.has("cart-n1-0") && cc.has("cart-n2-0"), "cart : distance ou milieu absents en 2nde"); }
  /* Formes hors programme de 2nde écartées (trinôme, radical, système, produit scalaire), présentes en 1re */
  const H10 = { eq2fact: ["ramener-zero", "trinome", "erreur", "facteur-num"], fimg: ["zeros-calcul", "preimage-tri", "axes-triangle"], racinv: ["sqrt-lin", "sqrt-param", "inv-aff"], droites: ["systeme"], cart: ["angle-droit"] };
  { const s10 = { profile: { system: "FR", grade: 10, track: "college" } }, s11 = { profile: { system: "FR", grade: 11, track: "college" } }; let n = 0;
    for (const [id, bad] of Object.entries(H10)) for (const d of [1, 2, 3]) for (let s = 1; s <= 40; s++) { const q = Engine.make(s10, id, d, s); n++; ok(!bad.includes(q.ctx), "2nde : forme hors programme tirée " + q.code + " (" + q.ctx + ")"); const r = Engine.make(s10, id, d); ok(!bad.includes(r.ctx), "2nde (tirage libre) : " + id + " " + r.ctx); }
    let tri = 0; for (let s = 1; s <= 40; s++) if (Engine.make(s11, "eq2fact", 2, s).ctx === "trinome" || Engine.make(s11, "eq2fact", 2, s).ctx === "ramener-zero") tri++;
    ok(tri > 0, "1re : eq2fact a perdu ses trinômes");
    for (let s = 1; s <= 40; s++) { const q = Engine.make(s11, "f2formes", [2, 3][s % 2], s); ok(!["canon-couple", "dev-k-a"].includes(q.ctx), "1re : forme canonique dans le cas général " + q.code); }
    log.push("formes hors programme contrôlées : " + n + " questions"); }
  /* Vocabulaire français au lycée : racine (et non zéro), courbe (et non graphe), coordonnées (et non composantes),
     antécédent, ordonnée à l'origine p, produit × (hors produit scalaire) */
  const T = (q) => [q.q, q.sol, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.parts || []).map((p) => p.label), ...(q.traps || []).map((t) => t.m), ...(q.hints || [])].filter((x) => typeof x === "string").join(" | ");
  const SW = { zero: /\bzéros? (?:de|du|\\\()|\b(?:le|un|son|les|ses|des) zéros?\b(?! (?:après|dans))/, graphe: /\bgraphes?\b/, composante: /\bcomposantes?\b/, preimage: /préimage/i, evidence: /en évidence/, h: /mx \+ h\b|\bh = y/, axe: /\baxe (?:horizontal|vertical)\b/, point: /\b[a-z]·[a-z]\b(?<![uvwn]·[uvwn])/ };
  { let n = 0; const seen = {};
    for (const g of [10, 11, 12]) { const st = { profile: { system: "FR", grade: g, track: "college" } };
      for (const c of cat(g).filter((x) => x.current)) for (const d of [1, 2, 3]) for (let s = 1; s <= 4; s++) { const q = Engine.make(st, c.id, d, s), t = T(q); n++;
        for (const [k, re] of Object.entries(SW)) if (re.test(t) && !seen[k + c.id]) { seen[k + c.id] = 1; ok(false, g + " : vocabulaire suisse (" + k + ") " + q.code + " « " + t.match(new RegExp(".{0,40}(?:" + re.source + ").{0,20}"))[0] + " »"); } } }
    log.push("vocabulaire contrôlé : " + n + " questions"); }
  for (const [a, b] of [["Détermine les zéros de \\(f\\).", "Détermine les racines de \\(f\\)."], ["Quel est son plus petit zéro ?", "Quelle est sa plus petite racine ?"], ["Le zéro est -2.", "La racine est -2."],
    ["On complète par des zéros.", "On complète par des zéros."], ["Compte tous les zéros.", "Compte tous les zéros."], ["Il y a 4 zéros.", "Il y a 4 zéros."], ["tangente au graphe de \\(f\\)", "tangente à la courbe de \\(f\\)"],
    ["h = y₀ − m·x₀", "p = y₀ − m × x₀"], ["2 u·v", "2 u·v"], ["AB · AC = 0", "AB · AC = 0"], ["le trajet en km/h", "le trajet en km/p"]]) {
    const r = frIdTxt("droites", frLocalQ(a), 11); ok(a === "le trajet en km/h" ? r === a : r === b, "frIdTxt « " + a + " » → « " + r + " »"); }
  ok(frIdTxt("droites", "Le zéro est -2.", 9) === "Le zéro est -2.", "zéro → racine appliqué au collège");
  /* Profils suisses : textes inchangés (zéro, graphe, h, ·) */
  { const st = { profile: { system: "CH", grade: 13, track: "college" } };
    for (const [id, re] of [["droites", /\bh\b/], ["fimg", /zéro|graphe/], ["trinfact", /zéro/]]) { let hit = false; for (let s = 1; s <= 30 && !hit; s++) for (const d of [1, 2, 3]) if (re.test(T(Engine.make(st, id, d, s)))) hit = true; ok(hit, "profil suisse modifié (" + id + ")"); } }
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? fails.map((m) => "ÉCHEC " + m).join("\n") + "\n" + log.join("\n") : "ok · " + log.join(" · ");
</script>
