     tests/_probe_anim.html#a=nug|count|shine|flame|chip|bar&t=MS&dark=1 : met l'écran en place, déclenche l'animation,
     puis fige TOUTES les animations à l'instant t (document.getAnimations()) ; tools/_gif_animations.py en fait des GIF. -->

<body><main id="app"></main>
<script>
const P = new URLSearchParams(location.hash.slice(1)), A = P.get("a") || "nug", T = +(P.get("t") || 0);
if (P.get("dark") === "1") document.documentElement.setAttribute("data-theme", "dark");
let seed = 7; Math.random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const _st = window.setTimeout; window.setTimeout = (f, ms, ...r) => (ms >= 500 && ms < 50000 ? 0 : _st(f, ms, ...r)); /* nettoyages différés (retrait des éléments) : pas pendant la capture */
window.MathJax = { typesetPromise: () => Promise.resolve() }; Element.prototype.scrollIntoView = function () {};
try { localStorage.clear(); } catch (e) {}
window.fetch = () => Promise.resolve(new Response("{}")); if (navigator.sendBeacon) navigator.sendBeacon = () => true;
</script>

<script>
const freeze = (t) => document.getAnimations().forEach((a) => { try { a.pause(); a.currentTime = t; } catch (e) {} });
const newSt = () => { homeTab = "today"; session = null; state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.tourDone = true; state.placed = true; state.homeVisits = 9; save(); };
const ids = () => Engine.catalog(state.profile).map((x) => x.id).filter((id) => GEN[id] && !isPrimId(id));
const pickQ = () => { for (const id of ids()) { const q = Engine.make(state, id, 2); if (q && !q.parts && !q.choices && !q.opts && !q.fig && !/\\\(|\$/.test(q.q + (q.sol || "")) && q.spec && typeof q.spec.value === "number") return q; } };
const good = (q) => { const v = q.spec.value; if (Math.abs(v * 1e6 - Math.round(v * 1e6)) < 1e-6) return String(+v.toFixed(6)); for (let d = 2; d <= 200; d++) { const n = Math.round(v * d); if (Math.abs(n / d - v) < 1e-9) return n + "/" + d; } return String(v); };
const sessQ = (id, i, n) => { session = { fmt: "revision", plan: Array.from({ length: n }, () => id + "|2|rev"), i, score: i, answered: i, start: Date.now() - 120000, elo0: state.elo.r, ids: new Set([id]) }; };
addEventListener("load", () => setTimeout(() => {
  newSt();
  if (A === "nug" || A === "bar") {
    const q = pickQ(); sessQ(q.id, 1, 4);
    nextQuestion = () => {}; /* rien après */
    renderQuestion(q, { eyebrow: "Révision · 2 sur 4" + '<span class="pbar" aria-hidden="true" data-done="50"><i style="width:25%"></i></span>', onDone: (res) => { ypAdd(state, ypPoints(2, res)); return 0; }, onNext: () => {} });
    for (const a of document.getAnimations()) a.finish(); /* le .pop de la carte est fini quand l'élève répond */
    document.getElementById("ans").value = q.canon || good(q); document.getElementById("check").click();
  } else if (A === "count") {
    const id = ids()[0]; sessQ(id, 4, 4); session.ypg = ypAdd(state, 14); state.streak = { count: 3, best: 5, last: day() }; screenSummary();
  } else if (A === "flame") {
    const id = ids()[0]; sessQ(id, 4, 4); session.ypg = ypAdd(state, 14); state.streak = { count: 4, best: 5, last: day() }; session.filonUp = true; screenSummary();
    const b = app.querySelector(".card.streak"); if (b) b.scrollIntoView = null, window.scrollTo(0, 0);
  } else if (A === "chip") {
    state.streak = { count: 4, best: 5, last: day() }; flameChip = true; screenHome();
  } else if (A === "home") {
    ypSync(); state.yp.pts = 1700; state.streak = { count: 4, best: 5, last: day() }; screenHome();
  } else if (A === "grades") {
    ypSync(); state.yp.pts = 1700; screenGrades();
  } else if (A === "shine") {
    const q = pickQ(); sessQ(q.id, 1, 3); renderQuestion(q, { eyebrow: "À polir · 2 sur 3", onDone: () => 0, onNext: () => {} });
    for (const a of document.getAnimations()) a.finish();
    toast("✨ Polie ! Une pépite de plus ✓", 60000, "shine");
  }
  requestAnimationFrame(() => freeze(T));
}, 300));
</script>
