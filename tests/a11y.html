<script>
/* 27.11 (accessibilité) : résultat et correction annoncés (zone aria-live="polite" présente avant la réponse) ;
   « réduire les animations » respecté (défilements smooth ramenés à auto, animations coupées, pas de confettis) ;
   écran de question au clavier (Tab : champ → pavé → « Vérifier », Entrée valide) ; tout bouton a un nom lisible
   (texte ou aria-label), sur l'accueil, la question (tous les pavés), le bilan, les Réglages et « Ce que l'app envoie ». */
const fails = [], ok = (c, m) => { if (!c && fails.length < 40) fails.push(m); };
const frA = (v) => { if (Math.abs(v * 1e6 - Math.round(v * 1e6)) < 1e-6) return String(+v.toFixed(6)); for (let d = 2; d <= 200; d++) { const n = Math.round(v * d); if (Math.abs(n / d - v) < 1e-9) return n + "/" + d; } return String(v); };
const opt = (o) => Object.assign({ eyebrow: "Test", onDone: () => 3, onNext: () => 0, track: "" }, o || {});
const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== "hidden" && !el.closest("[hidden]");
const focusables = () => [...document.querySelectorAll("a[href], button, input, textarea, select, summary, [tabindex]")].filter((el) => !el.disabled && el.tabIndex >= 0 && visible(el));
const accName = (el) => { const l = el.getAttribute("aria-label"); if (l) return l; const lb = el.getAttribute("aria-labelledby"); if (lb) return lb.split(/\s+/).map((i) => (document.getElementById(i) || {}).textContent || "").join(" "); return (el.textContent || "").trim() || el.getAttribute("title") || ""; };
const named = (where) => { const bad = [...app.querySelectorAll("button"), ...document.querySelectorAll("body > button")].filter((b) => visible(b) && !/[A-Za-zÀ-ÿ0-9]/.test(accName(b))).map((b) => "« " + (b.textContent || "").trim() + " » (" + (b.id || b.className || b.dataset.k || "") + ")"); ok(!bad.length, where + " : boutons sans nom lisible " + [...new Set(bad)].slice(0, 6).join(", ")); };
const key = (el, k) => el.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
try {
  Element.prototype.scrollIntoView = Element.prototype.scrollIntoView || function () {};
  statsSet(false);
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true;
  /* 1) Résultat et correction annoncés ; clavier */
  for (const [id, d, seed] of [["rel", 2, 11], ["eq1", 2, 3], ["prop", 1, 5]]) {
    let q; try { q = Engine.finalize(state, id, Engine.build(id, d, seed)); } catch (e) { continue; }
    if (!q || q.parts) continue;
    let done = null; renderQuestion(q, opt({ onDone: (r) => { done = r; return 3; } }));
    const fb = document.getElementById("fb"), inp = document.getElementById("ans"), chk = document.getElementById("check");
    ok(fb && fb.getAttribute("aria-live") === "polite" && !fb.textContent.trim(), id + " : zone d'annonce prête avant la réponse");
    const F = focusables(), iA = F.indexOf(inp), iK = F.findIndex((b) => b.closest("#kp")), iC = F.indexOf(chk);
    ok(iA >= 0 && iK > iA && iC > iK, id + " : ordre de tabulation champ " + iA + " → pavé " + iK + " → Vérifier " + iC);
    ok(![inp, chk, ...app.querySelectorAll("#kp button")].some((x) => x.tabIndex < 0), id + " : élément retiré de la tabulation");
    inp.focus(); ok(document.activeElement === inp, id + " : le champ prend le focus");
    inp.value = "123456789"; key(inp, "Enter");
    ok(document.getElementById("fb") === fb && /Pas encore|Presque|Pas cette fois|Pas tout/.test(fb.textContent), id + " : « Pas encore » annoncé (Entrée) : " + fb.textContent.trim().slice(0, 60));
    inp.value = frA(q.spec.value); key(inp, "Enter");
    ok(done && done.solved, id + " : Entrée valide la bonne réponse " + inp.value);
    ok(document.getElementById("fb") === fb && new RegExp(PRAISE.map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + "|Juste").test(fb.textContent), id + " : « Juste ! » annoncé : " + fb.textContent.trim().slice(0, 60));
    const nx = document.getElementById("nx"); ok(nx && focusables().includes(nx), id + " : « Continuer » atteignable au clavier");
    /* correction annoncée après un échec */
    renderQuestion(q, opt()); const fb2 = document.getElementById("fb"), i2 = document.getElementById("ans");
    i2.value = "123456789"; key(i2, "Enter"); i2.value = "123456788"; key(i2, "Enter");
    if (!document.getElementById("nx")) document.getElementById("idk").click();
    ok(fb2.getAttribute("aria-live") === "polite" && fb2.querySelector(".sol, #ssteps, #gsteps, .solfull"), id + " : correction dans la zone annoncée");
  }
  /* 2) Noms lisibles des boutons */
  homeTab = "today"; screenHome(); named("accueil");
  screenSettings(); named("Réglages");
  if (typeof screenPrivacy === "function") { screenPrivacy(() => 0); named("Ce que l'app envoie"); }
  const ids = Engine.catalog(state.profile).filter((c) => GEN[c.id]).map((c) => c.id);
  const kinds = {};
  for (const prof of [{ system: "CH", grade: 11, track: "college" }, { system: "CH", grade: 13, track: "college" }, { system: "CH", grade: 9, track: "college" }]) {
    const st = Engine.newState({ ...prof, minutes: 5 }); Engine.autoInit(st); state = st; state.placed = true; state.tourDone = true;
    for (const id of Engine.catalog(st.profile).filter((c) => GEN[c.id]).map((c) => c.id)) {
      let q; try { q = Engine.finalize(st, id, Engine.make(st, id, 2)); } catch (e) { continue; }
      if (!q) continue;
      const kk = q.parts ? "parts" : kpKey(q.choix > 1 && q.choix <= 9 && q.spec.kind === "value" ? { ...q.spec, choix: q.choix } : q.spec) + ":" + q.spec.kind;
      if (kinds[kk]) continue; kinds[kk] = id;
      renderQuestion(q, opt()); named("question " + id + " (" + kk + ")");
    }
  }
  ok(Object.keys(kinds).length >= 5, "pavés essayés : " + Object.keys(kinds).join(" "));
  /* bilan d'une séance */
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true;
  let cap = null; const _rq = renderQuestion; renderQuestion = (q, o) => { cap = { q, o }; _rq(q, o); };
  state.today = { date: day(), f: "auto" }; startSession();
  for (let g = 0; g < 30; g++) {
    if (app.querySelector(".lesson-card")) { named("leçon"); const pc = app.querySelector("#pc button"); if (pc) pc.click(); const go = document.getElementById("go"); if (!go) break; cap = null; go.click(); continue; }
    if (!cap || !document.querySelector(".qtext")) break; const { o } = cap; cap = null; o.onDone({ tries: 1, solved: true, dontKnow: false, ans: "1" }); o.onNext(false);
  }
  renderQuestion = _rq;
  ok(document.getElementById("home"), "bilan atteint"); named("bilan");
  /* 3) Réduire les animations */
  const MM = window.matchMedia; window.matchMedia = (q) => (/reduced-motion/.test(q) ? { matches: true, media: q, addEventListener() {}, removeEventListener() {} } : MM.call(window, q));
  const got = []; Element.prototype.scrollIntoView = function (a) { got.push(a); }; const sb = window.scrollBy; window.scrollBy = function (a) { got.push(a); };
  a11yMotion();
  document.body.scrollIntoView({ behavior: "smooth", block: "start" }); window.scrollBy({ top: 10, behavior: "smooth" }); document.body.scrollIntoView(true);
  ok(got.length === 3 && got[0].behavior === "auto" && got[0].block === "start" && got[1].behavior === "auto" && got[1].top === 10 && got[2] === true, "défilements smooth ramenés à auto : " + JSON.stringify(got));
  document.querySelectorAll(".burst").forEach((b) => b.remove()); burst(); ok(!document.querySelector(".burst"), "confettis malgré « réduire les animations »");
  window.matchMedia = MM; got.length = 0; document.body.scrollIntoView({ behavior: "smooth" }); ok(MM.call(window, "(prefers-reduced-motion: reduce)").matches || (got[0] && got[0].behavior === "smooth"), "sans réglage : smooth gardé");
  window.scrollBy = sb;
  /* règle générale de style.css (en file://, Chromium peut cacher les règles d'une feuille liée : contrôle alors sauté) */
  let css = false, lisible = false;
  for (const sh of document.styleSheets) { if (!/style\.css/.test(sh.href || "")) continue; let rs = []; try { rs = [...sh.cssRules]; lisible = true; } catch (e) {}
    for (const r of rs) if (r.media && /prefers-reduced-motion/.test(r.media.mediaText)) for (const x of r.cssRules) if (/^\*/.test(x.selectorText) && /animation-duration/.test(x.cssText) && /transition-duration/.test(x.cssText)) css = true; }
  ok(css || !lisible, "feuille de style : règle générale « réduire les animations »");
  /* 4) zone d'annonce des messages brefs */
  toast("essai"); const t = document.querySelector(".toast"); ok(t && t.getAttribute("role") === "status", "toast annoncé (role=status)");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(1, 3).join(" ")); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC accessibilité\n" + fails.slice(0, 25).join("\n") : "ok accessibilité : annonces, clavier, noms des boutons, animations réduites";
</script>
