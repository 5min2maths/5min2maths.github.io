<script>
// Leçons actives de la 3e et de la 4e Collège (act_col34.js, 24.11 ; copie de act_2c.html) : on joue chaque leçon. Devine, puis chaque défi :
// une réponse fausse (9999, ou la position de départ des curseurs) ne doit pas valider ; ensuite on cherche la bonne.
const log=[];const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return false;} e.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
const gfb=()=>document.querySelector('#gfb').textContent;
// Réponses candidates : entiers, fractions simples, quelques décimaux et grands nombres.
const C=[];for(let v=-100;v<=300;v++)C.push(String(v));
for(let q=2;q<=8;q++)for(let p=-40;p<=40;p++){if(p%q)C.push(p+"/"+q);}
for(let k=-2000;k<=2000;k++)if(k%100)C.push(String(k/100));for(let k=-999;k<=999;k++)if(k%10)C.push((k/1000).toFixed(3));
const typeAns=(sel,v)=>{const el=document.querySelector(sel+" .act-in");if(!el)return false;el.value=v;const b=el.closest(".act-ans").querySelector("[data-go]");b.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
let wrongOk=true;
const answer=(sel,b)=>{ // sel : zone qui contient le champ
  typeAns(sel,"9999"); if(gfb()!==b){wrongOk=false;return true;}
  for(const v of C){if(!document.querySelector(sel+" .act-in"))return gfb()!==b;typeAns(sel,v);if(gfb()!==b)return true;}return false;};
const ranges=()=>[...document.querySelectorAll('#play input[type=range]')];
const vals=(r)=>{const a=[];for(let v=+r.min;v<=+r.max+1e-9;v+=+r.step)a.push(+v.toFixed(6));return a;};
const setR=(i,v)=>{const r=ranges()[i];if(!r)return;r.value=v;r.dispatchEvent(new Event("input"));r.dispatchEvent(new Event("change"));};
const askIn=()=>document.querySelector('#play .s2c-ask .act-in');
const seek=()=>{const b=gfb();
  if(document.querySelector("#play .act-plus .act-in")) return answer("#play .act-plus",b); /* question ajoutée (A.plus) : les curseurs de la leçon restent affichés */
  if(ranges().length){
    const rs=ranges();setR(0,rs[0].value); if(gfb()!==b||askIn()){wrongOk=false;return true;}
    const V=rs.map(vals),n=V.length;
    const rec=(i)=>{if(i===n)return false;for(const v of V[i]){setR(i,v);if(gfb()!==b||askIn())return true;if(rec(i+1))return true;}return false;};
    rec(0); if(gfb()!==b) return true; if(askIn()) return answer("#play .s2c-ask",b); return false;}
  if(document.querySelector("#play .act-in")) return answer("#play",b);
  return false;};
const run=(id)=>{ try{ window.scrollTo=()=>{}; Element.prototype.scrollIntoView=function(){}; wrongOk=true; screenLesson(id,()=>{});
  const A=ACTIVE[id]; click('#pc button[data-i="'+A.predict.good+'"]'); const msgs=[];const X=actPrep(A);
  for(let k=0;k<X.defis.length;k++){ if(!seek()) msgs.push("défi "+(k+1)+" non trouvé"); else msgs.push(gfb().slice(2,50)); }
  const html=document.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g,"").replace(/<pre id="log"[\s\S]*?<\/pre>/,""); const bad=/NaN|undefined|Infinity/.test(html);
  const ok=!document.getElementById("s3").hidden&&!bad&&wrongOk&&!msgs.some(m=>/non trouvé/.test(m));
  log.push(id+" ["+X.mode+"] : "+(ok?"OK":"ÉCHEC "+(bad?"(NaN/undefined) ":"")+(wrongOk?"":"(réponse fausse acceptée) "))+" · "+msgs.join(" | "));
  }catch(e){log.push(id+" ERR ÉCHEC "+e.stack)} };
const IDS=["tauxvar","nbderive","derivref","derivregles","derivprodquot","derivcomp","tangente","variations","optimderiv","primitives","integrale","aireint","volrev","lnexp","croissance","matrices","translin","condbayes","varalea","binomiale","normale"];
for(const id of IDS){ if(ACTIVE[id]&&LESSONS[id]) run(id); else log.push(id+" : ÉCHEC (leçon active ou leçon absente)"); }
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");</script>
