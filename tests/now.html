<script>
// 25.11 : chapitre « en classe » deviné d'après la période de l'année, confirmé d'un geste ; sinon reconnu à un exercice typique.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const over = (root) => [...root.querySelectorAll("*")].filter((e) => e.scrollWidth > e.clientWidth + 1 && !["auto", "scroll"].includes(getComputedStyle(e).overflowX) && e.clientWidth > 0 && !e.closest("mjx-container, .figwrap, .fab-cmt") && !e.matches(".brand")).map((e) => e.className || e.tagName);
try {
  ok(Math.abs(schoolYearPart(new Date(2026, 10, 25)) - 0.33) < 0.03, "part de l'année au 25.11 : " + schoolYearPart(new Date(2026, 10, 25)));
  ok(schoolYearPart(new Date(2026, 7, 1)) === 0 && schoolYearPart(new Date(2027, 5, 20)) > 0.95, "bornes de l'année");
  for (const [g, tr] of [[9, "college"], [10, "college"], [11, "college"], [12, "college"], [13, "college"], [14, "college"], [15, "college"], [12, "mp"], [13, "mp"]]) {
    state = Engine.newState({ system: "CH", grade: g, track: tr, minutes: 5 }); Engine.autoInit(state); state.placed = true;
    const chs = nowChapters(), k = nowGuess(chs);
    ok(chs.length >= 2 && k >= 0, g + tr + " : chapitres " + chs.length);
    screenNow();
    ok(document.getElementById("nyes") && app.querySelector(".now-sample .qtext"), g + tr + " : devinette avec exemple");
    ok(app.querySelector("h3").textContent === chs[k].label, g + tr + " : chapitre deviné affiché");
    ok(!over(app).length, g + tr + " : rien ne dépasse (devinette) " + over(app).slice(0, 3));
    document.getElementById("nyes").click();
    ok(Engine.nowActive(state) && state.now.ids.every((id) => chs[k].ids.includes(id)) && state.now.ids.length <= 5, g + tr + " : « Oui » choisit le chapitre deviné");
    screenNow(); document.getElementById("nno").click();
    const cards = app.querySelectorAll(".now-card-pick");
    ok(cards.length === chs.length, g + tr + " : une carte par chapitre");
    ok([...cards].every((c) => c.querySelector(".now-sample")), g + tr + " : chaque carte a un exercice typique");
    ok(!over(app).length, g + tr + " : rien ne dépasse (cartes) " + over(app).slice(0, 3));
    const last = chs.length - 1; cards[last].click();
    ok(state.now.ids.every((id) => chs[last].ids.includes(id)), g + tr + " : une carte choisit son chapitre");
    screenNow(); document.getElementById("nno").click(); document.getElementById("adv").click();
    ok(app.querySelectorAll(".check input").length > 0, g + tr + " : choix avancé notion par notion");
  }
  /* chapitre maîtrisé sauté */
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  const chs = nowChapters(), k0 = nowGuess(chs); chs[k0].ids.forEach((id) => Object.assign(state.notions[id], { m: 0.9, ok: 5 }));
  ok(nowGuess(chs) === Math.min(k0 + 1, chs.length - 1), "chapitre maîtrisé : on propose le suivant");
  log.push("9 classes");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.slice(0, 12).join("\n") : "ok chapitre en classe : " + log.join(" | ");
</script>
