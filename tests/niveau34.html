<script>
// 25.11 soir (décision de l'enseignant) : 3e–4e du Collège, niveau MA1 (normal) ou MA2 (renforcé).
const fails = [], ok = (c, m) => { if (!c) fails.push(m); };
try {
  const ids = (p) => Engine.catalog(p).map((c) => c.id);
  const R = NOTIONS.filter((n) => n.niv === "R").map((n) => n.id);
  ok(R.length >= 5 && ["intparties", "intsubst", "eqdiff", "colin", "derivseconde"].every((x) => R.includes(x)), "notions MA2 marquées : " + R.join(", "));
  for (const g of [14, 15]) {
    const a = ids({ system: "CH", grade: g, track: "college", niv: "N" }), b = ids({ system: "CH", grade: g, track: "college", niv: "R" }), c = ids({ system: "CH", grade: g, track: "college" });
    ok(!a.some((x) => R.includes(x)), g + " MA1 : aucune notion MA2");
    ok(R.filter((x) => NOTIONS.find((n) => n.id === x).CH[0] <= g).every((x) => b.includes(x)), g + " MA2 : notions MA2 présentes");
    ok(b.length > a.length && c.length === a.length, g + " : MA2 ⊃ MA1, sans choix = MA1 (" + a.length + " / " + b.length + ")");
  }
  ok(ids({ system: "CH", grade: 13, track: "college" }).length === ids({ system: "CH", grade: 13, track: "college", niv: "R" }).length, "2e Collège : pas de distinction");
  ok(ids({ system: "CH", grade: 15, track: "mp" }).length === ids({ system: "CH", grade: 15, track: "mp", niv: "N" }).length, "MP : pas de distinction");
  /* écran */
  draft = { system: "CH", grade: 14, track: "college", minutes: 5 }; screenLevel();
  ok(document.getElementById("niv"), "choix MA1 / MA2 affiché en 3e Collège");
  document.getElementById("next").click(); ok(/Choisis ton niveau/.test(document.getElementById("niverr").textContent), "niveau obligatoire");
  draft = { system: "CH", grade: 13, track: "college", minutes: 5 }; screenLevel(); ok(!document.getElementById("niv"), "pas de choix en 2e");
  draft = { system: "CH", grade: 14, track: "mp", minutes: 5 }; screenLevel(); ok(!document.getElementById("niv"), "pas de choix en MP");
  draft = { system: "CH", grade: 15, track: "college", minutes: 5, niv: "R" }; screenLevel(); ok(document.querySelector('#niv [data-v="R"]').getAttribute("aria-pressed") === "true", "niveau gardé en changeant de classe");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.join("\n") : "ok niveau MA1 / MA2";
</script>
