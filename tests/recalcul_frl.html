<!-- 27.11 (agent recalcfr) : recalcul indépendant des niveaux 1 à 3 des notions PROPRES au lycée français (catalogue FR,
     classe 2nde à Tle, CH: null : suites, exponentielle, ln, produit scalaire, probabilités conditionnelles, loi binomiale,
     etc.), sur le modèle de recalcul.html. Chaque question est construite (Engine.build) puis finalisée pour un profil
     français de sa classe (Engine.finalize : €, consignes de forme exact / frac / final, comme l'élève la voit) ; les
     oracles de tests/recalc_oracles_frl.js la recalculent à partir de l'énoncé (et de la figure quand les données y sont).
     Échec : désaccord (réponse attendue, arrondi, corrigé, saisie refusée de la réponse recalculée), question non reconnue
     (toutes doivent l'être), valeur tronquée, exception, ou contre-épreuve non détectée (réponse attendue faussée sur
     chaque énoncé reconnu : l'oracle doit protester). #n=100 (graines par notion et niveau) ; #ids=lnfr,binom ; #detail ;
     #miss (exemples non reconnus ; #flat : texte lu par les oracles). Couverture : tools/recalcul.md. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 100), DET = P.has("detail"), MISS = P.has("miss");
  const GR = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", theta: "θ", varphi: "φ", phi: "φ" };
  const prep = (s) => String(s == null ? "" : s).replace(/\\(alpha|beta|gamma|delta|theta|varphi|phi)\b/g, (m, g) => GR[g]).replace(/\\(sin|cos|tan)\b/g, "$1");
  const item = (q, id, d) => ({ id, d, code: q.code, raw: String(q.q || ""), fig: String(q.fig || "") + (q.figure || ""), txt: VRAI.plain(prep(q.q)), sol: VRAI.plain(prep(q.sol)), rawSol: String(q.sol || ""), spec: q.spec && q.spec.kind !== "multi" ? q.spec : null,
    parts: (q.parts || []).map((p) => ({ label: VRAI.plain(prep(p.label)), spec: p.spec || null })) });
  const mutate = (sp) => !sp ? sp : sp.kind === "value" ? { ...sp, value: Math.abs(sp.value * 0.2 + 0.7) < 1e-9 ? sp.value + 1 : sp.value * 1.2 + 0.7 } : sp.kind === "set" ? { ...sp, all: false, values: sp.all ? [1] : sp.values.length ? [sp.values[0] + 1, ...sp.values.slice(1)] : [1] } : sp.kind === "pair" ? { ...sp, values: [sp.values[0] + 1, ...sp.values.slice(1)] } : sp.kind === "ineq" ? { ...sp, value: sp.value + 1 } : sp.kind === "expr" ? { ...sp, expr: "(" + sp.expr + ")+1" } : sp.kind === "solset" ? { ...sp, ivs: sp.ivs.length ? sp.ivs.map((iv, i) => i ? iv : iv.map((e, j) => (j % 2 === 0 && e !== null && isFinite(e) ? e + 1 : e))) : [[0, true, 1, true]] } : sp;
  /* notions propres au lycée français : classe FR ≥ 2nde, absentes du parcours suisse */
  const ALL = NOTIONS.filter((n) => n.FR && n.FR[0] >= 10 && !n.CH && GEN[n.id]).map((n) => n.id);
  const ids = P.get("ids") ? P.get("ids").split(",") : ALL;
  const t0 = performance.now(), stat = {}, fails = [], exc = [], miss = {};
  let nq = 0, nk = 0, nm = 0;
  for (const id of ids) {
    const n = NOTIONS.find((m) => m.id === id), st = { profile: { system: "FR", grade: n.FR[0] } };
    if (!RECALC.IDSFRL.has(id)) fails.push(id + " : notion sans oracle (tests/recalc_oracles_frl.js)");
    for (const d of [1, 2, 3]) for (let k = 1; k <= N; k++) {
      const s = (stat[id + "-" + d] = stat[id + "-" + d] || { n: 0, k: 0 });
      let q; try { q = Engine.finalize(st, id, Engine.build(id, d, k)); } catch (e) { exc.push(id + "-" + d + "-" + k + " : " + e.message); continue; }
      s.n++; nq++;
      const it = item(q, id, d);
      for (const sp of [q.spec, ...(q.parts || []).map((p) => p.spec), ...(q.guide || []).map((g) => g.spec)]) { const t = RECALC.truncSpec(sp); if (t) fails.push(q.code + " [valeur tronquée] " + t); }
      let r; try { r = RECALC.check(it); } catch (e) { exc.push(q.code + " (oracle) : " + e.message); continue; }
      if (!r.length) { const key = id + "-" + d; (miss[key] = miss[key] || []).push(q.code + " : " + (P.has("flat") ? RECALC._frl.flat(it.raw).slice(0, 400) : it.txt.slice(0, 150))); continue; }
      s.k++; nk++;
      for (const c of r) if (c.msg) fails.push(q.code + " [" + c.rule + "] " + c.msg);
      if (r.every((c) => !c.msg)) { /* contre-épreuve sur chaque énoncé reconnu */
        nm++; let r2; try { r2 = RECALC.check({ ...it, spec: mutate(it.spec), parts: it.parts.map((p) => ({ ...p, spec: mutate(p.spec) })) }); } catch (e) { r2 = []; }
        if (!r2.some((c) => c.msg)) fails.push(q.code + " : contre-épreuve — réponse attendue faussée non détectée [" + r.map((c) => c.rule).join(", ") + "]");
      }
    }
  }
  for (const key in miss) fails.push(key + " : " + miss[key].length + " énoncé(s) non reconnu(s), ex. " + miss[key][0]);
  const uniq = [...new Set(fails)];
  const out = [(uniq.length || exc.length ? "ÉCHEC " : "ok ") + ids.length + " notions du lycée français, " + nq + " énoncés (niveaux 1 à 3, " + N + " graines), " + nk + " recalculés, " + nm + " contre-épreuves, " + uniq.length + " désaccord(s), " + exc.length + " exception(s), " + Math.round(performance.now() - t0) + " ms"];
  for (const f of uniq.slice(0, 200)) out.push("  " + f);
  if (exc.length) out.push("EXC :\n  " + exc.slice(0, 30).join("\n  "));
  if (MISS) for (const key in miss) out.push("  MISS " + key + "\n    " + [...new Set(miss[key].map((s) => s.replace(/^\S+ : /, "")))].slice(0, 12).join("\n    "));
  if (DET) for (const id of ids) out.push("  " + id + " : " + [1, 2, 3].map((d) => { const s = stat[id + "-" + d]; return s ? s.k + "/" + s.n : "-"; }).join("  "));
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
