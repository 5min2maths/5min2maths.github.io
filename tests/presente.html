<script>
// Supports de présentation (25.11) : …/#decouvrir (élèves) et …/#parents ; vraie question, indices, mode présentation, 360 px, aucun envoi.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(f, ms = 4000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { const v = f(); if (v) return v; } catch (e) {} await wait(30); } return null; }
const over = (root) => [...root.querySelectorAll("*")].filter((e) => e.scrollWidth > e.clientWidth + 1 && !["auto", "scroll"].includes(getComputedStyle(e).overflowX) && e.clientWidth > 0 && !e.closest("mjx-container, .figwrap, .fab-cmt, .keypad") && !e.matches(".brand")).map((e) => (e.className || e.tagName) + " " + e.scrollWidth + "/" + e.clientWidth); /* .brand : 3 px de la bulle 💬 accrochée au titre, comme sur les autres écrans */
const txt = () => app.textContent.replace(/\s+/g, " ");
(async () => {
  try {
    /* 1. Élèves */
    history.replaceState(null, "", "#decouvrir"); ok(presentRoute() === true, "route #decouvrir");
    ok(app.querySelectorAll(".pz-s").length >= 6, "sections élèves : " + app.querySelectorAll(".pz-s").length);
    ok(app.querySelector("#pztry .qtext") && app.querySelector("#pztry .qtext").textContent.trim(), "vraie question affichée");
    ok(app.querySelector(".pz-qr svg"), "QR code");
    for (const g of [9, 10, 11, 12]) {
      app.querySelector(`#pzg1 button[data-v="${g}"]`).click();
      ok(app.querySelector("#pztry .qtext").textContent.trim(), "question en " + g);
      document.getElementById("pzans").value = "987654"; document.getElementById("pzok").click();
      ok(document.getElementById("pzfb").textContent.trim(), "retour après une réponse fausse (" + g + ")");
      const gb = document.getElementById("pzg"); if (gb) { gb.click(); ok(document.getElementById("pzgb").textContent.trim(), "aide pas à pas (" + g + ")"); }
    }
    ok(!over(app).length, "élèves : rien ne dépasse à 360 px : " + over(app).slice(0, 4).join(", "));
    app.querySelector(".pz-play").click(); ok(document.body.classList.contains("pz-on"), "mode présentation");
    app.querySelector(".pz-play").click(); ok(!document.body.classList.contains("pz-on"), "fin du mode présentation");
    log.push("élèves ok");
    /* 2. Parents */
    history.replaceState(null, "", "#parents"); ok(presentRoute() === true, "route #parents");
    ok(app.querySelectorAll(".pz-s").length >= 7, "sections parents");
    ok(/accompagner, pas surveiller/.test(txt()) && /ne verrez pas/.test(txt()), "ton : accompagner, ce qui n'est pas montré");
    for (const g of [9, 11, 12]) {
      app.querySelector(`#pzg2 button[data-v="${g}"]`).click();
      ok(app.querySelector("#pzsolve .qtext").textContent.trim(), "problème parent en " + g);
      const hb = document.getElementById("pzhint");
      if (hb) { hb.click(); ok(app.querySelectorAll("#pzhints .pz-hint").length === 1, "1er indice dévoilé (" + g + ")"); }
      ok(app.querySelector("#pzsolve .par-sol"), "solution repliée (" + g + ")");
    }
    ok(!over(app).length, "parents : rien ne dépasse à 360 px : " + over(app).slice(0, 4).join(", "));
    document.getElementById("pzgot").click(); await wait(50); ok(location.hash === "#parent", "J'ai reçu un lien → #parent");
    history.replaceState(null, "", location.pathname);
    log.push("parents ok");
    /* 3. Enseignants (25.11) */
    history.replaceState(null, "", "#enseignants"); ok(presentRoute() === true, "route #enseignants");
    ok(app.querySelectorAll(".pz-s").length >= 9, "sections enseignants : " + app.querySelectorAll(".pz-s").length);
    const cov = pzCoverage(); ok(cov.length === 11 && cov.every(([, n, ch]) => n >= 5 && ch >= 2), "couverture par classe : " + cov.map((c) => c.join(" ")).join(", "));
    ok(app.querySelectorAll(".pz-cov-r").length === cov.length, "barres de couverture");
    ok(app.querySelectorAll(".pz-loop-n").length === 5, "boucle d'une séance");
    ok(/ne fait pas/.test(txt()) && /plan d'études/i.test(txt()), "limites et programme présentés");
    for (const g of [9, 11, 12]) {
      app.querySelector(`#pzg3 button[data-v="${g}"]`).click();
      ok(app.querySelector("#pztry .qtext").textContent.trim(), "démo enseignant en " + g);
    }
    ok(!over(app).length, "enseignants : rien ne dépasse à 360 px : " + over(app).slice(0, 4).join(", "));
    await until(() => [...app.querySelectorAll(".pz-num")].every((e) => e.textContent.trim()), 1500);
    history.replaceState(null, "", location.pathname);
    ping("open"); ok(!window.__net.length, "aucun envoi réseau : " + window.__net.join());
    log.push("enseignants ok");
  } catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
  document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.join("\n") : "ok présentation : " + log.join(" | ");
})();
</script>
