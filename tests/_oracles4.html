<!-- SECONDE MOITIÉ (notions de rang impair) : copie de tests/recalcul.html, seule la meta « part » change ; garder les deux pages identiques.
     Recalcul indépendant (26.11, après la canette « hauteur minimale » acceptée à 9,6 au lieu de 9,7) : chaque énoncé
     reconnu par un oracle (tests/recalc_oracles.js) est recalculé à partir des nombres de l'énoncé et comparé à la réponse
     attendue, à l'arrondi demandé (sens compris) et au corrigé. Échec = tout désaccord (code de la question).
     Passe 1 : toutes les notions, niveaux 1 à 3, graines 1 à 15 (repérage des notions reconnues, ≥ 20 % à un niveau, et
     contrôle « valeur exacte arrondie » partout). Passe 2 : notions reconnues, graines 16 à 100 (100 énoncés par notion et
     niveau). Puis exercices riches et défis (parties reconnues). Contre-épreuve : sur les 3 premières graines, la réponse
     attendue est faussée et l'oracle doit protester. Couverture : tools/recalcul.md.
     #n=100 ; #ids=pct,vitesse ; #detail : taux de reconnaissance par notion et niveau ; #mutant : contre-épreuve partout. -->
<pre id="out">en cours</pre>
<script>
/* Hors suite (26.11 soir, agent defisch3) : couverture des oracles de défis par contexte (ctx).
   #ids=a,b&n=40 : pour chaque notion et chaque ctx, parties reconnues / parties numériques, désaccords, contre-épreuves. */
(function(){try{
 const P=new URLSearchParams(location.hash.slice(1)),N=+(P.get("n")||40),ids=P.get("ids").split(","),out=[];
 const GR={alpha:"α",beta:"β",gamma:"γ",delta:"δ",theta:"θ",varphi:"φ",phi:"φ"};
 const prep=(s)=>String(s==null?"":s).replace(/\\(alpha|beta|gamma|delta|theta|varphi|phi)\b/g,(m,g)=>GR[g]).replace(/\\(sin|cos|tan)\b/g,"$1");
 const mutate=(sp)=>!sp?sp:sp.kind==="value"?{...sp,value:Math.abs(sp.value*0.2+0.7)<1e-9?sp.value+1:sp.value*1.2+0.7}:sp.kind==="pair"?{...sp,values:[sp.values[0]+1,...sp.values.slice(1)]}:sp;
 let bad=0;
 for(const id of ids){const S={};
  for(let s=1;s<=N;s++){let q;try{q=Engine.build(id,4,s);}catch(e){out.push(id+" EXC "+e.message);bad++;continue;}
   const c=q.ctx||"?",st=(S[c]=S[c]||{n:0,parts:0,rec:0,fails:[],ex:null});st.n++;
   const it={id,d:4,code:q.code,raw:String(q.q||""),fig:q.fig||"",txt:VRAI.plain(prep(q.q)),sol:VRAI.plain(prep(q.sol)),rawSol:"",spec:null,parts:(q.parts||[]).map(p=>({label:VRAI.plain(prep(p.label)),spec:p.spec}))};
   if(!st.ex)st.ex=it.txt.slice(0,150)+" ¶ "+it.parts.map(p=>p.label).join(" | ").slice(0,250);
   st.parts+=it.parts.filter(p=>p.spec&&(p.spec.kind==="value"||p.spec.kind==="pair")).length;
   for(const p of q.parts||[]){const sp=p.spec;if(sp&&sp.kind==="value"&&sp.round){const k=sp.round,v=sp.value,r=Math.round(+(v/k).toPrecision(12))*k;if(Math.abs(r-v)>1e-9*Math.max(1,Math.abs(v)))st.fails.push(q.code+" valeur non arrondie "+v+" ("+k+")");}}
   let r;try{r=RECALC.check(it);}catch(e){st.fails.push(q.code+" oracle EXC "+e.message);continue;}
   st.rec+=r.length;for(const x of r)if(x.msg)st.fails.push(q.code+" ["+x.rule.slice(0,30)+"] "+x.msg);
   if(r.length&&r.every(x=>!x.msg)){const r2=RECALC.check({...it,parts:it.parts.map(p=>({...p,spec:mutate(p.spec)}))});if(!r2.some(x=>x.msg))st.fails.push(q.code+" contre-épreuve non détectée");}
  }
  for(const [c,st] of Object.entries(S)){const ok=st.rec===st.parts&&!st.fails.length;if(!ok)bad++;
   out.push((ok?"ok ":"!! ")+id+" / "+c+" : "+st.n+" tirages, "+st.rec+"/"+st.parts+" parties recalculées"+(st.fails.length?", "+st.fails.length+" désaccord(s)":""));
   if(!ok||P.has("ex"))out.push("     "+st.ex);for(const f of [...new Set(st.fails)].slice(0,6))out.push("     "+f);}
 }
 out.unshift((bad?"ÉCHEC ":"ok ")+ids.length+" notions");
 document.getElementById("out").textContent=out.join("\n");
}catch(e){document.getElementById("out").textContent="EXC "+e.stack;}})();
</script>
