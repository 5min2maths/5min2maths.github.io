<script>window.MathJax = { typesetPromise: () => Promise.resolve() }; try { localStorage.clear(); } catch (e) {}
window.fetch = () => Promise.resolve(new Response("{}")); if (navigator.sendBeacon) navigator.sendBeacon = () => true;</script>
<script src="_poids_data.js"></script>
<script>
/* 27.11 (agent poids, tools/poids.md) : poids de la version publiée (docs/, construite par build.py).
   27.11 (agent ordre) : docs/ = segments consécutifs des sources (docs/sNN.js), chaque classe exécute les siens dans
   l'ordre de JS (build.py).
   1. Plafonds du premier chargement (ce qu'un élève télécharge avant son premier écran, gzip) ; histoires, questions
      curieuses et présentations dans le paquet « x » seulement (jamais avant le premier écran).
   2. Les segments, mis bout à bout, redonnent exactement la liste JS de build.py (même ordre) ; chaque classe : une
      sous-suite croissante (ordre des sources).
   3. Pour chaque classe (9e–4e Collège, MP 1re–4e, France 6e–Tle) : avec SEULEMENT ses segments (dans l'ordre), chaque
      notion du catalogue a son générateur et donne des questions de chaque niveau sans erreur (une page fille par classe).
   Données : tests/_poids_data.js, écrit par build.py. Contrôle d'équivalence complet avec les sources (mêmes questions,
   leçons, registres de la classe) : python3 tools/poids.py ordre (lancé par tools/run_tests.sh). */
const PLAFOND_KO = { nouveau: 805, 11: 1420, 12: 1500, "13mp": 1870, fr8: 2140 }; /* 28.11 soir : 773 / 1387 / 1466 / 1839 / 2109 avec le contenu validé du jour (grands problèmes defis_sec2 +21 Ko, formes de 10e variantes +21 Ko, riche_10 +18 Ko, moteur +7 Ko) → même marge ≈ 30 Ko ; MAIS ce contenu propre à une classe est chargé par tous : découpage par classe à faire (/entretien poids, en tête de file) puis plafonds redescendus */ /* gzip ; mesures du 27.11 (agent ordre) : 696, 1290, 1369, 1741, 2011 ; 27.11 soir : 722 avec le logo Pépite² de l en-tête, plafond 740 ; 28.11 : 1324 (11e) et 1402 (1re) avec les figures de /contenu figures (105 formes) et la carte Mon niveau → plafonds 1355 et 1435 (même marge ≈ 30 Ko) */
const PROFILS = {
  9: { system: "CH", grade: 9, track: "college" }, 10: { system: "CH", grade: 10, track: "college" }, 11: { system: "CH", grade: 11, track: "college" },
  12: { system: "CH", grade: 12, track: "college" }, 13: { system: "CH", grade: 13, track: "college" }, 14: { system: "CH", grade: 14, track: "college" },
  15: { system: "CH", grade: 15, track: "college" }, "12mp": { system: "CH", grade: 12, track: "mp" }, "13mp": { system: "CH", grade: 13, track: "mp" },
  "14mp": { system: "CH", grade: 14, track: "mp" }, "15mp": { system: "CH", grade: 15, track: "mp" },
  fr6: { system: "FR", grade: 6 }, fr7: { system: "FR", grade: 7 }, fr8: { system: "FR", grade: 8 }, fr9: { system: "FR", grade: 9 },
  fr10: { system: "FR", grade: 10 }, fr11: { system: "FR", grade: 11 }, fr12: { system: "FR", grade: 12 },
};
const out = (t) => (document.getElementById("out").textContent = t);
const cle = new URLSearchParams(location.search).get("p");
if (typeof POIDS === "undefined") out("ÉCHEC tests/_poids_data.js absent : lancer python3 build.py");
else if (cle) fille(cle);
else mere();

function charge(src) { return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(src)); document.body.appendChild(s); }); }

function cleDe(p) { return p.system === "FR" ? "FR" : p.grade + (p.track === "mp" && p.grade >= 12 ? "mp" : ""); }
function segsDe(p) { return p ? POIDS.classes[cleDe(p)] : POIDS.commun; }

/* Page fille : une classe, ses segments dans l'ordre, puis toutes les notions du catalogue. */
function fille(k) {
  const errs = [];
  window.addEventListener("error", (e) => errs.push(String(e.message) + " " + (e.filename || "").split("/").pop() + ":" + e.lineno));
  const p = PROFILS[k], pq = segsDe(p);
  pq.map((i) => "../docs/" + POIDS.seg[i][0]).reduce((pr, s) => pr.then(() => charge(s)), Promise.resolve()).then(() => {
    const st = Engine.newState(p), cat = Engine.catalog(p), manq = [], err = [];
    for (const n of cat) st.notions[n.id] = Engine.newNotion("vu");
    for (const n of cat) {
      if (!GEN[n.id]) { manq.push(n.id); continue; }
      for (const lv of [1, 2, 3, 4]) {
        if (lv === 4 && !hasProb(n.id)) continue;
        for (const sd of [1, 2]) {
          try { const q = Engine.make(st, n.id, lv, sd); if (!q || typeof q.q !== "string" || !q.q.trim()) err.push(n.id + "-" + lv + " vide"); }
          catch (e) { err.push(n.id + "-" + lv + " " + e.message); }
        }
      }
    }
    parent.postMessage({ k, n: cat.length, pq, manq, err: err.slice(0, 5), errs: errs.slice(0, 5) }, "*");
  }, (e) => parent.postMessage({ k, n: 0, pq, manq: [], err: ["chargement " + e.message], errs }, "*"));
}

function mere() {
  const fails = [], ok = (c, m) => { if (!c && fails.length < 40) fails.push(m); };
  const F = POIDS.files, lignes = [];
  /* 1. plafonds */
  const premier = (p) => ["index.html"].concat(segsDe(p).map((i) => POIDS.seg[i][0]), ["start.js"]);
  const ko = (fs, i) => Math.round(fs.reduce((a, f) => a + (F[f] ? F[f][i] : NaN), 0) / 1024);
  for (const [k, max] of Object.entries(PLAFOND_KO)) {
    const fs = premier(k === "nouveau" ? null : PROFILS[k]), g = ko(fs, 1);
    ok(g <= max, k + " : premier chargement " + g + " Ko gzip > plafond " + max + " Ko");
    lignes.push(k + " " + g + " Ko");
  }
  const fx = POIDS.x.flatMap((i) => POIDS.seg[i][2]);
  for (const f of ["histoire.js", "curieux.js", "presente.js"]) ok(fx.indexOf(f) >= 0, f + " doit être dans le paquet x");
  ok(Object.values(POIDS.classes).concat([POIDS.commun]).every((L) => L.every((i) => POIDS.x.indexOf(i) < 0)), "paquet x requis avant le premier écran");
  /* 2. segments = liste JS, dans l'ordre ; classes : sous-suites croissantes */
  const pub = POIDS.seg.flatMap((s) => s[2]).concat(["app.js"]);
  ok(pub.join() === POIDS.JS.join(), "segments mis bout à bout ≠ liste JS de build.py");
  ok(POIDS.seg.every((s) => F[s[0]]), "segment manquant dans docs/");
  for (const [c, L] of Object.entries(POIDS.classes)) ok(L.every((x, j) => !j || x > L[j - 1]) && POIDS.commun.every((i) => L.indexOf(i) >= 0), c + " : segments hors de l'ordre des sources ou code commun incomplet");
  /* 3. une page fille par classe */
  const ks = Object.keys(PROFILS), res = {};
  let i = 0, cadre = null;
  window.addEventListener("message", (e) => {
    const r = e.data; if (!r || !r.k || res[r.k]) return;
    res[r.k] = r;
    ok(r.n >= 20, r.k + " : catalogue de " + r.n + " notions");
    ok(!r.manq.length, r.k + " : notions sans générateur avec les paquets " + r.pq.join(",") + " : " + r.manq.join(", "));
    ok(!r.err.length, r.k + " : " + r.err.join(" ; "));
    ok(!r.errs.length, r.k + " : erreurs JS " + r.errs.join(" ; "));
    if (cadre) { cadre.remove(); cadre = null; }
    suivante();
  });
  function suivante() {
    if (i >= ks.length) {
      return out(fails.length ? "ÉCHEC " + fails.join(" | ") : "ok poids (premier chargement gzip : " + lignes.join(", ") + ") ; " + ks.length + " classes, notions complètes avec leurs seuls segments");
    }
    cadre = document.createElement("iframe"); cadre.src = "poids.html?p=" + ks[i++]; cadre.style.display = "none"; document.body.appendChild(cadre);
  }
  suivante();
}
</script>
