<script>
// Signaux muets (20.11) : vérifie les lignes envoyées (envoi remplacé par une capture).
const sent = [], fails = [];
sigSend = (S) => sent.push({ ...S, t0: undefined, sec: S.sec != null ? S.sec : sigSec(S) });
const ok = (c, m) => { if (!c) fails.push(m); };
const last = () => sent[sent.length - 1];
try {
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  // 1. question en séance : 2 réponses fausses, pas à pas guidé, puis Continuer
  session = { fmt: "", plan: ["prio|1"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), pinged: true };
  let q = Engine.build("prio", 1, 7); q.kind = "";
  renderQuestion(q, { eyebrow: "t", track: "seance", onDone: () => 1, onNext: () => screenHome() });
  const inp = () => document.getElementById("ans");
  inp().value = "abc"; document.getElementById("check").click();
  inp().value = "999999"; document.getElementById("check").click();
  inp().value = "999998"; document.getElementById("check").click();
  const g = document.getElementById("guide") || document.getElementById("solstep"); if (g) g.click();
  document.getElementById("nx").click();
  let r = last();
  ok(r && r.ev === "q" && r.code === q.code, "1 code " + JSON.stringify(r));
  ok(r.issue === "faux" && r.essais === 2, "1 issue/essais " + r.issue + r.essais);
  ok(r.illis === 1, "1 illisible " + r.illis);
  ok(r.rep1 === "999999", "1 rep1 " + r.rep1);
  ok(r.aide.length > 0 && /[ge]/.test(r.aide), "1 aide " + r.aide);
  // 2. question quittée sans répondre (onglet / écran suivant)
  q = Engine.build("prio", 2, 8);
  renderQuestion(q, { eyebrow: "t", track: "seance", onDone: () => 1, onNext: () => 0 });
  screenHome();
  ok(last().issue === "quitte" && last().code === q.code, "2 quitte " + JSON.stringify(last()));
  // 3. juste du premier coup
  q = Engine.build("prio", 1, 9);
  renderQuestion(q, { eyebrow: "t", track: "seance", onDone: () => 1, onNext: () => screenHome() });
  inp().value = String(q.spec.value).replace(".", ","); document.getElementById("check").click();
  document.getElementById("nx").click();
  ok(last().issue === "ok1" && last().essais === 1, "3 ok1 " + JSON.stringify(last()));
  // 4. « Je ne sais pas » puis correction complète
  q = Engine.build("prio", 1, 10);
  renderQuestion(q, { eyebrow: "t", track: "test", onDone: () => 1, onNext: () => screenHome() });
  document.getElementById("idk").click(); document.getElementById("nx").click();
  ok(last().issue === "idk" && last().fmt === "test", "4 idk " + JSON.stringify(last()));
  // 5. consultation (#q-) : rien d'envoyé
  const n = sent.length;
  renderQuestion(Engine.build("prio", 1, 11), { eyebrow: "t", onDone: () => 0, onNext: () => 0 }); screenHome();
  ok(sent.length === n, "5 consultation envoyée");
  // 5 bis. bouton 💬 : code de la question dès l'affichage (avant toute réponse), puis de la leçon, puis titre de page
  q = Engine.build("prio", 2, 12); renderQuestion(q, { eyebrow: "t", track: "seance", onDone: () => 1, onNext: () => 0 });
  ok(pageCode() === q.code, "5b code question avant réponse " + pageCode());
  screenLesson(Object.keys(LESSONS)[0], () => 0); ok(pageCode() === "lecon-" + Object.keys(LESSONS)[0], "5b leçon " + pageCode());
  screenHome(); ok(/^page-/.test(pageCode()), "5b accueil " + pageCode());
  // 6. mot à la place d'un calcul : [texte]
  ok(sigRep("julie martin") === "[texte]" && sigRep("2sqrt(3)") === "2sqrt(3)" && sigRep("3/4") === "3/4", "6 sigRep");
  // 7. leçon active : devine, passer les défis, J'ai compris
  const act = Object.keys(ACTIVE).find((id) => LESSONS[id]);
  screenLesson(act, () => screenHome());
  document.querySelector("#pc button").click(); document.getElementById("skip").click(); document.getElementById("go").click();
  r = last();
  ok(r.ev === "lecon" && r.code === "lecon-" + act && r.issue === "lue" && /^[Dd]P$/.test(r.aide) && r.kind === "active", "7 leçon " + JSON.stringify(r));
  // 8. leçon par lien (#l-) : rien
  const m = sent.length; screenLesson(act, () => screenHome(), false, false); document.querySelector("#pc button").click(); document.getElementById("skip").click(); document.getElementById("go").click();
  ok(sent.length === m, "8 consultation leçon envoyée");
  // 9. problème : voir le corrigé
  const pid = NOTIONS.map((x) => x.id).find((id) => { try { return Engine.build(id, 4, 3).parts; } catch (e) { return false; } });
  if (pid) { const pq = Engine.build(pid, 4, 3); renderQuestion(pq, { eyebrow: "t", track: "semaine", onDone: () => 0, onNext: () => screenHome() }); document.getElementById("idk").click(); document.getElementById("nx").click();
    ok(last().issue === "idk" && last().code === pq.code, "9 problème " + JSON.stringify(last())); }
  else fails.push("9 aucun problème trouvé");
} catch (e) { fails.push("exception " + e.message + " " + e.stack); }
document.getElementById("out").textContent = (fails.length ? "ÉCHEC\n" + fails.join("\n") : "OK " + sent.length + " lignes") + "\n" + JSON.stringify(sent.slice(0, 3));
</script>
