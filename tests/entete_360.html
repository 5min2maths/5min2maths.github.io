<script>
/* 26.11 (captures de la présentation : « Classe MP 2e » à 412 px, roue ⚙️ coupée au bord droit) : l'en-tête de l'accueil
   tient à 360 px pour toutes les classes. La page se recharge dans un cadre de 360 × 640 et y mesure l'en-tête. */
if (window === top) {
  document.body.innerHTML = '<iframe src="entete_360.html#cadre" style="width:360px;height:640px;border:0"></iframe>';
  const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = "en cours"; document.body.appendChild(pre);
  window.addEventListener("message", (e) => { if (typeof e.data === "string" && e.data.startsWith("ent:")) pre.textContent = e.data.slice(4); });
} else window.addEventListener("load", () => {
  const out = [], fail = [];
  const ok = (c, m) => { (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + m); };
  try {
    app.style.width = "";
    const P = [];
    for (const g of [9, 10, 11, 12, 13, 14, 15]) P.push({ system: "CH", grade: g, track: "college", minutes: 5 });
    for (const g of [12, 13, 14, 15]) P.push({ system: "CH", grade: g, track: "mp", minutes: 5 });
    for (const g of [6, 7, 8, 9, 10, 11, 12]) P.push({ system: "FR", grade: g, track: "college", minutes: 5 });
    const bad = []; let n = 0;
    for (const prof of P) {
      state = Engine.newState(prof); Engine.autoInit(state); state.placed = true; state.streak = { count: 123, best: 123, last: day() }; save();
      homeTab = "today"; screenHome();
      const hd = app.querySelector(".home-head"), gear = document.getElementById("settings"); if (!hd || !gear) { bad.push(classTag(prof) + " : pas d'en-tête"); continue; }
      n++;
      /* rien ne se chevauche : nom de l'app, bouton commentaire, puis la rangée de droite (série, classe, roue) */
      const els = [...hd.querySelectorAll(".brand > *, .row > *")].filter((e) => getComputedStyle(e).display !== "none"), rs = els.map((e) => e.getBoundingClientRect());
      for (let k = 1; k < rs.length; k++) if (rs[k].left < rs[k - 1].right - 0.5) bad.push(classTag(prof) + " : chevauchement " + els[k - 1].tagName + "/" + els[k].tagName + " (" + Math.round(rs[k - 1].right) + " > " + Math.round(rs[k].left) + ")");
      const W = document.documentElement.clientWidth, r = gear.getBoundingClientRect(), hr = hd.getBoundingClientRect();
      if (r.right > W + 0.5 || r.right > hr.right + 0.5 || hd.scrollWidth > hd.clientWidth + 1 || document.documentElement.scrollWidth > W + 1) bad.push(classTag(prof) + " : roue à " + Math.round(r.right) + " / " + W + " (en-tête " + hd.scrollWidth + " / " + hd.clientWidth + ")");
    }
    ok(n === P.length && !bad.length, "en-tête à " + document.documentElement.clientWidth + " px : " + n + " classes, roue ⚙️ visible" + (bad.length ? " — " + bad.join(" | ") : ""));
  } catch (e) { fail.push("EXC " + e.message); }
  parent.postMessage("ent:" + fail.concat(out).join("\n") + "\n" + (fail.length ? fail.length + " ÉCHEC(S)" : "tout ok"), "*");
});
</script>
