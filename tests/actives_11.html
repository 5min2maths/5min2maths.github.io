<script>
/* ======== act_ch11c (ancienne page tests/act_ch11c.html) ======== */
Lot.section("act_ch11c", { html: `<main id="app"></main><pre id="log" hidden></pre>`, body: "width:400px" }, function () {
const log=[];const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return false;} e.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
// Chaque défi : on fait varier le curseur (d'abord vers le haut, puis vers le bas) jusqu'à ce que le message change.
const gfb=()=>document.querySelector('#gfb').textContent;
const C=[];for(let v=-12;v<=120;v++)C.push(v);
const seek=()=>{const b=gfb();const inp=()=>document.querySelector(".act-in");
if(inp()){for(const v of C){const el=inp();if(!el)return gfb()!==b;el.value=String(v);click("[data-go]");if(gfb()!==b)return true;}return false;}for(let i=0;i<70;i++){click('[data-st="x"][data-d="1"]');if(gfb()!==b)return true;}for(let i=0;i<160;i++){click('[data-st="x"][data-d="-1"]');if(gfb()!==b)return true;}return false;};
const run=(id)=>{ try{ window.scrollTo=()=>{}; Element.prototype.scrollIntoView=function(){}; screenLesson(id,()=>{});
  const A=ACTIVE[id]; click('#pc button[data-i="'+A.predict.good+'"]'); const msgs=[];
  for(let k=0;k<(typeof actPrep!=="undefined"?actPrep(A):A).defis.length;k++){ if(!seek()) msgs.push("défi "+(k+1)+" non trouvé"); else msgs.push(gfb().slice(0,60)); }
  const html=document.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g,"").replace(/<pre id="log"[\s\S]*?<\/pre>/,""); const bad=/NaN|undefined|Infinity/.test(html);
  log.push(id+" : "+(document.getElementById("s3").hidden||bad?"ÉCHEC "+(bad?"(NaN/undefined) ":""):"OK")+" · "+msgs.join(" | "));
  }catch(e){log.push(id+" ERR "+e.stack)} };
// rel, angles, thales, simil (et cercthales, proba le 24.11) : manipulations refaites le 23.11 (src/act_manip2.js), testées dans tests/manip.html.
for(const id of ["fracops","rac","thalesrec","repere","tabval","denombr","carres","pctvar"]) run(id);
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");
});
/* ======== act_litt11 (ancienne page tests/act_litt11.html) ======== */
Lot.section("act_litt11", { html: `<main id="app"></main><pre id="log" hidden></pre>`, body: "width:400px" }, function () {
const log=[];const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return;} e.dispatchEvent(new MouseEvent("click",{bubbles:true}));};
const st=(id,d,n)=>{for(let i=0;i<n;i++)click('[data-st="'+id+'"][data-d="'+d+'"]');};
const run=(id,pred,steps)=>{ try{ window.scrollTo=()=>{}; Element.prototype.scrollIntoView=function(){}; screenLesson(id,()=>{});
  click('#pc button[data-i="'+pred+'"]'); const msgs=[];
  for(const s of steps){ s(); msgs.push(document.querySelector('#gfb').textContent.slice(0,70)); }
  log.push(id+" : "+(document.getElementById("s3").hidden?"ÉCHEC (défis non réussis) "+(document.querySelector('.act-hint')||{}).textContent:"OK")+" · "+msgs.join(" | "));
  }catch(e){log.push(id+" ERR "+e.stack)} };
// reduire, distrib, idrem, factor : manipulations refaites le 23.11 (src/act_manip2.js), testées dans tests/manip.html.
run("litelab",1,[()=>st("n",1,3),()=>{st("n",1,1);st("n",-1,1);},()=>st("n",1,3)]);
run("valnum",1,[()=>st("x",1,4),()=>st("x",-1,10),()=>st("x",1,7)]);
run("monomes",1,[()=>{st("m",1,1);st("n",1,2);},()=>st("n",-1,2),()=>{st("m",1,1);st("n",1,2);}]);
run("parenth",1,[()=>{click('.act-num[data-i="0"]');click('.act-num[data-i="1"]');click('.act-num[data-i="2"]');click('#actok');},()=>click('#actok'),()=>{click('.act-num[data-i="0"]');click('.act-num[data-i="1"]');click('.act-num[data-i="2"]');click('#actok');}]);
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");
});
Lot.lance();
</script>
