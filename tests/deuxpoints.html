<pre id="out">en cours</pre><script>
// Deux-points ambigus (16.11) : après colonBreak, (1) « nombre : nombre » en texte simple, (2) « : » de ponctuation dans une formule
// (affiché ÷ par le préfiltre) : les deux membres du « : » contiennent « = ».
const out = [], hits = {};
const scan = (src, t) => { if (typeof t !== "string") return; const parts = t.split(/(\\\(.*?\\\))/);
  parts.forEach((p, i) => { if (i % 2) { const m = p.match(/=[^:]*\s:\s[^:]*=/); if (m && !/\\text/.test(p)) (hits[src] = hits[src] || []).push("MATH " + p.slice(0, 90)); }
    else { const plain = p.replace(/:\s*<br>/g, ":¶").replace(/<[^>]+>/g, " "); const m = plain.match(/.{0,30}[0-9)²³]\s:\s[-−0-9(].{0,25}/); if (m && !/h \d{1,2} : \d|\d h \d/.test(m[0])) (hits[src] = hits[src] || []).push("TEXTE " + m[0]); } }); };
for (const id of Object.keys(GEN)) for (const d of [1, 2, 3, 4]) for (let s = 1; s <= 25; s++) { let q; try { q = Engine.build(id, d, s); } catch (e) { continue; }
  [q.q, q.sol, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.traps || []).map((t) => t.m), ...(q.parts || []).map((p) => p.label), ...(q.hints || [])].forEach((t) => scan(id, t)); }
for (const [id, L] of Object.entries(LESSONS)) if (L && typeof L === "object") [L.intro, L.regle, L.piege, ...(L.exemple || [])].forEach((t) => scan("leçon " + id, t));
for (const [ch, C] of Object.entries(RICH)) for (const kind of ["ex", "raison"]) C[kind].forEach((f, k) => { for (let s = 1; s <= 20; s++) { R.seed(s); const x = f(); [x.q, x.sol, ...x.parts.map((p) => p.label)].forEach((t) => scan("riche " + ch, t)); } });
const ids = Object.keys(hits).sort((a, b) => hits[b].length - hits[a].length);
out.push(ids.reduce((n, k) => n + hits[k].length, 0) + " occurrences dans " + ids.length + " sources");
for (const k of ids) out.push(k + " (" + hits[k].length + ") : " + [...new Set(hits[k])].slice(0, 3).join("  ||  "));
document.getElementById("out").textContent = out.join("\n");
</script>
