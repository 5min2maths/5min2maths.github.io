<pre id="o"></pre><script>
const fine = new Set(FINE.map((f) => f.id)), out = [];
for (const n of NOTIONS) { if (fine.has(n.id)) continue; out.push("## " + n.id + " — " + n.label + " CH" + JSON.stringify(n.CH) + " MP" + JSON.stringify(n.MP));
  for (const d of [1, 2, 3]) for (let i = 0; i < 3; i++) { R.seed(d * 97 + i * 13 + 5); try { const q = GEN[n.id](d); out.push("  d" + d + " " + q.q.replace(/\\\(|\\\)/g, "").replace(/<[^>]*>/g, "").slice(0, 150)); } catch (e) { out.push("  d" + d + " ERR " + e.message); } } }
document.getElementById("o").textContent = out.join("\n");
</script>
