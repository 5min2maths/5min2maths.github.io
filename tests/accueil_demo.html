// Accueil (21.11) : exemple selon la classe (notions déjà vues), « Pas encore vu ça ? », pré-remplissage de l'étape 1.
const fails=[],ok=(c,m)=>{if(!c)fails.push(m)};Element.prototype.scrollIntoView=function(){};
const yr=(id)=>{const n=NOTIONS.find(x=>x.id===id);return n&&n.CH?n.CH[0]:99};
try{
 state=null;demoGrade=null;demoSkip=[];
 for(let k=0;k<30;k++){screenWelcome();const ch=document.querySelector("#demo .chip").textContent;}
 ok(demoPoolFor(null).every(([id])=>DEMO_BASE.includes(id)),"1 sans classe : bases seulement");
 const log=[];
 for(const g of [9,10,11,12]){const pool=demoPoolFor(g).map(x=>x[0]);log.push(g+" : "+pool.length+" notions ("+pool.slice(0,12).join(", ")+"…)");
  ok(pool.length>=3,"2 au moins 3 notions en "+g);
  if(g<=11)ok(pool.every(id=>yr(id)<=g),"3 rien d'une année suivante en "+g);
  demoGrade=g;for(let k=0;k<40;k++){const q=demoQuestion();ok(pool.includes(q.id),"4 question hors pool "+q.id+" en "+g);}}
 ok(!demoPoolFor(9).map(x=>x[0]).includes("pyth"),"5 pas de Pythagore en 9e");
 // Interface
 demoGrade=null;screenWelcome();document.querySelector('#dgrade button[data-v="10"]').click();
 ok(demoGrade===10&&draft.grade===10,"6 choix 10e mémorisé et pré-rempli");ok(document.querySelector('#dgrade button[data-v="10"]').getAttribute("aria-pressed")==="true","6 bouton actif");
 const id1=document.querySelector("#demo .chip").textContent;document.getElementById("dskip").click();ok(demoSkip.length===1,"7 notion écartée");
 document.getElementById("go").click();ok(document.querySelector('#grade button[aria-pressed="true"]').dataset.v==="10","8 étape 1 sur 10e");
 document.body.insertAdjacentHTML("beforeend","<pre id=log>"+log.join("\n")+"</pre>");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC\n"+fails.slice(0,10).join("\n"):"OK")+"</pre>");
