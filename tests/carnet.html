<script>
// Carnet d'erreurs et programme jusqu'au test (20.11) : parcours complet dans l'app.
const fails=[], ok=(c,m)=>{if(!c)fails.push(m)};
const _rq=renderQuestion; renderQuestion=function(q,opt){window.__q=q;return _rq(q,opt)};
const answer=(good)=>{const q=window.__q;const fr=(v)=>{if(Math.abs(v*1e6-Math.round(v*1e6))<1e-6)return String(+v.toFixed(6));for(let d=2;d<=200;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return n+"/"+d}return String(v)};document.getElementById("ans").value=good?(q.canon||fr(q.spec.value)):"123456789";document.getElementById("check").click();if(!good){document.getElementById("ans").value="123456788";document.getElementById("check").click();}};
try{
state=Engine.newState({system:"CH",grade:11,track:"college",minutes:5});Engine.autoInit(state);state.placed=true;
for(const id in state.notions)state.notions[id].lessonSeen=true;
// 1. séance : une question ratée entre au carnet
session={fmt:"",plan:["prio|2"],i:0,score:0,answered:0,start:Date.now(),elo0:state.elo.r,ids:new Set(),pinged:true};nextQuestion();
answer(false);
ok((state.carnet||[]).length===1&&state.carnet[0].id==="prio"&&state.carnet[0].d===2,"1 ajout "+JSON.stringify(state.carnet));
document.getElementById("nx").click();
ok(/Carnet d'erreurs/.test(app.textContent),"1 bilan mentionne le carnet");
// 2. accueil et Progrès
homeTab="today";screenHome();ok(/1 à effacer/.test((app.querySelector('.door[data-door="carnet"]')||{}).textContent||""),"2 case Carnet de l'accueil (22.11)");
homeTab="carnet";screenHome();ok(!!document.getElementById("carnetgo")&&/à refaire/.test(app.textContent),"2 page Carnet");
// 3. séance carnet : réussite, échec (remise à 0), puis deux réussites → effacée
startCarnet();ok(/Carnet d'erreurs · 1 sur 1/.test(app.textContent),"3 eyebrow");answer(true);ok(state.carnet[0].ok===1,"3 ok=1");document.getElementById("nx").click();
startCarnet();answer(false);ok(state.carnet[0].ok===0,"3 échec remet à 0");document.getElementById("nx").click();
startCarnet();answer(true);document.getElementById("nx").click();startCarnet();answer(true);
ok((state.carnet||[]).length===0,"3 effacée après 2 réussites "+JSON.stringify(state.carnet));
document.getElementById("nx").click();ok(/vide : bravo/.test(app.textContent),"3 bilan carnet vide");
// 4. programme du test : J-5 révision, J-2 sujet, J-1 dernier tour, J jour J
const ids=["prio","fracadd","puiss"];
for(const [L,kind] of [[5,"autoeval"],[2,"mock"],[1,"apres"],[0,"jourj"]]){state.prep={ids,date:addDays(day(),L)};homeTab="today";screenHome();
 ok(new RegExp(PREP_TASK[kind].label).test(app.textContent),"4 tâche J-"+L+" = "+kind);
 homeTab="test";screenHome();ok(app.querySelectorAll(".pday").length>=L+1&&!!document.getElementById("prepgo"),"4 programme J-"+L);}
// 5. dernier tour avec une erreur du carnet sur une notion du test, puis marquage fait
state.carnet=[{id:"fracadd",d:1,code:"x",date:day(),ok:0}];state.prep={ids,date:addDays(day(),4),start:addDays(day(),-1)};startPrepTask("revision");
ok(session.plan[0]==="fracadd|1|carnet","5 carnet en tête de la révision ciblée "+session.plan.join());
answer(true);ok(state.carnet[0].ok===1,"5 réussite comptée pour le carnet");
for(let k=0;k<40&&!/Score/.test(app.textContent);k++){const b=document.getElementById("nx");if(b)b.click();else if(document.getElementById("idk"))document.getElementById("idk").click();}
ok((state.prep.log||{})[day()]==="revision","5 tâche du jour marquée "+JSON.stringify(state.prep.log));
// 6. parcours guidé : J-1 = test rapide (après) ; autoévaluation du 1er jour cochée dans la frise
state.prep={ids,date:addDays(day(),1),start:addDays(day(),-3)};startPrepTask("apres");ok(/Autoévaluation/.test(app.textContent),"6 J-1 : autoévaluation");
state.prep={ids,date:addDays(day(),5)};state.autotest=null;homeTab="test";screenHome();ok(/étape 1 sur 6/.test(app.textContent)&&/Autoévaluation/.test(app.querySelector(".prep-now").textContent),"6 1er jour : autoévaluation, étape 1 sur 6");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC\n"+fails.join("\n"):"OK")+"</pre>");
</script>
