<script>
(function(){
 const N=+(new URLSearchParams(location.hash.slice(1)).get("n")||60);
 const PROFS=[];
 for (const g of [9,10,11,12,13,14,15]) PROFS.push({system:"CH",grade:g,track:"college"});
 for (const g of [12,13,14,15]) PROFS.push({system:"CH",grade:g,track:"mp"});
 for (const g of [6,7,8,9,10,11,12]) PROFS.push({system:"FR",grade:g,track:"college"});
 const cls={};
 for (const p of PROFS){ let cat; try{cat=Engine.catalog(p);}catch(e){continue;} const lab=p.system+p.grade+(p.track==="mp"?"mp":""); for (const c of cat) (cls[c.id]=cls[c.id]||[]).push(lab);}
 const rows=[];
 for (const id of Object.keys(GEN)) { if(!hasProb(id)) continue; const S=new Set(),C=new Set(),TP=new Set(); let ex=0;
  for(let s=1;s<=N;s++){let q;try{q=Engine.build(id,4,s);}catch(e){ex++;continue;} S.add(q.q+" | "+(q.parts||[]).map(p=>p.label).join(" | ")); C.add(q.ctx||"?"); TP.add((VRAI.plain(q.q)+" | "+(q.parts||[]).map(p=>VRAI.plain(p.label)).join(" | ")).replace(/[−-]?\d+(?:[,.']\d+)*/g,"#"));}
  const np=probList(id).length+((typeof PROBX!=="undefined"&&PROBX[id])?PROBX[id].length:0);
  rows.push([TP.size,S.size,id,C.size,np,(cls[id]||[]).join(",")]);}
 rows.sort((a,b)=>a[0]-b[0]);
 document.getElementById("out").textContent=rows.filter(r=>r[0]<=2).map(r=>r.join("\t")).join("\n");
})();
</script>
