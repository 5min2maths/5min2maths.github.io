/act_prop11.js"></script><script src="../src/act_litt11.js"></script><script src="../src/act_eq1c.js"></script><script src="../src/act_sys1c.js"></script><script src="../src/act_ch11b.js"></script><script src="../src/act_ch11c.js"></script><script src="../src/act_1c.js"></script><script src="../src/act_mp2.js"></script><script src="../src/act_mp34.js"></script><script src="../src/act_manip.js"></script><script src="../src/sujet.js"></script><script src="../src/qcm.js"></script><script src="../src/engine.js"></script><script src="../src/app.js"></script>
<script>
// Améliorations élèves du 21.11 (lot 2) : reprise de séance, visite guidée, paliers, bilan de la semaine, format de demain, données en gras.
const fails=[], ok=(c,m)=>{if(!c)fails.push(m)};
try{
state=Engine.newState({system:"CH",grade:11,track:"college",minutes:5});Engine.autoInit(state);state.placed=true;
for(const id in state.notions)state.notions[id].lessonSeen=true;
// 2. visite guidée
homeTab="today";screenHome();ok(!!document.getElementById("tour")&&/séance du jour/.test(document.getElementById("tour").textContent)&&app.querySelector(".sess-card.tour-hi"),"2 bulle 1 (accueil à cases, 22.11)");
document.getElementById("tournext").click();ok(homeTab==="today"&&/Mathélo/.test(document.getElementById("tour").textContent)&&app.querySelector(".elo-band.tour-hi"),"2 bulle 2 sur le Mathélo");
document.getElementById("tourskip").click();ok(state.tourDone&&!document.getElementById("tour")&&homeTab==="today","2 passer : fini");
screenHome();ok(!document.getElementById("tour"),"2 plus de visite ensuite");
// 1. reprise de séance
session={fmt:"auto",plan:["prio|1","fracadd|1","puiss|1"],i:0,score:0,answered:0,start:Date.now(),elo0:state.elo.r,ids:new Set(),pinged:true};nextQuestion();
document.getElementById("idk").click();document.getElementById("nx").click();
ok(state.resume&&state.resume.s.i===1&&state.resume.s.answered===1,"1 séance gardée "+JSON.stringify(state.resume&&{i:state.resume.s.i,a:state.resume.s.answered}));
session=null;homeTab="today";screenHome();ok(/question <b>2 sur 3<\/b>/.test(app.innerHTML),"1 carte Reprendre");
document.getElementById("resgo").click();ok(session&&session.i===1&&session.ids instanceof Set&&/2 sur 3/.test(app.textContent),"1 reprise à la question 2");
document.getElementById("idk").click();document.getElementById("nx").click();document.getElementById("idk").click();document.getElementById("nx").click();
ok(/Score/.test(app.textContent)&&!state.resume,"1 bilan : plus de reprise");
// 5. format de demain
ok(/Demain : /.test(app.textContent)&&state.tomorrow&&state.tomorrow.date===addDays(day(),1),"5 format de demain annoncé");
const other=Object.keys(FORMATS).find(f=>f!==state.today.f);state.tomorrow={date:day(),f:other};delete state.today;ok(Engine.todayFormat(state)===other,"5 promesse tenue le lendemain");
// 3. paliers
state.elo.r=1287;homeTab="today";screenHome();ok(/Chercheur/.test(app.textContent)&&/Stratège dans 38 pts/.test(app.textContent),"3 grade : "+(app.querySelector(".eb-grade")||{}).textContent);
ok(gradeOf(950).name==="Calculateur"&&gradeOf(1250).name==="Chercheur"&&gradeOf(1550).name==="Érudit"&&gradeOf(2400).next===null,"3 grades de départ par classe");
// 4. bilan de la semaine (simulé un lundi)
const dd=new Date(day()+"T12:00:00"),dow=(dd.getDay()+6)%7,mon=addDays(day(),-dow);
state.history=[{date:addDays(mon,-6),n:5,score:4},{date:addDays(mon,-4),n:3,score:2},{date:addDays(mon,-2),n:4,score:4}];state.elo.log=[[addDays(mon,-8),1200],[addDays(mon,-2),1240]];delete state.recapSeen;
const card=weekRecapCard();if(dow<=2){ok(/3<\/b> jours de pratique/.test(card)&&/12<\/b> questions/.test(card)&&/\+40/.test(card),"4 bilan : "+card.replace(/<[^>]+>/g," ").slice(0,140));}else ok(card==="","4 rien après mercredi");
// 6. données en gras
ok(/\\mathbf\{4\}/.test(boldData("Un magasin vend \\(4\\) cahiers pour \\(32\\) CHF : combien coûtent \\(6\\) cahiers dans ce magasin ?")),"6 gras en contexte");
ok(!/mathbf/.test(boldData("Calcule : \\(4 + 3 \\cdot 2\\)")),"6 pas de gras dans un calcul nu");
ok(/<b>5<\/b> billets à <b>9<\/b> CHF/.test(boldData("Au cinéma, une famille paie 5 billets à 9 CHF et un grand pop-corn à 4 CHF. Écris le calcul en une seule ligne.")),"6 gras sur les nombres du texte");
ok(!/<b>/.test(boldData('Une classe de 11e <span class="x" data-n="3">mesure</span> la cour avec une corde : quelle longueur obtient-elle au total ?').replace(/<span[^>]*>/,"")),"6 pas de gras dans 11e ni dans les attributs");
// 7. joker de série
state.streak={count:6,last:addDays(day(),-2),best:6};delete state.streak.jokerWk;homeTab="today";screenHome();
ok(/Joker de série/.test(app.textContent),"7 rappel du joker");
ok(Engine.finishDay(state,1,1)==="joker"&&state.streak.count===7,"7 joker utilisé "+JSON.stringify(state.streak));
state.streak.last=addDays(day(),-2);state.streak.count=7;const r2=Engine.finishDay(state,1,1);
if(Engine.weekOf(day())===Engine.weekOf(addDays(day(),-2))||true) ok(r2===""&&state.streak.count===1,"7 un seul joker par semaine "+JSON.stringify(state.streak));
ok(Backup.unpack(JSON.parse(JSON.stringify(Backup.pack(state)))).streak.jokerWk===state.streak.jokerWk,"7 joker dans la sauvegarde");
// 8. rappel de sauvegarde
delete UI.lastBackup;delete UI.backupLater;state.history=Array.from({length:8},(x,k)=>({date:addDays(day(),-k-1),n:3,score:2}));screenHome();
ok(!!document.getElementById("bkgo"),"8 carte de sauvegarde après 7 jours");
document.getElementById("bkno").click();ok(!document.getElementById("bkgo"),"8 plus tard");
delete UI.backupLater;UI.lastBackup=day();screenHome();ok(!document.getElementById("bkgo"),"8 code récent : pas de carte");delete UI.lastBackup;
// 9. brouillon
session={fmt:"auto",plan:["prio|1"],i:0,score:0,answered:0,start:Date.now(),elo0:state.elo.r,ids:new Set(),pinged:true};nextQuestion();
const sb=document.getElementById("scrbtn");ok(!!sb&&document.getElementById("scr").hidden,"9 bouton brouillon, zone cachée");
sb.click();ok(!document.getElementById("scr").hidden&&/Cacher/.test(sb.textContent),"9 brouillon ouvert");
const cv=document.querySelector("#scr canvas");cv.dispatchEvent(new PointerEvent("pointerdown",{clientX:cv.getBoundingClientRect().left+10,clientY:cv.getBoundingClientRect().top+10,pointerId:1,bubbles:true}));
ok(/b/.test(sig&&sig.aide||""),"9 usage du brouillon noté");
document.getElementById("scrclose").click();ok(document.getElementById("scr").hidden,"9 fermé");
// 10. page Mes grades
state.elo.r=1287;homeTab="today";screenHome();document.getElementById("eloband").click();
ok(/Mes grades/.test(app.textContent)&&app.querySelectorAll(".grades li").length===GRADES.length,"10 page grades");
ok(app.querySelector(".grades li.cur")&&/Chercheur/.test(app.querySelector(".grades li.cur").textContent),"10 grade actuel mis en avant");
ok(!/départ en/.test(app.textContent)&&gradeOf(1850).name==="Virtuose"&&gradeOf(2300).name==="Légende","10 échelle jusqu'en 4e");
document.getElementById("back").click();ok(!!document.getElementById("eloband"),"10 retour accueil");
// 11. changer de format sans redessiner l'accueil
homeTab="today";screenHome();const band0=document.getElementById("eloband"),f0=Engine.todayFormat(state);document.getElementById("other").click();
ok(document.getElementById("eloband")===band0,"11 accueil non redessiné");ok(Engine.todayFormat(state)!==f0&&app.querySelector(".fmt-lab").textContent===FORMATS[Engine.todayFormat(state)].label,"11 nouveau format affiché");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC\n"+fails.join("\n"):"OK")+"</pre>");
</script>
