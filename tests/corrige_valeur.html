<!-- Garde-fou « la réponse est dans le corrigé » (27.11, agent corrige ; tests/corrige_valeur.js, tools/corrige_valeur.md).
     Questions ordinaires (GEN, niveaux 1 à 3) de toutes les notions du catalogue, profils suisses (CO 9e–11e, Collège 1re–4e MA1/MA2, MP 1re–4e : mêmes textes, Engine.build).
     #n=30 (graines) ; #ids=eq1,pyth ; #detail : tous les exemples. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 30), DET = P.has("detail"), t0 = performance.now();
  const WANT = P.get("ids") ? new Set(P.get("ids").split(",")) : null;
  /* Exceptions relues (clé « écart|notion-niveau » ou « écart|notion ») : réponse qualitative, phrase, choix… Aussi étroites que possible. */
  const OK = CV_OK;
  const by = {}, ex = {}, errs = []; let nq = 0, nok = 0, nm = 0, nd = 0;
  const run = function* () { for (const id of Object.keys(GEN)) for (const d of [1, 2, 3]) for (let s = 1; s <= N; s++) yield [id, d, s, () => Engine.build(id, d, s)]; };
  for (const [id, d, s, mk] of run()) {
    if (WANT && !WANT.has(id)) continue;
    let q; try { q = mk(); } catch (e) { errs.push(id + "-" + d + "-" + s + " : " + e.message); continue; }
    if (!q) continue; nq++;
    const r = CV.check(q); if (!r.length) nok++;
    if (s <= 5) { const [m, dd] = CV.contre(q); nm += m; nd += dd; }
    for (const { key, msg } of r) {
      if (OK[key + "|" + id + "-" + d] || OK[key + "|" + id]) continue;
      const k = key + " | " + id + "-" + d; by[k] = (by[k] || 0) + 1; if (!ex[k] || DET) (ex[k] = ex[k] || []).push((q.code || id) + " : " + msg + "\n      corrigé : " + CV.text(q.sol).slice(-220));
    }
  }
  const keys = Object.keys(by).sort();
  const out = [(keys.length || errs.length ? "ÉCHEC " : "ok ") + nq + " questions (" + N + " graines), " + keys.length + " écart(s) (notion-niveau), " + errs.length + " exception(s), " + Math.round(performance.now() - t0) + " ms ; formes : " + JSON.stringify(CV.kinds)];
  /* contre-épreuve : une réponse faussée (signe inversé, valeur décalée) doit être déclarée absente du corrigé */
  const taux = nm ? nd / nm : 1;
  out.push((taux < CV_TAUX ? "ÉCHEC " : "") + "contre-épreuve : " + nd + " / " + nm + " réponses faussées repérées (" + Math.round(1000 * taux) / 10 + " %, seuil " + 100 * CV_TAUX + " %)");
  out.push(...CV_COUV("CH"));
  for (const k of keys) out.push("  " + k + " ×" + by[k] + "\n    ex. " + ex[k].slice(0, DET ? 50 : 1).join("\n    ex. "));
  if (errs.length) out.push("EXC :\n  " + errs.slice(0, 30).join("\n  "));
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
