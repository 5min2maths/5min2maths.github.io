// Choix de la voie au sec. II (20.11) : rien de présélectionné, « Continuer » refusé sans choix.
const fails=[],ok=(c,m)=>{if(!c)fails.push(m)};Element.prototype.scrollIntoView=function(){};
try{
 state=null;draft={system:"CH",grade:13,track:null,minutes:5};screenLevel();
 ok(!document.querySelector('#track button[aria-pressed="true"]'),"1 aucune voie présélectionnée");
 document.getElementById("next").click();ok(/Choisis d'abord ta voie/.test(document.getElementById("trackerr").textContent),"2 refus sans voie");ok(!state,"2 pas de profil créé");
 document.querySelector('#track button[data-v="mp"]').click();ok(draft.track==="mp","3 MP choisie");
 document.getElementById("next").click();ok(state&&state.profile.track==="mp"&&state.profile.grade===13,"3 profil MP 2e "+JSON.stringify(state&&state.profile));
 // 24.11 : MP 3e et 4e (grade 14, 15) : la voie est demandée aussi en 3e–4e.
 for(const g of [14,15]){state=null;draft={system:"CH",grade:g,track:null,minutes:5};screenLevel();ok(!!document.getElementById("track"),"5 voie proposée en "+(g-11)+"e");
  document.getElementById("next").click();ok(!state,"5 refus sans voie en "+(g-11)+"e");
  document.querySelector('#track button[data-v="mp"]').click();document.getElementById("next").click();ok(state&&state.profile.track==="mp"&&state.profile.grade===g,"5 profil MP "+(g-11)+"e "+JSON.stringify(state&&state.profile));}
 state=null;draft={system:"CH",grade:14,track:null,minutes:5};screenLevel();document.querySelector('#track button[data-v="college"]').click();document.getElementById("next").click();ok(state&&state.profile.track==="college"&&state.profile.grade===14,"6 profil 3e Collège");
 state=null;draft={system:"CH",grade:11,track:null,minutes:5};screenLevel();ok(!document.getElementById("track"),"4 pas de voie en 11e");document.getElementById("next").click();ok(state&&state.profile.track==="college","4 11e = college");
}catch(e){fails.push("EXC "+e.message)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC\n"+fails.join("\n"):"OK")+"</pre>");
