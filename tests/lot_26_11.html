<script>
// Lot du 26.11 : la page se charge dans un cadre de 360 × 640 (téléphone) et y lance tous les contrôles.
if (window === top) {
  document.body.innerHTML = '<iframe src="lot_26_11.html#cadre" style="width:360px;height:640px;border:0"></iframe>';
  const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = "en cours"; document.body.appendChild(pre);
  window.addEventListener("message", (e) => { if (typeof e.data === "string" && e.data.startsWith("lot:")) pre.textContent = e.data.slice(4); });
} else window.addEventListener("load", () => {
// Lot du 26.11 (tests/lot_26_11.html) : un contrôle par point du lot (compétences du Collège, vraisemblance, revue
// des testeurs). Chaque section écrit ses échecs dans OUT ; la page finit par « OK … » ou « ÉCHEC … ».
const OUT = []; let nbF = 0;
const fail = (m) => { nbF++; if (nbF < 300) OUT.push("ÉCHEC " + m); };
const ok = (sp, inp) => { try { return checkAnswer(sp, inp).status === "correct"; } catch (e) { return false; } };
const showSpec = (sp, canon) => sp.kind === "value" ? String(sp.value) : sp.kind === "expr" ? sp.expr : sp.kind === "set" ? sp.values.map(String).join(" ; ") : sp.kind === "pair" ? sp.values.join(" ; ") : canon || "?";
const sameAns = (a, b) => { if (a.kind !== b.kind) return false; if (a.kind === "value") return Math.abs(a.value - b.value) <= Math.max(a.round || 0, b.round || 0, 1e-9 * Math.max(1, Math.abs(a.value))); return ok(a, showSpec(b)); };
const txt = (q) => [q.q, q.sol, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.traps || []).map((t) => t.m)].join(" | ");
const sec = (nom, f) => { try { f(); } catch (e) { fail(nom + " : exception " + e.message + " " + (e.stack || "").split("\n")[1]); } };

// ---------- A. Compétences du Collège : nouvelles formes (40 tirages par forme) ----------
sec("A formes", () => {
  const FORMES = [["factor", 3, "trinome-complete"], ["factor", 3, "erreur"], ["fimg", 1, "ordonnee-origine"], ["fimg", 2, "zeros-calcul"], ["fimg", 3, "axes-triangle"],
    ["inter", 1, "deux-droites"], ["inter", 1, "deux-droites-graphe"], ["angles", 3, "chaine-proprietes"], ["fracrat", 3, "division"], ["sinlaw", 3, "resolution"]];
  for (const [id, lv, ctx] of FORMES) {
    const got = [];
    for (let s = 1; s <= 3000 && got.length < 40; s++) { R.seed(s * 17 + 3); let q; try { q = GEN[id](lv); } catch (e) { fail(id + " exception " + e.message); break; } if (q && q.ctx === ctx) got.push([s, q]); }
    if (got.length < 40) fail(id + "-" + lv + " « " + ctx + " » : " + got.length + " tirages seulement");
    got.forEach(([s, q]) => {
      const c = id + "-" + lv + " " + ctx + " s" + s, t = txt(q);
      if (/undefined|NaN|Infinity|\[object/.test(t)) fail(c + " texte cassé : " + t.match(/.{0,40}(undefined|NaN|Infinity|\[object).{0,20}/)[0]);
      if (!ok(q.spec, q.canon || showSpec(q.spec))) fail(c + " réponse refusée : " + showSpec(q.spec));
      if (!q.guide || !q.guide.length) fail(c + " sans pas à pas");
      (q.guide || []).forEach((g, k) => { if (!ok(g.spec, showSpec(g.spec))) fail(c + " étape " + (k + 1) + " refuse sa réponse"); });
      if (q.guide && q.guide.length && !sameAns(q.spec, q.guide[q.guide.length - 1].spec)) fail(c + " dernière étape ≠ réponse");
      if (!q.traps || !q.traps.length) fail(c + " sans piège");
      (q.traps || []).forEach((tr) => { if (tr.v !== undefined ? Math.abs(tr.v - q.spec.value) <= 1e-9 : tr.e ? ok(q.spec, tr.e) : tr.spec ? ok(q.spec, showSpec(tr.spec)) : false) fail(c + " piège = réponse"); });
      if (trivialQ(q, 0)) fail(c + " triviale : " + trivialQ(q, 0));
      if (/(^|[^\d])\d+\.\d+/.test(q.q.replace(/<[^>]+>/g, ""))) fail(c + " point décimal");
      const v = VRAI_CHECK({ raw: String(q.q), txt: VRAI.plain(q.q), sol: VRAI.plain(q.sol), parts: [], guide: (q.guide || []).map((g) => ({ label: VRAI.plain(g.ask), spec: g.spec })), fig: q.fig || "", spec: q.spec });
      v.forEach(([k, m]) => fail(c + " vraisemblance " + k + " : " + m));
    });
  }
  // Défi de résolution complète (sinlaw) : 4 parties, valeurs cohérentes (somme des angles 180°).
  const defs = PROB_EXTRA.sinlaw || []; let vu = 0;
  for (let s = 1; s <= 60; s++) { R.seed(s); for (const f of defs) { const p = f(); if (p.parts.length !== 4) continue; vu++;
    const [c, al, be] = p.parts.map((x) => x.spec.value); if (Math.abs(al + be + +p.q.match(/gamma = (\d+)/)[1] - 180) > 1e-6 || !(c > 0)) fail("défi sinlaw incohérent s" + s); } }
  if (!vu) fail("défi sinlaw de résolution complète absent");
  // Rattachement : chaque compétence du lot a une notion et des niveaux.
  for (const [code, n] of [["1.AL.03c", "factor@3"], ["1.FO.03c", "fimg@123"], ["1.FO.04a", "fimg@12"], ["1.FO.09a", "inter@1"], ["1.GE.01a", "angles@123"], ["2.AL.02c", "fracrat@3"], ["2.GE.02c", "sinlaw@3"]])
    if (!(REF_MATU.q[code] || []).includes(n)) fail("ref_matu " + code + " : " + JSON.stringify(REF_MATU.q[code]) + " sans " + n);
});

// ---------- B. Vraisemblance : les nouvelles règles de tests/vrai_checks.js se déclenchent ----------
sec("B règles", () => {
  const V = (t) => VRAI_CHECK({ raw: t, txt: t, sol: "", parts: [], guide: [], fig: "", spec: null }).map((x) => x[0]);
  const doit = [["Un hôtel accepte 100 réservations pour 55 chambres ; chaque client vient avec la probabilité 0,5.", "surréservation"], ["Un cheval tire une péniche le long du canal avec une force de 120 N.", "force"],
    ["Combien de mètres économise-t-il (elle) ?", "formulation"], ["Au cinéma, une place coûte 6 CHF. Combien de places ?", "cinéma"], ["La température baisse de 5 °C chaque fois qu'on monte de 500 m.", "altitude"],
    ["Un chariot roule sur un rail à 50 m/s.", "vitesse"], ["La petite bouteille mesure 20 cm de haut et contient 1,5 L.", "bouteille"]];
  for (const [t, k] of doit) if (!V(t).length) fail("règle de vraisemblance muette (" + k + ") : " + t);
  for (const t of ["Calcule P_N(E). (fraction acceptée)", "Une compagnie vend 400 billets pour un vol de 366 places.", "La température baisse de 3 °C chaque fois qu'on monte de 500 m.", "Au cinéma, une place coûte 18 CHF."])
    if (V(t).length) fail("règle de vraisemblance trop large : " + t + " → " + V(t).join(", "));
  // Défis d'arithmétique : un seul contexte par énoncé.
  for (const f of PROBX.arith || []) for (let s = 1; s <= 20; s++) { R.seed(s); const p = f(); if ((/bus/.test(p.q) && /corbeille/.test(p.q)) || (/carreler/.test(p.q) && /empile/.test(p.q))) fail("défi arith à deux contextes : " + p.q.slice(0, 80)); }
});

// ---------- C. Revue d'un testeur ----------
sec("C", () => {
  const L = Badges.list({ profile: { system: "CH", grade: 11, track: "college" }, notions: {}, streak: { count: 0 } }), i1 = L.findIndex((b) => b.id === "premier"), i3 = L.findIndex((b) => b.id === "serie3");
  if (i3 !== i1 + 1 || L[i3].fam !== "reg") fail("badge « 3 jours d'affilée » absent ou mal placé");
  else {
    const st = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }), d0 = "2026-11-02";
    const at = (d) => { const real = Date; window.Date = class extends real { constructor(...a) { super(...(a.length ? a : [d + "T10:00:00"])); } static now() { return new real(d + "T10:00:00").getTime(); } }; try { Engine.finishDay(st, 1, 1); } finally { window.Date = real; } };
    at(d0); at(addDays(d0, 1)); at(addDays(d0, 3)); /* le 3e jour arrive après un jour manqué : joker */
    const p = L[i3].prog(st, {}); if (st.streak.count !== 3 || p[0] !== 3) fail("badge « 3 jours » avec le joker : série " + st.streak.count + ", progression " + p[0]);
  }
  if (/dans l'espace/.test(NOTIONS.find((n) => n.id === "pythfig").label)) fail("pythfig : libellé « dans l'espace »");
});

// ---------- D. Revue des élèves testeurs ----------
sec("D", () => {
  if (mockTitle({ q: { q: "Sam écrit : … Trouve l'erreur, puis donne le bon produit." } }) !== "Trouve l'erreur") fail("sujet : titre « Trouve l'erreur »");
  const sp = { kind: "value", value: (120 * Math.sqrt(3)) / 17, radical: true };
  if (checkAnswer(sp, "12,2262409946").status === "correct") fail("décimal de calculatrice accepté pour 120√3/17");
  
  if (checkAnswer({ kind: "value", value: 2.5 }, "2,5").status !== "correct") fail("2,5 refusé");
  if (checkAnswer({ kind: "value", value: 0.0625 }, "0,0625").status !== "correct") fail("0,0625 refusé (décimal exact)");
  for (let s = 1; s <= 20; s++) { const c = Curieux.build("gratuit", s); if (!/« −/.test(c.q)) { fail("curieux « gratuit » : pourcentage sans signe moins"); break; } }
  if (moneyTidy("La virgule se déplace de 1 rang(s).") !== "La virgule se déplace de 1 rang." || moneyTidy("3,25 a 2 décimale(s).") !== "3,25 a 2 décimales.") fail("accords (s) : " + moneyTidy("de 1 rang(s) ; 2 décimale(s)"));
  if (/<br>/.test(colonBreak("Les \\(x^2\\) : \\(3x^2\\) ; les \\(x\\) : \\(3x\\)"))) fail("colonBreak coupe entre deux formules");
  if (classTag({ system: "CH", grade: 13, track: "mp" }) !== "MP 2e") fail("classTag MP");
  for (let s = 1; s <= 60; s++) { const q = Engine.build("sys2", 4, s); if (/-1[A-Z](?![a-zA-Z])/.test(q.sol || "")) { fail("corrigé « -1L » : " + q.code); break; } }
  if (exactNote({ kind: "value", value: 3.2e-7, sci: true }, "Écris en notation scientifique.")) fail("exactNote sur la notation scientifique");
  if (!/fraction/.test(exactNote({ kind: "value", value: 1 / 3 }, "Calcule."))) fail("exactNote absente pour 1/3");
  // Leçon du collège français : médiane et étendue, sans quartiles.
  const st0 = state; state = Engine.newState({ system: "FR", grade: 8, minutes: 5 });
  if (/quartile/i.test(lessonBody("quartiles").replace(/<[^>]+>/g, " ")) || !/médiane/i.test(lessonBody("quartiles"))) fail("leçon quartiles en 4e France : " + lessonBody("quartiles").replace(/<[^>]+>/g, " ").slice(0, 120));
  state = Engine.newState({ system: "FR", grade: 10, minutes: 5 }); if (!/quartile|Q_1/i.test(lessonBody("quartiles"))) fail("leçon quartiles en 2nde");
  state = st0;
  // Leçons actives : « Devine » et premier défi pas identiques (mêmes nombres) ; filtre6 compare volontairement « moins de » et « au plus ».
  const nums = (t) => (String(t).replace(/<[^>]+>/g, " ").match(/\d+(?:[.,]\d+)?/g) || []).join(" "); /* mêmes nombres, dans le même ordre */
  /* même objet, autre demande (le défi poursuit le « Devine ») : relu le 26.11, gardé */
  const SUITE = ["filtre6", "eq3", "bicarre", "absval", "ineq2", "ratden", "valint", "trigeq", "etudefct", "compdiff"];
  for (const [id, A] of Object.entries(ACTIVE)) { if (!A || !A.predict || !Array.isArray(A.defis) || typeof A.defis[0] !== "string" || SUITE.includes(id)) continue;
    const a = nums(A.predict.q), b = nums(A.defis[0]); if (a.split(" ").length >= 2 && a === b) fail("leçon " + id + " : « Devine » et 1er défi identiques (" + a + ") : " + A.predict.q.slice(0, 70) + " || " + A.defis[0].slice(0, 70)); }
  if (!/Collège, MP/.test(DEMO_GRADES.CH.find(([g]) => g === 12)[1])) fail("« Sec. II » sans « Collège, MP »");
  if (Engine.eloRefund({ elo: { r: 1000, log: [] } }, -30) !== 15) fail("Mathélo : moitié de la perte rendue après un pas à pas réussi");
});

// ---------- Séries d'automatismes : 200 séances, toutes les classes ----------
sec("auto", () => {
  const PROFS = [["CH", 9, "college"], ["CH", 10, "college"], ["CH", 11, "college"], ["CH", 12, "college"], ["CH", 13, "college"], ["CH", 14, "college", "N"], ["CH", 15, "college", "R"], ["CH", 12, "mp"], ["CH", 13, "mp"], ["CH", 14, "mp"], ["CH", 15, "mp"],
    ["FR", 6], ["FR", 7], ["FR", 8], ["FR", 9], ["FR", 10], ["FR", 11], ["FR", 12], ["CH", 11, "college"], ["CH", 9, "college"]];
  const RQ = window.renderQuestion, SL = window.screenLesson, SS = window.screenSummary, st0 = state, ss0 = session; let cap = null, lessons = 0, n = 0, bad = 0;
  window.renderQuestion = (q) => { cap = q; }; window.screenLesson = () => { lessons++; }; window.screenSummary = () => {};
  try {
    for (const [sys, g, tr, niv] of PROFS) {
      state = Engine.newState({ system: sys, grade: g, track: tr, niv, minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true;
      for (let k = 0; k < 10; k++) {
        const plan = Engine.planSession(state, "auto");
        session = { fmt: "auto", plan, i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), lessonAt: lessonAtStart(plan) };
        for (let i = 0; i < plan.length; i++) { session.i = i; cap = null; nextQuestion(); n++;
          if (!cap) { fail("auto " + sys + g + " : pas de question"); continue; }
          if (!Engine.isDrill(cap) && ++bad <= 12) fail("auto " + sys + g + (tr || "") + " : hors critère « " + String(cap.q).replace(/<[^>]+>/g, "").slice(0, 90) + " » (" + cap.code + ")"); }
      }
    }
  } finally { window.renderQuestion = RQ; window.screenLesson = SL; window.screenSummary = SS; state = st0; session = ss0; }
  if (lessons) fail("auto : " + lessons + " leçon(s) montrée(s)");
  if (n < 600) fail("auto : seulement " + n + " questions");
});

// ---------- Interface (cadre de 360 × 640) : accueil, statistiques, installation, problème, bilan, Mathélo caché ----------
sec("UI", () => {
  Element.prototype.scrollIntoView = function () {};
  const st0 = state, ss0 = session, today = day();
  const fresh = (o = {}) => { try { localStorage.clear(); } catch (e) {} for (const k of Object.keys(UI)) if (!["fs", "vib"].includes(k)) delete UI[k];
    state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true; state.eloSeen = true; state.firstDone = true;
    state.history = [{ date: addDays(today, -1), n: 4, score: 3 }, { date: addDays(today, -2), n: 4, score: 3 }]; state.streak = { count: 2, last: addDays(today, -1), best: 2 }; Object.assign(state, o); session = null; homeTab = "today"; return state; };
  const goTop = () => { const b = app.querySelector(".sess-go, #prepgo, .prep-today .btn-primary"); return b ? b.getBoundingClientRect().top + window.scrollY : 9999; };
  // 1. Le grand bouton reste dans les 640 premiers pixels, quels que soient les rappels du jour.
  const CAS = {
    "simple": () => {},
    "joker": () => { state.streak = { count: 4, last: addDays(today, -2), best: 4 }; },
    "bilan de la semaine": () => { state.history.push({ date: addDays(today, -8), n: 5, score: 4 }); state.recapSeen = null; },
    "sauvegarde": () => { for (let k = 3; k < 12; k++) state.history.push({ date: addDays(today, -k), n: 3, score: 2 }); },
    "carnet": () => { state.carnet = [{ id: "eq1", d: 1, code: "eq1-1-a", date: today, ok: 0 }]; },
    "série perdue": () => { state.streak = { count: 3, last: addDays(today, -4), best: 3 }; },
    "tout à la fois": () => { for (let k = 3; k < 12; k++) state.history.push({ date: addDays(today, -k), n: 3, score: 2 }); state.streak = { count: 4, last: addDays(today, -2), best: 4 }; state.carnet = [{ id: "eq1", d: 1, code: "x", date: today, ok: 0 }]; state.eloSeen = false; },
  };
  for (const [k, f] of Object.entries(CAS)) { fresh(); f(); screenHome(); window.scrollTo(0, 0); const y = goTop();
    if (y > 640 - 48) fail("accueil (" + k + ") : bouton de séance à " + Math.round(y) + " px (> 592)");
    if (/Mathélo/.test(app.textContent)) fail("accueil (" + k + ") : « Mathélo » visible"); }
  fresh({ streak: { count: 3, last: addDays(today, -4), best: 5 } }); screenHome();
  if (!/Ta série de 3 jours s'est arrêtée : on repart aujourd'hui ! Ton record : 5\./.test((app.querySelector(".sess-card") || {}).textContent || "")) fail("série perdue : phrase absente de la carte de séance");
  // 2. Statistiques : sous la séance, « Plus tard », 3 jours ignorés, « Non » définitif.
  fresh(); screenHome(); const sc = app.querySelector("#statscard"), sg = app.querySelector(".sess-card");
  if (!sc || !sg || sc.getBoundingClientRect().top < sg.getBoundingClientRect().bottom) fail("statistiques : carte absente ou au-dessus de la séance");
  UI.statsSeen = [addDays(today, -3), addDays(today, -2), addDays(today, -1)]; screenHome(); if (app.querySelector("#statscard")) fail("statistiques : encore là après 3 jours ignorés");
  fresh(); screenHome(); app.querySelector("#statslater").click(); if (app.querySelector("#statscard")) fail("statistiques : « Plus tard » ne masque pas");
  fresh(); screenHome(); app.querySelector("#statsnon").click(); UI.statsSeen = []; delete UI.statsLater; screenHome(); if (app.querySelector("#statscard")) fail("statistiques : « Non » ne la fait pas disparaître");
  // 3. Installer : au plus une fois par semaine.
  fresh(); const r1 = returnCard(), r2 = returnCard(); if (!r1 || r2) fail("installation : " + (!r1 ? "jamais proposée" : "proposée deux fois le même jour"));
