<script>
window.addEventListener("load", () => {
// Lot du 26.11 (tests/lot_26_11.html) : un contrôle par point du lot (compétences du Collège, vraisemblance, revue
// des testeurs). Chaque section écrit ses échecs dans OUT ; la page finit par « OK … » ou « ÉCHEC … ».
const OUT = []; let nbF = 0;
const fail = (m) => { nbF++; if (nbF < 300) OUT.push("ÉCHEC " + m); };
const ok = (sp, inp) => { try { return checkAnswer(sp, inp).status === "correct"; } catch (e) { return false; } };
const showSpec = (sp, canon) => sp.kind === "value" ? String(sp.value) : sp.kind === "expr" ? sp.expr : sp.kind === "set" ? sp.values.map(String).join(" ; ") : sp.kind === "pair" ? sp.values.join(" ; ") : canon || "?";
const sameAns = (a, b) => { if (a.kind !== b.kind) return false; if (a.kind === "value") return Math.abs(a.value - b.value) <= Math.max(a.round || 0, b.round || 0, 1e-9 * Math.max(1, Math.abs(a.value))); return ok(a, showSpec(b)); };
const txt = (q) => [q.q, q.sol, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.traps || []).map((t) => t.m)].join(" | ");
const sec = (nom, f) => { try { f(); } catch (e) { fail(nom + " : exception " + e.message + " " + (e.stack || "").split("\n")[1]); } };

// ---------- A. Compétences du Collège : nouvelles formes (40 tirages par forme) ----------
sec("A formes", () => {
  const FORMES = [["factor", 3, "trinome-complete"], ["factor", 3, "erreur"], ["fimg", 1, "ordonnee-origine"], ["fimg", 2, "zeros-calcul"], ["fimg", 3, "axes-triangle"],
    ["inter", 1, "deux-droites"], ["inter", 1, "deux-droites-graphe"], ["angles", 3, "chaine-proprietes"], ["fracrat", 3, "division"], ["sinlaw", 3, "resolution"]];
  for (const [id, lv, ctx] of FORMES) {
    const got = [];
    for (let s = 1; s <= 3000 && got.length < 40; s++) { R.seed(s * 17 + 3); let q; try { q = GEN[id](lv); } catch (e) { fail(id + " exception " + e.message); break; } if (q && q.ctx === ctx) got.push([s, q]); }
    if (got.length < 40) fail(id + "-" + lv + " « " + ctx + " » : " + got.length + " tirages seulement");
    got.forEach(([s, q]) => {
      const c = id + "-" + lv + " " + ctx + " s" + s, t = txt(q);
      if (/undefined|NaN|Infinity|\[object/.test(t)) fail(c + " texte cassé : " + t.match(/.{0,40}(undefined|NaN|Infinity|\[object).{0,20}/)[0]);
      if (!ok(q.spec, q.canon || showSpec(q.spec))) fail(c + " réponse refusée : " + showSpec(q.spec));
      if (!q.guide || !q.guide.length) fail(c + " sans pas à pas");
      (q.guide || []).forEach((g, k) => { if (!ok(g.spec, showSpec(g.spec))) fail(c + " étape " + (k + 1) + " refuse sa réponse"); });
      if (q.guide && q.guide.length && !sameAns(q.spec, q.guide[q.guide.length - 1].spec)) fail(c + " dernière étape ≠ réponse");
      if (!q.traps || !q.traps.length) fail(c + " sans piège");
      (q.traps || []).forEach((tr) => { if (tr.v !== undefined ? Math.abs(tr.v - q.spec.value) <= 1e-9 : tr.e ? ok(q.spec, tr.e) : tr.spec ? ok(q.spec, showSpec(tr.spec)) : false) fail(c + " piège = réponse"); });
      if (trivialQ(q, 0)) fail(c + " triviale : " + trivialQ(q, 0));
      if (/(^|[^\d])\d+\.\d+/.test(q.q.replace(/<[^>]+>/g, ""))) fail(c + " point décimal");
      const v = VRAI_CHECK({ raw: String(q.q), txt: VRAI.plain(q.q), sol: VRAI.plain(q.sol), parts: [], guide: (q.guide || []).map((g) => ({ label: VRAI.plain(g.ask), spec: g.spec })), fig: q.fig || "", spec: q.spec });
      v.forEach(([k, m]) => fail(c + " vraisemblance " + k + " : " + m));
    });
  }
  // Défi de résolution complète (sinlaw) : 4 parties, valeurs cohérentes (somme des angles 180°).
  const defs = PROB_EXTRA.sinlaw || []; let vu = 0;
  for (let s = 1; s <= 60; s++) { R.seed(s); for (const f of defs) { const p = f(); if (p.parts.length !== 4) continue; vu++;
    const [c, al, be] = p.parts.map((x) => x.spec.value); if (Math.abs(al + be + +p.q.match(/gamma = (\d+)/)[1] - 180) > 1e-6 || !(c > 0)) fail("défi sinlaw incohérent s" + s); } }
  if (!vu) fail("défi sinlaw de résolution complète absent");
  // Rattachement : chaque compétence du lot a une notion et des niveaux.
  for (const [code, n] of [["1.AL.03c", "factor@3"], ["1.FO.03c", "fimg@123"], ["1.FO.04a", "fimg@12"], ["1.FO.09a", "inter@1"], ["1.GE.01a", "angles@123"], ["2.AL.02c", "fracrat@3"], ["2.GE.02c", "sinlaw@3"]])
    if (!(REF_MATU.q[code] || []).includes(n)) fail("ref_matu " + code + " : " + JSON.stringify(REF_MATU.q[code]) + " sans " + n);
});

// FIN
const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = nbF ? "ÉCHEC (" + nbF + ")\n" + OUT.join("\n") : "OK lot 26.11"; document.body.appendChild(pre);
});
</script>
