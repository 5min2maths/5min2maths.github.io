<script>
/* Corrections r27 (27.11) : revue quotidienne du 27.11 (n° 1 à 6), commentaires de l'auteur (intégrale, histoires), petits
   défauts (pavé des questions à choix, Réessayer / On le fait ensemble), robot (rayon 1). Chaque contrôle échoue sans la correction. */
const out = [], fail = [], ok = (c, m) => (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + m);
const fresh = (prof, o = {}) => { state = Engine.newState(prof); Engine.autoInit(state); state.placed = true; state.tourDone = true; Object.assign(state, o); save(); return state; };
const P11 = { system: "CH", grade: 11, track: "college", minutes: 5 }, PMP2 = { system: "CH", grade: 13, track: "mp", minutes: 5 };
try {
  /* A1. pas à pas de fracadd « 1/4 − (c/e − g/h) » : plus de phrase « change le signe de g/h » */
  let nPar = 0, bad1 = 0;
  for (let s = 1; s < 400 && nPar < 15; s++) { const q = Engine.build("fracadd", 3, s); if (q && q.ctx === "parmoins") { nPar++; if (/change le signe de/.test(q.sol)) bad1++; } }
  ok(nPar >= 5 && !bad1, "A1. fracadd « − (…) » : solution sans « change le signe de » (" + nPar + " tirages, " + bad1 + " fautifs)");
  /* A2. essai de l'accueil, Sec. II : notions de l'année et de la précédente seulement */
  const pool = demoPoolFor(12), old = pool.filter(([id]) => { const pl = placeOf(NOTIONS.find((n) => n.id === id), { system: "CH", grade: 12, track: "college" }); return pl && pl[0] < 11; });
  ok(pool.length > 0 && !old.length, "A2. accueil Sec. II : " + pool.length + " notions, aucune avant la 11e (" + old.map((x) => x[0]).slice(0, 5).join(", ") + ")");
  ok(demoPoolFor(9).length > 0 && demoPoolFor(10).length > 0, "A2. accueil 9e et 10e : essai toujours possible");
  /* A3. « Je prépare une évaluation », MP 2e : aucune notion au nom de son chapitre */
  fresh(PMP2); Engine.unlock && Engine.unlock(state, new Date("2026-11-27T12:00:00")); screenPrep();
  const dup = [...app.querySelectorAll(".card")].filter((c) => { const h3 = c.querySelector("h3"); return h3 && [...c.querySelectorAll(".check span")].some((sp) => sp.textContent.trim().toLowerCase() === h3.textContent.replace(/^.*·\s*/, "").replace(/^\d+\.\s*/, "").trim().toLowerCase()); });
  ok(app.querySelectorAll(".check").length > 3 && !dup.length, "A3. MP 2e : chapitre et notion jamais du même nom (" + dup.map((c) => c.querySelector("h3").textContent).join(", ") + ")");
  /* A4. après la tâche de l'évaluation : pas de « séance faite ✓ » sous le format du jour */
  fresh(P11); const pid = Object.keys(state.notions).filter((id) => GEN[id]).slice(0, 2);
  state.prep = { ids: pid, date: addDays(day(), 4), start: addDays(day(), -1), log: { [day()]: "revision" } }; state.history.push({ date: day(), n: 4, score: 3 }); save();
  homeTab = "today"; screenHome();
  const fmtTxt = (app.querySelector(".sess-fmt") || {}).textContent || "";
  ok(!/séance faite ✓/.test(fmtTxt) && /\(évaluation\)/.test(fmtTxt), "A4. tâche de l'évaluation faite : « Séance du jour faite ✓ (évaluation) », pas « séance faite ✓ » (" + fmtTxt.trim().slice(0, 80) + ")");
  state.fmtDone = day(); save(); screenHome();
  ok(/séance faite ✓/.test((app.querySelector(".sess-fmt") || {}).textContent || ""), "A4. séance du format faite : « séance faite ✓ »");
  /* A5. jour du positionnement : 2 questions, niveau 2 au plus, quel que soit le format */
  fresh(PMP2); state.placedOn = day(); save();
  const plans = ["revision", "mixte", "app", "auto"].map((f) => Engine.planSession(state, f));
  ok(plans.every((p) => p.length <= 2 && p.every((e) => String(e).startsWith("PROB:") || +String(e).split("|")[1] <= 2)), "A5. jour du positionnement : " + plans.map((p) => p.join(" ")).join(" / "));
  state.placedOn = addDays(day(), -1); save();
  ok(Engine.planSession(state, "revision").length > 2, "A5. le lendemain : séance normale");
  /* A6. statistiques : 2 jours au plus, « Plus tard » = une semaine, sous la séance */
  try { localStorage.removeItem("m2m-stats"); } catch (e) {}
  fresh(P11, { firstDone: true }); UI.statsSeen = []; UI.statsLater = null; homeTab = "today"; screenHome();
  const h1 = app.innerHTML;
  ok(h1.includes('id="statscard"') && h1.indexOf('id="statscard"') > h1.indexOf("sess-go"), "A6. carte des statistiques sous la séance");
  UI.statsSeen = [addDays(day(), -3), addDays(day(), -2)];
  ok(statsCard() === "", "A6. après 2 jours d'affichage : plus de carte (Réglages seulement)");
  UI.statsSeen = []; UI.statsLater = addDays(day(), -5);
  ok(statsCard() === "", "A6. « Plus tard » il y a 5 jours : pas encore (une semaine)");
  UI.statsLater = null; UI.statsSeen = [];
  /* B1. leçon active intégrale : une seule manipulation */
  ok(ACTIVE.integrale && ACTIVE.integrale.defis.length === 1, "B1. intégrale : un seul défi à curseur (" + (ACTIVE.integrale && ACTIVE.integrale.defis.length) + ")");
  /* B2–B3. histoires : brouillon, pavé de calcul (touche ^) dans « Pour aller plus loin » */
  fresh(P11); const kT = HISTOIRE.findIndex((x) => /Alan Turing/.test(x.titre));
  screenHistory(kT, () => {});
  ok(!!document.getElementById("scrbtn") && !!document.getElementById("scr"), "B3. histoire : zone brouillon");
  document.getElementById("hidk").click();
  const mb = app.querySelector('[data-more="plus"]'); if (mb) mb.click();
  const hk = app.querySelector("#hsteps .keypad");
  ok(hk && !!hk.querySelector('[data-k="^"]'), "B2. Turing, pour aller plus loin (26³) : touche puissance sur le pavé");
  const kG = HISTOIRE.findIndex((x) => /échiquier/.test(x.titre)); screenHistory(kG, () => {});
  ok(!!app.querySelector('#kp [data-k="^"]'), "B2. grains de l'échiquier, « À toi » : touche puissance");
  /* D1. question à choix numérotés : touches 1 à n et ⌫ */
  fresh({ system: "CH", grade: 9, track: "college", minutes: 5 }); let qc = null;
  for (let s = 1; s < 200 && !qc; s++) for (const d of [1, 2, 3]) { const q = Engine.build("isom", d, s); if (q && q.choix && !q.parts) { qc = q; break; } }
  if (qc) { renderQuestion(qc, { eyebrow: "test", single: true, onDone() {}, onNext() {}, onNotYet() {} });
    const ks = [...app.querySelectorAll("#kp button")].map((b) => b.dataset.k);
    ok(ks.join(",") === [...Array(qc.choix).keys()].map((i) => i + 1).concat(["⌫"]).join(","), "D1. question à choix (" + qc.choix + ") : pavé " + ks.join(" ")); }
  else ok(false, "D1. aucune question à choix trouvée (isom)");
  /* D2. accueil : après une erreur, Réessayer puis On le fait ensemble */
  state = null; demoGrade = 9; let tries = 0, okD2 = false;
  for (; tries < 10 && !okD2; tries++) {
    screenWelcome(); const inp = document.getElementById("dans"); inp.value = "123456789"; document.getElementById("dok").click();
    const r = document.getElementById("dretry"), g = document.getElementById("dguide");
    if (r && g) { okD2 = !!(r.compareDocumentPosition(g) & Node.DOCUMENT_POSITION_FOLLOWING); r.click(); okD2 = okD2 && !document.getElementById("dretry") && document.getElementById("dans").value === "" && !document.getElementById("dans").disabled; }
  }
  ok(okD2, "D2. accueil, après une erreur : « Réessayer » avant « On le fait ensemble », le champ se vide et reste ouvert");
  /* C. robot : cercle niveau 2, jamais de rayon 1 */
  let r1 = 0; for (let s = 1; s < 300; s++) { const q = Engine.build("cercle", 2, s); if (q && q.spec.value === 1) r1++; }
  ok(!r1, "C. cercle niveau 2 : jamais de rayon 1 (" + r1 + " sur 300)");
  /* 27.11 : coordonnées entre parenthèses (agent recalcfr) */
  { const sp = { kind: "pair", values: [-5, -2] };
    ok(["(-5 ; -2)", "−5 ; −2", "[-5;-2]", "( -5 ; -2 )"].every((t) => checkAnswer(sp, t).status === "correct") && checkAnswer(sp, "(-2 ; -5)").status !== "correct", "E. coordonnées « (−5 ; −2) » acceptées, ordre contrôlé"); }
} catch (e) { fail.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(0, 3).join(" ")); }
document.getElementById("out").textContent = fail.concat(out).join("\n") + "\n" + (fail.length ? fail.length + " ÉCHEC(S)" : "tout ok");
</script>
