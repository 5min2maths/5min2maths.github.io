<!-- 26.11 soir (agent defisfr) : recalcul indépendant des défis (niveau 4) du profil France rendus variés (fichiers
     src/fr_*.js), sur le modèle de recalcul.html, restreint à ces défis. Oracles : tests/recalc_oracles_fr.js (un par
     contexte). Échec : désaccord (réponse attendue, arrondi demandé, corrigé), question non reconnue (toutes les parties
     doivent être recalculées), valeur tronquée, exception, ou contre-épreuve non détectée (réponse attendue faussée sur
     chaque énoncé : l'oracle doit protester). #n=150 (graines par défi) ; #ids=proba2,lnfr ; #detail. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 150), DET = P.has("detail");
  const ids = P.get("ids") ? P.get("ids").split(",") : RECALC_FR.IDS;
  const mutate = (sp) => !sp || sp.kind !== "value" ? sp : { ...sp, value: Math.abs(sp.value * 0.2 + 0.7) < 1e-9 ? sp.value + 1 : sp.value * 1.2 + 0.7 };
  const t0 = performance.now(), fails = [], exc = [], per = {};
  let np = 0, nk = 0, nm = 0;
  for (const id of ids) {
    const { items, errs } = VRAI.items({ n: N, ids: [id], src: ["defi"] });
    exc.push(...errs);
    const st = (per[id] = { q: 0, p: 0, k: 0 });
    for (const x of items) {
      st.q++;
      const it = { id: x.id, d: x.d, code: x.code, raw: x.raw, fig: x.fig, txt: x.txt, sol: x.sol, rawSol: "", spec: null, parts: x.parts };
      const vp = x.parts.filter((p) => p.spec && p.spec.kind === "value"); st.p += vp.length; np += vp.length;
      if (vp.length !== x.parts.length) fails.push(x.code + " : partie sans réponse numérique");
      for (const p of x.parts) { const t = RECALC.truncSpec(p.spec); if (t) fails.push(x.code + " [valeur tronquée] " + t); }
      let r; try { r = RECALC.check(it); } catch (e) { exc.push(x.code + " (oracle) : " + e.message); continue; }
      st.k += r.length; nk += r.length;
      if (r.length < vp.length) fails.push(x.code + " : question(s) non reconnue(s) par les oracles — " + VRAI.plain(x.txt).slice(0, 60) + " ¶ " + vp.map((p) => p.label).join(" | ").slice(0, 160));
      for (const c of r) if (c.msg) fails.push(x.code + " [" + c.rule.slice(0, 40) + "] " + c.msg);
      if (r.length && r.every((c) => !c.msg)) for (let i = 0; i < x.parts.length; i++) { /* contre-épreuve : une partie faussée à la fois */
        nm++; let r2; try { r2 = RECALC.check({ ...it, parts: it.parts.map((p, j) => (j === i ? { ...p, spec: mutate(p.spec) } : p)) }); } catch (e) { r2 = []; }
        if (!r2.some((c) => c.msg)) fails.push(x.code + " : contre-épreuve — réponse attendue de « " + x.parts[i].label.slice(0, 50) + " » faussée non détectée");
      }
    }
    if (!st.q) fails.push(id + " : aucun défi tiré");
  }
  const uniq = [...new Set(fails)];
  const out = [(uniq.length || exc.length ? "ÉCHEC " : "ok ") + ids.length + " défis France, " + np + " questions, " + nk + " recalculées, " + nm + " contre-épreuves, " + uniq.length + " désaccord(s), " + exc.length + " exception(s), " + Math.round(performance.now() - t0) + " ms"];
  for (const f of uniq.slice(0, 120)) out.push("  " + f);
  if (exc.length) out.push("EXC :\n  " + exc.slice(0, 30).join("\n  "));
  if (DET) for (const id of ids) out.push("  " + id + " : " + per[id].q + " énoncés, " + per[id].k + "/" + per[id].p + " questions recalculées");
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
