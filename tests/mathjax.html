Lot.section("sujet11", { html: `<main id="app"></main><pre id="log"></pre>`, body: "width:420px" }, function () {
try{ Element.prototype.scrollIntoView=function(){}; window.print=()=>{};

/* ======== eq1c_vue (ancienne page tests/eq1c_vue.html) ======== */
Lot.section("eq1c_vue", { html: `<main id="app" hidden></main><div id="g"></div>`, body: "width:760px;background:#fff", apercu: true }, function () {
try{ const ids=(location.hash.slice(1)||"eq1,eqfrac,eqspec,formule,probeq,eq2fact").split(","), seed=+(new URLSearchParams(location.search).get("s")||7); let h="";
for (const id of ids) for (const d of [1,2,3,4]) { const q=Engine.build(id,d,seed); h+=`<div style="border-top:2px solid #888;margin:6px 0;padding:4px;font-size:13px"><b>${q.code}</b> ${q.ctx||""}<div>${q.q}</div>${q.fig?'<div style="width:260px">'+q.fig+'</div>':""}${q.parts?"<ul>"+q.parts.map(p=>"<li>"+p.label+" → "+(+p.spec.value.toFixed(4))+"</li>").join("")+"</ul>":"<div>→ "+JSON.stringify(q.spec)+"</div>"}<div style="color:#246">${q.sol}</div>${(q.guide||[]).map((g,i)=>"<div style='color:#555'>"+(i+1)+". "+g.ask+" <i>"+g.sol+"</i></div>").join("")}${(q.traps||[]).map(t=>"<div style='color:#a40'>⚠ "+t.m+"</div>").join("")}</div>`; }
document.getElementById("g").innerHTML=h; MathJax.startup.promise.then(()=>MathJax.typesetPromise()).then(()=>document.title="ok"); }catch(e){document.body.insertAdjacentHTML("afterbegin","<pre>ERR "+e.stack+"</pre>")}
});
