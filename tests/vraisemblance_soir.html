<!-- Audit de vraisemblance, suite du soir (26.11, tools/vraisemblance_26-11.md § « soir ») :
     1. notions ajoutées ou très modifiées depuis l'audit du matin (src/perco.js, ch1c_trous, ch4c_trous, fr_trous, fr_fin,
        ch11_rep3d, ch1c_arg, formes VARX de simil et volcone) : #n graines (150) par niveau, défis compris, contrôles de
        tests/vrai_checks.js et contrôles propres (ci-dessous) ;
     2. profils strictement séparés : tout le catalogue de chaque classe (CO 9e–11e, Collège 1re–4e, MP 1re–4e, France 6e–Tle),
        questions finales (Engine.make : formes réservées écartées, passe française appliquée) : aucun terme romand en
        profil France (CHF, francs, villes suisses, apprentis, PGDC, préimage, cathète, septante, produit « · »…) et aucun
        terme français en profil romand (€ hors change, × entre deux nombres, PGCD, antécédent, brevet…) ;
     3. défis figés (un seul énoncé au niveau 4) = ÉCHEC ; pour les défis rendus aléatoires le 26.11 (agents defis2 et defis3,
        liste VARIES), au moins 10 énoncés différents et 3 contextes (avant : simple rapport mineur).
     #n=150 ; #np=3 (graines par notion et par niveau pour les profils) ; #detail. -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 150), NP = +(P.get("np") || 3), DET = P.has("detail"), t0 = performance.now();
  const SOIR = ["isom", "ensco", "numer", "fctlec", "litconv", "simil", "volcone", "graphefct", "ineqgraph", "geoesp", "densite", "approxnorm", "cercle6", "bissec6", "filtre6", "tabform5", "hauteurs5",
    "symax", "mediatrice", "echelle6", "proba6", "empil", "compdiff", "posrelc", "intmaj", "suiteint", "repere3d", "tradalg", "contrex", "demoalg", "implication"];
  const MINEUR = new Set(["montant à 1 décimale (mineur)"]);
  const byKey = {}, ex = {}, add = (k, id, code, m) => { const kk = k + " | " + id; byKey[kk] = (byKey[kk] || 0) + 1; if (!ex[kk]) ex[kk] = code + " : " + m; };
  const errs = [];
  // 1. notions du soir : contrôles communs et propres
  const { items, errs: e1 } = VRAI.items({ n: N, ids: SOIR, src: ["gen", "defi"] }); errs.push(...e1);
  const d4 = {};
  for (const x of items) {
    for (const [k, m] of VRAI_CHECK(x)) add(k, x.id + "-" + x.d, x.code, m);
    const all = x.txt + " " + x.parts.map((p) => p.label).join(" ");
    /* variable annoncée mais absente (« si x = 8, alors x² = 64 (x et y sont des réels) ») */
    if (/x et y sont des réels/.test(all) && !/\by\b|xy|y\s*=|y\^/.test(all.replace(/x et y sont des réels/, ""))) add("variable absente", x.id + "-" + x.d, x.code, all.slice(0, 120));
    /* accord du participe (« une allée de 2,5 m est représenté ») */
    let m; if ((m = /\b(une|la) [a-zàâçéèêëîïôûù]+ de [\d,']+ ?(?:m|cm|km) est représenté(?![\p{L}])/u.exec(all))) add("accord", x.id + "-" + x.d, x.code, m[0]);
    /* tableau de valeurs : la même valeur de x deux fois dans la ligne du haut (« n | 1 4 6 8 5 6 ») */
    for (const r of String(x.raw).matchAll(/\\begin\{array\}\{c\|[c|]+\}\s*(?:\\text\{[^}]*\}|[a-z]) & ([^\\]+)\\\\/g)) {
      const v = r[1].split("&").map((t) => t.trim()).filter((t) => t && t !== "?"); if (/tableau de valeurs|tableau donne/i.test(all) && !/fonction/.test(all) && new Set(v).size !== v.length) add("tableau : colonne répétée", x.id + "-" + x.d, x.code, v.join(" "));
    }
    /* congélateur : jamais en dessous de −26 °C */
    if (/congélateur/.test(all) && x.spec && x.spec.kind === "value" && x.spec.value < -26 && /température/.test(all)) add("température invraisemblable", x.id + "-" + x.d, x.code, all.slice(0, 100) + " → " + x.spec.value);
    if (x.d === 4) (d4[x.id] = d4[x.id] || new Set()).add(x.txt + " | " + x.parts.map((p) => p.label).join(" | "));
  }
  for (const [id, S] of Object.entries(d4)) if (S.size === 1) add("défi figé", id + "-4", id, [...S][0].slice(0, 90));
  /* défis rendus aléatoires le 26.11 (agent defis2, puis agent defis3 le soir : 42 défis de plus) : au moins 10 énoncés
     différents (énoncé et questions) et 3 contextes (ctx) */
  const VARIES = ["approxnorm", "compdiff", "echelle6", "empil", "intmaj", "mediatrice", "posrelc", "proba6", "suiteint", "symax", "isom", "numer",
    "fracmul", "fracconv", "sci", "scicalc", "pythfig", "pythrec", "vol", "airepyr", "volcomp", "thales", "repere", "sysprob", "sysgraph", "sysineq", "eqfrac", "bicarre",
    "lectgraph", "trigexact", "droitesrem", "polyreg", "graphefct", "ineqgraph", "repere3d", "bayes", "syslin", "bases", "etudelnexp", "geoesp", "densite",
    "probaxiomes", "derivth", "trigcercle", "optimderiv", "eqlog", "eqbic", "dec10", "pow9", "aire1", "quadri", "decarr", "airelat", "fracadd",
    /* 26.11 soir (agent defisch) : défis à 1 ou 2 contextes passés à 3 */
    "decread", "deccomp", "ulong", "uaire", "uvol", "angtype", "perim", "aire2", "aire3", "volpave", "fracrep", "fracsimp", "fractout", "proptab", "prop", "change", "agrand",
    "diagr", "premiers", "fracper", "decprob", "multdiv", "relrep", "symetries", "rac", "disque", "grandmanq", "voldecomp", "eqverif", "pente", "rotation",
    "rel", "reladd", "decadd", "decdiv", "carres", "ordgr", "fracops", "divcrit", "racenc", "tradexpr", "valnum", "pctvar", "affine", "pyth", "simil",
    "eq1", "probeq", "probeq2", "litelab", "parenth", "fctlec", "monomes", "reduire", "pct", "prio",
    /* 26.11 soir (agent defisch2) : suite, 9e–11e */
    "distrib", "idrem", "eq2", "echelle", "sys2", "angles", "angtri", "volcone", "formule", "proba", "volmanq", "eq2fact", "cercthales", "thalesrec", "racprop", "litconv",
    /* 26.11 soir (agent defisch2) : 1re Collège */
    "eq3", "absval", "ineq2", "ensembles", "trinfact", "eqspec", "modaff", "geocomb", "trigrel", "f2", "euclide", "trigo", "ineq", "f2expr", "racinv", "ratden", "exactes", "f2trois", "morceaux", "tradalg", "contrex", "demoalg", "implication",
    /* 26.11 soir (agent defisch3) : 2e–4e Collège et MP */
    "stats", "statfreq", "quartiles", "triaire", "droites", "droitesinter", "recipaff", "trigassoc", "trigeq2", "fracrat", "vabs", "eqparam", "cart", "expo", "log", "vecteurs",
    "eqratmp", "logprop", "croissexp", "volmp", "similmp", "coordmp", "vectmp", "scalmp", "projmp", "pvectmp", "explogfn", "eqirrmp", "limitinf", "continuite", "combi",
    "vect3d", "droite3d", "plans", "pscal3d", "derivref", "etudefct", "primitives", "volrev", "croissance", "appllin", "condbayes", "varalea", "binomiale", "normale", "lnexp"];
  for (const id of VARIES) {
    const S = new Set(), C = new Set();
    for (let s = 1; s <= N; s++) { let q; try { q = Engine.build(id, 4, s); } catch (e) { errs.push(id + "-4-" + s + " : " + e.message); continue; } S.add(q.q + " | " + (q.parts || []).map((p) => p.label).join(" | ")); C.add(q.ctx || "?"); }
    if (S.size < Math.min(10, N / 3) || C.size < 3) add("défi peu varié", id + "-4", id, S.size + " énoncés différents et " + C.size + " contexte(s) sur " + N + " graines");
  }
  // 2. profils : tout le catalogue de chaque classe, questions finales
  const PROFS = [];
  for (const g of [9, 10, 11, 12, 13, 14, 15]) PROFS.push({ system: "CH", grade: g, track: "college" });
  for (const g of [12, 13, 14, 15]) PROFS.push({ system: "CH", grade: g, track: "mp" });
  for (const g of [6, 7, 8, 9, 10, 11, 12]) PROFS.push({ system: "FR", grade: g, track: "college" });
  const txt = (q) => [q.q, q.sol, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.parts || []).map((p) => p.label), ...(q.hints || []), ...(q.traps || []).map((t) => t.m)].filter((t) => typeof t === "string").join(" | ");
  const VILLES_CH = "Genève|Lausanne|Berne|Zurich|Neuchâtel|Fribourg|Valais|Sion|Lugano|Bâle|Léman|Montreux|Vevey|Yverdon|Nyon|Morges|Bienne|Lucerne|Gruyère|Cervin|Brévine|Romont|Delémont|Salève|Jungfrau|Lavaux|Carouge|Onex|Meyrin|Vernier|Plainpalais|Gothard";
  const FRB = [["CHF / francs", /CHF|(?<!lancers? )\bfrancs?\b(?! (?:succès|lancers?|tireurs?))/], ["lieu suisse", new RegExp("\\b(?:" + VILLES_CH + ")\\b")], ["usage suisse", /\b(?:septante|huitante|nonante|PGDC|PPMC|[Pp]réimages?|cathètes?|apprenti(?:e|s|es)?|EVACOM|natel|CFC|gymnase)\b|mise en évidence|mets? [^.;]{0,25}en évidence/],
    ["produit « · » (usage suisse)", /\\cdot(?![a-zA-Z])/]];
  const CHB = [["euro hors change", /€|\beuros?\b/], ["× entre deux nombres (usage français)", /\d\s*(?:\\text\{[^}]*\}\s*)?\\times\s*\d[\d,{}]*\s*(?:\\text\{[^}]*\}\s*)?(?:=|\\\))/], ["usage français", /\b(?:PGCD|PPCM|antécédents?|brevet|baccalauréat|collégiens?|lycéens?)\b/]];
  /* cas relus et acceptés (clé|notion) */
  const OK = new Set([
    "produit « · » (usage suisse)|*vec", /* produit scalaire : le point est voulu (frTimes) */
  ]);
  let nq = 0;
  for (const p of PROFS) {
    const st = { profile: p }, B = p.system === "FR" ? FRB : CHB, cat = Engine.catalog(p), lab = p.system + p.grade + (p.track === "mp" ? "mp" : "");
    for (const c of cat) for (const d of [1, 2, 3, 4]) {
      if (d === 4 && !hasProb(c.id)) continue;
      for (let s = 1; s <= NP; s++) {
        let q; try { q = Engine.make(st, c.id, d, s); } catch (e) { errs.push(lab + " " + c.id + "-" + d + "-" + s + " : " + e.message); continue; }
        if (!q) continue; nq++;
        const t = txt(q);
        for (const [k, re] of B) {
          let tt = t;
          if (k.startsWith("produit")) tt = t.replace(/\\\([\s\S]*?\\\)/g, (f) => (/\\vec|\\overrightarrow/.test(f) ? "" : f));
          if (k === "euro hors change" && /CHF/.test(t) && /\bEUR\b|euros?|€/.test(t) && /change|vaut|obtient|banque|taux|convert/.test(t)) continue;
          const m = tt.match(new RegExp(".{0,50}(?:" + re.source + ").{0,30}", re.flags.replace("g", "")));
          if (m && !OK.has(k + "|" + c.id)) add(k, c.id + "-" + d + " (" + p.system + ")", lab + " " + q.code, m[0]);
        }
      }
    }
  }
  const keys = Object.keys(byKey).sort(), grave = keys.filter((k) => !MINEUR.has(k.split(" | ")[0])), mineur = keys.filter((k) => MINEUR.has(k.split(" | ")[0]));
  const out = [(grave.length || errs.length ? "ÉCHEC " : "ok ") + items.length + " énoncés du soir (" + N + " graines, " + SOIR.length + " notions) et " + nq + " questions de profil (" + PROFS.length + " classes, " + NP + " graines), " + grave.length + " problème(s), " + mineur.length + " mineur(s), " + errs.length + " exception(s), " + Math.round(performance.now() - t0) + " ms"];
  for (const k of keys) if (DET || !MINEUR.has(k.split(" | ")[0])) out.push((MINEUR.has(k.split(" | ")[0]) ? "  (mineur) " : "  ") + k + " ×" + byKey[k] + "  ex. " + ex[k]);
  if (!DET && mineur.length) out.push("  mineurs : " + mineur.map((k) => k.split(" | ")[1]).join(", "));
  if (errs.length) out.push("EXC :\n  " + errs.slice(0, 30).join("\n  "));
  document.getElementById("out").textContent = out.join("\n");
})();
</script>
