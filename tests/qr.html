<meta charset="utf-8">
<pre id="out"></pre>
<script src="../src/qr.js"></script>
<script>
// Contrôle des tables : nombre total de mots de code = modules de données / 8, pour chaque version.
const errs = [];
for (let v = 1; v <= 40; v++) { const t = QR.blocks(v).reduce((a, b) => a + b[0], 0); if (t !== QR.rawModules(v) >> 3) errs.push("v" + v + " " + t + "≠" + (QR.rawModules(v) >> 3)); }
const lens = [5, 17, 60, 150, 300, 700, 1200, 1600, 2000, 2400, 2900, 3100];
const out = { errs, qr: lens.map((n) => { let s = "https://5min2maths.github.io/#r="; let x = 7; while (s.length < n) { x = (x * 1103515245 + 12345) & 0x7fffffff; s += "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"[x % 64]; } const m = QR.encode([...new TextEncoder().encode(s)]); return { s, m: m ? m.map((r) => r.map((b) => (b ? 1 : 0)).join("")) : null }; }) };
document.getElementById("out").textContent = JSON.stringify(out);
</script>
