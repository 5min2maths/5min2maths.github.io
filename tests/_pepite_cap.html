    /* 27.11 soir (revue des écrans n° 2, 3, 5, 8) : Histoire « À toi », retour après une erreur, pas à pas, Progrès, tablette */
    if (P.get("cls") !== "tel") {
      const two = H5.classList.contains("ecran-2col"), vis = (el) => { const r = el && el.getBoundingClientRect(); return !!r && r.width > 0 && r.top >= 0 && r.bottom <= H; };
      newSt(); reseed(); screenHistory(0, () => {}); window.scrollTo(0, 0);
      if (two) ok(vis(document.getElementById("hans")) && vis(document.getElementById("hok")), "Histoire « À toi » : réponse et « Vérifier » visibles sans défiler (" + Math.round(document.getElementById("hok").getBoundingClientRect().bottom) + " / " + H + ")");
      if (P.get("cls") === "ordi") { const kb = document.querySelector("#kp button"); ok(kb && kb.getBoundingClientRect().height <= 46, "Histoire : pavé compact de l'ordinateur (" + (kb ? Math.round(kb.getBoundingClientRect().height) : "-") + " px)"); }
      newSt(); reseed(); session = null;
      const q = qWith((q) => q.guide && q.guide.length >= 2 && !q.parts && q.spec && q.spec.kind === "value");
      renderQuestion(q, opt({ onNotYet: () => 0, onEasy: () => 0 }));
      const inp = document.getElementById("ans"); inp.value = "123456"; inp.dispatchEvent(new Event("input")); document.getElementById("check").click();
      inp.value = "654321"; inp.dispatchEvent(new Event("input")); document.getElementById("check").click();
      const bar = document.getElementById("qbar"), fb = document.getElementById("fb");
      if (two) ok(!!(fb && bar && fb.compareDocumentPosition(bar) & Node.DOCUMENT_POSITION_FOLLOWING), "retour après une erreur : barre d'action (« Continuer ») sous le retour");
      const gb = document.getElementById("guide"); if (gb) gb.click(); window.scrollTo(0, 0);
      const gok = document.querySelector("#gs0 .gok");
      const hit = (el) => { if (!el) return false; const r = el.getBoundingClientRect(), t = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return !!t && el.contains(t); };
      if (two) ok(gb && vis(gok) && hit(gok), "pas à pas : « Vérifier l'étape » visible sans défiler et pas cachée par la barre (" + (gok ? Math.round(gok.getBoundingClientRect().bottom) : "-") + " / " + H + ")");
      if (P.get("cls") === "tablette") { const ks = [...document.querySelectorAll("#gs0 .keypad button")].map((b) => b.getBoundingClientRect().height); ok(ks.length && Math.min(...ks) >= 52, "pas à pas, tablette : touches ≥ 52 px (" + Math.round(Math.min(...ks)) + ")"); }
      newSt(); homeTab = "prog"; screenHome();
      const map = document.querySelector(".pmap-card"), first = document.querySelector('.home-panel[data-tab="prog"] > :first-child');
      if (two) ok(map && first && map.getBoundingClientRect().left > first.getBoundingClientRect().right, "Progrès : carte de progression dans la colonne de droite");
      if (P.get("cls") === "tablette") {
        const sq = document.querySelector(".pm-sq"), r = sq.getBoundingClientRect(), a = getComputedStyle(sq, "::after"), ins = parseFloat(a.top) || 0;
        ok(r.height - 2 * ins >= 44 && a.content !== "none", "tablette : zone de toucher des cases de la carte ≥ 44 px (" + Math.round(r.height - 2 * ins) + ")");
      }
      if (P.get("cls") === "ordi") ok(getComputedStyle(H5).scrollbarGutter === "stable", "ordinateur : place de la barre de défilement réservée (en-tête sans décalage)");
    }
    /* mesures du 27.11 avant les affichages (master 2618068, mêmes tirages et même date) : info seulement, car tout
       changement de contenu les modifie ; le contrôle qui compte est la comparaison « sans classe d'écran » ci-dessus. */
    const AVANT = {"accueil":"79/gpx7s","figure":"87/a8v0ru","pave":"83/1dbjc1c","probleme":"102/ouodw0","lecon":"17/tswxgd","bilan":"37/2baz0o","progres":"164/1bevvct","competences":"804/hhl1i8","reglages":"50/p5edvz"};
    if (P.get("cls") === "tel" && W === 360) { const d = Object.keys(sigs).filter((k) => sigs[k] !== AVANT[k]); out.push("info " + tag + (d.length ? "différent des mesures du 27.11 (contenu changé depuis ?) : " + d.join(", ") : "identique aux mesures du 27.11 avant les affichages (" + Object.keys(sigs).length + " écrans)")); }
    /* option des Réglages : choix gardé (localStorage) et appliqué sans recharger */
    if (W >= 1024) {
      newSt(); screenSettings();
      const bs = [...document.querySelectorAll("#ecran button")];
      ok(bs.length === 4, "Réglages : 4 choix d'affichage (" + bs.length + ")");
      for (const [v, cls] of [["tab", "tablette"], ["tel", "tel"], ["ordi", "ordi"], ["auto", W >= 1024 ? "ordi" : "tel"]]) {
        const b = document.querySelector('#ecran button[data-v="' + v + '"]'); if (!b) continue; b.click();
        let saved = ""; try { saved = JSON.parse(localStorage.getItem("m2m-ui")).ecran; } catch (e) {}
        ok(H5.classList.contains("ecran-" + cls) && saved === v && document.querySelector('#ecran button[data-v="' + v + '"]').getAttribute("aria-pressed") === "true", "Réglages « " + v + " » → ecran-" + cls + ", gardé (" + saved + ")");
      }
      if (P.get("ecran") !== "auto") document.querySelector('#ecran button[data-v="' + P.get("ecran") + '"]').click();
    }
    /* détection automatique : largeur et pointeur (tactile = coarse) */
    if (W === 1440 && P.get("ecran") === "auto") {
      const C = [[360, true, "tel"], [412, true, "tel"], [699, true, "tel"], [768, true, "tab"], [820, true, "tab"], [1024, true, "tab"], [1180, true, "tab"], [1366, true, "tab"], [800, false, "tel"], [1023, false, "tel"], [1024, false, "ordi"], [1440, false, "ordi"]];
      const badA = C.filter(([w, c, e]) => ecranAuto(w, c) !== e).map(([w, c, e]) => w + (c ? " tactile" : " souris") + " → " + ecranAuto(w, c) + " (attendu " + e + ")");
      ok(!badA.length, "détection automatique : " + C.length + " cas" + (badA.length ? " — " + badA.join(" | ") : ""));
    }
  } catch (e) { fail.push("EXC " + tag + e.message + " " + (e.stack || "").split("\n")[1]); }
  parent.postMessage("ecr:" + fail.concat(out).join("\n"), "*");
});
</script>
