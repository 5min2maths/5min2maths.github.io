<script>const log=[];const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return false;} e.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
// Leçons actives de 10e (act_10a.js) : devine, puis pour chaque défi une mauvaise réponse (aide sans valider) puis la bonne.
const gfb=()=>document.querySelector('#gfb').textContent;
const type=(v)=>{const el=document.querySelector(".act-in");if(!el)return false;el.value=v;click("[data-go]");return true;};
const REP={disque:["12","225","27π"],grandmanq:["12","6","5"],airelat:["240","88","120"],voldecomp:["200","240","48'000"]};
const run=(id)=>{ try{ window.scrollTo=()=>{}; Element.prototype.scrollIntoView=function(){}; screenLesson(id,()=>{});
  const A=ACTIVE[id], X=actPrep(A); const msgs=[];
  if(!document.querySelector(".act-step .figwrap svg.fig")&&A.predict.fig) msgs.push("figure du Devine absente");
  click('#pc button[data-i="'+A.predict.good+'"]');
  if(!/Exact/.test(document.getElementById("pfb").textContent)) msgs.push("devine non validé");
  if(X.mode!=="figure") msgs.push("mode "+X.mode);
  if(X.defis.length!==REP[id].length) msgs.push(X.defis.length+" défis");
  REP[id].forEach((v,k)=>{ const b=gfb(); type("7777"); if(gfb()!==b) msgs.push("défi "+(k+1)+" validé à tort");
    if(!/Pas encore/.test((document.querySelector(".act-hint")||{}).textContent||"")) msgs.push("défi "+(k+1)+" : pas d'aide");
    type(v); if(gfb()===b) msgs.push("défi "+(k+1)+" non validé avec "+v); });
  const html=document.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g,"").replace(/<pre id="log"[\s\S]*?<\/pre>/,""); const bad=/NaN|undefined|Infinity/.test(html);
  const fail=document.getElementById("s3").hidden||bad||msgs.length;
  log.push(id+" : "+(fail?"ÉCHEC "+(bad?"(NaN/undefined) ":"")+msgs.join(" | "):"OK · "+gfb().slice(0,70)));
  }catch(e){log.push(id+" EXC "+e.stack)} };
for(const id of Object.keys(REP)) run(id);
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");</script>
