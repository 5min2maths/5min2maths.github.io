<script>
// Leçons actives MP 3e et MP 4e (24.11, src/act_mp34.js) : chaque leçon se joue jusqu'au bout (« Retiens » visible).
// « À toi » et « Essaie sur la figure » : chaque défi est cherché parmi des candidats ; « Manipule » : l'état est posé
// directement (box.__manip.set), puis la question « à toi » est répondue. Pas de NaN / undefined dans la page.
const log=[];window.scrollTo=()=>{};Element.prototype.scrollIntoView=function(){};
const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return false;}e.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
const gfb=()=>document.querySelector("#gfb").textContent;
const C=["1/3","1.204","2.32","1.5","9.5"];for(let v=-12;v<=2000;v++)C.push(String(v));
const seek=()=>{const b=gfb();for(const v of C){const el=document.querySelector("#play .act-in");if(!el)return gfb()!==b;el.value=v;click("#play [data-go]");if(gfb()!==b)return true;}return false;};
const MB=()=>[...document.querySelectorAll("#play div, #play")].find((d)=>d.__manip);
const answer=(v)=>{const i=document.querySelector(".manip-ask input");if(!i)return;i.value=String(v);click(".manip-ask [data-go]");};
const MAN={
  eqabs:[[(st)=>{st.x=8;},null],[(st)=>{st.x=-2;},0],[(st)=>{st.x=-6;},-3]],
  similmp:[[(st)=>{st.h=6;},240],[(st)=>{st.h=9;},null],[(st)=>{st.h=3;},"9,5"]],
  vectmp:[[(st)=>{st.B=[4,-1];},null],[(st)=>{st.B=[4,5];},10],[(st)=>{st.D=[2,3];},5]],
};
const IDS=["eqabs","eqbic","eqirrmp","eqratmp","puisrat","logdef","logprop","eqexp","eqlog","croissexp","volmp","similmp","coordmp","vectmp","scalmp","droiteparam","ineqmp","fctmp","polymp","sinusmp","explogfn"];
const run=(id)=>{ try{ screenLesson(id,()=>{});
  const A=ACTIVE[id]; if(!A){log.push(id+" : ÉCHEC pas de leçon active");return;}
  if(!document.getElementById("s3")){log.push(id+" : ÉCHEC pas d'écran de leçon active (leçon absente ?)");return;}
  click('#pc button[data-i="'+A.predict.good+'"]'); const X=actPrep(A), msgs=[X.mode];
  if(X.mode==="manip"){ const S=MAN[id]; if(!S){log.push(id+" : ÉCHEC manipulation sans scénario de test");return;}
    S.forEach(([set,ans],k)=>{ const b=MB(); if(!b){msgs.push("pas de manipulation");return;} b.__manip.set(set); if(ans!==null) answer(ans); msgs.push(b.__manip.step>k?"défi "+(k+1)+" ✓":"défi "+(k+1)+" ✗ "+(document.querySelector(".manip-hint")||{}).textContent); }); }
  else for(let k=0;k<X.defis.length;k++){ if(!seek()) msgs.push("défi "+(k+1)+" non trouvé"); else msgs.push(gfb().slice(0,40)); }
  const html=document.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g,"").replace(/<pre id="log"[\s\S]*?<\/pre>/,""); const bad=/NaN|undefined|Infinity/.test(html);
  const ok=!document.getElementById("s3").hidden&&!bad&&!msgs.some((m)=>/✗|non trouvé|pas de/.test(m));
  log.push(id+" : "+(ok?"OK":"ÉCHEC "+(bad?"(NaN/undefined) ":""))+" · "+msgs.join(" | "));
  }catch(e){log.push(id+" ÉCHEC EXC "+e.stack.slice(0,300))} };
for(const id of IDS) run(id);
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");</script>
