<script>
(async function () {
  const OUT = [], log = (s) => OUT.push(s);
  const flush = () => { document.getElementById("out").textContent = OUT.join("\n"); };
  const wait = (ms = 30) => new Promise((r) => setTimeout(r, ms));
  const rnd = Math.random;
  const ST = new Set(String(CFG.strategie).split(",").filter(Boolean)), EX = String(CFG.extras).split(",").filter(Boolean);
  const LV = { tresfaible: { p1: 0.25, p2: 0.15, pl: 0.25 }, faible: { p1: 0.45, p2: 0.3, pl: 0.4 }, moyen: { p1: 0.7, p2: 0.5, pl: 0.65 }, fort: { p1: 0.93, p2: 0.8, pl: 0.9 } }[CFG.niveau] || { p1: 0.7, p2: 0.5, pl: 0.65 };
  /* ---------- temps simulé ---------- */
  let T = 0, Tsess = 0;
  const words = (s) => (String(s || "").match(/[\p{L}\p{N}][\p{L}\p{N}'’,.\-]*/gu) || []).length;
  const readS = (s) => (words(s) * 60) / CFG.wpm;
  const add = (sec) => { T += sec; Tsess += sec; };
  const mmss = (s) => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  /* ---------- lecture de l'écran ---------- */
  const hideCss = document.createElement("style");
  hideCss.textContent = ".keypad,.vote,details.cmt,.tabs,#fabs,#fabc,.fab,.preview{display:none!important}";
  const vis = (el) => !!el && el.offsetParent !== null && !el.disabled;
  const screenText = (root = app) => { document.head.appendChild(hideCss); const t = (root.innerText || "").replace(/\n{2,}/g, "\n").trim(); hideCss.remove(); return t; };
  const buttons = () => [...app.querySelectorAll("button, a.btn-sec, a.btn-ghost")].filter((b) => vis(b) && !b.closest(".keypad") && !b.closest(".vote") && !b.closest("details.cmt")).map((b) => (b.innerText || b.getAttribute("aria-label") || "").replace(/\s+/g, " ").trim()).filter(Boolean);
  const indent = (t, n = 4) => String(t).split("\n").map((l) => " ".repeat(n) + l).join("\n");
  const status = () => { try { return "Mathélo " + state.elo.r + " · points de l'année " + ypPts() + " · carnet " + (state.carnet || []).length; } catch (e) { return ""; } };
  let nShot = 0;
  const shot = (label, opt = {}) => {
    nShot++;
    if (CFG.stopat && (/^\d+$/.test(CFG.stopat) ? String(nShot) === CFG.stopat : new RegExp(CFG.stopat).test(label))) { CFG.ecran = 1; throw new Error("STOP " + label); }
    const t = screenText();
    log("\n━━ [" + mmss(T) + "] #" + nShot + " " + label);
    log(indent(opt.max ? t.slice(0, opt.max) + (t.length > opt.max ? " […]" : "") : t));
    log("    ▸ boutons : " + buttons().join(" | "));
    return t;
  };
  const act = (s) => log("  → " + s);
  const click = async (el, what) => { if (!el) { act("(introuvable : " + what + ")"); return false; } act("touche « " + (what || (el.innerText || "").trim().slice(0, 60)) + " »"); el.click(); await wait(); return true; };
  const $ = (id) => document.getElementById(id);
  const byText = (re, root = app) => [...root.querySelectorAll("button, a")].find((b) => vis(b) && re.test(b.innerText || ""));
  /* ---------- réponses ---------- */
  const fmt = (x) => { if (!isFinite(x)) return String(x); let s = String(+(+x).toPrecision(12)); if (/e/.test(s)) return s; return s.replace(".", ","); };
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  function valAns(spec) {
    const v = spec.value;
    if (spec.sci) { const e = Math.floor(Math.log10(Math.abs(v))), a = +(v / Math.pow(10, e)).toPrecision(10); return fmt(a) + "*10^" + e; }
    if (spec.round) { const k = Math.round(v / spec.round) * spec.round, dec = Math.max(0, -Math.floor(Math.log10(spec.round) + 1e-9)); return (+k.toFixed(dec)).toFixed(dec).replace(".", ","); }
    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
    for (let k = 1; k <= 4; k++) { const n = v * Math.pow(10, k); if (Math.abs(n - Math.round(n)) < 1e-7) return fmt(+v.toFixed(k)); }
    for (let d = 2; d <= 400; d++) { const n = v * d; if (Math.abs(n - Math.round(n)) < 1e-9) { const g = gcd(Math.round(n), d); return Math.round(n) / g + "/" + d / g; } }
    const pi = v / Math.PI; for (let d = 1; d <= 12; d++) { const n = pi * d; if (Math.abs(n - Math.round(n)) < 1e-9) { const g = gcd(Math.round(n), d); return (Math.round(n) / g === 1 ? "" : Math.round(n) / g) + "π" + (d / g > 1 ? "/" + d / g : ""); } }
    for (let c = 1; c <= 12; c++) { const w2 = Math.round(v * c * v * c); if (Math.abs(v * c * v * c - w2) < 1e-6) { let a = 1, b = w2; for (let k = 2; k * k <= b; k++) while (b % (k * k) === 0) { b /= k * k; a *= k; } return (v < 0 ? "-" : "") + (a > 1 ? a : "") + "√" + b + (c > 1 ? "/" + c : ""); } }
    return fmt(v);
  }
  function rightAns(spec) {
    if (!spec) return null;
    if (spec.kind === "value") return valAns(spec);
    if (spec.kind === "expr") return String(spec.expr);
    if (spec.kind === "set") return spec.all ? "tous" : !spec.values.length ? "∅" : spec.values.map((v) => valAns({ value: v })).join(" ; ");
    if (spec.kind === "pair") return spec.values.map((v) => valAns({ value: v })).join(" ; ");
    if (spec.kind === "ineq") return "x " + spec.op + " " + valAns({ value: spec.value });
    /* 26.11 (3e passage) : ensembles de solutions en intervalles (sinon la trace restait bloquée au positionnement 1re Coll.) */
    if (spec.kind === "solset") { if (!spec.ivs || !spec.ivs.length) return "∅"; return spec.ivs.map(([a, ai, b, bi]) => (a === null || !isFinite(a) ? "]-inf" : (ai ? "[" : "]") + valAns({ value: a })) + " ; " + (b === null || !isFinite(b) ? "inf[" : valAns({ value: b }) + (bi ? "]" : "["))).join(" ∪ "); }
    return null;
  }
  function wrongAns(q, spec) {
    const T = ((q && q.traps) || []).filter((t) => t.v !== undefined || t.e || t.s);
    if (T.length) { const t = T[Math.floor(rnd() * T.length)]; return { a: t.v !== undefined ? valAns({ value: t.v }) : t.e || t.s.join(" ; "), typ: "piège : " + (t.m || "").slice(0, 80) }; }
    if (spec && spec.kind === "value") return { a: valAns({ value: spec.value === 0 ? 3 : Math.round(spec.value * 10 + 10) / 10 }), typ: "erreur quelconque" };
    if (spec && spec.kind === "expr") return { a: "2*x+1", typ: "erreur quelconque" };
    if (spec && spec.kind === "pair") return { a: spec.values.map((v) => valAns({ value: -v || 1 })).join(" ; "), typ: "erreur quelconque (signes)" };
    return { a: "7", typ: "erreur quelconque" };
  }
  const specTxt = (s) => { if (!s) return "?"; const c = { ...s }; delete c.traps; return JSON.stringify(c).slice(0, 160); };
  /* ---------- captures de l'app ---------- */
  let cap = null, lessonId = null;
  const _rq = renderQuestion; renderQuestion = (q, o) => { cap = { q, o, done: false }; _rq(q, o); };
  let curQ = null, histE = null, qcmList = [];
  const _sc = screenCurious; screenCurious = (q, ...a) => { curQ = q; return _sc(q, ...a); };
  if (typeof HISTOIRE !== "undefined") for (const k of Object.keys(HISTOIRE)) { const f = HISTOIRE[k].ex; HISTOIRE[k].ex = (...a) => (histE = f(...a)); }
  if (typeof qcmMake === "function") { const _qm = qcmMake; qcmMake = (...a) => { const r = _qm(...a); if (r) qcmList.push(r); return r; }; }
  const _sl = screenLesson; screenLesson = (id, ...a) => { lessonId = id; return _sl(id, ...a); };
  const thinkS = (q) => (q.parts ? 150 : q.d >= 4 ? 150 : q.d === 3 ? 50 : q.d === 2 ? 30 : 15) * (/faible/.test(CFG.niveau) ? 1.4 : CFG.niveau === "fort" ? 0.7 : 1) * (ST.has("presse") ? 0.7 : 1);
  const qs = []; /* questions rencontrées */
  const inNow = (q) => !!(state.now && state.now.ids && q && state.now.ids.includes(q.id)); /* 26.11 soir : question du chapitre « en classe » ? */
  /* ---------- une question ---------- */
  async function doQuestion() {
    const { q, o } = cap; cap.done = true;
    const t = shot("QUESTION " + (q.code || "") + " · d" + q.d + (q.kind ? " · " + q.kind : "") + (inNow(q) ? " · 📚 chapitre en classe" : ""));
    const ra = q.parts ? q.parts.map((p) => rightAns(p.spec)).join(" | ") : rightAns(q.spec);
    log("    ⓘ attendu : " + ra + "   [spec " + (q.parts ? q.parts.map((p) => specTxt(p.spec)).join(" / ") : specTxt(q.spec)) + "]");
    qs.push({ now: inNow(q), code: q.code, id: q.id, d: q.d, q: String(q.q).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").slice(0, 300), ans: ra });
    add(readS(t.split("\n").slice(0, 12).join(" ")) + thinkS(q));
    if (q.parts) return doProblem(q);
    const inp = $("ans");
    /* « Trop facile » (Inès) */
    if (ST.has("facile") && q.d <= 1 && $("easy") && vis($("easy")) && rnd() < 0.6) { await click($("easy"), "Trop facile ⏭"); return; }
    if (ST.has("lecon") && rnd() < 0.25) { const d = app.querySelector(".card details.lesson"); if (d) { d.open = true; await wait(); log("  → ouvre « 📖 Rappel de cours » :"); log(indent(screenText(d).slice(0, 700), 6)); add(readS(screenText(d)) * 0.6); } }
    if (ST.has("idk") && rnd() < +(CFG.idk || 0.15)) { await click($("idk"), "Je ne sais pas"); add(3); return afterEnd(q); }
    let ok = rnd() < LV.p1, a = ok ? ra : null, w = null;
    if (!ok) { w = wrongAns(q, q.spec); a = w.a; }
    if (a === null) { act("(pas de réponse calculable pour ce type : je ne sais pas)"); await click($("idk"), "Je ne sais pas"); return afterEnd(q); }

    log("débordements (fenêtre " + W + " px) : " + (over.join(" | ") || "aucun"));
    document.getElementById("out").textContent = OUT.slice(-3).join("\n"); document.getElementById("out").style.cssText = "position:fixed;top:0;left:0;font-size:9px;background:#ff0;z-index:99;opacity:.85;max-width:100%"; window.scrollTo(0, 0); }
  if (!CFG.ecran) app.style.display = "none";
})();
</script>
