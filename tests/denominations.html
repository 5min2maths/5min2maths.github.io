<script>
// 25.11 (règle de l'auteur, « très important ») : chaque système a ses dénominations. Les domaines du PER (« Nombres et
// opérations »…) ne s'affichent qu'au CO ; Collège, MP et France voient les chapitres et domaines de leur référentiel.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const PER = /^(Nombres et opérations|Fonctions et algèbre|Grandeurs et mesures|Espace)$/;
const P = [["Collège 1re", { system: "CH", grade: 12, track: "college" }], ["Collège 3e", { system: "CH", grade: 14, track: "college" }], ["MP 1re", { system: "CH", grade: 12, track: "mp" }], ["MP 3e", { system: "CH", grade: 14, track: "mp" }],
  ["FR 6e", { system: "FR", grade: 6 }], ["FR 4e", { system: "FR", grade: 8 }], ["FR 3e", { system: "FR", grade: 9 }], ["FR 2nde", { system: "FR", grade: 10 }], ["FR 1re", { system: "FR", grade: 11 }], ["FR Tle", { system: "FR", grade: 12 }]];
try {
  for (const [l, p] of P) {
    const labs = new Set(Engine.catalog(p).map((c) => Engine.themeLabel(c.theme, p)));
    /* « Grandeurs et mesures » est aussi un domaine officiel du collège français. */
    const per = (t) => PER.test(t) && !(p.system === "FR" && /Grandeurs et mesures$/.test(t));
    const bad = [...labs].filter((t) => per(t) || !t || /undefined/.test(t));
    ok(!bad.length, l + " : libellés hors référentiel " + bad.join(", "));
    if (p.system === "FR") ok(![...labs].some((t) => /^CO |^\d+e · /.test(t)), l + " : chapitre suisse " + [...labs].filter((t) => /^CO |^\d+e · /.test(t)).join(", "));
    if (p.system === "FR" && p.grade <= 9) ok([...labs].every((t) => /^(Nombres et calculs|Organisation et gestion de données, fonctions|Grandeurs et mesures|Espace et géométrie|Algorithmique et programmation)$/.test(t)), l + " : domaines du collège français " + [...labs].join(", "));
    /* carte de progression */
    state = Engine.newState({ ...p, track: p.track || "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
    app.innerHTML = themeMapCard();
    const rows = [...app.querySelectorAll(".spread.small b")].map((b) => b.textContent);
    ok(rows.length && !rows.some((t) => PER.test(t) && !(p.system === "FR" && /Grandeurs et mesures$/.test(t))), l + " : carte de progression " + rows.join(" | "));
  }
  state = Engine.newState({ system: "CH", grade: 10, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  app.innerHTML = themeMapCard();
  ok([...app.querySelectorAll(".spread.small b")].some((b) => PER.test(b.textContent)), "CO : la carte garde les domaines du PER");
  /* 25.11 soir : profil France → présentation française (séparation complète), jamais « Collège de Lyon » */
  state = Engine.newState({ system: "FR", grade: 9, track: "college", minutes: 5 }); Engine.autoInit(state);
  history.replaceState(null, "", "#enseignants"); presentRoute(); frDom(app);
  ok(/Programmes officiels/.test(app.textContent) && !/Genève|Lyon|romand/.test(app.textContent), "profil France : présentation enseignants française");
  history.replaceState(null, "", location.pathname); pzStop();
  ok(frLocalQ("Une cycliste part de Genève.") === "Une cycliste part de Lyon." && frLocal("Collège de Genève") === "Collège de Genève", "Genève → Lyon : énoncés seulement");
  log.push(P.length + " profils");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.join("\n") : "ok dénominations : " + log.join(" | ");
</script>
