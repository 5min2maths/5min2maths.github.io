<script>
// Parcours EVACOM 11e (24.11, chantier L) : toutes les formes sur 30 graines, 20 sujets complets, rendu à 360 px, correction et bilan.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const bad = (s) => /NaN|undefined|Infinity|\[object/.test(s);
const known = (id) => !!NOTIONS.find((n) => n.id === id);
// Garde-fou : une forme qui tourne en rond (tirage sans fin) fait échouer le test au lieu de bloquer la page.
let cnt = 0; const r0 = R.rand, b0 = EVACOM.build; R.rand = () => { if (++cnt > 200000) throw new Error("boucle sans fin"); return r0(); }; EVACOM.build = (it) => { cnt = 0; return b0(it); };
try {
  // 1. Chaque forme : pas de NaN/undefined, un corrigé par sous-question, notions connues.
  let nForms = 0;
  EVACOM.SLOTS.forEach((sl, s) => sl.forms.forEach((f, k) => { nForms++;
    for (let r = 1; r <= 30; r++) { const it = { s, f: k, seed: 1000 * s + 37 * k + r }; let x;
      try { x = EVACOM.build(it); } catch (e) { fails.push("forme " + s + "/" + k + " graine " + it.seed + " : " + e.message); continue; }
      const all = [x.titre, x.q, ...(x.parts || []), ...(x.sol || [])].join(" ");
      ok(!bad(all), "NaN/undefined " + s + "/" + k + " : " + all.slice(0, 200));
      ok(x.titre && x.sol && x.sol.length, "titre ou corrigé manquant " + s + "/" + k);
      ok((x.parts && x.parts.length) ? x.sol.length === x.parts.length : x.sol.length === 1, "un corrigé par sous-question " + s + "/" + k + " (" + (x.parts || []).length + " / " + x.sol.length + ")");
      ok(x.q || (x.parts && x.parts.length), "énoncé vide " + s + "/" + k);
      ok(known(x.id) && (x.also || []).every(known), "notion inconnue " + x.id + " " + (x.also || []).join());
      ok(x.sol.every((t) => t && t.replace(/<[^>]+>/g, "").trim().length > 2), "corrigé vide " + s + "/" + k);
      ok(!/\\cdot -|\+ -|- -\d|\+ \+/.test(all.replace(/\\left\(-/g, "")), "signe double " + s + "/" + k + " : " + (all.match(/.{30}(\\cdot -|\+ -|- -\d|\+ \+).{20}/) || [""])[0]);
      (x.parts || []).forEach((p) => { const o = [...p.matchAll(/class="evc-opt">☐ (.*?)<\/span>/g)].map((m) => m[1]); if (o.length) { ok(o.length === 4 && new Set(o).size === 4, "QCM : 4 choix distincts " + s + "/" + k + " : " + o.join(" | ")); } });
    } }));
  log.push(EVACOM.SLOTS.length + " emplacements, " + nForms + " formes");
  // 2. 20 sujets complets : 14 questions (7 + 7), sujets tous différents, formes du sujet précédent évitées.
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  const sigs = new Set(); let prev = null, same = 0;
  for (let k = 0; k < 20; k++) { evacomNew(); const qs = evacomQs(), sig = qs.map((x) => x.q + (x.parts || []).join("|")).join("#");
    ok(qs.length === 14 && qs.filter((x) => x.p === 1).length === 7, "14 questions, 7 par partie");
    ok(new Set(qs.map((x) => x.q + (x.parts || []).join("|"))).size === qs.length, "deux questions identiques dans le sujet " + k);
    ok(!sigs.has(sig), "sujet déjà vu " + k); sigs.add(sig);
    ok(qs.every((x) => !bad([x.q, ...(x.parts || []), ...x.sol].join(" "))), "NaN dans le sujet " + k);
    if (prev) state.evacom.items.forEach((it, i) => { if (EVACOM.SLOTS[i].forms.length > 1 && prev[i].f === it.f) same++; });
    prev = state.evacom.items; }
  ok(same === 0, "formes reprises du sujet précédent : " + same);
  // 3. Accès : 11e seulement ; carte sous « Mon test » et dans « Progrès » (pas de 7e case sur l'accueil).
  homeTab = "today"; screenHome(); ok(document.querySelectorAll(".door").length === 6, "6 cases sur l'accueil");
  homeTab = "prog"; screenHome(); ok(!!document.getElementById("evacom"), "carte dans Progrès");
  homeTab = "test"; screenHome(); ok(!!document.getElementById("evacom"), "carte sous Mon test (sans test prévu)");
  state.prep = { ids: ["fracadd", "rel"], date: addDays(day(), 4) }; screenHome(); ok(!!document.getElementById("evacom"), "carte sous Mon test (test prévu)"); state.prep = null;
  const s10 = Engine.newState({ system: "CH", grade: 10, track: "college", minutes: 5 }), s11 = state; state = s10; ok(evacomCard() === "", "pas de parcours en 10e"); state = Object.assign(Engine.newState({ system: "CH", grade: 12, track: "college", minutes: 5 })); ok(evacomCard() === "", "pas de parcours en 1re"); state = s11;
  // 4. Sujet affiché à 360 px : pas de débordement.
  homeTab = "test"; screenHome(); document.getElementById("evacom").click();
  ok(/EVACOM blanche/.test(app.textContent) && /95 minutes/.test(app.textContent) && /sans calculatrice/.test(app.textContent), "en-tête du sujet");
  ok(!/\bpts?\b|points?\)/.test(app.querySelector(".mock-part").textContent), "pas de barème affiché");
  ok(document.querySelectorAll(".mock-part").length === 2 && document.querySelectorAll(".mock-q").length === 14, "2 parties, 14 questions");
  let over = []; for (let k = 0; k < 20; k++) { screenEvacom(true); const W = document.body.getBoundingClientRect().right;
    app.querySelectorAll("*").forEach((el) => { const r = el.getBoundingClientRect(); if (r.right > W + 1 && !el.closest("mjx-container")) over.push(el.tagName + "." + el.className + " " + Math.round(r.right) + " " + el.textContent.slice(0, 40)); }); }
  ok(!over.length, "débordements : " + over.length + " " + [...new Set(over)].slice(0, 3).join(" | "));
  // 5. Corrigé, auto-correction, bilan.
  const c0 = JSON.stringify(state.comps || {});
  document.getElementById("corr").click(); ok(document.querySelectorAll(".mock-mark").length === 14, "14 questions à cocher");
  document.getElementById("valid").click(); ok(/Il te reste 14/.test(app.textContent), "tout cocher d'abord");
  [...document.querySelectorAll(".mock-mark")].forEach((g, i) => g.querySelector('button[data-v="' + (i % 3 === 0 ? 0 : i % 3 === 1 ? 1 : 0.5) + '"]').click());
  document.getElementById("valid").click();
  ok(/Où tu en es/.test(app.textContent) && /Partie 1/.test(app.textContent), "bilan");
  ok(JSON.stringify(state.comps) !== c0, "compétences mises à jour");
  ok(state.evacom.runs.length === 1 && state.evacom.done.juste === 5 && state.evacom.done.faux === 5, "résultat gardé : " + JSON.stringify(state.evacom.done && { j: state.evacom.done.juste, f: state.evacom.done.faux }));
  ok(document.querySelectorAll(".evc-weak li").length >= 3, "notions à retravailler");
  const les = document.querySelector(".evc-les"); if (les) { les.click(); ok(!!document.getElementById("go") || /Manipule|Rappel/.test(app.textContent), "rappel de cours"); screenEvacomResult(); }
  document.getElementById("rev").click(); ok(session && session.plan.length >= 2 && session.plan.every((p) => GEN[p.split("|")[0]]), "révision ciblée");
  homeTab = "test"; screenHome(); ok(/Dernier sujet blanc : 5 questions justes sur 14/.test(app.textContent), "carte : dernier résultat");
  document.getElementById("evcbilan").click(); ok(/Où tu en es/.test(app.textContent), "bilan rouvert");
  homeTab = "test"; screenHome(); document.getElementById("evacom").click(); ok(!state.evacom.done && state.evacom.runs.length === 1, "nouveau sujet après un sujet fini");
  // Un sujet en clair pour la relecture (non bloquant).
  log.push("exemple : " + evacomQs().map((x, i) => (i + 1) + ". " + x.titre).join(" · "));
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = (fails.length ? "ÉCHEC " + fails.length + "\n" + [...new Set(fails)].slice(0, 25).join("\n") : "ok") + "\n" + log.join("\n");
</script>
