<script>
/* Revue « élèves joués » du 26.11 (tools/revue_eleves_claude_26-11.md) : un contrôle par point corrigé.
   #only=tri,plong,... pour ne lancer que certaines sections. */
(async function () {
  const out = [], fail = [];
  const ok = (c, m) => { (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + m); };
  const ONLY = (location.hash.match(/only=([\w,]+)/) || [])[1];
  const on = (k) => !ONLY || ONLY.split(",").includes(k);
  const ids = Object.keys(GEN);
  const B = (id, lv, sd) => { try { return Engine.build(id, lv, sd); } catch (e) { return null; } };

  /* 1. Triangles donnés par trois côtés : inégalité triangulaire stricte (thales-3-q7c : AD = 2, AE = 4, DE = 6). */
  if (on("tri")) {
    const num = (s) => +String(s).replace(/\\text\{'\}|[{}']/g, "").replace(",", ".");
    let n = 0; const bad = [];
    for (const id of ids) for (const lv of [1, 2, 3, 4]) for (let sd = 1; sd <= 60; sd++) {
      const q = B(id, lv, sd); if (!q || typeof q.q !== "string") continue;
      const t = q.q, seg = {};
      for (const m of t.matchAll(/(?<![A-Za-z\\])([A-Z])([A-Z]) = (\d[\d{},']*)/g)) seg[[m[1], m[2]].sort().join("")] = num(m[3]);
      const P = [...new Set(Object.keys(seg).join(""))];
      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) for (let k = j + 1; k < P.length; k++) {
        const [a, b, c] = [[P[i], P[j]], [P[j], P[k]], [P[i], P[k]]].map((x) => seg[x.sort().join("")]);
        if (a === undefined || b === undefined || c === undefined) continue;
        const tr = [P[i], P[j], P[k]];
        /* points alignés annoncés (D ∈ [AB], « alignés ») : pas un triangle */
        if (/align/.test(t) || tr.some((p) => tr.filter((x) => x !== p).every((x) => new RegExp("\\\\in \\[(" + tr.filter((y) => y !== p).join("|") + "){2}\\]").test(t)) && new RegExp(p + " \\\\in \\[").test(t))) continue;
        n++;
        if (!(a < b + c && b < a + c && c < a + b)) bad.push(q.code + " " + tr.join("") + " : " + a + ", " + b + ", " + c);
      }
    }
    /* triangle décrit par trois longueurs : « côtés 5, 7 et 13 », « mesurent … », a = …, b = …, c = … */
    for (const id of ids) for (const lv of [1, 2, 3, 4]) for (let sd = 1; sd <= 60; sd++) {
      const q = B(id, lv, sd); if (!q || typeof q.q !== "string") continue;
      const flat = q.q.replace(/\\[()]/g, "").replace(/\\text\{'\}/g, "").replace(/\\(?:,|;| )\\text\{[^}]*\}|\\text\{ ?(?:cm|m|km|mm)\}/g, "").replace(/\{,\}/g, ".");
      for (const ph of flat.split(/[.;?](?!\d)/)) {
        if (!/triangle/i.test(ph)) continue;
        const L = "(\\d+(?:\\.\\d+)?)", m = new RegExp("(?:côtés|mesurent)(?: de| de longueurs?| mesurent)?\\s*" + L + "(?: ?[ck]?m)?, " + L + "(?: ?[ck]?m)? et " + L).exec(ph)
          || new RegExp("\\ba = " + L + "[^=]*\\bb = " + L + "[^=]*\\bc = " + L).exec(ph);
        if (!m) continue;
        const [a, b, c] = m.slice(1, 4).map(Number); n++;
        if (!(a < b + c && b < a + c && c < a + b)) bad.push(q.code + " : " + a + ", " + b + ", " + c);
      }
    }
    ok(n > 50 && !bad.length, "triangles par côtés : " + n + " contrôlés, inégalité stricte" + (bad.length ? " — " + bad.slice(0, 6).join(" | ") : ""));
  }

  /* 2. Contextes réels : un plongeur reste sous l'eau (rel-1-jny), une température reste plausible. */
  if (on("plong")) {
    let n = 0; const bad = [];
    for (const id of ids) for (const lv of [1, 2, 3]) for (let sd = 1; sd <= 60; sd++) {
      const q = B(id, lv, sd); if (!q || !q.spec || q.spec.kind !== "value" || typeof q.q !== "string") continue;
      if (/plongeur/.test(q.q) && /quelle (altitude|profondeur)/i.test(q.q)) { n++; if (q.spec.value >= 0) bad.push(q.code + " → " + q.spec.value); }
      if (/Quelle température fait-il/.test(q.q)) { n++; if (q.spec.value < -30 || q.spec.value > 45) bad.push(q.code + " → " + q.spec.value + " °C"); }
    }
    ok(n > 20 && !bad.length, "plongeur sous l'eau, températures plausibles : " + n + " questions" + (bad.length ? " — " + bad.slice(0, 6).join(" | ") : ""));
  }

  /* 3. TeX visible hors formule (pièges, indices, pas à pas, corrigés) : même balayage que tests/_trace.html#scan=1. */
  if (on("tex")) {
    const outside = (t) => String(t || "").replace(/<\/?[a-z][^>]*>/g, " ").split(/\\\(.*?\\\)/s).join(" ");
    const BAD = /\{,\}|\\text\{|\\cdot|\\frac|\\times|\\sqrt|\\widehat|\\le\b|\\ge\b/;
    let n = 0; const bad = [];
    for (const id of ids) for (const lv of [1, 2, 3, 4]) for (let sd = 1; sd <= 12; sd++) {
      const q = B(id, lv, sd); if (!q) continue; n++;
      const fields = [q.hint, ...(q.hints || []), ...(q.traps || []).map((t) => t.m), ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), q.sol, q.q, ...(q.parts || []).map((p) => p.label)];
      for (const t of fields) if (BAD.test(outside(t))) { bad.push(q.code + " : " + outside(t).replace(/\s+/g, " ").slice(0, 90)); break; }
    }
    ok(n > 1000 && !bad.length, "TeX visible hors formule : " + n + " questions, " + bad.length + " touchées" + (bad.length ? " — " + bad.slice(0, 5).join(" | ") : ""));
    /* le filtre lui-même : texte modifié, formules intactes */
    ok(plainTeX("Il faut replacer la virgule : 2{,}86 a 2 décimales ; \\(2{,}86 + 1\\text{'}000\\) et 1\\text{'}000 CHF.") === "Il faut replacer la virgule : 2,86 a 2 décimales ; \\(2{,}86 + 1\\text{'}000\\) et 1'000 CHF.", "plainTeX : texte nettoyé, formules intactes");
  }

  /* 8. « Décimaux » qui sont des entiers (decmul-1-5it : « 5 · 3 », « 5 a 0 décimale ») : au moins un vrai décimal. */
  if (on("dec")) {
    let n = 0; const bad = [];
    for (const id of ["decmul", "decdiv", "decadd"]) for (const lv of [1, 2, 3]) for (let sd = 1; sd <= 150; sd++) {
      const q = B(id, lv, sd); if (!q) continue; n++;
      if (!/\d\{,\}\d|\d,\d/.test(q.q + " " + (q.parts || []).map((p) => p.label).join(" ")) && !/[÷:] ?\\?\(?\d+ ?\\?\)? (?:enfants|personnes|amis)/.test(q.q) && !(id === "decdiv" && q.spec && !Number.isInteger(q.spec.value)) /* quotient décimal */ && !/\\\) g \(/.test(q.q) /* 600 g à 17 CHF le kilo : × 0,6 caché */) bad.push(q.code + " : " + String(q.q).slice(0, 70));
      if (/a 0 décimale/.test(q.sol)) bad.push(q.code + " : « 0 décimale »");
    }
    ok(!bad.length, "décimaux : " + n + " questions, toutes avec un vrai décimal" + (bad.length ? " — " + bad.slice(0, 5).join(" | ") : ""));
  }

  /* 9. Arrondi au centime cohérent (decmul-4-qkr : 523,075 → corrigé 523,08, « bonnes réponses » 523,07). */
  if (on("arr")) {
    /* 26.11 (décision n° 6 : six autres contextes de problème) : decmul-4-qkr n'est plus le carrelage ; on cherche un
       carrelage dont le prix exact tombe sur un demi-centime (cas de 523,075). */
    let q0 = null; for (let sd = 1; sd <= 3000 && !q0; sd++) { const q = B("decmul", 4, sd); if (q && /carrelle/.test(q.q)) { const m = q.sol.match(/\\cdot ([\d{},]+) \\approx/), x = q.parts[0].spec.value * (m ? +m[1].replace("{,}", ".") : 0) * 1000; if (Math.abs(x - Math.round(x)) < 1e-6 && Math.round(x) % 10 === 5) q0 = q; } }
    const pb = q0 && q0.parts && q0.parts[1], fb = pb && String(pb.spec.value.toFixed(2)).replace(".", "{,}");
    ok(pb && Math.abs(pb.spec.value * 100 - Math.round(pb.spec.value * 100)) < 1e-6 && q0.sol.replace(/\\text\{'\}/g, "").includes(fb), "carrelage au demi-centime (" + (q0 && q0.code) + ") : b) attendu au centime comme le corrigé" + (pb ? " (valeur " + pb.spec.value + ")" : ""));
    const bad = [];
    for (let sd = 1; sd <= 300; sd++) { const q = B("decmul", 4, sd); if (!q || !q.parts || !/carrelle/.test(q.q)) continue;
      for (const p of q.parts.slice(1)) { const v = p.spec.value, f = Number.isInteger(v) ? String(v) : String(v.toFixed(2)).replace(".", "{,}"); if (Math.abs(v * 100 - Math.round(v * 100)) > 1e-6 || !q.sol.replace(/\\text\{'\}/g, "").includes(f)) bad.push(q.code + " " + v); } }
    ok(!bad.length, "carrelage : valeurs attendues arrondies au centime, identiques au corrigé" + (bad.length ? " — " + bad.slice(0, 5).join(" | ") : ""));
  }

  /* 9 (suite). Énoncé sans ambiguïté (probeq-3-xpp) ; indice ciblé sur la forme canonique (f2-1-b9d). */
  if (on("arr")) {
    const pq = Engine.fromCode("probeq-3-xpp");
    ok(pq && !/fois et demie plus/.test(pq.q), "probeq-3-xpp : plus de « une fois et demie plus »");
    const fq = Engine.fromCode("f2-1-b9d");
    ok(fq && /sommet/.test(fq.q) && /Forme canonique/.test(fq.hint) && !/discriminant/.test(fq.hint), "f2-1-b9d : indice sur la forme canonique" + (fq ? " (" + String(fq.hint).slice(0, 60) + ")" : ""));
  }

  /* ---------- parcours dans l'app (points 4 à 7, 10 à 12) ---------- */
  const fresh = (prof) => { state = Engine.newState(prof); Engine.autoInit(state); state.placed = true; save(); return state; };
  const eb = () => ((app.querySelector(".eyebrow") || {}).textContent || "").replace(/\s+/g, " ");
  const skipQ = () => { const k = document.getElementById("idk"); if (k) k.click(); const n = document.getElementById("nx"); if (n) n.click(); };
  if (on("app")) try {
    /* 4. Carnet : jamais de leçon, compteur stable, « Effacer mes erreurs (2 questions) » = 2 questions. */
    fresh({ system: "CH", grade: 9, track: "college", minutes: 5 });
    const L9 = Object.keys(state.notions).filter((id) => LESSONS[id] && GEN[id]).slice(0, 2);
    L9.forEach((id) => Object.assign(state.notions[id], { status: "encours", seen: 0, lessonSeen: false, m: 0.3 }));
    state.carnet = L9.map((id) => ({ id, d: 1, code: id + "-1-1", date: day(), ok: 0 }));
    homeTab = "carnet"; screenHome();
    ok(/Effacer mes erreurs \(2 questions\)/.test(app.textContent), "carnet : bouton « (2 questions) »");
    startCarnet(); const seenEb = [];
    for (let k = 0; k < 6 && document.getElementById("idk"); k++) { seenEb.push(eb()); skipQ(); }
    ok(seenEb.length === 2 && /1 sur 2/.test(seenEb[0]) && /2 sur 2/.test(seenEb[1]) && !seenEb.some((x) => /leçon|Nouvelle notion|étape/i.test(x)), "carnet : 2 questions, « 1 sur 2 » puis « 2 sur 2 », sans leçon — " + seenEb.join(" | "));
    /* séance ordinaire : 2e et 3e notions à leçon remplacées, total stable */
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 });
    const L11 = Object.keys(state.notions).filter((id) => LESSONS[id] && GEN[id] && state.notions[id].status !== "avenir").slice(0, 3);
    L11.forEach((id) => Object.assign(state.notions[id], { status: "encours", seen: 0, lessonSeen: false, m: 0.3 }));
    session = { fmt: "mixte", plan: L11.map((id) => id + "|1|app"), i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), pinged: true }; session.lessonAt = lessonAtStart(session.plan);
    nextQuestion(); const tot = [];
    for (let k = 0; k < 10; k++) { const t = eb(), m = /(\d+) sur (\d+)/.exec(t); if (m) tot.push(+m[2]); if (document.getElementById("go") && /cours/i.test(t)) { document.getElementById("go").click(); continue; } if (!document.getElementById("idk")) break; skipQ(); }
    ok(tot.length >= 3 && tot.every((x) => x === tot[0]), "séance : total « n sur N » stable (" + tot.join(",") + ")");
    /* 5. Mon évaluation : révision ciblée de 4 questions, sans problème, sans leçon */
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 });
    const P3 = Object.keys(state.notions).filter((id) => GEN[id] && state.notions[id].status !== "avenir").slice(0, 3);
    P3.forEach((id) => Object.assign(state.notions[id], { lessonSeen: false, status: "encours" }));
    state.prep = { ids: P3, date: addDays(day(), 4), start: addDays(day(), -1) };
    startPrepTask("revision");
    ok(session.plan.length === 4 && session.plan.every((e) => !/^PROB:|\|4(\||$)/.test(e)), "évaluation : 4 questions sans problème (" + session.plan.join(" ") + ")");
    const ebs = []; for (let k = 0; k < 8 && document.getElementById("idk"); k++) { ebs.push(eb()); skipQ(); }
    ok(ebs.length === 4 && ebs.every((x) => /sur 4/.test(x) && !/cours/i.test(x)), "évaluation : « n sur 4 », jamais de rappel de cours inséré — " + ebs.join(" | "));
    ok(/4 questions/.test(PREP_TASK.revision.text) && !/problème/.test(PREP_TASK.revision.text), "évaluation : texte « 4 questions »");
    /* 6. Évaluation active : un seul grand bouton sur l'accueil ; le sujet de préparation (J−2) reste au choix */
    state.prep = { ids: P3, date: addDays(day(), 4), start: addDays(day(), -1) }; state.prep.log = {}; homeTab = "today"; screenHome();
    ok(app.querySelectorAll(".btn-big").length === 1 && document.getElementById("preptask") && !document.getElementById("go"), "accueil, évaluation active : un seul grand bouton (" + app.querySelectorAll(".btn-big").length + ")");
    state.prep = { ids: P3, date: addDays(day(), 2), start: addDays(day(), -3) }; screenHome();
    ok(app.querySelectorAll(".btn-big").length === 1 && document.getElementById("go"), "accueil, J−2 (sujet au choix) : la séance reste le seul grand bouton");
    /* 12. veille du test : pas de « Test rapide final ». 26.11 (décision de l'enseignant, n° 11) : J−1 = tes erreurs */
    state.prep = { ids: P3, date: addDays(day(), 1), start: addDays(day(), -3) }; state.autotest = null; screenHome();
    ok(!/Test rapide final/.test(app.textContent) && /Tes erreurs/.test(app.textContent), "J−1 : « Tes erreurs », pas « Test rapide final »");
    state.prep = null;
    /* 7. notion réussie au positionnement : vue, pas de leçon « Nouvelle notion » ; libellé réservé à l'année */
    fresh({ system: "CH", grade: 9, track: "college", minutes: 5 });
    const pid = Object.keys(state.notions).find((id) => LESSONS[id] && GEN[id] && state.notions[id].status !== "avenir");
    Engine.placementResult(state, pid, true, 2);
    ok(state.notions[pid].seen >= 1 && state.notions[pid].lessonSeen && !Engine.lessonDue(state, pid) && !newNotion(pid), "positionnement réussi : notion vue, plus de leçon (" + pid + ")");
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 });
    ok(state.notions.pyth && !newNotion("pyth"), "Pythagore en 11e (notion de 10e) : pas « Nouvelle notion »");
    const cur = Object.keys(state.notions).find((id) => { const n = NOTIONS.find((x) => x.id === id); return placeOf(n, state.profile)[0] === 11; });
    ok(cur && newNotion(cur), "notion de 11e jamais travaillée : « Nouvelle notion » (" + cur + ")");
    /* 10. Mathélo provisoire : un échec de niveau 1 coûte 15 points au plus ; réussites inchangées */
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 }); state.elo.n = 3;
    const dl = Engine.updateElo(state, "prio", 1, 0), dw = Engine.updateElo(state, "prio", 3, 0);
    ok(dl >= -15 && dw < -15, "Mathélo provisoire : échec niveau 1 " + dl + " (≥ −15), niveau 3 " + dw);
    /* 10. pas à pas : message honnête */
    const gq = Engine.build("prio", 2, 3), box = document.createElement("div"); app.innerHTML = ""; app.appendChild(box); let fin = false;
    runGuide(gq, box, () => (fin = true));
    for (let k = 0; k < 10 && !fin; k++) { const st = box.querySelectorAll(".gstep"), last = st[st.length - 1], i = last && last.querySelector("input"); if (!i || i.disabled) break; i.value = "999999"; last.querySelector(".gok").click(); }
    ok(fin && !/Bravo/.test(box.textContent) && /Voici la solution complète/.test(box.textContent), "pas à pas tout faux : « Voici la solution complète », pas « Bravo »");
    /* 10. plafond du jour atteint : on le dit */
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 }); const y = ypSync(state); y.d = day(); y.dp = YP.cap; y.ds = 2;
    session = { fmt: "mixte", plan: ["prio|1", "prio|1", "prio|1"], i: 3, score: 3, answered: 3, start: Date.now(), elo0: state.elo.r, ids: new Set(["prio"]), ypg: 0 };
    screenSummary();
    ok(/plafond du jour atteint/.test(app.textContent) && !/Points de l'année\s*\+0/.test(app.textContent), "bilan : « plafond du jour atteint » au lieu de +0");
    /* 10. contexte de problème répété (« On carrelle… ») : pas deux fois dans la semaine en séance */
    fresh({ system: "CH", grade: 10, track: "college", minutes: 5 });
    const k1 = Engine.make(state, "decmul", 4, undefined, true), k2 = Engine.make(state, "decmul", 4, undefined, true);
    const w4 = (q) => String(q.q).replace(/\\\(.*?\\\)/g, " ").split(/\s+/).slice(0, 3).join(" ");
    ok(k1 && k2 && !(k2.parts && w4(k1) === w4(k2)), "problème decmul : contexte pas répété (" + w4(k1) + " / " + (k2.parts ? w4(k2) : "niveau " + k2.d) + ")");
    /* 11. France : accueil, titre, quartiles */
    SYSTEMS.FR = SYSTEMS_HIDDEN.FR; state = null; demoGrade = null; screenWelcome();
    const gb = [...app.querySelectorAll("#dgrade button")].map((b) => b.textContent).join(",");
    ok(gb === "6e,5e,4e,3e,Lycée" && !/CHF/.test((document.getElementById("demo") || {}).textContent || ""), "accueil avec aperçu France : classes françaises, pas de CHF (" + gb + ")");
    const g4 = [...app.querySelectorAll("#dgrade button")].find((b) => b.textContent === "4e"); g4.click();
    ok(draft.system === "FR" && draft.grade === 8, "accueil FR : « 4e » choisit la 4e française");
    for (let k = 0; k < 20; k++) { demoSkip = []; screenWelcome(); if (/CHF/.test(document.getElementById("demo").textContent)) { ok(false, "essai en CHF : " + document.getElementById("demo").textContent.slice(0, 80)); break; } }
    delete SYSTEMS.FR; demoGrade = null; draft = { system: "CH", grade: 11, track: null, minutes: 5 };
    fresh({ system: "FR", grade: 8, track: "college", minutes: 5 });
    const d = document.createElement("div"); d.innerHTML = '<div class="eyebrow">Je prépare mon évaluation · étape 2 sur 2 · 1 sur 8</div><p>Calcule 2 · 3</p>'; frDom(d);
    ok(!/×/.test(d.querySelector(".eyebrow").textContent) && /×/.test(d.querySelector("p").textContent), "France : « · » du titre gardé, produit en × (" + d.textContent + ")");
    const cq = Engine.catalog(state.profile).find((c) => c.id === "quartiles");
    let qq = 0; for (let k = 0; k < 30; k++) { const q = Engine.make(state, "quartiles", 3); if (/quartile/i.test(q.q)) qq++; }
    ok(cq && !/quartile/i.test(cq.label) && !qq, "France 4e : ni libellé ni question sur les quartiles (" + (cq && cq.label) + ", " + qq + ")");
    fresh({ system: "FR", grade: 10, track: "college", minutes: 5 });
    ok(/quartiles/.test(Engine.catalog(state.profile).find((c) => c.id === "quartiles").label), "France 2nde : quartiles gardés");
    /* 12. « Je prépare une évaluation » : chapitre en classe et chapitres récents, le reste replié */
    fresh({ system: "CH", grade: 11, track: "college", minutes: 5 });
    const nid = Object.keys(state.notions).find((id) => state.notions[id].status === "encours") || Object.keys(state.notions)[0];
    state.now = { ids: [nid], date: day() }; screenPrep();
    const vis = [...app.querySelectorAll(".check")].filter((c) => !c.closest("details")).length, all = app.querySelectorAll(".check").length;
    ok(vis > 0 && vis < all && app.querySelector("details.prep-more:not([open])"), "« Je prépare une évaluation » : " + vis + " notions visibles sur " + all + ", le reste replié");
    /* 12. positionnement annoncé honnêtement */
    state = null; draft = { system: "CH", grade: 11, track: "college", minutes: 5 }; screenLevel();
    ok(/environ 5 minutes/.test(app.textContent) && !/2 à 3 minutes/.test(app.textContent), "positionnement annoncé « environ 5 minutes »");
  } catch (e) { fail.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(0, 3).join(" ")); }

  document.getElementById("out").textContent = fail.concat(out).join("\n") + "\n" + (fail.length ? fail.length + " ÉCHEC(S)" : "tout ok");
})().catch((e) => { document.getElementById("out").textContent = "EXC " + e.message + "\n" + e.stack; });
</script>
