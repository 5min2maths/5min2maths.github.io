t src="../src/act_prop11.js"></script><script src="../src/act_litt11.js"></script><script src="../src/act_eq1c.js"></script><script src="../src/act_sys1c.js"></script><script src="../src/act_ch11b.js"></script><script src="../src/act_ch11c.js"></script><script src="../src/act_1c.js"></script><script src="../src/act_mp2.js"></script><script src="../src/act_mp34.js"></script><script src="../src/act_manip.js"></script><script src="../src/sujet.js"></script><script src="../src/qcm.js"></script><script src="../src/engine.js"></script><script src="../src/app.js"></script><script>const L=[];let fails=0;const bad=(m)=>{fails++;if(fails<40)L.push("ÉCHEC "+m);};

 for(const kind of ["ex","raison"])C[kind].forEach((f,gi)=>{for(let s=1;s<=100;s++){R.seed(s*7919+gi);let x;try{x=f();}catch(e){bad(ch+" "+kind+gi+" graine "+s+" EXC "+e.message);break;}n++;
  const txt=(x.q.replace(/<svg[\s\S]*?<\/svg>/g,"")+(x.fig?"":"")+x.sol+x.parts.map(p=>p.label).join(" ")), all=txt+(x.fig||"");

  if(/[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(all)){bad(ch+" "+x.titre+" caractère de contrôle (\\frac ?)");break;}
  if(/\d\.\d/.test(txt.replace(/<[^>]*>/g,""))){bad(ch+" "+x.titre+" point décimal : "+txt.replace(/<[^>]*>/g,"").match(/.{0,30}\d\.\d.{0,10}/)[0]);break;}

  const tv=(x.vals||[]).find(v=>!Number.isFinite(v)||Math.abs(v)<1e-9||Math.abs(Math.abs(v)-1)<1e-9);if(tv!==undefined){bad(ch+" "+x.titre+" graine "+s+" valeur triviale "+tv);break;}
  const op=(txt.match(/\\\(/g)||[]).length,cl=(txt.match(/\\\)/g)||[]).length;if(op!==cl){bad(ch+" "+x.titre+" \\( \\) déséquilibrés");break;}
 }});
 const lv=[1,2,3].map(l=>C.ex.filter(f=>{R.seed(1);return f().lv===l}).length);
 L.push(ch+" : "+n+" tirages, ex par niveau "+lv.join("/")+", raisonnements "+C.raison.length);
 for(const lev of ["facile","standard","exigeant"]){const it=mockPlan(C.ids,lev),nb=it.filter(i=>i.part==="B").length;if(nb<3)bad(ch+" "+lev+" : "+nb+" exercices B");}

for(const sys of ["MATU","MP"])for(const [id,c] of Object.entries(ORDRE_THEME[sys]))(chaps[sys+":"+c]=chaps[sys+":"+c]||[]).push(id);
/* 28.11 (nickel 10e, ch. 7) : banque réservée à une classe (RICH.litt10, grades) : chapitres du CO jugés avec le profil de leur classe */
const prof=(k)=>{const m=/^CO:(\d+)C/.exec(k);return m?{system:"CH",grade:+m[1],track:"co"}:undefined;};
const saved={};NEW.forEach(k=>{saved[k]=RICH[k];delete RICH[k];});const before={};for(const k in chaps)before[k]=richChapter(chaps[k],prof(k));Object.assign(RICH,saved);
let nc=0;for(const k in chaps){const c=k.split(":")[1],now=richChapter(chaps[k],prof(k));if(k.startsWith("CO:")&&EXP[c]){nc++;if(now!==EXP[c])bad(k+" → "+now+" au lieu de "+EXP[c]);}else if(now!==before[k])bad(k+" changé : "+before[k]+" → "+now);}
if(richChapter(["dec10"])!=="dec9"||richChapter(["proptab"])!=="prop9")bad("révisions 9e dans 10e");
L.unshift((fails?"ÉCHEC ":"OK ")+NEW.length+" banques, "+nc+" chapitres 9e/10e branchés, "+fails+" défaut(s)");
