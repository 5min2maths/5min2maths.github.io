const drag=(k,x,y)=>MANIP.sim(B(),k,x,y), tap=(k)=>MANIP.simTap(B(),k), key=(k,c)=>MANIP.simKey(B(),k,c);
const S=()=>B().__manip.st, step=()=>B().__manip.step;
const LES={
  reduire(){ const bins=[[58,214],[168,214],[270,214]], bi={x2:0,x:1,"1":2}; const ex=[];
    // erreur volontaire : une barre x dans le bac des unités
    const i0=S().tiles.findIndex((t)=>t.t==="x"); drag(3+i0,...bins[2]); ex.push(/semblables/.test(hint())?"refus ok":"REFUS ABSENT");
    // toucher-toucher : une tuile puis son bac
    const i1=S().tiles.findIndex((t)=>t.t==="1"&&t.bin<0); tap(3+i1); tap(2); ex.push(S().tiles[i1].bin===2?"tap ok":"TAP ÉCHEC");
    for(let s=0;s<3;s++){ let guard=0; while(step()===s&&guard++<40){ const i=S().tiles.findIndex((t)=>t.bin<0&&!t.gone); if(i<0)break; drag(3+i,...bins[bi[S().tiles[i].t]]); } ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗")); }
    return ex; },
  distrib(){ return area(true); }, idrem(){ return area(false,10); },
  factor(){ const ex=[]; drag(0,160,46+2*26+12); ex.push(/partage|pareilles|rangée/.test(hint())?"aide ok":"AIDE ABSENTE:"+hint());
    const G=[3,5,6]; for(let s=0;s<3;s++){ if(s===1){ for(let j=0;j<4;j++) key(0,"ArrowDown"); } else drag(0,160,46+G[s]*26+12); if(B().__manip.asking) answer(4); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗ k="+S().k)); } return ex; },
  eq1(){ const ex=[]; for(let s=0;s<3;s++){ solveBal(); if(B().__manip.asking) answer(-4); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗ "+document.querySelector(".manip-out").textContent+" | "+hint())); } return ex; },
  fracadd(){ const ex=[], DEN=[2,3,4,5,6,8,10,12], ry=117, chip=(d)=>S().row.length+DEN.indexOf(d);
    drag(chip(4),150,ry); drag(chip(6),150,ry); ex.push(/pareilles/.test(hint())?"mélange refusé":"MÉLANGE ACCEPTÉ:"+hint()); tap(0); tap(0);
    const need=[[12,5],[6,5],[12,7]]; for(let s=0;s<3;s++){ const [d,n]=need[s]; for(let i=0;i<n&&step()===s;i++){ if(i%2) tap(chip(d)); else drag(chip(d),160,ry); } if(B().__manip.asking) answer(13); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗ "+hint())); } return ex; },
  rel(){ const ex=[], X=(v)=>160+v*14, W=[[-5,7],[3,-8],[-2,6]];
    for(let s=0;s<3;s++){ if(s===2){ drag(0,X(-8),96); ex.push(/retourne/.test(hint())?"piège ok":"PIÈGE:"+hint()); } if(s===1){ for(let j=0;j<8;j++) key(0,"ArrowLeft"); } else drag(0,X(W[s][0]+W[s][1]),96); if(B().__manip.asking) answer(s===1?-3:3); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗ "+hint())); } return ex; },
  thales(){ const ex=[], X=(u)=>30+u*21.5, Y=(v)=>204-v*21.5;
    drag(0,X(6),Y(0)); ex.push("défi 1"+(step()>0?" ✓":" ✗")); drag(0,X(9),Y(0)); answer(6); ex.push("défi 2"+(step()>1?" ✓":" ✗"));
    drag(0,X(4),Y(0)); ex.push(/Déforme/.test(hint())?"aide ok":"AIDE:"+hint()); drag(1,X(4),Y(6)); drag(0,X(5),Y(0)); drag(0,X(4),Y(0)); answer(10); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+hint())); return ex; },
  simil(){ const ex=[], C=(k)=>[34+30*k,262-30*k]; drag(0,...C(3)); answer(25); ex.push("défi 1"+(step()>0?" ✓":" ✗")); drag(0,...C(0.5)); ex.push("défi 2"+(step()>1?" ✓":" ✗")); drag(0,...C(2.5)); answer(8); ex.push("défi 3"+(step()>2?" ✓":" ✗")); return ex; },
  angles(){ const ex=[], P=(a)=>[160+100*Math.cos(a*Math.PI/180),130-100*Math.sin(a*Math.PI/180)]; const t0=S().th; key(0,"ArrowUp"); ex.push(S().th===t0+5?"clavier ok":"CLAVIER "+S().th);
    drag(0,...P(120)); answer(70); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().th)); drag(0,...P(50)); answer(110); ex.push("défi 2"+(step()>1?" ✓":" ✗")); drag(0,...P(90)); answer(57); ex.push("défi 3"+(step()>2?" ✓":" ✗")); return ex; },
  angtri(){ const ex=[], X=(u)=>10+u*20, Y=(v)=>190-v*20; drag(2,X(2),Y(1)); ex.push(!(S().P[2][0]===2&&S().P[2][1]===1)?"dégénéré refusé":"DÉGÉNÉRÉ ACCEPTÉ");
    drag(2,X(2),Y(7)); answer(55); ex.push("défi 1"+(step()>0?" ✓":" ✗")); drag(1,X(10),Y(1)); ex.push("défi 2"+(step()>1?" ✓":" ✗")); drag(2,X(7),Y(2)); answer(360); ex.push("défi 3"+(step()>2?" ✓":" ✗")); return ex; },
  diagr(){ const ex=[], BX=(i)=>52+i*54+18, y=(v)=>204-v*7; [12,18,9,21].forEach((v,i)=>{ if(i===2){ for(let j=0;j<4;j++) key(2,"ArrowUp"); } else drag(i,BX(i),y(v)); }); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+hint()));
    drag(0,296,y(12)); ex.push(/monte/.test(hint())?"aide ok":"AIDE:"+hint()); drag(0,296,y(15)); ex.push("défi 2"+(step()>1?" ✓":" ✗")); drag(0,BX(4),y(20)); answer(4.9); ex.push("défi 3"+(step()>2?" ✓":" ✗")); return ex; },
  vol(){ const ex=[], P=(x,y,z)=>[150+(x-y)*13,114+(x+y)*7.5-z*15];
    drag(2,P(2,1.5,0)[0],P(2,1.5,0)[1]-45-16); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+JSON.stringify(S())));
    drag(0,...P(4.8,0,0)); drag(1,...P(0,3.8,0)); drag(2,P(2,1.5,0)[0],P(2,1.5,0)[1]-30-16); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+JSON.stringify(S())));
    drag(0,...P(2.8,0,0)); drag(2,P(1,1.5,0)[0],P(1,1.5,0)[1]-60-16); answer(8); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+JSON.stringify(S()))); return ex; },
  sys2(){ const ex=[], X=(x)=>104+x*18, Y=(y)=>196-y*18; drag(0,X(0),Y(10)); ex.push(/une seule/.test(hint())?"aide ok":"AIDE:"+hint());
    [[6,4],[2,5],[-2,1]].forEach(([x,y],s)=>{ drag(0,X(x),Y(y)); if(B().__manip.asking) answer(4); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗")); }); return ex; },
  utemps(){ const ex=[], XM=(m)=>22+276*m/60; drag(0,XM(45),56); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().m)); key(0,"ArrowRight"); key(0,"ArrowRight"); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().m)); drag(0,XM(21),56); answer(1.4); ex.push("défi 3"+(step()>2?" ✓":" ✗")); return ex; },
  // 24.11 : cinq manipulations de plus (cercthales, proba, modaff, f2formes, pente)
  cercthales(){ const ex=[], P=(f)=>[160+100*Math.cos(f*Math.PI/180),128-100*Math.sin(f*Math.PI/180)];
    drag(0,...P(110)); ex.push(/angle en B/.test(hint())?"piège ok":"PIÈGE:"+hint());
    drag(0,...P(70)); answer(65); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().phi));
    const f0=S().phi; key(0,"ArrowLeft"); ex.push(S().phi===f0+2?"clavier ok":"CLAVIER "+S().phi);
    drag(0,...P(90)); answer(8); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().phi));
    drag(0,...P(100)); answer(70); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+S().phi)); return ex; },
  proba(){ const ex=[], U=[96,124], OUT=[250,215], nc=()=>step()===2?3:2, idx=(c)=>nc()+S().balls.indexOf(c);
    drag(0,250,200); ex.push(/lâche/.test(hint())?"hors urne ok":"HORS URNE:"+hint());
    tap(0); tap(1); drag(1,...U); key(1,"Enter"); ex.push(S().balls.length===7&&/trop grande/.test(hint())?"aide ok":"AIDE:"+S().balls.join("")+" "+hint());
    drag(1,...U); if(B().__manip.asking) answer(0.6); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().balls.join("")));
    drag(1,...U); ex.push(/EN TOUT/.test(hint())?"piège ok":"PIÈGE:"+hint());
    drag(idx("b"),...OUT); tap(idx("b")); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().balls.join("")));
    drag(0,...U); tap(0); tap(1); answer("3/10"); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+S().balls.join("")+" "+hint())); return ex; },
  modaff(){ const ex=[], X=(x)=>36+x*22, Y=(y)=>200-y*5.5;
    drag(0,X(0),Y(6)); ex.push(/point rond/.test(hint())?"aide ok":"AIDE:"+hint());
    drag(1,X(5),Y(16)); answer(36); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+JSON.stringify(S())));
    drag(0,X(3),214); ex.push(/remboursée/.test(hint())?"aide ok":"AIDE:"+hint());
    for(let j=0;j<3;j++) key(0,"ArrowRight"); answer(5); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().x));
    drag(0,X(0),Y(12)); ex.push(/24/.test(hint())?"aide ok":"AIDE:"+hint());
    drag(1,X(8),Y(24)); answer(1); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+JSON.stringify(S()))); return ex; },
  f2formes(){ const ex=[], X=(x)=>160+x*20, Y=(y)=>150-y*12;
    drag(0,X(4),Y(1)); ex.push(/Bon coefficient/.test(hint())?"aide ok":"AIDE:"+hint());
    drag(0,X(4),Y(4)); answer(2); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().S));
    key(0,"ArrowDown"); ex.push(S().S[1]===1?"clavier ok":"CLAVIER "+S().S);
    drag(0,X(-3),Y(-4)); answer(-3); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().S));
    drag(0,X(0),Y(-4)); ex.push(/milieu/.test(hint())?"aide ok":"AIDE:"+hint());
    drag(0,X(3),Y(-4)); answer(5); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+S().S)); return ex; },
  pente(){ const ex=[], k0=0.9*5, k2=10.8;
    drag(0,294,196-6*k0); ex.push(/2 %/.test(hint())?"piège ok":"PIÈGE:"+hint());
    drag(0,294,196-18*k0); answer(5); ex.push("défi 1"+(step()>0?" ✓":" ✗ "+S().h));
    for(let j=0;j<20;j++) key(0,"ArrowUp"); ex.push("défi 2"+(step()>1?" ✓":" ✗ "+S().h));
    drag(0,24+11*k2,196-0.9*k2*5); ex.push(/raide/.test(hint())?"aide ok":"AIDE:"+hint());
    drag(0,24+15*k2,196-0.9*k2*5); answer(45); ex.push("défi 3"+(step()>2?" ✓":" ✗ "+S().L)); return ex; },
};
function area(useTap,ans){ const ex=[]; for(let s=0;s<3;s++){ const n=S().cells.length, src={x2:0,x:1,"1":2};
    if(s===0){ // mauvaise tuile d'abord
      const c=S().cells.find((c)=>c.t!=="x2"); drag(n+src.x2,c.x+c.w/2,c.y+c.h/2); ex.push(/il y faut/.test(hint())?"refus ok":"REFUS ABSENT:"+hint()); }
    let last=null; S().cells.slice().sort((a,b)=>a.t<b.t?-1:1).forEach((c)=>{ const i=S().cells.indexOf(c); if(S().cells[i].on)return;
      if(useTap&&last===c.t) tap(i); else { drag(n+src[c.t],c.x+c.w/2,c.y+c.h/2); last=c.t; } });
    if(B().__manip.asking) answer(s===1?5:ans); ex.push("défi "+(s+1)+(step()>s?" ✓":" ✗ "+hint())); } return ex; }
function solveBal(){ const s0=step(); const it=()=>step()===s0?S().items:[], on=(sd,t)=>it().map((I,k)=>[I,k]).filter(([I])=>I.side===sd&&!I.off&&I.t===t).map(([,k])=>k);
  let flip=false; const rm=(k)=>{ if(k===undefined||step()!==s0)return; flip=!flip; if(flip) drag(k,80,225); else tap(k); };
  const pair=(t)=>{ const a=on("L",t),b=on("R",t); rm(a[0]); rm(b[0]); };
  let g=0; while(on("L","x").length&&on("R","x").length&&g++<9) pair("x");
  g=0; while(on("L","1").length&&on("R","1").length&&g++<12) pair("1");
  const sd=on("L","x").length?"L":"R", ot=sd==="L"?"R":"L"; g=0;
  while(on(sd,"x").length>1&&g++<6){ rm(on(sd,"x")[0]); for(let j=0;j<S().X;j++) rm(on(ot,"1")[0]); } }
// 24.11 : questions ajoutées après les défis (A.plus, actPlus dans active.js) : une réponse fausse est refusée, la bonne valide.
const plusAns=(id,msgs)=>{(ACTIVE[id].plus||[]).forEach((p,j)=>{const go=(v)=>{const i=document.querySelector(".act-plus .act-in");if(!i)return false;i.value=v;i.closest(".act-ans").querySelector("[data-go]").dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
  const b=document.querySelector("#gfb").textContent;if(!go("9999")){msgs.push("✗ question ajoutée "+(j+1)+" absente");return;}if(document.querySelector("#gfb").textContent!==b)msgs.push("✗ réponse fausse acceptée");
  go(String(p.ans));msgs.push(document.querySelector("#gfb").textContent!==b?"✓ question ajoutée "+(j+1):"✗ question ajoutée "+(j+1)+" refusée");});};
const ids=(location.hash.slice(1)||Object.keys(LES).join(",")).split(",");
for(const id of ids){ try{ screenLesson(id,()=>{}); click('#pc button[data-i="'+ACTIVE[id].predict.good+'"]');
  if(!B()) throw new Error("pas de figure manipulable");
  const ex=LES[id](); plusAns(id,ex); const html=document.getElementById("app").innerHTML;
  const fin=!document.getElementById("s3").hidden;
  // pas de débordement à 360 px (24.11)
  const app=document.getElementById("app"), R=document.body.getBoundingClientRect().right+1, ov=app.scrollWidth>app.clientWidth+1||[...app.querySelectorAll("*")].some((e)=>{const r=e.getBoundingClientRect();return r.width&&r.right>R;});
  const bad=/✗|[A-ZÉÈ]{4,}[ :]/.test(ex.join(" · ")); // une vérification intermédiaire ratée (aide absente, clavier…) compte comme un échec (24.11)
  log.push(id+" : "+(fin&&!ov&&!bad&&!/NaN|undefined/.test(html)?"OK":"ÉCHEC"+(/NaN|undefined/.test(html)?" (NaN/undefined)":"")+(ov?" (débordement à 360 px)":"")+(bad?" (vérification ratée)":""))+" · "+ex.join(" · "));
  }catch(e){log.push(id+" EXC "+e.message+" "+(e.stack||"").split("\n")[1])} }
if(window.__errs.length) log.push("ERREURS JS : "+window.__errs.join(" | "));
// échecs en tête (tools/run_tests.sh n'affiche que le début du journal)
log.sort((a,b)=>(/ÉCHEC|EXC|ERREURS/.test(b)?1:0)-(/ÉCHEC|EXC|ERREURS/.test(a)?1:0));
document.getElementById("log").hidden=false;document.getElementById("log").textContent=log.join("\n");
</script>
