<script>
// « Retiens » des leçons actives (24.11) : champ facultatif retiens (actRetiens, active.js). Pour chaque leçon active,
// sans retiens, l'étape 3 reçoit la leçon générale LESSONS[id] inchangée ; avec, elle affiche la règle, les exemples et
// le piège du retiens, qui doit être bien formé (regle, piege : texte ; exemple : liste non vide ; \\( \\) appariés).
const log=[];let bad=0,own=0,n=0;
window.scrollTo=()=>{};Element.prototype.scrollIntoView=function(){};
for(const id of Object.keys(ACTIVE)){ const A=ACTIVE[id],L=LESSONS[id]; if(!L) continue; n++;
  try{
    let E=L;
    if(A.retiens){own++; const r=typeof A.retiens==="function"?A.retiens(L):A.retiens;
      for(const k of Object.keys(r)) if(!["regle","exemple","piege"].includes(k)) {bad++;log.push(id+" : ÉCHEC champ inconnu "+k);}
      if(r.regle!==undefined&&!(typeof r.regle==="string"&&r.regle.trim())) {bad++;log.push(id+" : ÉCHEC regle vide");}
      if(r.piege!==undefined&&!(typeof r.piege==="string"&&r.piege.trim())) {bad++;log.push(id+" : ÉCHEC piege vide");}
      if(r.exemple!==undefined&&!(Array.isArray(r.exemple)&&r.exemple.length)) {bad++;log.push(id+" : ÉCHEC exemple vide");}
      E=Object.assign({},L,{regle:r.regle!==undefined?colonBreak(r.regle):L.regle,exemple:r.exemple?r.exemple.map(colonBreak):L.exemple,piege:r.piege!==undefined?colonBreak(r.piege):L.piege});
      const fe=(x)=>(x.match(/\\\(/g)||[]).length===(x.match(/\\\)/g)||[]).length;
      if(![E.regle,E.piege,...E.exemple].every(fe)) {bad++;log.push(id+" : ÉCHEC \\( \\) déséquilibrés");}
    }
    if(!A.retiens){ if(actRetiens(A,L)!==L){bad++;log.push(id+" : ÉCHEC leçon sans retiens modifiée");} continue; }
    /* dyn.js peut réécrire les nombres des exemples : on compare le texte hors formules du début de la règle et du piège */
    screenLesson(id,()=>{});
    const s3=document.getElementById("s3"); if(!s3){bad++;log.push(id+" : ÉCHEC pas d'étape Retiens");continue;}
    const plain=(x)=>{const d=document.createElement("div");d.innerHTML=x.replace(/\\\(.*?\\\)/g," ");return d.textContent.replace(/[\s,;:.]+/g,"").slice(0,25);};
    const nt=(el)=>el.textContent.replace(/\\\(.*?\\\)/g," ").replace(/[\s,;:.]+/g,""), rt=nt(s3.querySelector(".rule")), tt=nt(s3.querySelector(".trap"));
    if(!rt.includes(plain(E.regle))||!tt.includes(plain(E.piege))||s3.querySelectorAll(".ex-list > div").length!==E.exemple.length||/undefined|NaN/.test(s3.innerHTML)){bad++;log.push(id+" : ÉCHEC Retiens propre non affiché ["+plain(E.regle)+"] dans ["+rt.slice(0,60)+"] / ["+plain(E.piege)+"] dans ["+tt.slice(0,60)+"]");}
  }catch(e){bad++;log.push(id+" : EXC "+e.message);}
}
log.unshift((bad?"ÉCHEC ":"OK ")+n+" leçons actives, dont "+own+" avec un Retiens propre ; "+bad+" écart(s)");
document.getElementById("log").hidden=false;document.getElementById("log").textContent=log.join("\n");
</script>
