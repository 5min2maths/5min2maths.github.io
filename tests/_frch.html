<script>
(function(){try{
 const ids=location.hash.slice(1).split(","),out=[];
 const VILLES_CH = "Genève|Lausanne|Berne|Zurich|Neuchâtel|Fribourg|Valais|Sion|Lugano|Bâle|Léman|Montreux|Vevey|Yverdon|Nyon|Morges|Bienne|Lucerne|Gruyère|Cervin|Brévine|Romont|Delémont|Salève|Jungfrau|Lavaux|Carouge|Onex|Meyrin|Vernier|Plainpalais|Gothard";
 const FRB = [["CHF / francs", /CHF|(?<!lancers? )\bfrancs?\b(?! (?:succès|lancers?|tireurs?))/], ["lieu suisse", new RegExp("\\b(?:" + VILLES_CH + ")\\b")], ["usage suisse", /\b(?:septante|huitante|nonante|PGDC|PPMC|[Pp]réimages?|cathètes?|apprenti(?:e|s|es)?|EVACOM|natel|CFC|gymnase)\b|mise en évidence/],["cdot",/\\cdot(?![a-zA-Z])/]];
 const txt = (q) => [q.q, q.sol, ...(q.parts || []).map((p) => p.label), ...(q.hints || [])].filter((t) => typeof t === "string").join(" | ");
 let n=0;const bad={};
 for(const g of [6,7,8,9,10,11,12]){const st={profile:{system:"FR",grade:g,track:"college"}};const cat=new Set(Engine.catalog(st.profile).map(c=>c.id));
  for(const id of ids){if(!cat.has(id))continue;for(let s=1;s<=60;s++){let q;try{q=Engine.make(st,id,4,s);}catch(e){out.push("EXC "+id+" "+e.message);continue;}if(!q||q.d!==4)continue;n++;const t=txt(q);
   for(const [k,re] of FRB){let tt=t;if(k==="cdot")tt=t.replace(/\\\([\s\S]*?\\\)/g,(f)=>/\\vec|\\overrightarrow/.test(f)?"":f);const m=re.exec(tt);if(m){const kk=k+" "+id+" "+(q.ctx||"?");if(!bad[kk])bad[kk]="FR"+g+" "+q.code+" : "+tt.slice(Math.max(0,m.index-60),m.index+40);}}}}}
 out.unshift((Object.keys(bad).length?"ÉCHEC ":"ok ")+n+" défis FR");for(const [k,v] of Object.entries(bad))out.push(k+" | "+v);
 document.getElementById("out").textContent=out.join("\n");}catch(e){document.getElementById("out").textContent="EXC "+e.stack;}})();
</script>
