<!doctype html><meta charset="utf-8"><title>Galerie des figures</title><link rel="stylesheet" href="../src/style.css">
<style id="galcss">
body { background: var(--paper); background-image: none; }
#gal { max-width: none; font-family: var(--font-body); }
#gal h1 { font-size: 1.4rem; margin: 0 0 4px; } #gal h2 { margin: 28px 0 6px; border-bottom: 2px solid var(--ink); } #gal h3 { margin: 18px 0 6px; font-size: 1.05rem; }
#gal .toc { columns: 3 220px; font-size: 13px; } #gal .toc a { color: inherit; } #gal .toc b { display: block; }
#gal .grid { display: grid; grid-template-columns: repeat(auto-fill, 360px); gap: 10px; }
#gal .gcard { width: 360px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 8px; padding: 8px 10px; background: var(--card, #fff); font-size: 12px; line-height: 1.3; overflow: hidden; }
#gal .gcard.bad { border: 3px solid #d00; }
#gal .gcard .motif { color: #d00; font-weight: bold; margin-bottom: 4px; }
#gal .gcard .code { font-family: monospace; font-weight: bold; font-size: 12px; }
#gal .gcard .kind { float: right; color: #666; }
#gal .gcard .enonce { color: #555; margin-top: 4px; max-height: 5.2em; overflow: hidden; }
#gal .gcard .figs { width: 340px; margin: 4px auto 0; } #gal .gcard .figs svg { display: block; margin: 0 auto 4px; }
#gal .gcard .figs .figwrap { overflow: hidden; }
#gal .muted { color: #666; font-size: 13px; }
</style>
