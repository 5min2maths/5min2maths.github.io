const P = new URLSearchParams(location.hash.slice(1)), out = [];
for (const c of (P.get("codes") || "").split(",").filter(Boolean)) { let q; try { q = Engine.fromCode(c); if (!q) { const m = c.split("-"); q = Engine.build(m[0], +m[1], parseInt(m[2], 36)); } } catch (e) { out.push(c + " EXC " + e.message); continue; } out.push(c + "\nQ: " + (q && q.q) + "\nSOL: " + (q && q.sol) + "\nSPEC: " + JSON.stringify(q && q.spec) + "\nPARTS: " + JSON.stringify(q && q.parts) + "\nKEYS: " + (q ? Object.keys(q).join(",") : "") + "\nTXT: " + (q && (q.text || q.ctx || "")) + "\nFIG: " + String((q && (q.fig || q.svg)) || "").slice(0, 1500) + "\n"); }
