<script>
/* 27.11 (robustesse, mises à jour) : « Nouvelle version prête — Recharger » seulement à l'accueil et au bilan, jamais
   pendant une question ; rechargement automatique au retour dans l'app seulement sur l'accueil ou le bilan sans activité
   en cours ; recherche de mise à jour au plus toutes les 30 min. */
const fails = [], ok = (c, m) => { if (!c && fails.length < 30) fails.push(m); };
Element.prototype.scrollIntoView = function () {};
let reloads = 0;
try {
  Upd.reload = () => reloads++;
  statsSet(false);
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true; state.tourDone = true;
  homeTab = "today"; screenHome();
  ok(!app.querySelector(".upd-line"), "rien à l'accueil sans mise à jour");
  ok(Upd.visible() === false && reloads === 0, "pas de rechargement sans mise à jour");
  /* mise à jour trouvée pendant que l'élève est à l'accueil */
  Upd.found();
  const L = app.querySelector(".upd-line");
  ok(L && L.getAttribute("role") === "status" && /Nouvelle version prête/.test(L.textContent) && document.getElementById("updgo"), "ligne affichée à l'accueil");
  ok(L && L.offsetHeight > 0 && L.offsetHeight < 60, "une ligne discrète (" + (L && L.offsetHeight) + " px)");
  ok(app.scrollWidth <= app.clientWidth + 1, "ligne sans débordement");
  document.getElementById("updgo").click(); ok(reloads === 1, "« Recharger » recharge");
  /* pendant une question : rien */
  const q = Engine.finalize(state, "rel", Engine.build("rel", 2, 11));
  renderQuestion(q, { eyebrow: "Test", onDone: () => 3, onNext: () => 0, track: "" });
  ok(!app.querySelector(".upd-line"), "ligne affichée pendant une question");
  ok(Upd.visible() === false && reloads === 1, "rechargement pendant une question");
  /* retour à l'accueil, puis retour dans l'app : rechargement automatique */
  screenHome(); ok(app.querySelector(".upd-line"), "ligne de retour à l'accueil");
  ok(Upd.visible() === true && reloads === 2, "rechargement automatique au retour dans l'app (accueil)");
  /* séance en cours (accueil ouvert au milieu d'une séance) : pas de rechargement */
  let cap = null; const _rq = renderQuestion; renderQuestion = (qq, o) => { cap = { q: qq, o }; _rq(qq, o); };
  state.today = { date: day(), f: "auto" }; startSession();
  for (let g = 0; g < 3 && !cap; g++) { const go = document.getElementById("go"); if (!go) break; const pc = app.querySelector("#pc button"); if (pc) pc.click(); go.click(); }
  if (cap) { cap.o.onDone({ tries: 1, solved: true, dontKnow: false, ans: "1" }); session.answered = Math.max(1, session.answered || 0); }
  const keep = session; screenHome(); session = keep;
  ok(!homeBusy() || Upd.visible() === false, "rechargement au milieu d'une séance");
  /* bilan : ligne affichée, rechargement possible */
  session = null; cap = null; state.today = { date: day(), f: "auto" }; startSession();
  for (let g = 0; g < 30; g++) {
    if (app.querySelector(".lesson-card")) { const pc = app.querySelector("#pc button"); if (pc) pc.click(); const go = document.getElementById("go"); if (!go) break; cap = null; go.click(); continue; }
    if (!cap || !document.querySelector(".qtext")) break; const { o } = cap; cap = null; ok(!app.querySelector(".upd-line"), "ligne pendant la séance"); o.onDone({ tries: 1, solved: true, dontKnow: false, ans: "1" }); o.onNext(false);
  }
  renderQuestion = _rq;
  ok(document.getElementById("home") && app.querySelector(".upd-line"), "ligne au bilan");
  const r0 = reloads; Upd.visible(); ok(reloads === r0 + 1, "rechargement automatique depuis le bilan");
  /* recherche de mise à jour : au plus toutes les 30 min */
  let n = 0; Upd.reg = { update: () => { n++; return Promise.resolve(); } }; Upd.lastCheck = 0;
  const t = 1e12; ok(Upd.check(t) && n === 1, "recherche au retour"); ok(!Upd.check(t + 60000) && n === 1, "pas de 2e recherche avant 30 min"); ok(Upd.check(t + 31 * 60000) && n === 2, "recherche après 30 min");
  Upd.ready = false; Upd.lastCheck = 0; screenHome(); Upd.visible(); ok(n === 3 && !app.querySelector(".upd-line"), "retour sans mise à jour : recherche seulement");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(1, 3).join(" ")); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC mises à jour\n" + fails.join("\n") : "ok mises à jour : ligne à l'accueil et au bilan seulement, rechargement automatique au retour, recherche toutes les 30 min au plus";
</script>
