<script>
/* 26.11 soir (revue des élèves joués, n° 1, grave) : le chapitre choisi « En ce moment en classe » doit être travaillé même
   quand ses notions sont de l'année (« en cours », leçon pas encore vue). Avant la correction : Révision, Défi du jour et
   Automatismes n'en posaient aucune (MP 2e « Fonctions quadratiques » 0 sur 15). Pour chaque profil et chaque chapitre de
   l'année dont une notion a sa leçon à voir : au moins la moitié des questions de l'ensemble des formats portent sur le
   chapitre, chaque format en pose au moins une (Automatismes : si une notion du chapitre en fournit), au plus une leçon,
   en tête, et jamais en Révision ni au Défi du jour ; une notion au plus 2 fois par séance (n° 2). */
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const idOf = (e) => String(e).split("|")[0];
try {
  const P = [["MP 2e", { system: "CH", grade: 13, track: "mp" }], ["3e Coll. MA1", { system: "CH", grade: 14, track: "college", niv: "N" }],
    ["4e Coll. MA2", { system: "CH", grade: 15, track: "college", niv: "R" }], ["11e", { system: "CH", grade: 11, track: "college" }],
    ["4e FR", { system: "FR", grade: 8, track: "college" }], ["2nde FR", { system: "FR", grade: 10, track: "college" }]];
  let nCh = 0, tot = 0, totNow = 0;
  for (const [nom, pr] of P) {
    state = Engine.newState({ ...pr, minutes: 5 }); Engine.autoInit(state); state.placed = true;
    const base = JSON.stringify(state);
    const chs = nowChapters();
    for (const ch of chs) {
      state = JSON.parse(base);
      const ids = nowPickIds(ch); Engine.setNow(state, ids);
      if (!ids.some((id) => Engine.lessonDue(state, id))) continue; /* chapitre déjà vu : non concerné */
      nCh++;
      let n = 0, k = 0;
      for (const f of Object.keys(FORMATS)) {
        let fN = 0, fK = 0;
        for (let r = 0; r < 4; r++) {
          const plan = Engine.planSession(state, f);
          fN += plan.length; fK += plan.filter((e) => ids.includes(idOf(e))).length;
          const c = {}; plan.forEach((e) => (c[idOf(e)] = (c[idOf(e)] || 0) + 1));
          const lone = Object.keys(c).length === 1;
          ok(lone || Object.values(c).every((x) => x <= 2), nom + " " + ch.label + " " + f + " : une notion plus de 2 fois " + plan.join(" "));
          const les = plan.map((e, i) => (Engine.lessonDue(state, idOf(e)) && !ids.includes(idOf(e)) ? i : -1)).filter((i) => i >= 0);
          ok(les.length <= 1 && (!les.length || les[0] === 0), nom + " " + ch.label + " " + f + " : leçon ailleurs qu'en tête " + plan.join(" "));
          if (f === "revision" || f === "defi" || f === "auto") ok(plan.noLesson || f === "auto" || !plan.some((e) => Engine.lessonDue(state, idOf(e))), nom + " " + ch.label + " " + f + " : leçon possible en " + f);
        }
        const drillable = ids.some((id) => Engine.drillable(state, id));
        if (f !== "auto" || drillable) ok(fK > 0, nom + " · " + ch.label + " · " + f + " : aucune question du chapitre");
        n += fN; k += fK;
      }
      /* chapitre d'une ou deux notions : la limite de 2 fois par séance (n° 2) passe avant la part du chapitre */
      ok(k >= n / (ids.length >= 3 ? 2 : 3), nom + " · " + ch.label + " (" + ids.length + " notions) : " + k + " questions du chapitre sur " + n);
      tot += n; totNow += k;
    }
  }
  ok(nCh >= 15, "chapitres de l'année testés : " + nCh);
  log.push(nCh + " chapitres de l'année, " + totNow + " questions du chapitre sur " + tot + " (" + Math.round((100 * totNow) / tot) + " %)");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.length + " · " + fails.slice(0, 12).join("\n") : "ok chapitre en classe servi : " + log.join(" | ");
</script>
