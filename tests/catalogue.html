<!doctype html><meta charset="utf-8"><meta name="budget" content="90000">
<title>Tests : catalogue</title>
<link rel="stylesheet" href="../src/style.css">
<!-- Catalogue : formes à figure obligatoire, anciennes notions, tirages fins par notion ; aperçus (code d'une question, figure, échantillon).
     Page de thème (28.11, /entretien tests) : chaque section est une ancienne page de test, recopiée telle quelle
     (mécanisme : tests/lot.js). Sections : figs, oldnotions, fine, code, one, figsample.
     Une seule section : catalogue.html#section=figs -->
<body><main id="app"></main>
<script>window.MathJax={typesetPromise:()=>Promise.resolve()};try{localStorage.clear()}catch(e){}</script>
<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script><script src="../src/expr.js"></script><script src="../src/figures.js"></script><script src="../src/geo.js"></script><script src="../src/generators.js"></script><script src="../src/gen2.js"></script><script src="../src/gen3.js"></script><script src="../src/variantes.js"></script><script src="../src/competences.js"></script><script src="../src/ch11_prop.js"></script><script src="../src/ch11_litt.js"></script><script src="../src/ch1c_eq.js"></script><script src="../src/ch1c_sys.js"></script><script src="../src/ch11_no.js"></script><script src="../src/ch11_gm.js"></script><script src="../src/ch11_ang.js"></script><script src="../src/ch11_thales.js"></script><script src="../src/ch11_proba.js"></script><script src="../src/ch1c_no.js"></script><script src="../src/ch1c_fct.js"></script><script src="../src/ch1c_alg.js"></script><script src="../src/ch1c_f2b.js"></script><script src="../src/ch11_no2.js"></script><script src="../src/ch1c_geo.js"></script><script src="../src/ch1c_trig.js"></script><script src="../src/ch_mp1.js"></script><script src="../src/ch11_fct.js"></script><script src="../src/ch10_no.js"></script><script src="../src/ch_mp2.js"></script><script src="../src/ch_mp3.js"></script><script src="../src/ch_mp4.js"></script><script src="../src/fr_2nde.js"></script><script src="../src/ch3c_ana.js"></script><script src="../src/ch3c_geo.js"></script><script src="../src/ch4c_ana.js"></script><script src="../src/ch2c.js"></script><script src="../src/ch1c_arg.js"></script><script src="../src/riche.js"></script><script src="../src/riche_11b.js"></script><script src="../src/riche_11c.js"></script><script src="../src/riche_1c.js"></script><script src="../src/riche_sys1c.js"></script><script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/engine.js"></script>
<script src="lot.js"></script>
<script>
/* ======== figs (ancienne page tests/figs.html) ======== */
Lot.section("figs", { html: `<div id="app"></div><pre id="o"></pre>` }, function () {
const out = [];
for (const n of NOTIONS) { if (n.theme !== "gm" && n.theme !== "es") continue; const row = [];
  for (const d of [1, 2, 3]) { let f = 0, ex = ""; for (let i = 0; i < 30; i++) { const q = GEN[n.id](d); if (q.fig) f++; else if (!ex) ex = q.q.replace(/<[^>]*>|\\\(|\\\)/g, "").slice(0, 90); } row.push("d" + d + ":" + Math.round(f / 30 * 100) + "%" + (f < 30 ? " [" + ex + "]" : "")); }
  out.push(n.id + " (" + (n.CH || n.MP) + ") " + row.join(" | ")); }
/* 28.11 (/contenu figures, tools/archive/contenu_figures_28-11.md) : formes qui doivent garder leur figure (une par forme
   ajoutée, tirage exact par son code) ; figure absente = ÉCHEC. */
const OBLIG = ["euclide-1-p", "euclide-2-s", "euclide-3-u", "exactes-1-s", "exactes-2-s", "exactes-3-r", "exactes-3-s", "geocomb-2-r", "geocomb-3-s",  "droitesrem-2-u", "trigo-3-u", "trigexact-3-t", "airepyr-1-u", "airepyr-2-r", "airepyr-2-u", "volcomp-2-t", "volcomp-2-u", "volcomp-3-q", "volcomp-4-u", "volmanq-1-s", "volmanq-2-u", "volmanq-3-u", "volcone-2-q",  "cercthales-2-r", "cercthales-3-s", "cercthales-3-t", "thales-4-d", "thales-4-o", "thalesrec-1-u", "thalesrec-2-s", "angles-1-q", "angles-1-r", "angles-3-s", "angles-3-t", "angles-3-u", "pythrec-3-u", "probeq2-3-r", "volpave-1-u"];
const manque = OBLIG.filter((c) => { const q = Engine.fromCode(c); return !q || !(q.fig || (q.parts || []).some((x) => x.fig)); });
out.unshift(manque.length ? "ÉCHEC figure manquante : " + manque.join(", ") : "ok : " + OBLIG.length + " formes à figure obligatoire (28.11)");
document.getElementById("o").textContent = out.join("\n");
});
/* ======== oldnotions (ancienne page tests/oldnotions.html) ======== */
Lot.section("oldnotions", { html: `<pre id="o"></pre>` }, function () {
const fine = new Set(FINE.map((f) => f.id)), out = [];
for (const n of NOTIONS) { if (fine.has(n.id)) continue; out.push("## " + n.id + " — " + n.label + " CH" + JSON.stringify(n.CH) + " MP" + JSON.stringify(n.MP));
  for (const d of [1, 2, 3]) for (let i = 0; i < 3; i++) { R.seed(d * 97 + i * 13 + 5); try { const q = GEN[n.id](d); out.push("  d" + d + " " + q.q.replace(/\\\(|\\\)/g, "").replace(/<[^>]*>/g, "").slice(0, 150)); } catch (e) { out.push("  d" + d + " ERR " + e.message); } } }
document.getElementById("o").textContent = out.join("\n");
});
/* ======== fine (ancienne page tests/fine.html) ======== */
Lot.section("fine", { html: `<pre id="o"></pre>` }, function () {
const out=[]; const want=(location.hash||"").slice(1);
for (const f of FINE) { if (want && !new RegExp(want).test(String(f.CH ? f.CH[0] : "MP") + (f.MP ? "MP" : ""))) continue; for (const d of [1,2,3]) for (let i=0;i<2;i++){ R.seed(d*1000+i*77+f.id.length*13+f.id.charCodeAt(1)); const q=GEN[f.id](d); out.push(f.id+" d"+d+" | "+q.q.replace(/\\\(|\\\)/g,"")+" => "+(q.spec.value!==undefined?q.spec.value:q.spec.expr||JSON.stringify(q.spec.values||q.spec))+" || "+q.sol.replace(/\\\(|\\\)/g,"")); } }
document.getElementById("o").textContent=out.join("\n");
});
/* ======== code (ancienne page tests/code.html) ======== */
Lot.section("code", { html: `<div id="app"></div><pre id="o"></pre>



<div id="f" style="width:320px;height:140px"></div><style>#f svg{width:320px;height:140px}</style><pre id="o"></pre>`, apercu: true }, function () {
const q = Engine.fromCode(location.hash.slice(1)); document.getElementById("f").innerHTML = q.fig || ""; document.getElementById("o").textContent = JSON.stringify({ q: q.q, parts: q.parts, sol: q.sol }, null, 1);
});
/* ======== one (ancienne page tests/one.html) ======== */
Lot.section("one", { html: `<div id="app"></div><pre id="o"></pre>



<div id="f" style="width:300px"></div>`, apercu: true }, function () {
document.getElementById("f").innerHTML = GEN.cercle(1).fig;
});
/* ======== figsample (ancienne page tests/figsample.html) ======== */
Lot.section("figsample", { html: `<style>body{background:#fff;padding:8px} .g{display:grid;grid-template-columns:repeat(3,300px);gap:6px} .g div{border:1px solid #ccc;font:10px sans-serif;overflow:hidden} </style>


<div class="g" id="g"></div>`, apercu: true }, function () {
const W = [["euclide",1],["euclide",2],["euclide",3],["perim",3],["aire2",3],["aire3",1],["aire3",2],["angtype",2],["quadri",1],["grandmanq",3],["pythfig",2],["rotation",1],["volcomp",1],["volcomp",3],["cercthales",1],["cercthales",2],["cercthales",3],["thalesrec",1],["thalesrec",2],["thales",3],["exactes",2],["trigexact",1],["trigexact",3],["geocomb",2],["triaire",1],["triaire",3],["trigassoc",1],["cercletan",3],["droitesinter",3],["angles",3]];
document.getElementById("g").innerHTML = W.map(([id, d]) => { R.seed(id.length * 31 + d); const q = GEN[id](d); return "<div>" + id + " d" + d + " — " + q.q.replace(/<[^>]*>/g, "").slice(0, 120) + (q.fig || "<b>PAS DE FIGURE</b>") + "</div>"; }).join("");
});
Lot.lance();
</script>
