<script>
/* ======== vide (ancienne page tests/vide.html) ======== */
Lot.section("vide", { html: `<div id="app"></div><pre id="o"></pre>` }, function () {
/* 25.11 (commentaire de l'enseignant : « comment j'écris aucune ? ») : réponse « pas de solution » aux listes de solutions.
   Touche ∅ du clavier, acceptée par checkAnswer, montrée dans l'aperçu, et consigne qui dit comment répondre. */
const out = [], T = (c, m) => out.push((c ? "ok " : "ÉCHEC ") + m);
try {
  const vide = { kind: "set", values: [] }, deux = { kind: "set", values: [-2, 3] };
  for (const a of ["∅", "aucune", "Aucune solution", "{}", "{ }", "S = {}", "S = ∅", "Ø", "ø", "pas de solution"]) T(checkAnswer(vide, a).status === "correct", "vide accepte « " + a + " »");
  for (const a of ["∅", "aucune", "{}"]) T(checkAnswer(deux, a).status === "wrong", "non vide refuse « " + a + " »");
  T(checkAnswer(deux, "3 ; -2").status === "correct", "non vide accepte 3 ; -2");
  T(checkAnswer(vide, "0").status === "wrong", "vide refuse 0");
  T(SolSet.parse("∅").length === 0, "intervalles : ∅ = ensemble vide");
  state = Engine.newState({ system: "CH", grade: 13, track: "college", minutes: 5 }); Engine.autoInit(state);
  /* Toutes les notions dont une question peut attendre l'ensemble vide : clavier avec ∅ et consigne. */
  const ids = NOTIONS.map((n) => n.id).filter((id) => GEN[id]), found = {};
  for (const id of ids) for (let lv = 1; lv <= 3; lv++) for (let sd = 1; sd <= 60; sd++) {
    let q; try { q = Engine.build(id, lv, sd); } catch (e) { continue; }
    if (q.parts || !q.spec) continue;
    const empty = (q.spec.kind === "set" && !q.spec.all && q.spec.values.length === 0) || (q.spec.kind === "solset" && q.spec.ivs.length === 0);
    if (empty && !found[id]) found[id] = q;
  }
  const L = Object.keys(found);
  T(L.length >= 3, "notions à réponse vide trouvées : " + L.join(", "));
  for (const id of L) {
    const q = found[id];
    renderQuestion(q, { eyebrow: "Test", onDone: () => 0, onNext: () => 0 });
    const key = document.querySelector('#kp button[data-k="∅"]');
    T(!!key, q.code + " : touche ∅ au clavier");
    const txt = (document.querySelector(".qtext").textContent + " " + ((document.querySelector(".exact-note") || {}).textContent || ""));
    T(/∅/.test(txt), q.code + " : la consigne dit d'écrire ∅");
    if (key) { key.click(); const inp = document.getElementById("ans"); T(inp.value === "∅", q.code + " : la touche écrit ∅");
      T(checkAnswer(q.spec, inp.value).status === "correct", q.code + " : ∅ accepté");
      try { const p = previewHtml(inp.value, q.spec); T(/varnothing|emptyset|∅/.test(p), q.code + " : aperçu de ∅"); } catch (e) { T(false, q.code + " : aperçu de ∅ (" + e.message + ")"); } }
  }
  /* Une liste de solutions non vide a aussi la touche et la consigne (sinon elles trahiraient la réponse). */
  let q2 = null; for (let sd = 1; sd < 200 && !q2; sd++) { const q = Engine.build("eq2fact", 1, sd); if (q.spec.kind === "set" && q.spec.values.length) q2 = q; }
  renderQuestion(q2, { eyebrow: "Test", onDone: () => 0, onNext: () => 0 });
  T(!!document.querySelector('#kp button[data-k="∅"]') && /∅/.test(document.querySelector(".card").textContent), q2.code + " (non vide) : touche et consigne ∅ aussi");
  /* Clavier de calcul ordinaire : pas de ∅. */
  renderQuestion(Engine.build("fracmul", 3, 7), { eyebrow: "Test", onDone: () => 0, onNext: () => 0 });
  T(!document.querySelector('#kp button[data-k="∅"]'), "calcul : pas de touche ∅");
} catch (e) { out.push("EXC " + e.message); }
const bad = out.filter((l) => /^ÉCHEC/.test(l));
document.getElementById("o").textContent = (bad.length ? "ÉCHEC " + bad.length + "\n" + bad.join("\n") + "\n" : "ok ensemble vide (" + out.length + " contrôles)\n") + out.join("\n");
});
/* ======== ui (ancienne page tests/ui.html) ======== */
Lot.section("ui", { html: `<div id="app"></div><pre id="o"></pre>` }, function () {
const out = [], $ = (s) => document.querySelector(s), log = (m) => out.push(m);
window.onerror = (m, s, l) => out.push("ERREUR " + m + " ligne " + l);
const click = (sel) => { const e = typeof sel === "string" ? $(sel) : sel; if (!e) { out.push("introuvable " + sel); return false; } e.click(); return true; };
try {
  click("#go"); log("niveau : " + [...document.querySelectorAll("#grade button")].map((b) => b.textContent).join(", ") + " | choix école : " + !!$("#sys"));
  click('#grade button[data-v="11"]'); click("#next");
  log("après niveau : " + ($(".eyebrow") ? $(".eyebrow").textContent : "?") + " | " + ($(".qtext") ? $(".qtext").textContent.slice(0, 80) : document.querySelector("h2").textContent) + " | pas vu : " + !!$("#notyet"));
  click("#notyet"); log("après « pas encore vu » : " + ($(".eyebrow") ? $(".eyebrow").textContent : "?"));
  // positionnement : « je ne sais pas » partout
  for (let k = 0; k < 12 && $("#idk"); k++) { click("#idk"); const nx = $("#nx"); if (nx) nx.click(); }
  log("écran : " + (document.querySelector("h2") ? document.querySelector("h2").textContent : "?"));
  const b = [...document.querySelectorAll("button")].find((x) => /Commencer|accueil|C'est parti|Continuer/.test(x.textContent)); if (b) b.click();
  log("accueil : " + [...document.querySelectorAll("h2, h3")].map((h) => h.textContent).join(" | ").slice(0, 300));
  log("boutons : " + [...document.querySelectorAll("button")].map((x) => (x.id || "-") + ":" + x.textContent.slice(0, 18)).join(" / "));
  if ($("#go") && !$("#comps")) click("#go");
  log("accueil 2 : " + [...document.querySelectorAll("h2, h3")].map((h) => h.textContent).join(" | ").slice(0, 200));
  click("#comps"); log("compétences : " + [...document.querySelectorAll("h2, .card h3")].map((h) => h.textContent).join(" | ").slice(0, 200) + " | lignes : " + document.querySelectorAll(".comp").length + " | notes : " + [...document.querySelectorAll(".note:not(.none)")].map((x) => x.textContent).join(" "));
  click("#back");
  click("#go");
  click("#go");
  log("après go : " + [...document.querySelectorAll("h2, .eyebrow")].map((h) => h.textContent).join(" | ").slice(0, 200));
  { const c = [...document.querySelectorAll("button")].find((x) => /compris|question|Passer/i.test(x.textContent)); if (c && !document.querySelector(".qtext")) c.click(); }
  for (let k = 0; k < 3; k++) { log("question : " + ($(".eyebrow") ? $(".eyebrow").textContent : "") + " — " + ($(".qtext") ? $(".qtext").textContent.slice(0, 90) : "(pas de question) " + (document.querySelector("h2") || {}).textContent) + " | trop facile : " + !!$("#easy")); if ($("#idk")) { click("#idk"); if ($("#nx")) click("#nx"); } }
} catch (e) { out.push("EXCEPTION " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("o").textContent = out.join("\n");
});
/* ======== sent (ancienne page tests/sent.html) ======== */
Lot.section("sent", { html: `<pre id="o"></pre>` }, function () {
const out = []; for (const id of ["droitesinter", "angtype", "decarr", "trigassoc", "prio"]) out.push(id + " → " + sentences(LESSONS[id].regle).join("  ‖  "));
let maxOne = 0; for (const [id, L] of Object.entries(LESSONS)) { const n = sentences(L.regle).length; if (n === 1 && L.regle.length > 160) { maxOne++; out.push("  bloc : " + id + " : " + L.regle.slice(0, 160)); } }
out.push("règles longues restées en un bloc : " + maxOne);
document.getElementById("o").textContent = out.join("\n");
});
/* ======== cmt (ancienne page tests/cmt.html) ======== */
Lot.section("cmt", { html: `<div id="app"></div><pre id="o"></pre>`, apercu: true }, function () {
state = Engine.newState({ system: "CH", grade: 13, track: "college", minutes: 5 }); Engine.autoInit(state); renderQuestion(Engine.build("prio", 1, 7), { eyebrow: "Test", onDone: () => 3, onNext: () => 0 }); document.getElementById("idk").click(); document.querySelector("details.cmt").open = true; document.getElementById("cmt").value = "La consigne pourrait préciser…"; document.getElementById("cmtsend").click(); window.scrollTo(0, 400);
});
/* ======== kp (ancienne page tests/kp.html) ======== */
Lot.section("kp", { html: `<div id="app"></div><pre id="o"></pre>`, apercu: true }, function () {
state = Engine.newState({ system: "CH", grade: 13, track: "college", minutes: 5 }); Engine.autoInit(state); renderQuestion(Engine.build("droites", 1, 7), { eyebrow: "Test clavier", onDone: () => 0, onNext: () => 0 }); document.querySelector("#kp button[data-k=y]").click(); document.querySelector("#kp button[data-k=\"=\"]").click(); document.title = document.getElementById("ans").value;
});
/* ======== lesson (ancienne page tests/lesson.html) ======== */
Lot.section("lesson", { html: `<div id="app"></div><pre id="o"></pre>`, apercu: true }, function () {
state = Engine.newState({ system: "CH", grade: 13, track: "college", minutes: 5 }); Engine.autoInit(state); screenLesson("cercletan", () => 0); const b = document.querySelector(".lfb button[data-v=down]"); b.click(); document.querySelector("details.cmt .cmt-t").value = "Je ne comprends pas la pente"; document.querySelector("details.cmt .cmt-s").click(); document.title = (document.querySelector(".cmt-ok") || {}).textContent + " | " + state.notions.cercletan.lessonSeen;
});
Lot.lance();
</script>
