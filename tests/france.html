<script>
const fails = [], log = [], ok = (c, m) => { if (!c && fails.length < 60) fails.push(m); };
const SW = { CHF: /CHF/, milliers: /\d['’]\d{3}(?!\d)|\\text\{'\}/, PGDC: /PGDC|PPMC/, preimage: /[Pp]réimage/, evidence: /en évidence/, EVACOM: /EVACOM/, Geneve: /Genève|genevois/, change: /\b1 (€|euro) (=|vaut)|\bEUR\b|Suisse/ };
const hit = (t) => Object.entries(SW).filter(([, re]) => re.test(t)).map(([k, re]) => k + " « " + t.match(new RegExp(".{0,30}(?:" + re.source + ").{0,20}"))[0] + " »");
try {
  // 1. frLocal : cas types, idempotence
  const C = [
    ["Le prix est 1'200 CHF.", "Le prix est 1 200 €."], ["\\(1\\text{'}250\\ \\text{CHF}\\)", "\\(1\\,250\\ \\text{€}\\)"], ["\\(12'500\\)", "\\(12\\,500\\)"],
    ["Combien en CHF ?", "Combien en euros ?"], ["PGDC(24 ; 36), PPMC", "PGCD(24 ; 36), PPCM"],
    ["Détermine la préimage de 3.", "Détermine l'antécédent de 3."], ["Détermine les préimages de 4.", "Détermine les antécédents de 4."],
    ["une seule préimage", "un seul antécédent"], ["c) Plus grande préimage de 0", "c) Plus grand antécédent de 0"], ["Images et préimages", "Images et antécédents"],
    ["Mise en évidence de \\(3x\\)", "Factorisation par \\(3x\\)"], ["Factorise (mise en évidence) :", "Factorise (facteur commun) :"], ["Mets en évidence.", "Factorise."],
    ["Il faut encore mettre en évidence", "Il faut encore factoriser"], ["Mettre \\(x\\) en évidence retire un x", "Factoriser par \\(x\\) retire un x"],
    ["Ramène à 0 et mets \\(t\\) en évidence : ok", "Ramène à 0 et factorise par \\(t\\) : ok"], ["mets -2 en évidence, puis", "factorise par -2, puis"], ["Après \\(x\\) en évidence, reste", "Après factorisation par \\(x\\), reste"], ["Étape 1 : mise en évidence d'un facteur commun", "Étape 1 : factorisation par un facteur commun"],
    ["3 lancers francs", "3 lancers francs"], ["au franc près", "à l'euro près"], ["l'aire 1'000'000", "l'aire 1 000 000"], ["2,5 ; 3'14", "2,5 ; 3'14"],
  ];
  for (const [a, b] of C) { const r = frLocal(a); ok(r === b, "frLocal « " + a + " » → « " + r + " » (attendu « " + b + " »)"); ok(frLocal(r) === r, "frLocal non idempotent : " + a); }
  // 2. Profils suisses : finalize ne touche pas aux textes
  let nCH = 0;
  for (const id of ["pct", "prop", "fimg", "factor", "arith", "pctvar", "modaff", "sci"]) for (const d of [1, 2, 3]) for (let s = 1; s <= 6; s++) {
    const raw = Engine.build(id, d, s), q = Engine.finalize({ profile: { system: "CH", grade: 11, track: "college" } }, id, JSON.parse(JSON.stringify(raw)));
    const T = (x) => [x.q, x.sol, x.hint, ...(x.guide || []).flatMap((g) => [g.ask, g.sol]), ...(x.hints || []), ...(x.traps || []).map((t) => t.m)].join(" | ");
    ok(T(q) === T(raw), "profil CH modifié : " + raw.code); nCH++;
  }
  log.push("profils suisses inchangés : " + nCH + " questions");
  // 3. Questions d'un profil français, 6e → Tle : tout le catalogue, niveaux 1 à 3 (et défis), 3 graines
  const txt = (q) => [q.q, q.sol, q.hint, q.fig, ...(q.guide || []).flatMap((g) => [g.ask, g.sol]), ...(q.parts || []).map((p) => p.label), ...(q.hints || []), ...(q.traps || []).map((t) => t.m)].filter((x) => typeof x === "string").join(" | ");
  const bad = {};
  for (const g of [6, 7, 8, 9, 10, 11, 12]) {
    const p = { system: "FR", grade: g, track: "college", minutes: 5 }, st = { profile: p }, cat = Engine.catalog(p); let n = 0;
    for (const c of cat) for (const d of [1, 2, 3, 4]) for (let s = 1; s <= 3; s++) {
      if (d === 4 && !hasProb(c.id)) continue;
      let q; try { q = Engine.make(st, c.id, d, s); } catch (e) { ok(false, "EXC " + c.id + "-" + d + "-" + s + " " + e.message); continue; }
      if (!q) continue; n++;
      const sp = q.spec; if (sp && sp.kind === "value" && !q.parts) ok(checkAnswer(sp, q.canon || String(+(+sp.value).toFixed(10)).replace(".", ",")).status === "correct", "réponse refusée après localisation " + q.code);
      for (const h of hit(txt(q))) { const k = h.split(" ")[0] + " " + c.id; if (!bad[k]) bad[k] = q.code + " : " + h; }
    }
    log.push(SYSTEMS_HIDDEN.FR.grades.find(([x]) => x === g)[1] + " : " + cat.length + " notions, " + n + " questions");
  }
  for (const [k, v] of Object.entries(bad)) ok(false, "question FR : " + v);
  // 3 bis. Tirage normal (sans graine) : les énoncés propres à la Suisse (change EUR ↔ CHF, « en Suisse ») sont écartés
  const stF = { profile: { system: "FR", grade: 9, track: "college", minutes: 5 } }; let nCh = 0;
  for (const [id, d] of [["prop", 3], ["prop", 2], ["pctvar", 2], ["pctvar", 3], ["pct", 3]]) for (let k = 0; k < 40; k++) {
    const q = Engine.make(stF, id, d), t = txt(q); nCh++;
    ok(!/1 € = [\d,]+ €|\bEUR\b|Suisse|taux de change/.test(t), "énoncé suisse tiré en profil FR : " + q.code + " « " + t.slice(0, 90) + " »");
  }
  ok(horsCO(stF, "prop", { q: "Au taux 1 EUR = 0,95 CHF, combien ?" }), "horsCO : change non écarté en FR");
  ok(!horsCO({ profile: { system: "CH", grade: 9, track: "college" } }, "prop", { q: "1 EUR = 0,95 CHF" }), "horsCO : profil CH touché");
  log.push("tirages normaux FR contrôlés : " + nCh);
  // 3 ter. Terminale : les chapitres de 1re du Collège de Genève ne sont plus « de l'année »
  const tle = Engine.catalog({ system: "FR", grade: 12, track: "college" }).filter((c) => c.current).map((c) => c.id);
  ok(!["rel", "pyth", "puiss", "reduire", "eq1"].some((id) => tle.includes(id)), "Tle : notions de collège « de l'année » : " + tle.join(" "));
  log.push("Tle de l'année : " + tle.join(" "));
  // 3 quater. Seconde : les automatismes repris du collège (againFR 10, src/fr_2nde.js) restent « de l'année » malgré fr_college.js
  const sec = Engine.catalog({ system: "FR", grade: 10, track: "college" }).filter((c) => c.current).map((c) => c.id);
  ok(["fracops", "idrem", "pctvar", "fimg", "eq1"].every((id) => sec.includes(id)), "2nde : automatismes repris absents (" + sec.length + " de l'année)");
  log.push("2nde : " + sec.length + " notions de l'année");
  // 4. Leçons et aide d'un profil français (rendues par l'app : frDom)
  state = Engine.newState({ system: "FR", grade: 9, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  ok(gradeName(state.profile) === "3e", "nom de classe FR : " + gradeName(state.profile));
  const scr = (name, f) => { try { f(); const t = app.textContent; for (const h of hit(t)) ok(false, "écran " + name + " : " + h); } catch (e) { ok(false, "écran " + name + " EXC " + e.message); } };
  scr("accueil", () => screenHome());
  scr("compétences", () => screenComps());
  scr("réglages", () => screenSettings());
  for (const id of ["fimg", "factor", "pct", "prop", "premiers", "pctvar", "sci", "idrem"]) if (state.notions[id]) scr("leçon " + id, () => screenLesson(id));
  for (const [id, d] of [["pct", 2], ["prop", 1], ["fimg", 2], ["factor", 1], ["pctvar", 2], ["modaff", 2]]) scr("question " + id, () => { const q = Engine.make(state, id, d, 5); renderQuestion(q, { eyebrow: "Question", onDone: () => 0, onNext: () => 0 }); });
  // 5. Aperçu …/#france : « France » au choix de l'école (étape 1) ; sans le réglage, rien
  ok(!!SYSTEMS.FR, "aperçu : SYSTEMS.FR absent malgré m2m-france");
  state = null; draft = { system: "FR", grade: 9, track: null, minutes: 5 }; screenLevel();
  ok(!!document.querySelector('#sys button[data-v="FR"]') && document.querySelectorAll("#grade button").length === 7, "aperçu : choix France / 7 classes");
  draft.system = "CH"; screenLevel(); ok(document.querySelectorAll("#grade button").length === SYSTEMS.CH.grades.length, "aperçu : retour Suisse");
  /* 25.11 : …/#france app déjà ouverte : choix de l'école ouvert sur France */
  { const keep = SYSTEMS.FR; delete SYSTEMS.FR; history.replaceState(null, "", "#france"); const r = showCode() || restoreFromHash(); ok(SYSTEMS.FR && document.querySelector('#sys button[data-v="FR"][aria-pressed="true"]'), "#france app ouverte : France choisie"); ok(location.hash === "", "#france : adresse nettoyée"); if (!SYSTEMS.FR) SYSTEMS.FR = keep; }
  /* 25.11 : produit × en France, produit scalaire gardé, Suisse inchangée */
  ok(frLocal("Calcule \\(3 \\cdot 4\\).") === "Calcule \\(3 \\times 4\\).", "× en France : " + frLocal("Calcule \\(3 \\cdot 4\\)."));
  ok(/\\cdot/.test(frLocal("\\(\\vec{u} \\cdot \\vec{v} = 0\\)")), "produit scalaire gardé");
  ok(frLocal("3 · 4 = 12") === "3 × 4 = 12", "× dans le texte");
  { const st = Engine.newState({ system: "FR", grade: 9, minutes: 5 }); Engine.autoInit(st); let n = 0; for (const id of Object.keys(st.notions).slice(0, 60)) { try { const q = Engine.make(st, id, 2); if (/\\cdot/.test(q.q) && !/\\vec|\\overrightarrow/.test(q.q)) n++; } catch (e) {} } ok(n === 0, "3e FR : plus de point médian dans les énoncés (" + n + ")"); }
  { const st = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(st); let n = 0; for (const id of Object.keys(st.notions).slice(0, 60)) { try { const q = Engine.make(st, id, 2); if (/\\times/.test(q.q) && /\\cdot/.test(Engine.build(id, 2, q.seed).q)) n++; } catch (e) {} } ok(n === 0, "Suisse : point médian inchangé"); }
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = (fails.length ? "ÉCHEC\n" + fails.join("\n") : "OK") + "\n" + log.join("\n");
</script>
