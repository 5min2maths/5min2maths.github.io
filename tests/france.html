    ok(Engine.make({ profile: { system: "CH", grade: 11, track: "college" } }, "pct", 1, 5).code.split("-")[1] === "1", "UPFR appliqué à un profil suisse"); }
  // 10. Vocabulaire français ajouté le 25.11
  for (const [a, b] of [["Écris sous la forme \\(y = mx + h\\).", "Écris sous la forme \\(y = mx + p\\)."], ["Les cathètes mesurent 3 cm.", "Les côtés de l'angle droit mesurent 3 cm."], ["Donne le domaine de définition de \\(f\\).", "Donne l'ensemble de définition de \\(f\\)."], ["l'aire du domaine coloré", "l'aire du domaine coloré"]]) ok(frLocal(a) === b, "frLocal « " + a + " » → « " + frLocal(a) + " »");
  // 11. Notions créées le 25.11 : structure, formes, non-trivialité, réponse type acceptée, code reproductible
  for (const id of NEWFR) { const n = NOTIONS.find((x) => x.id === id); ok(n && n.FR && !n.CH && !n.MP, id + " : placement FR seul");
    ok(LESSONS_EXTRA[id] && LESSONS_EXTRA[id].length === 5 && HINTS[id] && COMPS[id] && COMPS[id].length === 3, id + " : leçon, indice ou compétences manquants");
    for (const d of [1, 2, 3]) { const ctx = new Set(); let triv = 0, noTrap = 0;
      for (let s = 1; s <= 40; s++) { const q = Engine.build(id, d, s); ctx.add(q.ctx);
        if (trivialQ(q, 5)) triv++; if (!(q.traps || []).length) noTrap++;
        ok((q.guide || []).length > 0, q.code + " sans pas à pas");
        const r = checkAnswer(q.spec, q.canon); ok(r.status === "correct", q.code + " : réponse type « " + q.canon + " » refusée (" + r.status + ")");
        if (s <= 5) { const c = Engine.fromCode(q.code); ok(c && c.q === q.q, q.code + " : code non reproductible"); } }
      ok(ctx.size >= 3, id + " niveau " + d + " : " + ctx.size + " forme(s) seulement"); ok(triv <= 4, id + " niveau " + d + " : " + triv + " questions triviales"); ok(noTrap <= 8, id + " niveau " + d + " : " + noTrap + " questions sans piège"); } }
  log.push("notions françaises du 25.11 : " + NEWFR.length + " contrôlées (structure, formes, réponse type, code)");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = (fails.length ? "ÉCHEC\n" + fails.join("\n") : "OK") + "\n" + log.join("\n");
</script>
