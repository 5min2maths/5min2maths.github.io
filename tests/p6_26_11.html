<script>
/* 26.11 (revue des élèves joués, 6e passage, tools/archive/revue_eleves_claude_26-11_p6.md) : un contrôle par point corrigé.
   1 : Problème de la semaine = notion de l'année (placeOf = classe), pas une reprise (échouait avant la correction :
       la 10e recevait arith@9). 2 : jamais une notion non travaillée (hors chapitre en classe). 3–9 : corrigé recipaff,
       maquette cohérente, camp / club, pct sans pourcentages successifs avant la 3e FR / en 9e, colonBreak, fracrat,
       stats vélo. 11–15 : corrigés (log, freinage, rangs), « Me tester » (formes de angtri), étiquette (x + …)°,
       élision devant Yanis, 5'000 CHF, « ou bien », consigne ∅, séries courtes et pas de défi le jour du positionnement. */
const fresh = (pr) => { state = Engine.newState({ ...pr, minutes: 5 }); Engine.autoInit(state); state.placed = true; return state; };
const strip = (t) => String(t || "").replace(/<[^>]+>/g, " ");
try {
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const parts = (q) => (q.parts || []).map((p) => p.label).join(" / ");
const num = (t) => +String(t).replace(/\\text\{'\}|'/g, "").replace("{,}", ".").replace(",", ".");
const yrOf = (id) => (placeOf(NOTIONS.find((n) => n.id === id), state.profile) || [])[0];

/* ---- 1. Problème de la semaine : notion de l'année ---- */
const setAll = (st, f) => { for (const c of Engine.catalog(st.profile)) { const s = st.notions[c.id]; if (s) Object.assign(s, f(c.id)); } };
let n1 = 0;
for (const pr of [{ system: "CH", grade: 10, track: "college" }, { system: "CH", grade: 11, track: "college" }, { system: "FR", grade: 10, track: "lycee" }]) {
  for (const r of [700, 850, 1000, 1150, 1300, 1500]) {
    fresh(pr); setAll(state, () => ({ status: "vu", seen: 3, m: 0.8 })); state.elo.r = r; delete state.weeklyPick;
    const id = Engine.weeklyProblem(state); n1++;
    ok(id && yrOf(id) === pr.grade, "1 : " + pr.system + "-" + pr.grade + ", Mathélo " + r + " : Problème de la semaine " + id + "@" + (id && yrOf(id)) + " (reprise)");
  }
}
/* chapitre « en classe » : une notion de l'année du chapitre d'abord */
fresh({ system: "CH", grade: 10, track: "college" }); setAll(state, () => ({ status: "vu", seen: 3, m: 0.8 }));
{ const ch = ["aire3", "disque", "grandmanq", "vol", "airelat", "voldecomp"].filter((id) => state.notions[id] && hasProb(id)); delete state.weeklyPick; Engine.weeklyProblem(state); Engine.setNow(state, ch); /* choix fait avant le chapitre : refait */
  const id = Engine.weeklyProblem(state); ok(ch.includes(id) && yrOf(id) === 10, "1 : chapitre en classe " + ch.join(",") + " → " + id); }
log.push("1 : " + n1 + " profils");

/* ---- 2. jamais une notion non travaillée (hors chapitre en classe) ---- */
let n2 = 0;
for (const pr of [{ system: "FR", grade: 6, track: "college" }, { system: "CH", grade: 9, track: "college" }, { system: "CH", grade: 10, track: "college" }]) {
  for (let k = 0; k < 6; k++) {
    fresh(pr); setAll(state, (id) => { const w = (id.length + k) % 3 === 0; return w ? { status: "vu", seen: 2, m: 0.7 } : { status: "encours", seen: 0, m: 0.4, lessonSeen: false }; }); delete state.weeklyPick;
    const id = Engine.weeklyProblem(state); n2++;
    if (id) ok(state.notions[id].seen > 0 && state.notions[id].m > 0, "2 : " + pr.system + "-" + pr.grade + " : Problème sur une notion jamais travaillée (" + id + ")");
  }
  fresh(pr); setAll(state, () => ({ status: "encours", seen: 0, m: 0.4 })); delete state.weeklyPick;
  ok(Engine.weeklyProblem(state) === null, "2 : " + pr.system + "-" + pr.grade + " : rien de travaillé, pas de Problème");
}
log.push("2 : " + n2 + " états");

/* tirages de défis */
const draws = (pr, id, d, n, f) => { fresh(pr); for (let k = 1; k <= n; k++) { const q = Engine.make(state, id, d); if (q) f(q, k); } };
const MP2 = { system: "CH", grade: 13, track: "mp" }, C1 = { system: "CH", grade: 12, track: "college" }, C2 = { system: "CH", grade: 13, track: "college" };

/* ---- 3. recipaff, forfait : (1 − m)x = p ---- */
let n3 = 0;
draws(MP2, "recipaff", 4, 120, (q) => { const m = /f\(x\) = ([\d{},.]+)x \+ (\d+)/.exec(q.sol || ""); if (!m) return; n3++; const mm = num(m[1]), p = +m[2];
  const c = new RegExp("x \\\\iff (-?[\\d{},.]+)x = (-?\\d+) \\\\iff x = ").exec(q.sol); ok(c && Math.abs(num(c[1]) - (1 - mm)) < 1e-9 && +c[2] === p, "3 : recipaff " + q.code + " : " + strip(q.sol).slice(-90)); });
ok(n3 > 10, "3 : recipaff forfait peu tiré (" + n3 + ")");

/* ---- 4. similmp, maquette : façade = L·h, volume = L·l·h, toit = L·l ---- */
let n4 = 0;
draws(MP2, "similmp", 4, 150, (q) => { if (q.ctx !== "maquette") return; n4++;
  const k = +/1\\,:\\,(\d+)/.exec(q.q)[1], vals = q.parts.map((p) => p.spec.value), B = num(/toit réel a une aire de \\\(([\d\\{}',text]+)/.exec(q.parts[2].label)[1]);
  const [Af, V, Bm] = vals, h = V / B, L = Af / h, l = B / L;
  ok(h >= 5 && h <= 30 && L >= 10 && L <= 60 && l >= 6 && l <= L && Math.abs(Bm - (B * 1e4) / (k * k)) < 1e-6, "4 : maquette incohérente " + q.code + " : L = " + L + ", l = " + l + ", h = " + h); });
ok(n4 > 10, "4 : maquette peu tirée (" + n4 + ")");

/* ---- 5. ensembles : camp et club indépendants ---- */
let n5 = 0;
for (const pr of [C1, { system: "FR", grade: 10, track: "lycee" }]) draws(pr, "ensembles", 4, 80, (q) => { if (q.ctx !== "ages") return; n5++; ok(!/tarif/.test(q.q + parts(q)), "5 : " + q.code + " « " + strip(q.q).slice(0, 120) + " »"); });
ok(n5 > 5, "5 : forme âges peu tirée (" + n5 + ")");

/* ---- 6. pct : pas de pourcentages successifs avant la 3e FR ni en 9e CO ; recalcul des nouvelles formes ---- */
const cnt6 = {};
for (const [pr, succOk] of [[{ system: "FR", grade: 6, track: "college" }, false], [{ system: "FR", grade: 8, track: "college" }, false], [{ system: "CH", grade: 9, track: "college" }, false], [{ system: "FR", grade: 9, track: "college" }, true], [{ system: "CH", grade: 10, track: "college" }, true]]) {
  const key = pr.system + "-" + pr.grade; cnt6[key] = {};
  draws(pr, "pct", 4, 120, (q) => { cnt6[key][q.ctx] = (cnt6[key][q.ctx] || 0) + 1; const t = strip(q.q + " " + parts(q));
    if (!succOk) ok(!/^succ-/.test(q.ctx || "") && !/puis (?:il )?baisse|Variation globale|carte d'étudiant|carte jeune/.test(t), "6 : " + key + " : pourcentages successifs (" + q.code + ", " + q.ctx + ")");
    const v = q.parts.map((p) => p.spec.value);
    if (q.ctx === "remise") { const r = +/de \\\((\d+)\\,\\%/.exec(q.q)[1], [P0, Q0] = [...q.q.matchAll(/affiché à \\\((\d+)\\\)/g)].map((m) => +m[1]); ok(v[0] === (P0 * r) / 100 && v[1] === P0 - (P0 * r) / 100 && Math.abs(v[2] - ((P0 + Q0) * (100 - r)) / 100) < 1e-9, "6 : remise " + q.code); }
    if (q.ctx === "part-total") { const N = +/les \\\((\d+)\\\) élèves/.exec(q.q)[1], p = +/(\d+)\\,\\%/.exec(q.q)[1], G = +/cordées de (\d+)/.exec(parts(q))[1]; ok(v[0] === (N * p) / 100 && v[1] === N - v[0] && v[2] === v[0] / G && Number.isInteger(v[2]), "6 : part " + q.code); }
    if (q.ctx === "composition") { const m0 = +/de \\\((\d+)\\\) g/.exec(q.q)[1], p = +/(\d+)\\,\\%/.exec(q.q)[1], [, k, por] = /dans (\d+) portions de (\d+) g/.exec(parts(q)).map(Number); ok(v[0] === (m0 * p) / 100 && v[1] === m0 - v[0] && v[2] === (k * por * p) / 100, "6 : composition " + q.code); }
  });
  if (succOk) ok(Object.keys(cnt6[key]).some((c) => /^succ-/.test(c)), "6 : " + key + " : plus de pourcentages successifs");
  ok(Object.keys(cnt6[key]).length >= 3, "6 : " + key + " : moins de 3 formes (" + Object.keys(cnt6[key]) + ")");
}
log.push("6 : " + JSON.stringify(cnt6["FR-6"]));

/* ---- 7. colonBreak : pas de majuscule à une variable ---- */
for (const [s, bad, good] of [["Le double produit vaut 2k = 8 : k = 4", /K = 4/, /<br>k = 4/], ["On a k² = 36 : k = 6", /K = 6/, /k = 6/], ["x = 3 : la solution est 3", null, /<br>La solution/], ["On pose t = 2 : f(t) = 5", /F\(t\)/, /f\(t\) = 5/]]) {
  const o = colonBreak(s); ok((!bad || !bad.test(o)) && good.test(o), "7 : colonBreak « " + s + " » → « " + o + " »"); }

/* ---- 8. fracrat evidence : c) pas déjà répondue par b) ---- */
let n8 = 0;
draws(MP2, "fracrat", 4, 200, (q) => { const b = /F\((-?\d+)\)/.exec(q.parts[1] ? q.parts[1].label : ""); if (q.ctx !== "evidence" || !b) return; n8++; ok(+b[1] !== q.parts[2].spec.value, "8 : fracrat " + q.code + " : c) = " + b[1] + " déjà donné en b)"); });
ok(n8 > 5, "8 : forme evidence peu tirée (" + n8 + ")");

/* ---- 9. stats vélo : cyclistes seulement ---- */
for (const pr of [{ system: "CH", grade: 15, track: "college" }, { system: "CH", grade: 14, track: "college" }]) draws(pr, "stats", 4, 150, (q) => { if (q.ctx === "velo") ok(!/traileuse|ski de fond/.test(q.q), "9 : " + q.code + " « " + strip(q.q).slice(0, 60) + " »"); });

/* ---- 11. corrigés ---- */
draws({ system: "CH", grade: 15, track: "mp" }, "logprop", 1, 80, (q) => { if (q.ctx === "difference") ok(/\\log_\{\d+\} \(\d+ \\div \d+\)/.test(q.sol), "11 : logprop " + q.code + " : parenthèses (" + q.sol.slice(0, 90) + ")"); });
draws({ system: "CH", grade: 15, track: "mp" }, "logprop", 2, 120, (q) => { if (q.ctx === "log2-donne") ok(!/10\^\{0\}|\+ 0 =/.test(q.sol), "11 : logprop " + q.code + " : « " + q.sol.slice(0, 120) + " »"); });
{ let nf = 0; draws({ system: "CH", grade: 15, track: "college" }, "integrale", 4, 120, (q) => { if (!/freine/.test(q.q)) return; nf++;
  q.parts.slice(0, 2).forEach((p) => { const ex = Math.abs(p.spec.value * 100 - Math.round(p.spec.value * 100)) < 1e-9; ok(!(ex && /au centième/.test(p.label)) && !(ex && p.spec.round), "11 : integrale " + q.code + " : « " + p.label + " » pour " + p.spec.value); });
  ok(!/= (\d+) \\approx \1 /.test(q.sol), "11 : integrale « = n ≈ n » " + q.code); }); log.push("11 : freinage " + nf); }
draws({ system: "FR", grade: 6, track: "college" }, "decread", 1, 120, (q) => { const m = /chiffre des (dizaines|unités) \?/.exec(q.q); if (m) ok(/À gauche de la virgule/.test(q.sol) && !/À droite/.test(q.sol), "11 : decread " + q.code + " : « " + strip(q.sol).slice(0, 60) + " »"); });

/* ---- 12. « Me tester » : formes de angtri ---- */
fresh({ system: "CH", grade: 10, track: "college" });
{ const r = Referentiel.find(state.profile, "31-FG1"), F = Referentiel.forms(r, "angtri"); ok(F && !F.includes("polygone") && !F.includes("nb-cotes") && F.includes("trapeze"), "12 : 31-FG1, formes de angtri " + F);
  const ps = Referentiel.plan(state.profile, r); ok(ps.some(([id]) => id === "angtri"), "12 : 31-FG1 sans angtri"); }

/* ---- 13. angles : coefficient 1 omis ---- */
draws({ system: "CH", grade: 11, track: "college" }, "angles", 3, 150, (q) => ok(!/\(1x/.test(q.q + " " + (q.fig || "") + " " + q.sol), "13 : « (1x » dans " + q.code));

/* ---- 14. libellés ---- */
ok(moneyTidy("Les notes de Yanis : 4") === "Les notes de Yanis : 4" && moneyTidy("le vélo de Yves") === "le vélo d'Yves" && moneyTidy("le compte de Elsa") === "le compte d'Elsa", "14 : élision « " + moneyTidy("Les notes de Yanis") + " » / « " + moneyTidy("le vélo de Yves") + " »");
draws({ system: "CH", grade: 15, track: "mp" }, "log", 4, 40, (q) => { if (/On place/.test(q.q)) ok(!/\\\(\d{4,}\\\) CHF/.test(q.q) && /\\text\{'\}000/.test(q.q), "14 : log « " + strip(q.q).slice(0, 50) + " »"); });
draws({ system: "CH", grade: 14, track: "college" }, "probaxiomes", 2, 150, (q) => { if (q.ctx === "jass" && /un 6, un 7 ou un 8|un dix ou un as/.test(q.q)) ok(/, ou bien (un 6|un dix)/.test(q.q), "14 : « " + strip(q.q).slice(-70) + " »"); });
{ const t = exactNote({ kind: "solset", ivs: [[-Infinity, false, 0, false]] }, "Résous x + 1 < 1."); ok((t.match(/∅/g) || []).length === 1, "14 : consigne ∅ en double : « " + t + " »"); }

/* ---- 15. séances courtes : élève sous la moyenne de la classe, jour du positionnement ---- */
fresh({ system: "FR", grade: 6, track: "college" }); state.elo.r = 760; state.last1 = [1, 1, 1, 1, 1, 1];
ok(Engine.autoN(state) === 4, "15 : Mathélo sous la classe : série de " + Engine.autoN(state));
state.elo.r = 1100; state.last1 = [1, 0, 1, 0, 0, 1, 1];
ok(Engine.autoN(state) === 4, "15 : moins de 70 % du premier coup : série de " + Engine.autoN(state));
state.last1 = [1, 1, 1, 1, 1, 1, 1, 1];
ok(Engine.autoN(state) === FORMATS.auto.slots.length, "15 : élève à l'aise : série de " + Engine.autoN(state));
fresh({ system: "FR", grade: 6, track: "college" }); setAll(state, () => ({ status: "vu", seen: 2, m: 0.8 })); state.placedOn = day();
{ let d = 0; for (let k = 0; k < 40; k++) if (Engine.chooseFormat(state) === "defi") d++; ok(d === 0, "15 : défi du jour le jour du positionnement (" + d + "/40)");
  state.today = { date: day(), f: "defi" }; ok(Engine.todayFormat(state) !== "defi", "15 : défi déjà tiré le jour du positionnement"); }

const out = [(fails.length ? "ÉCHEC " : "ok ") + "p6_26_11 : " + fails.length + " échec(s) · " + log.join(" · ")].concat(fails.slice(0, 40));
document.getElementById("out").textContent = out.join("\n");

} catch (e) { document.getElementById("out").textContent = "EXC " + e.message + "\n" + e.stack; }
</script>
