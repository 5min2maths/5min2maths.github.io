window.FRAME = P.has("cadre");
if (FRAME) {
  let s = 20261127; window.reseed = () => { s = 20261127; }; Math.random = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const D = Date, T0 = new D("2026-11-27T10:00:00").getTime(), t0 = D.now();
  class FD extends D { constructor(...a) { if (a.length) super(...a); else super(T0 + (D.now() - t0)); } static now() { return T0 + (D.now() - t0); } }
  window.Date = FD;
  try { localStorage.clear(); } catch (e) {}
  if (P.get("ecran")) try { localStorage.setItem("m2m-ui", JSON.stringify({ fs: 1, vib: true, ecran: P.get("ecran") })); } catch (e) {}
  window.fetch = () => Promise.resolve(new Response("{}")); if (navigator.sendBeacon) navigator.sendBeacon = () => true;
  window.confirm = () => true; window.alert = () => {}; window.ensurePacks = () => Promise.resolve();
  if (P.has("cap")) {

    document.write('<link rel="stylesheet" href="../docs/vendor/fonts/fonts.css"><script src="../docs/vendor/mathjax/tex-svg.js"><\/script>');
  } else { window.MathJax = { typesetPromise: () => Promise.resolve() }; Element.prototype.scrollIntoView = function () {}; }
}

<script>
const W_ = +P.get("w") || 1440, H_ = +P.get("h") || 900;
let TAILLES = [[1440, 900, "auto", "ordi"], [1280, 800, "auto", "ordi"], [1024, 768, "auto", "ordi"], [820, 1180, "tab", "tablette"], [1180, 820, "tab", "tablette"], [360, 640, "auto", "tel"], [1440, 900, "tel", "tel"], [1280, 800, "tab", "tablette"]];
if (!FRAME) {
  document.body.style.cssText = "margin:0;padding:0;background:#777";
  const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = "en cours";
  if (P.has("cap")) {
    /* capture : un cadre à la taille exacte (Chromium sans interface impose une fenêtre d'au moins 500 px) */
    document.body.innerHTML = '<iframe src="ecrans.html#cadre&' + location.hash.slice(1) + '" style="width:' + W_ + 'px;height:' + H_ + 'px;border:0;display:block"></iframe>';
  } else {
    document.body.appendChild(pre);
    const res = []; let k = 0;
    if (P.get("only")) TAILLES.splice(0, TAILLES.length, ...TAILLES.filter((t) => t.slice(0, 3).join(",").startsWith(P.get("only"))));
    const next = () => {
      if (k >= TAILLES.length) { const bad = res.filter((l) => /ÉCHEC|EXC/.test(l)); pre.textContent = bad.concat(res.filter((l) => !/ÉCHEC|EXC/.test(l))).join("\n") + "\n" + (bad.length ? bad.length + " ÉCHEC(S)" : "tout ok"); return; }
      const [w, h, e, cls] = TAILLES[k++], f = document.createElement("iframe");
      f.style.cssText = "width:" + w + "px;height:" + h + "px;border:0;display:block";
      f.src = "ecrans.html#cadre&run&w=" + w + "&h=" + h + "&ecran=" + e + "&cls=" + cls;
      const onm = (ev) => { if (ev.source !== f.contentWindow || typeof ev.data !== "string" || !ev.data.startsWith("ecr:")) return; removeEventListener("message", onm); res.push(...ev.data.slice(4).split("\n").filter(Boolean)); f.remove(); next(); };
      addEventListener("message", onm); document.body.insertBefore(f, pre);
    };
    next();
  }
} else window.addEventListener("load", () => {
  const W = innerWidth, H = innerHeight, tag = W + "×" + H + (P.get("ecran") !== "auto" ? " (" + P.get("ecran") + ")" : "") + " : ";
  const out = [], fail = [];
  const ok = (c, m) => (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + tag + m);
  const newSt = (g) => { g = g || 11; for (const k of Object.keys(UI)) if (!["fs", "vib", "ecran"].includes(k)) delete UI[k]; uiSave(); homeTab = "today"; state = Engine.newState({ system: "CH", grade: g, track: g >= 12 ? "college" : "co", minutes: 5 }); Engine.autoInit(state); state.tourDone = true; state.placed = true; state.homeVisits = 9; save(); };
  const opt = (o) => Object.assign({ eyebrow: "Séance · question 2 sur 5", onDone: () => 3, onNext: () => 0, track: "" }, o || {});
  const qWith = (pred) => { for (const n of NOTIONS) for (const d of [2, 1, 3]) { let q = null; try { q = Engine.build(n.id, d, 11); } catch (e) {} if (q && pred(q)) return Engine.finalize(state, n.id, q); } return null; };
  const SCR = {
    accueil: () => { newSt(); homeTab = "today"; screenHome(); },
    figure: () => { newSt(); renderQuestion(qWith((q) => q.fig && !q.parts && String(q.q).length > 60 && /<svg/.test(q.fig)), opt({ onNotYet: () => 0, onEasy: () => 0 })); },
    pave: () => { newSt(); renderQuestion(qWith((q) => !q.fig && !q.parts && q.spec && q.spec.kind === "value"), opt({ onNotYet: () => 0, onEasy: () => 0 })); },
    probleme: () => { newSt(); session = { plan: ["x"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), weekly: true }; let q = null; for (const n of NOTIONS) { if (!hasProb(n.id)) continue; try { q = Engine.make(state, n.id, 4); } catch (e) { q = null; } if (q && q.parts && q.parts.length >= 3 && String(q.q).length > 120) break; } renderQuestion(q, opt({ eyebrow: "🔍 Problème de la semaine" })); },
    lecon: () => { newSt(); screenLesson("fractout", () => {}); },
    bilan: () => { newSt(); session = { fmt: "revision", plan: ["eq1|1|rev", "eq1|1|rev", "eq1|1|rev", "eq1|1|rev"], i: 4, score: 3, answered: 4, start: Date.now() - 300000, elo0: state.elo.r - 12, ids: new Set(["eq1"]) }; screenSummary(); },
    progres: () => { newSt(); homeTab = "prog"; screenHome(); },
    competences: () => { newSt(); screenComps(); },
    reglages: () => { newSt(); screenSettings(); },
  };
  const show = (k) => { reseed(); session = null; document.querySelectorAll("#tour, .collector-bg").forEach((t) => t.remove()); SCR[k](); document.querySelectorAll("#tour, .collector-bg").forEach((t) => t.remove()); window.scrollTo(0, 0); };
  if (P.has("cap")) { try { show(P.get("cap")); } catch (e) { document.body.insertAdjacentHTML("afterbegin", "<pre>EXC " + e.message + "</pre>"); } return; }
  try {
    const H5 = document.documentElement;
    ok(H5.classList.contains("ecran-" + P.get("cls")), "classe ecran-" + P.get("cls") + " (" + H5.className + ")");
    /* signature de mise en page : position et taille de chaque élément affiché */
    const sig = () => { let x = 5381, n = 0; for (const el of document.body.querySelectorAll("*")) { const r = el.getBoundingClientRect(); if (!r.width && !r.height) continue; n++; for (const v of [r.left, r.top, r.width, r.height]) x = (Math.imul(x, 33) + Math.round(v * 2)) | 0; } return n + "/" + (x >>> 0).toString(36); };
    const sigs = {};
    for (const k of Object.keys(SCR)) {
      show(k);
      /* débordement horizontal : la page, et tout élément hors d'un conteneur à défilement */
      const bad = [];
      if (H5.scrollWidth > W + 1) bad.push("page " + H5.scrollWidth + " px");
      for (const el of document.body.querySelectorAll("#app *, .qbar *")) {
        const r = el.getBoundingClientRect(); if (!r.width || bad.length > 3) continue;
        if (r.right <= W + 1 && r.left >= -1) continue;
        let p = el.parentElement, clip = false; while (p && p !== document.body) { const o = getComputedStyle(p).overflowX; if (o !== "visible") { clip = true; break; } p = p.parentElement; }
        const shut = el.closest("details:not([open])"); /* contenu d'un <details> fermé : pas affiché */
        if (!clip && !el.closest(".sr-only") && !(shut && !el.closest("summary"))) bad.push((el.id || el.className || el.tagName) + " " + Math.round(r.left) + "→" + Math.round(r.right));
      }
      ok(!bad.length, k + " : rien ne déborde" + (bad.length ? " — " + bad.join(" | ") : ""));
      if (P.get("cls") === "ordi" && /figure|pave|probleme/.test(k)) {
        const a = document.querySelector("#ans, #p0"), c = document.getElementById("check"), ra = a.getBoundingClientRect(), rc = c.getBoundingClientRect();
        ok(ra.top >= 0 && ra.bottom <= H && rc.top >= 0 && rc.bottom <= H, k + " : réponse et « Vérifier » visibles sans défiler (" + Math.round(ra.bottom) + ", " + Math.round(rc.bottom) + " / " + H + ")");
        { const b = document.getElementById("qbar"), ans = document.querySelector(".q-r .answer"); ok(getComputedStyle(b).position !== "fixed" && !!b.closest(".q-r") && !!ans && b.getBoundingClientRect().top >= ans.getBoundingClientRect().top, k + " : barre d'action dans la colonne de réponse, sous la réponse, pas collée au bord de l'écran"); }
      }
      if (P.get("cls") === "tel") {
        const s1 = sig(); sigs[k] = s1;
        const cl = H5.className; H5.className = H5.className.replace(/\becran-\S+/g, "").trim(); show(k); const s0 = sig(); H5.className = cl;
        ok(s1 === s0, k + " : mise en page au pixel près sans classe d'écran (" + s1 + (s1 === s0 ? "" : " ≠ " + s0) + ")");
      }
    }
    /* mesures du 27.11 avant les affichages (master 2618068, mêmes tirages et même date) : info seulement, car tout
       changement de contenu les modifie ; le contrôle qui compte est la comparaison « sans classe d'écran » ci-dessus. */
    const AVANT = {"accueil":"79/gpx7s","figure":"87/a8v0ru","pave":"83/1dbjc1c","probleme":"102/ouodw0","lecon":"17/tswxgd","bilan":"37/2baz0o","progres":"164/1bevvct","competences":"804/hhl1i8","reglages":"50/p5edvz"};
    if (P.get("cls") === "tel" && W === 360) { const d = Object.keys(sigs).filter((k) => sigs[k] !== AVANT[k]); out.push("info " + tag + (d.length ? "différent des mesures du 27.11 (contenu changé depuis ?) : " + d.join(", ") : "identique aux mesures du 27.11 avant les affichages (" + Object.keys(sigs).length + " écrans)")); }
    /* option des Réglages : choix gardé (localStorage) et appliqué sans recharger */
    if (W >= 1024) {
      newSt(); screenSettings();
      const bs = [...document.querySelectorAll("#ecran button")];
      ok(bs.length === 4, "Réglages : 4 choix d'affichage (" + bs.length + ")");
      for (const [v, cls] of [["tab", "tablette"], ["tel", "tel"], ["ordi", "ordi"], ["auto", W >= 1024 ? "ordi" : "tel"]]) {
        const b = document.querySelector('#ecran button[data-v="' + v + '"]'); if (!b) continue; b.click();
        let saved = ""; try { saved = JSON.parse(localStorage.getItem("m2m-ui")).ecran; } catch (e) {}
        ok(H5.classList.contains("ecran-" + cls) && saved === v && document.querySelector('#ecran button[data-v="' + v + '"]').getAttribute("aria-pressed") === "true", "Réglages « " + v + " » → ecran-" + cls + ", gardé (" + saved + ")");
      }
      if (P.get("ecran") !== "auto") document.querySelector('#ecran button[data-v="' + P.get("ecran") + '"]').click();
    }
    /* détection automatique : largeur et pointeur (tactile = coarse) */
    if (W === 1440 && P.get("ecran") === "auto") {
      const C = [[360, true, "tel"], [412, true, "tel"], [699, true, "tel"], [768, true, "tab"], [820, true, "tab"], [1024, true, "tab"], [1180, true, "tab"], [1366, true, "tab"], [800, false, "tel"], [1023, false, "tel"], [1024, false, "ordi"], [1440, false, "ordi"]];
      const badA = C.filter(([w, c, e]) => ecranAuto(w, c) !== e).map(([w, c, e]) => w + (c ? " tactile" : " souris") + " → " + ecranAuto(w, c) + " (attendu " + e + ")");
      ok(!badA.length, "détection automatique : " + C.length + " cas" + (badA.length ? " — " + badA.join(" | ") : ""));
    }
  } catch (e) { fail.push("EXC " + tag + e.message + " " + (e.stack || "").split("\n")[1]); }
  parent.postMessage("ecr:" + fail.concat(out).join("\n"), "*");
});
