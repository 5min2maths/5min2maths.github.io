<meta charset="utf-8">
<!-- Audit de trivialité (règle du 14.11 : une question triviale fait décrocher) : tirages par notion × niveau,
     questions telles que l'élève les voit (Engine.build, filtre trivialQ compris), pourcentage de cas suspects (réponse 0 ou ±1, réponse lisible dans l'énoncé, coefficient 1, +0 / ×1, solutions doublées).
     chromium --headless --dump-dom "file://…/tests/trivial.html#n=300&seuil=3" -->
<pre id="out">en cours</pre>
<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script>
<script src="../src/expr.js"></script>
<script src="../src/figures.js"></script><script src="../src/geo.js"></script>
<script src="../src/generators.js"></script>
<script src="../src/gen2.js"></script>
<script src="../src/gen3.js"></script><script src="../src/variantes.js"></script><script src="../src/competences.js"></script><script src="../src/badges.js"></script><script src="../src/backup.js"></script><script src="../src/qr.js"></script>
<script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/dyn.js"></script>
<script src="../src/engine.js"></script>
<script>
const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 300), SEUIL = +(P.get("seuil") || 3), out = [];
const strip = (s) => String(s || "").replace(/<[^>]+>/g, " ").replace(/\\[a-zA-Z]+/g, " ").replace(/[{}\\$]/g, " ");
const res = [];
for (const id of Object.keys(GEN)) for (const d of [1, 2, 3]) {
  const flags = {}; let n = 0; const ex = {};
  for (let i = 0; i < N; i++) {
    let q; try { q = Engine.build(id, d, i + 1); } catch (e) { continue; } if (!q) continue; n++;
    const txt = strip(q.q), raw = String(q.q || ""), sp = q.spec || {};
    const add = (k) => { flags[k] = (flags[k] || 0) + 1; if (!ex[k]) ex[k] = txt.replace(/\s+/g, " ").slice(0, 140) + "  → " + JSON.stringify(sp.value ?? sp.values ?? sp.expr); };
    if (sp.kind === "value" && typeof sp.value === "number") {
      if (sp.value === 0) add("réponse 0");
      if (Math.abs(sp.value) === 1) add("réponse ±1");
      const nums = (txt.match(/-?\d+(?:[.,]\d+)?/g) || []).map((s) => +s.replace(",", "."));
      if (Number.isInteger(sp.value) && Math.abs(sp.value) > 1 && nums.includes(sp.value) && !/ces nombres|parmi|lequel|laquelle/i.test(raw)) add("réponse dans l'énoncé"); // questions à choix : la réponse est forcément dans la liste
    }
    if (sp.kind === "set" && Array.isArray(sp.values) && new Set(sp.values).size < sp.values.length) add("solutions doublées");
    if (/(^|[^\d.,{\w])-?\s*1[a-z](?![a-z{])/.test(raw.replace(/\\[a-zA-Z]+/g, " "))) add("écriture 1x"); // « 1 h 26 » (unité) n'est pas « 1x »
    if (/(^|[^\d.,])[+-]\s*0(?![\d.,])/.test(raw)) add("terme + 0");
    if (/\\cdot\s*1(?![\d.,])|×\s*1(?![\d.,])|\^\{?1\}?(?![\d.,])/.test(raw)) add("×1 ou ^1");
  }
  for (const k in flags) res.push({ id, d, k, pct: Math.round(100 * flags[k] / n), ex: ex[k] });
}
res.sort((a, b) => b.pct - a.pct);
for (const r of res) if (r.pct >= SEUIL) out.push(`${String(r.pct).padStart(3)} %  ${r.id}-${r.d}  [${r.k}]  ${r.ex}`);
out.push("\n" + Object.keys(GEN).length + " générateurs, " + N + " tirages par niveau");

document.getElementById("out").textContent = out.join("\n");
</script>
