<script>const log=[];const click=(s)=>{const e=document.querySelector(s);if(!e){log.push("MANQUE "+s);return false;} e.dispatchEvent(new MouseEvent("click",{bubbles:true}));return true;};
// Leçons actives 9e, chapitres 1 à 6 (act_9a.js) : Devine (bonne réponse), puis chaque défi avec la réponse attendue
// (tapée avec une virgule), après une réponse fausse qui ne doit pas valider. dec10 : compteur (on cherche en montant puis en descendant).
const ANS={decread:[3.407,528,23.91],deccomp:[2.75,0.095,3.071],decarr:[3.48,12.7,60],ordgr:[900,2000,180],decadd:[9.25,1.65,4.65],dec10:null,

const gfb=()=>document.querySelector('#gfb').textContent;
const type=(v)=>{const el=document.querySelector(".act-in");if(!el)return false;el.value=String(v).replace(".",",");click("[data-go]");return true;};
const seek=()=>{const b=gfb();for(let i=0;i<70;i++){click('[data-st="x"][data-d="1"]');if(gfb()!==b)return true;}for(let i=0;i<160;i++){click('[data-st="x"][data-d="-1"]');if(gfb()!==b)return true;}return false;};
const run=(id)=>{ try{ window.scrollTo=()=>{}; Element.prototype.scrollIntoView=function(){}; screenLesson(id,()=>{});
  const A=ACTIVE[id], X=actPrep(A); click('#pc button[data-i="'+A.predict.good+'"]'); const msgs=[];
  const idx=X.defis.map((d)=>A.defis.indexOf(d));
  for(let k=0;k<X.defis.length;k++){ const b=gfb();
    if(ANS[id]){ type(9999.5); if(gfb()!==b){msgs.push("défi "+(k+1)+" validé à tort");continue;} type(ANS[id][idx[k]]); if(gfb()===b) msgs.push("défi "+(k+1)+" ÉCHEC"); else msgs.push(gfb().slice(0,40)); }
    else { if(!seek()) msgs.push("défi "+(k+1)+" non trouvé"); else msgs.push(gfb().slice(0,40)); } }
  const html=document.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g,"").replace(/<pre id="log"[\s\S]*?<\/pre>/,""); const bad=/NaN|undefined|Infinity/.test(html);
  log.push(id+" ["+X.mode+"] : "+(document.getElementById("s3").hidden||bad||msgs.some((m)=>/ÉCHEC|tort|non trouvé/.test(m))?"ÉCHEC "+(bad?"(NaN/undefined) ":""):"OK")+" · "+msgs.join(" | "));
  }catch(e){log.push(id+" ERR "+e.stack)} };
for(const id of Object.keys(ANS)) run(id);
document.getElementById("log").hidden=false; document.getElementById("log").textContent=log.join("\n");</script>
