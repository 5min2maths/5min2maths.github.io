<script>
/* 26.11 (revue des élèves joués, 5e passage, tools/archive/revue_eleves_claude_26-11_p5.md) : un contrôle par point corrigé.
   1 (grave) : 4e FR, « Factorise x² − 100 » (différence de deux carrés = 3e) : formes de factor / développer hors programme
     de 5e–4e écartées (HORS_FR, src/fr_couv.js), y compris par une graine (carnet). Échouait avant la correction.
   2 : « Me tester » d'un objectif MP : formes de la notion rattachées à CET objectif (REF_MP.f, Referentiel.plan).
   3 : note 6 seulement avec une réponse de niveau ≥ 2 ou 5 réponses. 4 : pas de leçon avant le Problème de la semaine.
   5 : élève en grande difficulté : pas de défi du jour, jour 1 de 2 questions. 6 : pas de mise en équation en automatismes.
   7–14 : quartiles en France (indice, libellé), colonBreak, taxi, corrigé ordonné, « Mes compétences » à 360 px,
   notions consolidées sans le positionnement, « L » pour les litres, fraction exigée. */
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const fresh = (pr) => { state = Engine.newState({ ...pr, minutes: 5 }); Engine.autoInit(state); state.placed = true; return state; };
const FR = (g) => ({ system: "FR", grade: g, track: "college" });
const strip = (t) => String(t || "").replace(/<[^>]+>/g, " ");
try {
  /* ---- 1. factoriser / développer en 5e–4e FR ---- */
  const DIFF = /x\^\{?2\}?\s*-\s*\d+(?!\d|\s*x|\{)(?!,)|a\^2 - b\^2|différence de (?:deux )?carrés/;
  const BAD8 = ["diffcarres", "diffcarres2", "carre", "maximal", "cube", "trinome", "trinome-complete", "erreur", "parenthese"];
  let n1 = 0;
  for (const g of [7, 8]) {
    fresh(FR(g));
    for (const d of [1, 2, 3, 4]) for (let k = 1; k <= 40; k++) {
      for (const q of [Engine.make(state, "factor", d, k), Engine.make(state, "factor", d)]) {
        n1++;
        ok(!DIFF.test(String(q.q) + " " + (q.parts || []).map((p) => p.label).join(" ")) && !BAD8.includes(q.ctx), (g === 8 ? "4e" : "5e") + " FR, factor niveau " + d + " : " + q.code + " « " + strip(q.q).slice(0, 60) + " » (" + q.ctx + ")");
        if (g === 7) ok(q.ctx !== "lettre", "5e FR : factorisation par x (" + q.code + ")");
      }
      for (const q of [Engine.make(state, "distrib", d, k)]) {
        const bad = g === 7 ? ["negatif", "lettre", "double", "double2", "trinome", "difference", "deuxdev", "degre3"] : ["difference", "deuxdev", "degre3"];
        ok(!bad.includes(q.ctx), (g === 8 ? "4e" : "5e") + " FR, distrib niveau " + d + " : forme " + q.ctx + " (" + q.code + ")");
      }
    }
  }
  /* la 3e garde a² − b² ; la Suisse n'est pas touchée */
  fresh(FR(9)); { let m = 0; for (let k = 1; k <= 30; k++) if (Engine.make(state, "factor", 2, k).ctx === "diffcarres") m++; ok(m > 0, "3e FR : plus de différence de carrés"); }
  fresh({ system: "CH", grade: 11, track: "college" }); { let m = 0; for (let k = 1; k <= 30; k++) if (/diffcarres/.test(Engine.make(state, "factor", 2, k).ctx)) m++; ok(m > 0, "11e : plus de différence de carrés"); }
  log.push("1 : " + n1 + " questions");

  /* ---- 2. « Me tester » MP : formes de l'objectif ---- */
  const tester = (pr, code, bad, n) => {
    fresh(pr); const r = Referentiel.find(state.profile, code), ps = Referentiel.plan(state.profile, r), seen = [];
    ok(ps.length > 0, code + " : pas de question");
    for (let k = 0; k < n; k++) { const [id, d] = ps[k % ps.length], F = Referentiel.forms(r, id); let q = Engine.make(state, id, d);
      if (F) for (let j = 0; j < 60 && !F.includes(q.ctx); j++) q = Engine.make(state, id, d);
      seen.push(q.ctx); ok(!bad.test(strip(q.q)) && (!F || F.includes(q.ctx)), code + " : « " + strip(q.q).slice(0, 70) + " » (" + q.code + ", " + q.ctx + ")"); }
    return seen;
  };
  tester({ system: "CH", grade: 13, track: "mp" }, "S3.FA.01", /forfait|minutes|Pour quelles valeurs/, 24);
  tester({ system: "CH", grade: 15, track: "mp" }, "S7.CO.01", /espace|polaire|; z|\bz\b/, 24);
  tester({ system: "CH", grade: 15, track: "mp" }, "S7.CO.03", /polaire/, 12);
  { const s5 = tester({ system: "CH", grade: 13, track: "mp" }, "S3.FA.05", /^$/, 12); ok(s5.every((c) => !["pente", "graphe", "image-lue"].includes(c)), "S3.FA.05 : forme de définition " + s5.join(",")); }

  /* ---- 3. note 6 et badges ---- */
  ok(compNote({ r: [1, 1, 1], n: 3 }) === 5, "3 réponses de niveau 1 : note " + compNote({ r: [1, 1, 1], n: 3 }));
  ok(compNote({ r: [1, 1, 1], n: 3, hi: true }) === 6 && compNote({ r: [1, 1, 1, 1, 1], n: 5 }) === 6, "note 6 refusée avec preuves");
  fresh({ system: "CH", grade: 15, track: "mp" }); state.badges = {};
  for (let k = 0; k < 3; k++) Engine.recordComp(state, "coordmp", 1, 1);
  ok(!state.badges.expert, "badge Expert après 3 questions de niveau 1");
  { const r = Referentiel.find(state.profile, "S7.CO.01"); ok(Referentiel.note(state, r) === 5, "S7.CO.01 : note " + Referentiel.note(state, r)); }

  /* ---- 4. pas de leçon avant le Problème de la semaine ---- */
  {
    fresh({ system: "CH", grade: 13, track: "mp" }); Engine.setNow(state, ["f2"]); Object.assign(state.notions.f2, { status: "encours", seen: 0, lessonSeen: false, m: 0.3 });
    session = { plan: ["f2"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), weekly: true }; nextQuestion();
    ok(!/étape 1 sur|nouvelle notion|rappel de cours ·/i.test(app.querySelector(".eyebrow") ? app.querySelector(".eyebrow").textContent : ""), "problème de la semaine, chapitre en classe : leçon avant (" + (app.querySelector(".eyebrow") || {}).textContent + ")");
    Engine.setNow(state, []); state.now = null; Object.assign(state.notions.f2, { status: "encours", seen: 2, lessonSeen: false, m: 0.3 });
    session = { plan: ["f2"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), weekly: true }; nextQuestion();
    ok(!/étape 1 sur|nouvelle notion|rappel de cours ·/i.test((app.querySelector(".eyebrow") || {}).textContent || ""), "problème de la semaine, notion déjà vue : leçon avant");
  }

  /* ---- 5. élève en grande difficulté : pas de défi ; jour 1 court ---- */
  {
    fresh({ system: "CH", grade: 9, track: "college" }); state.last1 = [0, 0, 1, 0, 0, 0, 0, 1]; state.formats = [];
    ok(Engine.struggling(state), "profil non reconnu en grande difficulté");
    let dz = 0; for (let k = 0; k < 40; k++) if (Engine.chooseFormat(state, [], addDays(day(), k % 5)) === "defi") dz++;
    ok(dz === 0, "élève en grande difficulté : " + dz + " défis du jour sur 40");
    state.tomorrow = null; state.today = null; state.tomorrow = { date: day(), f: "defi" };
    ok(Engine.todayFormat(state) !== "defi", "défi annoncé tenu pour un élève en grande difficulté");
    fresh({ system: "CH", grade: 9, track: "college" }); state.placedOn = day(); state.placeMiss = 3;
    for (const f of ["revision", "app", "auto", "mixte"]) ok(Engine.planSession(state, f).length <= 2, "jour 1 après 3 ratés : " + f + " de " + Engine.planSession(state, f).length);
  }

  /* ---- 6. automatismes : pas de mise en équation ---- */
  {
    fresh(FR(8)); let n6 = 0;
    for (let k = 1; k <= 20; k++) { const q = Engine.make(state, "probeq", 1, k); if (Engine.isDrill(q)) n6++; }
    ok(n6 === 0, "probeq accepté comme automatisme " + n6 + " fois");
    ok(!Engine.isDrill({ id: "eq1", q: "Un père a le triple de l'âge de son fils. Dans 10 ans, il aura le double de l'âge de son fils. Quel est l'âge du fils ?", spec: { kind: "value", value: 10 } }), "âge : automatisme");
  }

  /* ---- 7. quartiles en France : indice et libellé ---- */
  fresh(FR(8));
  ok(nLabel("quartiles") === "Étendue, médiane" && nLab("quartiles") === "Étendue, médiane", "4e FR : libellé « " + nLab("quartiles") + " »");
  for (let k = 1; k <= 20; k++) { const q = Engine.make(state, "quartiles", 1, k); ok(!/quartile|Q1|Q3|Q_1/i.test(String(q.hint) + " " + (q.hints || []).join(" ")), "4e FR, indice quartiles : " + q.hint); }
  fresh(FR(10)); ok(/quartile/i.test(Engine.make(state, "quartiles", 1, 3).hint || HINTS.quartiles), "2nde : indice des quartiles perdu");

  /* ---- 8. colonBreak : citation, majuscule ---- */
  {
    const a = colonBreak("« f(x) = 3x est une fonction linéaire : son graphe passe par l'origine. »"), b = colonBreak("« Le tableau x : 1, 2, 3 ; f(x) : 4, 6, 9 est celui d'une fonction affine. »");
    ok(!/<br>/.test(a) && !/<br>/.test(b), "colonBreak coupe dans une citation : " + a + " | " + b);
    const c = colonBreak("Sachant que :<br>\\(P(x) = x^3\\)<br>est divisible par \\(x - 4\\), donne le quotient.");
    ok(/<br>est divisible/.test(c), "majuscule au milieu d'une phrase : " + c);
    ok(/9\s:<br>117/.test(colonBreak("Divisibles par 9 : 117, 126.")) && /<br>/.test(colonBreak("x = 3 : on remplace.")), "colonBreak : coupures habituelles perdues");
    fresh({ system: "CH", grade: 13, track: "college" }); for (let k = 1; k <= 10; k++) { const q = Engine.make(state, "polydiv", 2, k); ok(!/Sachant que :|<br>Est /.test(q.q), "polydiv : " + q.q); }
  }

  /* ---- 9. pas à pas du taxi ---- */
  fresh({ system: "CH", grade: 11, track: "college" });
  { let seen = 0; for (let k = 1; k <= 120; k++) { const q = Engine.build("prio", 1, k); if (q.ctx !== "taxi") continue; seen++;
      const t = q.guide.map((g) => g.ask).join(" ") + " " + (q.traps || []).map((x) => x.m).join(" ");
      ok(!/éléments|nombre d'objets/.test(t) && / km/.test(q.guide[0].ask), "taxi : « " + strip(t).slice(0, 120) + " »"); }
    ok(seen > 0, "taxi jamais tiré"); }

  /* ---- 10. corrigé ordonné ---- */
  { let seen = 0; for (let k = 1; k <= 80; k++) { const q = Engine.build("idrem", 2, k); if (q.ctx !== "deuxlettres") continue; seen++;
      const s = String(q.sol); ok(s.indexOf("a^{2}") >= 0 && s.indexOf("a^{2}") < s.indexOf("ab") && s.indexOf("ab") < s.indexOf("b^{2}"), "corrigé non ordonné : " + s); }
    ok(seen > 0, "(a − b)² jamais tiré"); }

  /* ---- 11. « Mes compétences » MP : badges repliés après les objectifs ; « Me tester » compact ---- */
  {
    fresh({ system: "CH", grade: 13, track: "mp" }); screenCompsRef();
    const det = app.querySelector("details.bdg-sec"), first = app.querySelector(".rcomp");
    ok(det && !det.open && first && (first.compareDocumentPosition(det) & Node.DOCUMENT_POSITION_FOLLOWING), "badges non repliés ou avant les objectifs");
    const b = app.querySelector(".rtest[data-code='S3.FA.01']"); b.click();
    const eb = app.querySelector(".eyebrow").textContent;
    ok(!/fonction affine/.test(eb) && /Me tester/.test(eb) && /fonction affine/.test((app.querySelector(".eb-sub") || {}).textContent || ""), "en-tête de « Me tester » : " + eb);
  }

  /* ---- 12. notions consolidées : pas le positionnement ---- */
  {
    fresh(FR(8)); state.placed = false; state.snaps = [];
    Engine.recordComp(state, "rel", 2, 1); /* premier instantané pris pendant le positionnement */
    Object.keys(state.notions).slice(0, 8).forEach((id) => Object.assign(state.notions[id], { seen: 1, m: 0.75 }));
    Engine.snapPlaced(state);
    ok(Engine.week(state).cons.length === 0, "notions du positionnement comptées « consolidées » : " + Engine.week(state).cons.length);
  }

  /* ---- 13. litres : « L » ---- */
  { let n13 = 0; for (const c of CURIEUX) for (let k = 0; k < 6; k++) { let x; try { x = c.make(); } catch (e) { continue; } const t = JSON.stringify(x); n13++;
      ok(!/ℓ|\\\\ell|\d l\)| l par /.test(t), "curieux « " + c.key + " » : ℓ ou l pour les litres"); }
    ok(n13 > 100, "curieux : " + n13 + " tirages"); }

  /* ---- 14. fraction irréductible exigée ---- */
  ok(checkAnswer({ kind: "value", value: 15 / 16, frac: true }, "0,9375").status === "form" && checkAnswer({ kind: "value", value: 15 / 16, frac: true }, "15/16").status === "correct", "0,9375 accepté pour une fraction irréductible");
  fresh(FR(8)); { let m = 0; for (let k = 1; k <= 30; k++) { const q = Engine.make(state, "fracmul", 2, k); if (/fraction irréductible/.test(q.q) && !Number.isInteger(q.spec.value)) { m++; ok(q.spec.frac, "fracmul : spec.frac absent (" + q.code + ")"); } } ok(m > 0, "fracmul : aucune consigne « fraction irréductible »"); }
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.length + " · " + fails.slice(0, 14).join("\n") : "ok revue p5 (14 points) : " + log.join(" | ");
</script>
