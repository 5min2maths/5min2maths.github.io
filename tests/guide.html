<script>
// Simulation : un élève en difficulté se trompe deux fois sur Pythagore (additionne les côtés), puis suit le pas à pas.
const q = Engine.build("pyth", 1, 3), n = q.q.match(/\d+/g).map(Number);
renderQuestion(q, { eyebrow: "Démonstration", onDone: () => -8, onNext: () => {} });
const ans = document.getElementById("ans"), chk = document.getElementById("check");
ans.value = String(n[0] + n[1]); chk.click();
const first = document.getElementById("fb").innerText;
ans.value = String(n[0] + n[1]); chk.click();
document.getElementById("guide").click();
const steps = location.hash === "#all" ? q.guide.length : 2;
for (let k = 0; k < steps; k++) { const i = document.querySelectorAll(".gin")[k]; i.value = k === 1 ? "999" : String(q.guide[k].spec.value); i.closest(".gstep").querySelector(".gok").click(); }
document.title = first;
window.scrollTo(0, document.body.scrollHeight);
</script>
