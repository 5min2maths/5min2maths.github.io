src/dyn.js"></script><script src="../src/engine.js"></script><script src="../src/app.js"></script>
<script src="lot.js"></script>
<script>
/* ======== guide_fold (ancienne page tests/guide_fold.html) ======== */
Lot.section("guide_fold", { html: `<main id="app"></main><pre id="log"></pre>`, body: "width:420px" }, function () {
// Simulation : un élève en difficulté se trompe deux fois sur Pythagore (additionne les côtés), puis suit le pas à pas.
const q = Engine.build("vitesse", 2, 7);
renderQuestion(q, { eyebrow: "Démonstration", onDone: () => -8, onNext: () => {} });
const ans = document.getElementById("ans"), chk = document.getElementById("check");
document.getElementById("idk").click();
const first = "";
document.getElementById("guide").click();
const steps = 1;
for (let k = 0; k < steps; k++) { const i = document.querySelectorAll(".gin")[k]; i.value = String(q.guide[k].spec.value).replace(".", ","); i.closest(".gstep").querySelector(".gok").click(); }
document.title = first;
const A = document.querySelector(".card .answer"), T = document.querySelector(".fold-toggle"), Ls = document.querySelector("details.lesson");
document.getElementById("log").textContent = "réponse repliée : " + (A.style.display === "none") + " · bouton : " + (T ? T.textContent : "ABSENT") + " · rappel replié : " + (!Ls || Ls.style.display === "none") + " · étapes : " + document.querySelectorAll(".gstep").length;
T.click(); const l2 = " · après clic : " + (A.style.display !== "none") + " / " + T.textContent; T.click();
document.getElementById("log").textContent += l2 + " · re-replié : " + (A.style.display === "none");
});
/* ======== guide_fold2 (ancienne page tests/guide_fold2.html) ======== */
Lot.section("guide_fold2", { html: `<main id="app"></main><pre id="log"></pre>`, body: "width:420px" }, function () {
// Simulation : un élève en difficulté se trompe deux fois sur Pythagore (additionne les côtés), puis suit le pas à pas.
const q = (()=>{for(let s=1;s<200;s++){const q=Engine.build("reduire",1,s); if(/a/.test(q.spec.expr)&&/b/.test(q.spec.expr)) return q;}})();
renderQuestion(q, { eyebrow: "Démonstration", onDone: () => -8, onNext: () => {} });
const ans = document.getElementById("ans"), chk = document.getElementById("check");
document.getElementById("idk").click();
const first = "";
document.getElementById("guide").click();
const steps = 1; document.querySelector(".gin");
for (let k = 0; k < steps; k++) { const i = document.querySelectorAll(".gin")[k]; i.value = q.guide[k].spec.expr || String(q.guide[k].spec.value).replace(".", ","); i.closest(".gstep").querySelector(".gok").click(); }
document.title = first;
const KP = [...document.querySelectorAll(".gstep .keypad button")].map(b=>b.dataset.k).join(" "); const A = document.querySelector(".card .answer"), T = document.querySelector(".fold-toggle"), Ls = document.querySelector("details.lesson");
 document.getElementById("log").textContent = "clavier de l'étape 2 : " + KP + " · réponse repliée : " + (A.style.display === "none") + " · bouton : " + (T ? T.textContent : "ABSENT") + " · rappel replié : " + (!Ls || Ls.style.display === "none") + " · étapes : " + document.querySelectorAll(".gstep").length;
T.click(); const l2 = " · après clic : " + (A.style.display !== "none") + " / " + T.textContent; T.click();
document.getElementById("log").textContent += l2 + " · re-replié : " + (A.style.display === "none");
});
/* ======== guide (ancienne page tests/guide.html) ======== */
Lot.section("guide", { html: `<main id="app"></main>`, apercu: true }, function () {
// Simulation : un élève en difficulté se trompe deux fois sur Pythagore (additionne les côtés), puis suit le pas à pas.
const q = Engine.build("pyth", 1, 3), n = q.q.match(/\d+/g).map(Number);
renderQuestion(q, { eyebrow: "Démonstration", onDone: () => -8, onNext: () => {} });
const ans = document.getElementById("ans"), chk = document.getElementById("check");
ans.value = String(n[0] + n[1]); chk.click();
const first = document.getElementById("fb").innerText;
ans.value = String(n[0] + n[1]); chk.click();
document.getElementById("guide").click();
const steps = location.hash === "#all" ? q.guide.length : 2;
for (let k = 0; k < steps; k++) { const i = document.querySelectorAll(".gin")[k]; i.value = k === 1 ? "999" : String(q.guide[k].spec.value); i.closest(".gstep").querySelector(".gok").click(); }
document.title = first;
window.scrollTo(0, document.body.scrollHeight);
});
/* ======== code2 (ancienne page tests/code2.html) ======== */
Lot.section("code2", { html: `<main id="app"></main>`, apercu: true }, function () {
// #q-CODE : question ; #l-ID : rappel de cours
const k = location.hash.slice(1);
if (k.startsWith("l-")) h(`<div class="card pop lesson-card"><h2>${LESSONS[k.slice(2)].titre}</h2>${lessonBody(k.slice(2))}</div><pre>${JSON.stringify(LESSONS[k.slice(2)], null, 1).replace(/</g, "&lt;")}</pre>`);
else if (k.startsWith("g-")) { const [, id, d] = k.split("-"); const q = Engine.make(Engine.newState({ system: "CH", grade: 12, track: "college", minutes: 5 }), id, +d); renderQuestion(q, { eyebrow: "aperçu", onDone: () => 0, onNext: () => {} }); }
else { location.hash = "#q-" + k; showCode(); }
});
/* ======== dyn (ancienne page tests/dyn.html) ======== */
Lot.section("dyn", { html: `<main id="app"></main>`, apercu: true }, function () {
h(`<div class="card pop lesson-card"><h2>${LESSONS.optim.titre}</h2>${lessonBody("optim")}</div>`); const v = location.hash.slice(1); if (v) { const i = app.querySelector(".dyn input"); i.value = v; i.oninput(); }
});
Lot.lance();
</script>
