<script>
// Erreurs JS (23.11, chantier N) : rien ne part hors https ; ligne envoyée ; anti-déluge (1 fois par message et par jour, 5 par jour).
const fails = [], posts = [];
const ok = (c, m) => { if (!c) fails.push(m); };
window.fetch = (url, opt) => { posts.push(JSON.parse(opt.body)); return Promise.resolve(); };
const oui = () => true;
let fin = false;
try {
  state = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
  // 1. pages de test (file://) : envoi interdit, même par les écouteurs
  ok(location.protocol !== "https:" && errCanSend() === false, "1 errCanSend hors https");
  window.dispatchEvent(new ErrorEvent("error", { message: "Boum", filename: "file:///x/app.js", lineno: 3, colno: 4, error: new Error("Boum") }));
  ok(errReport("Boum", "app.js", 1, 1, "") === null, "1 errReport hors https");
  // 2. une vraie erreur (planifiée) ne doit rien envoyer non plus ; vérifié à la fin
  setTimeout(() => { undefinedFunctionXYZ(); }, 0);
  Promise.reject(new Error("rejet de test"));
  // 3. ligne envoyée (envoi forcé)
  screenHome();
  const st = "TypeError: a is undefined\n    at f (https://5min2maths.github.io/index.html?v=3:1234:56)\n    at g (https://5min2maths.github.io/index.html:99:1)\n    at h (index.html:5:5)\n    at i (index.html:6:6)";
  const r = errReport("TypeError: a is undefined " + "x".repeat(300), "https://5min2maths.github.io/sub/index.html?v=3#q", 1234, 56, st, oui);
  ok(r && r.ev === "err" && posts.length === 1, "3 envoi " + JSON.stringify(r));
  ok(r.msg.length === 200, "3 message tronqué " + r.msg.length);
  ok(r.src === "index.html" && r.ligne === 1234 && r.col === 56, "3 fichier court " + r.src);
  ok(r.pile.split(" | ").length === 3 && !/https?:|github/.test(r.pile), "3 pile " + r.pile);
  ok(r.version === BUILD && r.dev === deviceId() && r.date === day() && /^page-/.test(r.ecran) && r.niveau, "3 champs " + JSON.stringify(r));
  ok(errFile("https://5min2maths.github.io/") === "page" && errFile("") === "" && errFile("https://a.b/c/x.js?v=1") === "x.js", "3 errFile");
  // 4. même message le même jour : une seule fois
  ok(errReport("TypeError: a is undefined " + "x".repeat(300), "index.html", 1, 1, "", oui) === null && posts.length === 1, "4 doublon envoyé");
  // 5. bruit : extensions, Script error. sans fichier, réseau
  ok(errReport("Script error.", "", 0, 0, "", oui) === null, "5 Script error.");
  ok(errReport("x is null", "chrome-extension://abc/content.js", 1, 1, "", oui) === null, "5 extension (fichier)");
  ok(errReport("x is null", "", 0, 0, "at f (moz-extension://abc/c.js:1:1)", oui) === null, "5 extension (pile)");
  ok(errReport("Promesse rejetée : Failed to fetch", "", 0, 0, "", oui) === null, "5 réseau");
  // 6. plafond : 5 envois par jour au plus
  for (let k = 0; k < 8; k++) errReport("Erreur " + k, "index.html", k, 1, "", oui);
  ok(posts.length === 5, "6 plafond " + posts.length);
  // 7. jour suivant : compteur remis à zéro
  const m = JSON.parse(localStorage.getItem("m2m-err")); m.d = "2000-01-01"; localStorage.setItem("m2m-err", JSON.stringify(m));
  ok(errReport("Erreur 0", "index.html", 1, 1, "", oui) && posts.length === 6, "7 nouveau jour");
  // 8. appareil de l'auteur : rien
  localStorage.setItem("m2m-auteur", "1"); ok(errCanSend() === false, "8 auteur"); localStorage.removeItem("m2m-auteur");
  // 9. le rapporteur ne lève jamais d'erreur
  ok(errReport(undefined, undefined, undefined, undefined, undefined, oui) === null, "9 vide");
} catch (e) { fails.push("exception " + e.message + " " + e.stack); }
setTimeout(() => {
  ok(posts.length === 6, "2 une erreur réelle hors https a été envoyée (" + posts.length + ")");
  document.getElementById("out").textContent = (fails.length ? "ÉCHEC\n" + fails.join("\n") : "OK " + posts.length + " envois simulés") + "\n" + JSON.stringify(posts[0]);
}, 300);
</script>
