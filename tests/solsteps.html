<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script>

<script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/dyn.js"></script>
<script src="../src/engine.js"></script>
<script>
const out = [], per = { 1: [0, 0], 2: [0, 0], 3: [0, 0] }, sans = {};
for (const id of (location.hash ? location.hash.slice(1).split(",") : Object.keys(GEN))) for (const d of [1, 2, 3]) for (let i = 1; i <= 40; i++) {
  let q; try { q = Engine.build(id, d, i); } catch (e) { continue; }
  if (q.guide) continue;
  const p = splitSol(q.sol); per[d][1]++; if (p) per[d][0]++; else sans[id + "-" + d] = (sans[id + "-" + d] || 0) + 1;
  if (p && i === 1 && out.length < (location.hash ? 40 : 12)) out.push(id + "-" + d + " : " + p.map((x) => x.replace(/<[^>]+>/g, "")).join("  ‖  "));
}
out.unshift("Découpés : " + [1, 2, 3].map((d) => "niveau " + d + " " + Math.round(100 * per[d][0] / per[d][1]) + " %").join(", "),
  "Jamais découpés : " + Object.keys(sans).filter((k) => sans[k] === 40).length + " générateurs-niveaux", "");
document.getElementById("out").textContent = out.join("\n");
</script>
