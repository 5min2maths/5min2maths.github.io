/* 27.11 (tests à deux niveaux, niveau rapide : tools/tests_rapides.txt) : page « fumée ». Dans un cadre de 360 × 640 puis
   de 1440 × 900, ouvre les écrans principaux par les vraies fonctions de l'app (accueil, séance → première question,
   bilan, À polir (carnet), Réglages, Progrès, présentation parents, espace parent vide, aperçu parent) pour une classe
   suisse et une classe française, et vérifie : aucune erreur JS (window.onerror, promesses rejetées, exceptions),
   écran non vide, pas de débordement horizontal. Volontairement large et peu profonde : la suite complète de la nuit
   fait le reste. */
const FRAME = location.hash.startsWith("#cadre");
if (!FRAME) {
  document.write('<pre id="out">en cours</pre>');
  const T = [[360, 640], [1440, 900]], res = []; let k = 0;
  const next = () => {
    if (k >= T.length) { const bad = res.filter((l) => /ÉCHEC|EXC/.test(l)); document.getElementById("out").textContent = bad.concat(res.filter((l) => !/ÉCHEC|EXC/.test(l))).join("\n") + "\n" + (bad.length ? bad.length + " ÉCHEC(S)" : "tout ok"); return; }
    const [w, hh] = T[k++], f = document.createElement("iframe");
    f.style.cssText = "width:" + w + "px;height:" + hh + "px;border:0;display:block"; f.src = "fumee.html#cadre";
    const onm = (ev) => { if (ev.source !== f.contentWindow || typeof ev.data !== "string" || !ev.data.startsWith("fum:")) return; removeEventListener("message", onm); res.push(...ev.data.slice(4).split("\n").filter(Boolean)); f.remove(); next(); };
    addEventListener("message", onm); document.body.appendChild(f);
  };
  next();
} else {
  window.__errs = [];
  addEventListener("error", (e) => window.__errs.push(String(e.message) + " " + String(e.filename || "").split("/").pop() + ":" + e.lineno));
  addEventListener("unhandledrejection", (e) => window.__errs.push("promesse : " + String(e.reason && e.reason.message || e.reason)));
  window.MathJax = { typesetPromise: () => Promise.resolve() }; Element.prototype.scrollIntoView = function () {};
  try { localStorage.clear(); } catch (e) {}
  window.fetch = () => Promise.resolve(new Response("{}")); if (navigator.sendBeacon) navigator.sendBeacon = () => true;
  window.confirm = () => true; window.alert = () => {}; window.ensurePacks = () => Promise.resolve();
  document.head.insertAdjacentHTML("beforeend", "<style>*, *::before, *::after { animation: none !important; transition: none !important; }</style>");
}
</script>

<script>
if (FRAME) addEventListener("load", async () => {
  const W = innerWidth, out = [], fail = [];
  const ok = (c, m) => (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + W + " px : " + m);
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const newSt = (p) => { homeTab = "today"; session = null; state = Engine.newState(Object.assign({ minutes: 5 }, p)); Engine.autoInit(state); state.tourDone = true; state.placed = true; state.homeVisits = 9; save(); };
  const ids = () => Engine.catalog(state.profile).map((x) => x.id).filter((id) => GEN[id] && !isPrimId(id));
  const PROFS = [["11e", { system: "CH", grade: 11, track: "college" }], ["4e France", { system: "FR", grade: 8, track: "college" }]];
  const ECR = {
    accueil: () => { homeTab = "today"; screenHome(); },
    "séance (1re question)": () => { startSession(); if (!session || !app.querySelector("input, button.opt, .keypad, .lesson, [data-lesson], .choice, .opts button")) throw new Error("ni question ni leçon à l'écran"); },
    bilan: () => { const id = ids()[0]; session = { fmt: "revision", plan: [id + "|1|rev", id + "|1|rev", id + "|1|rev"], i: 3, score: 2, answered: 3, start: Date.now() - 300000, elo0: state.elo.r - 10, ids: new Set([id]) }; screenSummary(); },
    "À polir (carnet)": () => { const L = ids(); for (const id of L.slice(0, 3)) { const q = Engine.make(state, id, 2); carnetAdd(id, 2, q.code); } save(); homeTab = "carnet"; screenHome(); if (!app.querySelector(".carnet-card")) throw new Error("page À polir sans ses pépites"); startCarnet(); if (!session || !session.carnet) throw new Error("séance À polir non lancée"); },
    Réglages: () => { screenSettings(); },
    Progrès: () => { homeTab = "prog"; screenHome(); },
    "présentation parents": () => { screenParents(); },
    "espace parent vide": () => { screenParentEmpty(); },
    "aperçu parent": async () => { await screenParentShare(); await pause(300); const b = document.getElementById("ppreview"); if (!b) throw new Error("bouton d'aperçu absent"); b.onclick(); await pause(600); },
  };
  for (const [tag, p] of PROFS) {
    newSt(p);
    for (const [k, f] of Object.entries(ECR)) {
      const e0 = window.__errs.length;
      try { document.querySelectorAll("#tour, .collector-bg").forEach((t) => t.remove()); await f(); await pause(30); }
      catch (e) { fail.push("ÉCHEC " + W + " px : " + tag + ", " + k + " : EXC " + e.message); continue; }
      const err = window.__errs.slice(e0), txt = app.textContent.trim(), D = document.documentElement;
      ok(!err.length && txt.length > 20 && D.scrollWidth <= D.clientWidth + 1, tag + ", " + k + (err.length ? " : erreur JS " + err.slice(0, 2).join(" | ") : txt.length <= 20 ? " : écran vide" : D.scrollWidth > D.clientWidth + 1 ? " : débordement horizontal " + D.scrollWidth + " / " + D.clientWidth : ""));
      session = null; window.scrollTo(0, 0);
    }
  }
  parent.postMessage("fum:" + fail.concat(out).join("\n"), "*");
});
