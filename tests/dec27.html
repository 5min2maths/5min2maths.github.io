<script>
/* Décisions de l'enseignant du 27.11 après-midi (tools/archive/a_decider_26-11.md) : n° 33 ownYear, 15 eq3 hors France, 17 nombre
   dérivé de x³ et √x « par la définition » hors France, 18 « antécédent de 0 » en 4e–3e FR, 22 « Me tester » par forme,
   24 défi de 2–3 parties pour un élève faible, 25 « carte jeune », 26 polygones réguliers → 31-FG2 ; et corrigé cart
   niveau 3 sans « (x + 0) ». Chaque contrôle échoue sans la correction correspondante. */
const out = [], fail = [], ok = (c, m) => (c ? out : fail).push((c ? "ok " : "ÉCHEC ") + m);
const idOf = (e) => String(e).split("|")[0];
const P = (system, grade, track) => ({ system, grade, track: track || "college", minutes: 5 });
const txt = (q) => JSON.stringify([q.q, q.sol, q.hint, q.hints, (q.parts || []).map((p) => p.label), (q.guide || []).map((g) => g.ask), (q.traps || []).map((t) => t.m)]);
try {
  /* ---------- 33. ownYear : seulement une notion de l'année déjà travaillée ---------- */
  {
    const prof = P("CH", 10), st = Engine.newState(prof); Engine.autoInit(st); state = st;
    const yr = (id) => { const n = NOTIONS.find((x) => x.id === id), pl = n && placeOf(n, prof); return pl ? pl[0] : 0; };
    const own = Object.keys(st.notions).filter((id) => yr(id) === 10 && GEN[id] && !NOTIONS.find((x) => x.id === id).prim);
    const prev = Object.keys(st.notions).filter((id) => yr(id) === 9 && GEN[id] && st.notions[id].status === "vu").slice(0, 4);
    own.forEach((id) => (st.notions[id].status = "avenir"));
    prev.forEach((id) => Object.assign(st.notions[id], { seen: 3, m: 0.7, lessonSeen: true, fails: 0 }));
    const [A, B] = own;
    Object.assign(st.notions[A], { status: "encours", seen: 0, m: 0.3, lessonSeen: false });
    const plan = prev.slice(0, 3).map((id) => id + "|2|rev"), nl = () => Object.assign(plan.slice(), { noLesson: true }); /* séance sans leçon (Révision) */
    let r = Engine.ownYear(st, nl(), "revision");
    ok(prev.length >= 3 && !r.map(idOf).includes(A), "33. notion de l'année jamais vue (" + A + ") : pas posée par ownYear (" + r.join(" ") + ")");
    Object.assign(st.notions[B], { status: "encours", seen: 2, m: 0.6, lessonSeen: true });
    r = Engine.ownYear(st, nl(), "revision");
    ok(r.map(idOf).includes(B) && !r.map(idOf).includes(A), "33. notion de l'année déjà travaillée (" + B + ") : posée (" + r.join(" ") + ")");
  }
  /* ---------- 15. eq3 hors du catalogue français ---------- */
  ok(!Engine.catalog(P("FR", 12)).some((n) => n.id === "eq3") && !Engine.catalog(P("FR", 11)).some((n) => n.id === "eq3"), "15. eq3 absent du catalogue France (1re, Tle)");
  ok(Engine.catalog(P("CH", 12)).some((n) => n.id === "eq3"), "15. eq3 gardé en 1re Collège");
  /* ---------- 17. nombre dérivé de x³ et √x par la définition : hors France ---------- */
  {
    const fr = { profile: P("FR", 11) }, ch = { profile: P("CH", 14) }, seen = new Set(), chSeen = new Set();
    for (let s = 1; s <= 80; s++) { const q = Engine.make(fr, "nbderive", 3, s); if (q) seen.add(q.ctx); const c = Engine.make(ch, "nbderive", 3, s); if (c) chSeen.add(c.ctx); }
    ok(!seen.has("definition-cube") && !seen.has("definition-racine") && seen.size > 0, "17. France 1re : ni x³ ni √x par la définition (" + [...seen].join(", ") + ")");
    ok(chSeen.has("definition-cube") || chSeen.has("definition-racine"), "17. Collège 3e : formes gardées (" + [...chSeen].join(", ") + ")");
  }
  /* ---------- 18. « antécédent de 0 » en 4e–3e françaises ---------- */
  {
    const t = "La courbe représente une fonction \\(f\\). Quel est son plus petit zéro ?";
    ok(/plus petit antécédent de 0/.test(frIdTxt("lectgraph", t, 8)) && !/zéro/.test(frIdTxt("lectgraph", t, 9)), "18. 4e–3e : « plus petit antécédent de 0 » (" + frIdTxt("lectgraph", t, 8) + ")");
    ok(/racine/.test(frIdTxt("lectgraph", t, 10)), "18. lycée : « racine » gardée");
    ok(frIdTxt("rel", "Signe du nombre le plus loin de zéro.", 8) === "Signe du nombre le plus loin de zéro." && frIdTxt("decadd", "Aligne les virgules (complète par des zéros).", 9) === "Aligne les virgules (complète par des zéros).", "18. le nombre zéro reste (« loin de zéro », « complète par des zéros »)");
    ok(/Combien 0 a-t-il d'antécédents par \\\(f\\\)/.test(frIdTxt("lectgraph", "Combien de zéros \\(f\\) a-t-elle ?", 9)), "18. « Combien de zéros f a-t-elle » → « Combien 0 a-t-il d'antécédents par f »");
    const bad = [];
    for (const g of [8, 9]) { const st = { profile: P("FR", g) }; for (const id of ["lectgraph", "fimg", "affine"]) for (const d of [1, 2, 3]) for (let s = 1; s <= 30; s++) { let q; try { q = Engine.make(st, id, d, s); } catch (e) { continue; } if (q && /[Zz]éros?/.test(txt(q))) bad.push(g + ":" + q.code); } }
    ok(!bad.length, "18. 4e–3e FR : aucun « zéro » d'une fonction dans lectgraph, fimg, affine (" + bad.slice(0, 5).join(" ") + ")");
    const ch = { profile: P("CH", 12) }; let chz = 0; for (let s = 1; s <= 40; s++) { const q = Engine.make(ch, "lectgraph", 1, s); if (q && /zéro/.test(txt(q))) chz++; }
    ok(chz > 0, "18. Suisse : « zéro » gardé (lectgraph 1re Collège)");
  }
  /* ---------- 22. « Me tester » ciblé par forme (Collège, France, CO) ---------- */
  {
    const c1 = P("CH", 12), f4 = P("FR", 8), f3 = P("FR", 9), co11 = P("CH", 11), co9 = P("CH", 9);
    const r1 = Referentiel.find(c1, "1.AL.02b"), r2 = Referentiel.find(f4, "4e.NC.03"), r3 = Referentiel.find(f3, "3e.PF.02"), r4 = Referentiel.find(co11, "33-EQ3"), r5 = Referentiel.find(co9, "34-CG6");
    ok(r1 && Referentiel.forms(r1, "idrem") && Referentiel.forms(r1, "idrem").join() === "completer", "22. 1re Collège : 1.AL.02b (reconnaître une identité) ne tire que « completer » d'idrem");
    ok(r2 && Referentiel.forms(r2, "sci") && Referentiel.forms(r2, "sci").includes("nm") && !Referentiel.forms(r2, "sci").includes("grand"), "22. 4e FR : 4e.NC.03 (préfixes) : conversions nano… seulement");
    ok(r3 && Referentiel.forms(r3, "linfn") && Referentiel.forms(r3, "linfn").every((c) => /^pourcentage|composition/.test(c)), "22. 3e FR : 3e.PF.02 (pourcentage d'évolution) : formes « pourcentage »");
    ok(r4 && !Referentiel.plan(co11, r4).some(([id]) => id === "probeq"), "22. CO : 33-EQ3 (2e degré) ne tire plus les problèmes du 1er degré de probeq");
    ok(r5 && Referentiel.forms(r5, "vol") && Referentiel.forms(r5, "vol").join() === "pave", "22. CO 9e : 34-CG6 (cube et pavé) : vol limité au pavé");
    /* tirage réel de « Me tester » : seulement les formes de l'objectif */
    const st = Engine.newState(c1); Engine.autoInit(st); const F = Referentiel.forms(r1, "idrem") || ["completer"]; let okF = 0;
    for (let k = 0; k < 6; k++) { let q = Engine.make(st, "idrem", 2); for (let j = 0; j < 60 && q && !F.includes(q.ctx); j++) q = Engine.make(st, "idrem", 2); if (q && F.includes(q.ctx)) okF++; }
    ok(okF === 6, "22. idrem niveau 2 : la forme de l'objectif se tire (" + okF + "/6)");
  }
  /* ---------- 26. polygones réguliers → 31-FG2 ---------- */
  {
    const p10 = P("CH", 10), r = Referentiel.find(p10, "31-FG2");
    ok(r && r.links.includes("angtri@3") && Referentiel.plan(p10, r).some(([id, d]) => id === "angtri" && d === 3), "26. 31-FG2 (polygones réguliers) : angtri niveau 3 rattaché (" + (r && r.links.join(",")) + ")");
    ok(r && (Referentiel.forms(r, "angtri") || []).includes("polygone") && !(Referentiel.forms(Referentiel.find(p10, "31-FG1"), "angtri") || ["polygone"]).includes("polygone"), "26. formes « polygone » à 31-FG2, pas à 31-FG1");
  }
  /* ---------- 24. élève faible : défi de 2–3 parties ---------- */
  {
    const prof = P("CH", 11), cand = Engine.catalog(prof).map((n) => n.id).filter((id) => GEN[id] && hasProb(id)), mixed = [];
    for (const id of cand) { const n = new Set(); for (let s = 1; s <= 24; s++) { try { const q = Engine.build(id, 4, s); if (q && q.parts && !horsCO({ profile: prof }, id, q)) n.add(q.parts.length > 3 ? "long" : "court"); } catch (e) { break; } } if (n.size === 2) mixed.push(id); if (mixed.length >= 3) break; }
    const st = Engine.newState(prof); Engine.autoInit(st); st.elo.r -= 300; st.last1 = [1, 1, 0, 1, 1, 1];
    const strong = Engine.newState(prof); Engine.autoInit(strong); strong.elo.r += 300; strong.last1 = [1, 1, 1, 1, 1];
    let longW = 0, longS = 0, nW = 0;
    for (const id of mixed) for (let k = 0; k < 12; k++) { const q = Engine.make(st, id, 4); if (q && q.d === 4) { nW++; if (q.parts.length > 3) longW++; } const s = Engine.make(strong, id, 4); if (s && s.d === 4 && s.parts.length > 3) longS++; }
    ok(mixed.length && Engine.belowClass(st) && nW > 0 && longW === 0, "24. élève sous la moyenne : défi de 2–3 parties seulement (" + mixed.join(",") + " ; " + nW + " défis, " + longW + " longs)");
    ok(longS > 0, "24. élève fort : défis longs toujours possibles (" + longS + ")");
  }
  /* ---------- 25. « carte jeune » ---------- */
  {
    let n = 0, bad = 0;
    for (let s = 1; s <= 400 && n < 3; s++) { const q = Engine.build("pct", 4, s); if (q && q.ctx === "succ-fitness") { n++; if (!/carte jeune/.test(q.q) || /étudiant/.test(q.q)) bad++; } }
    ok(n > 0 && !bad, "25. défi pct fitness : « carte jeune » (" + n + " tirages)");
  }
  /* ---------- cart niveau 3 : corrigé sans « (x + 0) » ---------- */
  {
    const bad = []; for (let s = 1; s <= 400; s++) { const q = Engine.build("cart", 3, s); if (q && /\(x\s*[+-]\s*0\)/.test(txt(q))) bad.push(q.code); }
    ok(!bad.length, "cart 3 : corrigé réduit, jamais « (x + 0) » (" + bad.slice(0, 3).join(" ") + ")");
  }
} catch (e) { fail.push("EXC " + e.message + " " + (e.stack || "").split("\n").slice(0, 3).join(" ")); }
document.getElementById("out").textContent = fail.concat(out).join("\n") + "\n" + (fail.length ? fail.length + " ÉCHEC(S)" : "tout ok");
</script>
