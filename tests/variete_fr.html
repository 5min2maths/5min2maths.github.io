<!-- 26.11 soir (agent defisfr) : variété des défis (niveau 4) des fichiers src/fr_*.js (profil France). Sur #n graines
     (60 par défaut), chaque défi doit donner au moins 10 énoncés différents (énoncé et questions) et au moins 3 contextes
     (tag ctx), sans exception ni valeur cassée (réponse non finie). #n=120 ; #ids=proba2,lnfr ; #detail (compte par contexte). -->
<pre id="out">en cours</pre>
<script>
(function () {
  const P = new URLSearchParams(location.hash.slice(1)), N = +(P.get("n") || 60), DET = P.has("detail");
  /* tous les défis définis dans src/fr_*.js (fr_2nde, fr_1re, fr_3e, fr_tle, fr_trous, fr_college, fr_fin) */
  const ALL = ["proba2", "tauxevol", "vect3e", "probcond", "algopy", "expderiv", "trigrad", "autodnb", "tabvar", "lnfr", "hauteurs5", "tabform5", "cercle6", "bissec6", "filtre6", "progcalc", "ratio",
    "symax", "mediatrice", "echelle6", "proba6", "empil", "compdiff", "posrelc", "intmaj", "suiteint"];
  const ids = P.get("ids") ? P.get("ids").split(",") : ALL, bad = [], rows = [];
  for (const id of ids) {
    if (!GEN[id] || !hasProb(id)) { bad.push(id + " : pas de défi"); continue; }
    const S = new Set(), C = {}; let ex = 0;
    for (let s = 1; s <= N; s++) {
      let q; try { q = Engine.build(id, 4, s); } catch (e) { ex++; if (ex <= 2) bad.push(id + "-4-" + s + " : " + e.message); continue; }
      S.add(q.q + " | " + (q.parts || []).map((p) => p.label).join(" | ")); C[q.ctx || "?"] = (C[q.ctx || "?"] || 0) + 1;
      for (const p of q.parts || []) if (!p.spec || (p.spec.kind === "value" && !isFinite(p.spec.value))) bad.push(id + "-4-" + s + " : valeur cassée (" + VRAI.plain(p.label).slice(0, 40) + ")");
    }
    const nc = Object.keys(C).filter((c) => c !== "?").length;
    if (S.size < 10) bad.push(id + " : " + S.size + " énoncés différents sur " + N + " graines (au moins 10)");
    if (nc < 3) bad.push(id + " : " + nc + " contexte(s) (au moins 3) " + JSON.stringify(C));
    rows.push(id + " : " + S.size + " énoncés, " + nc + " contextes" + (DET ? " " + JSON.stringify(C) : ""));
  }
  const u = [...new Set(bad)];
  document.getElementById("out").textContent = [(u.length ? "ÉCHEC " : "ok ") + ids.length + " défis France, " + N + " graines chacun, " + u.length + " défaut(s)", ...u.slice(0, 60).map((x) => "  " + x), ...(DET || u.length ? rows.map((r) => "  " + r) : [])].join("\n");
})();
</script>
