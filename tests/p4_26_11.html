<script>
/* 26.11 (revue des élèves joués, 4e passage, tools/revue_eleves_claude_26-11_p4.md) : un contrôle par point corrigé.
   1 (grave) : chapitre « en classe » : notions de la classe d'abord (France 5e–3e : thèmes de cycle de la 6e à la 3e ;
     avant : les 5 premières, donc celles de 6e–5e). Échouait avant la correction pour 5e, 4e et 3e FR.
   2 (grave) : mode libre : notions de l'année seulement, sauf remobilisation justifiée (Engine.remob). Échouait avant
     (2e Collège : 4 rappels du CO sur 5 ; France : idem).
   3–11 : série courte pour l'élève en grande difficulté, jour 1 à 3 questions, positionnement arrêté après 3 ratés et sans
   carnet, pas de « À toi » en chaîne ni en automatismes, problème de la semaine = vrai problème de l'année, automatisme
   « sans calculatrice », niveau 2 d'entrée pour un élève fort, tradexpr en ×/÷ (FR), scènes robinet et vélo ; remarque :
   0,3̄ en fraction (équation) réservé à la 4e+ en France. */
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const idOf = (e) => String(e).split("|")[0];
const yr = (id) => { const pl = placeOf(NOTIONS.find((n) => n.id === id), state.profile); return pl ? pl[0] : null; };
const fresh = (pr) => { state = Engine.newState({ ...pr, minutes: 5 }); Engine.autoInit(state); state.placed = true; return state; };
try {
  /* ---- 1. chapitre en classe : notions de la classe d'abord ---- */
  const P1 = [["5e FR", { system: "FR", grade: 7, track: "college" }], ["4e FR", { system: "FR", grade: 8, track: "college" }], ["3e FR", { system: "FR", grade: 9, track: "college" }],
    ["3e Coll.", { system: "CH", grade: 14, track: "college", niv: "N" }], ["4e Coll.", { system: "CH", grade: 15, track: "college", niv: "R" }], ["MP 3e", { system: "CH", grade: 14, track: "mp" }], ["11e", { system: "CH", grade: 11, track: "college" }]];
  let n1 = 0;
  for (const [nom, pr] of P1) {
    fresh(pr);
    for (const ch of nowChapters()) {
      const own = ch.ids.filter((id) => yr(id) === pr.grade), ids = nowPickIds(ch), got = ids.filter((id) => yr(id) === pr.grade).length;
      if (!own.length) continue; n1++;
      ok(got === Math.min(5, own.length), nom + " · " + ch.label + " : " + got + " notions de la classe sur " + Math.min(5, own.length) + " possibles (" + ids.join(", ") + ")");
    }
  }
  /* sujet / évaluation : dans la liste « Je prépare une évaluation », la classe d'abord dans chaque chapitre */
  fresh({ system: "FR", grade: 9, track: "college" }); screenPrep();
  { const v = [...app.querySelectorAll(".checks")].map((c) => [...c.querySelectorAll("input")].map((i) => yr(i.value) === 9));
    ok(v.every((L) => L.indexOf(false) < 0 || L.lastIndexOf(true) < L.indexOf(false)), "3e FR, évaluation : une notion d'une autre classe avant celles de 3e"); }
  log.push("1 : " + n1 + " chapitres");

  /* ---- 2. mode libre : notions de l'année (plus des remobilisations justifiées) ---- */
  const P2 = [["2e Coll.", { system: "CH", grade: 13, track: "college" }], ["5e FR", { system: "FR", grade: 7, track: "college" }], ["4e FR", { system: "FR", grade: 8, track: "college" }], ["3e FR", { system: "FR", grade: 9, track: "college" }], ["MP 2e", { system: "CH", grade: 13, track: "mp" }]];
  for (const [nom, pr] of P2) {
    for (const prof of ["moyen", "fort", "fragile"]) {
      fresh(pr);
      const year = new Set(Engine.catalog(state.profile).filter((c) => c.current).map((c) => c.id)), all = Object.keys(state.notions).filter((id) => GEN[id]);
      /* après un positionnement réussi sur des notions d'avant, et quelques notions de l'année travaillées */
      all.filter((id) => !year.has(id)).slice(0, 25).forEach((id) => Object.assign(state.notions[id], { seen: 1, m: 0.75, box: 2 }));
      const m = prof === "fort" ? 0.9 : prof === "fragile" ? 0.35 : 0.6;
      all.filter((id) => year.has(id)).slice(0, 8).forEach((id, k) => Object.assign(state.notions[id], { seen: 3, m: prof === "moyen" && k % 2 ? 0.85 : m, status: "encours" }));
      let out = 0, tot = 0;
      for (let r = 0; r < 30; r++) { const need = Engine.remob ? Engine.remob(state, year) : new Set(); Engine.freePlan(state, "annee", 8).forEach((e) => { tot++; if (!year.has(idOf(e)) && !need.has(idOf(e)) && !(prof === "fragile" && Object.values(PREREQ).some((l) => l.includes(idOf(e))))) out++; }); }
      ok(out === 0 && tot > 0, nom + " " + prof + " (mode libre) : " + out + " notions d'une autre année sans raison sur " + tot);
    }
  }
  /* une notion d'avant ratée revient (remobilisation justifiée) */
  fresh({ system: "CH", grade: 13, track: "college" });
  { const year = new Set(Engine.catalog(state.profile).filter((c) => c.current).map((c) => c.id)), old = Object.keys(state.notions).find((id) => GEN[id] && !year.has(id));
    Object.assign(state.notions[old], { seen: 3, m: 0.2, fails: 2 });
    ok(Engine.remob(state, year).has(old), "2e Coll. : notion d'avant ratée non remobilisée (" + old + ")"); }

  /* ---- 3. série courte (élève en grande difficulté), jour 1 à 3 questions ---- */
  fresh({ system: "CH", grade: 9, track: "college" });
  state.last1 = [0, 0, 1, 0, 0, 0]; ok(Engine.autoN(state) === 4, "9e très faible : série de " + Engine.autoN(state) + " automatismes (4 attendus)");
  state.last1 = [1, 1, 1, 0, 1, 1]; ok(Engine.autoN(state) === 6, "9e à l'aise : série de " + Engine.autoN(state));
  state.placedOn = day(); for (const f of Object.keys(FORMATS)) ok(Engine.planSession(state, f).length <= 3, "jour du positionnement : " + f + " de " + Engine.planSession(state, f).length + " questions");

  /* ---- 5 (et 3) : positionnement : ratés hors du carnet ; arrêt après 3 ratés ---- */
  fresh({ system: "CH", grade: 9, track: "college" }); state.placed = false; delete state.placement; state.carnet = [];
  startPlacement();
  for (let k = 0; k < 3 && !state.placed; k++) { document.getElementById("idk").click(); const nx = document.getElementById("nx"); if (nx) nx.click(); }
  ok(state.placed, "positionnement : pas terminé après 3 « Je ne sais pas »");
  fresh({ system: "CH", grade: 9, track: "college" }); state.placed = false; delete state.placement; state.carnet = [];
  startPlacement();
  for (let k = 0; k < 6 && !state.placed; k++) { const inp = document.getElementById("ans"), ck = () => { const c = document.getElementById("check"); if (c && !document.getElementById("nx")) c.click(); };
    if (inp) { inp.value = "123456789"; ck(); inp.value = "123456788"; ck(); }
    if (!document.getElementById("nx")) { const i = document.getElementById("idk"); if (i) i.click(); }
    const nx = document.getElementById("nx"); if (nx) nx.click(); else break; }
  ok(state.placed && !(state.carnet || []).length, "positionnement : " + (state.carnet || []).length + " erreurs rangées au carnet");

  /* ---- 4. pas de « À toi » sur une reprise, ni en automatismes ---- */
  fresh({ system: "CH", grade: 9, track: "college" }); Object.values(state.notions).forEach((n) => (n.lessonSeen = true));
  session = { fmt: "revision", plan: ["ulong|2|rev", "uaire|2|rev"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set() };
  nextQuestion(); document.getElementById("idk").click();
  ok(!!document.getElementById("redo"), "révision : « Refaire » absent sur une première question ratée");
  document.getElementById("redo").click();
  ok(/nouvelles valeurs/i.test(app.querySelector(".eyebrow").textContent), "reprise : pas d'étiquette « nouvelles valeurs »");
  document.getElementById("idk").click();
  ok(!document.getElementById("redo") && document.getElementById("nx").classList.contains("btn-primary"), "reprise ratée : encore un « À toi » / « Refaire », ou « Continuer » pas principal");
  session = { fmt: "auto", plan: ["ulong|1|drill", "uaire|1|drill"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set() };
  nextQuestion(); document.getElementById("idk").click();
  ok(!document.getElementById("redo"), "automatismes : « À toi » / « Refaire » proposé (une question par créneau)");

  /* élève en grande difficulté (positionnement arrêté sur 3 ratés) : séances de 3 questions, pas de reprise */
  fresh({ system: "CH", grade: 9, track: "college" }); Object.values(state.notions).forEach((n) => (n.lessonSeen = true)); state.placeMiss = 3; state.last1 = [0, 1];
  ok(Engine.struggling(state) && Engine.planSession(state, "revision").length <= 3 && Engine.autoN(state) === 4, "élève très faible (3 ratés au positionnement) : séance non raccourcie");
  session = { fmt: "revision", plan: ["ulong|2|rev", "uaire|2|rev"], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set() };
  nextQuestion(); document.getElementById("idk").click();
  ok(!document.getElementById("redo"), "élève très faible : reprise proposée");

  /* ---- 6, 7. problème de la semaine : vrai problème en plusieurs parties, de l'année ---- */
  for (const [nom, pr] of [["3e FR", { system: "FR", grade: 9, track: "college" }], ["Tle FR", { system: "FR", grade: 12, track: "college" }], ["MP 3e", { system: "CH", grade: 14, track: "mp" }], ["9e", { system: "CH", grade: 9, track: "college" }], ["5e FR", { system: "FR", grade: 7, track: "college" }]]) {
    fresh(pr); state.elo.r = 1500;
    Engine.catalog(state.profile).filter((c) => c.current).forEach((c) => Object.assign(state.notions[c.id], { status: "encours", seen: 2, m: 0.7 }));
    const id = Engine.weeklyProblem(state), year = new Set(Engine.catalog(state.profile).filter((c) => c.current).map((c) => c.id));
    if (!id) { ok(false, nom + " : pas de problème de la semaine"); continue; }
    let q = Engine.make(state, id, 4, undefined, false); for (let k = 0; k < 20 && q.d !== 4; k++) q = Engine.make(state, id, 4, undefined, false);
    ok(q.d === 4 && q.parts && q.parts.length >= 2, nom + " : problème de la semaine d'une seule question (" + q.code + ")");
    ok(year.has(id), nom + " : problème de la semaine d'une autre année (" + id + ")");
  }

  /* ---- 8. « sans calculatrice » = automatisme ; chapitre MP 3e présent dans la série ---- */
  fresh({ system: "CH", grade: 14, track: "mp" });
  ok(Engine.isDrill({ q: "Calcule sans calculatrice \\(\\log_{2} 32\\).", spec: { kind: "value", value: 5 } }), "« sans calculatrice » refusé comme automatisme");
  ok(!Engine.isDrill({ q: "Calcule à la calculatrice \\(\\log 7\\).", spec: { kind: "value", value: 5 } }), "« à la calculatrice » accepté comme automatisme");
  { Engine.setNow(state, ["puisrat", "logdef", "logprop"]); let k = 0; for (let r = 0; r < 5; r++) k += Engine.planSession(state, "auto").filter((e) => state.now.ids.includes(idOf(e))).length;
    ok(k >= 10, "MP 3e, Puissances et logarithmes : " + k + " automatismes du chapitre sur 5 séries (≥ 10 attendus)"); }

  /* ---- 9. élève fort, notion jamais vue : niveau 2 d'entrée ---- */
  fresh({ system: "FR", grade: 12, track: "college" }); state.elo.r = 1850;
  Engine.setNow(state, ["tvi", "limitinf"]);
  ok(Engine.minLevel(state, "limitinf") === 2, "Tle forte : niveau minimal " + Engine.minLevel(state, "limitinf") + " sur une notion jamais vue");
  state.notions.limitinf.placed = true; state.notions.limitinf.m = 0.3;
  ok(Engine.minLevel(state, "limitinf") === 1, "notion ratée au positionnement : niveau 2 imposé");

  /* ---- 10. tradexpr en France : × et ÷ ---- */
  ok(/produit \(×\), quotient \(÷\)/.test(frLocal("Somme (+), différence (−), produit (·), quotient (:).")), "tradexpr FR : produit (·), quotient (:)");

  /* ---- 11. scènes robinet et « viennent à vélo » ---- */
  ok(sceneKey({ q: "Un robinet remplit 25 L en 5 minutes." }) === "robinet" && sceneKey({ q: "Sur 80 élèves, 12 viennent à vélo." }) === "velo-eleves", "scènes robinet / vélo non reconnues");

  /* ---- remarque : 0,3̄ en fraction par une équation : pas avant la 4e en France ---- */
  for (const [g, want] of [[7, false], [8, true]]) {
    fresh({ system: "FR", grade: g, track: "college" }); let per = 0;
    for (let k = 1; k <= 60; k++) { const q = Engine.make(state, "fracconv", 2, k); if (/10x - x|100x - 10x/.test(q.sol || "")) per++; }
    ok(want ? true : per === 0, "fracconv " + g + " FR : " + per + " écritures périodiques par équation");
  }
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.length + " · " + fails.slice(0, 14).join("\n") : "ok revue p4 (11 points) : " + log.join(" | ");
</script>
