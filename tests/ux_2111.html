<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script><script src="../src/expr.js"></script><script src="../src/figures.js"></script><script src="../src/geo.js"></script><script src="../src/generators.js"></script><script src="../src/gen2.js"></script><script src="../src/gen3.js"></script><script src="../src/variantes.js"></script><script src="../src/competences.js"></script><script src="../src/ch11_prop.js"></script><script src="../src/ch11_litt.js"></script><script src="../src/ch1c_eq.js"></script><script src="../src/ch1c_sys.js"></script><script src="../src/ch11_no.js"></script><script src="../src/ch11_gm.js"></script><script src="../src/ch11_ang.js"></script><script src="../src/ch11_thales.js"></script><script src="../src/ch11_proba.js"></script><script src="../src/ch1c_no.js"></script><script src="../src/ch1c_fct.js"></script><script src="../src/ch1c_alg.js"></script><script src="../src/ch1c_f2b.js"></script><script src="../src/ch11_no2.js"></script><script src="../src/ch1c_geo.js"></script><script src="../src/ch1c_trig.js"></script><script src="../src/ch_mp1.js"></script><script src="../src/ch11_fct.js"></script><script src="../src/ch10_no.js"></script><script src="../src/ch_mp2.js"></script><script src="../src/ch_mp3.js"></script><script src="../src/ch_mp4.js"></script><script src="../src/fr_2nde.js"></script><script src="../src/ch3c_ana.js"></script><script src="../src/ch3c_geo.js"></script><script src="../src/ch4c_ana.js"></script><script src="../src/ch1c_arg.js"></script><script src="../src/riche.js"></script><script src="../src/riche_11b.js"></script><script src="../src/riche_11c.js"></script><script src="../src/riche_1c.js"></script><script src="../src/riche_sys1c.js"></script><script src="../src/badges.js"></script><script src="../src/backup.js"></script><script src="../src/qr.js"></script><script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/dyn.js"></script><script src="../src/active.js"></script><script src="../src/act_prop11.js"></script><script src="../src/act_litt11.js"></script><script src="../src/act_eq1c.js"></script><script src="../src/act_sys1c.js"></script><script src="../src/act_ch11b.js"></script><script src="../src/act_ch11c.js"></script><script src="../src/act_1c.js"></script><script src="../src/act_mp2.js"></script><script src="../src/act_mp34.js"></script><script src="../src/act_manip.js"></script><script src="../src/sujet.js"></script><script src="../src/qcm.js"></script><script src="../src/engine.js"></script><script src="../src/app.js"></script>
<script>
// Améliorations UX du 21.11 : reprise du positionnement, série (record, rappel), bilan par notion, bouton « plus facile », légendes du clavier.
const fails=[], ok=(c,m)=>{if(!c)fails.push(m)};
const _rq=renderQuestion; renderQuestion=function(q,opt){window.__q=q;return _rq(q,opt)};
const answer=(good)=>{const q=window.__q;const fr=(v)=>{if(Math.abs(v*1e6-Math.round(v*1e6))<1e-6)return String(+v.toFixed(6));for(let d=2;d<=200;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return n+"/"+d}return String(v)};document.getElementById("ans").value=good?(q.canon||fr(q.spec.value)):"123456789";document.getElementById("check").click();if(!good&&document.getElementById("check")&&!document.getElementById("check").disabled){document.getElementById("ans").value="123456788";document.getElementById("check").click();}};
try{
// 1. positionnement : progression, reprise après « fermeture »
state=Engine.newState({system:"CH",grade:11,track:"college",minutes:5});Engine.autoInit(state);statsSet(false);/* 24.11 : carte des statistiques déjà répondue, sinon elle prend la place des autres cartes */
startPlacement();const n=state.placement.plan.length;ok(n>=3,"1 plan "+n);
ok(/question 1 sur/.test(app.textContent)&&!!app.querySelector(".pbar"),"1 eyebrow et barre");
document.getElementById("idk").click();document.getElementById("nx").click();
ok(state.placement.i===1,"1 position gardée "+state.placement.i);
const saved=JSON.parse(JSON.stringify(state.placement));
startPlacement(); // comme au rechargement
ok(/question 2 sur/.test(app.textContent),"1 reprise à la question 2");
ok(JSON.stringify(state.placement.plan)===JSON.stringify(saved.plan),"1 même plan");
for(let k=0;k<n+2&&state.placement;k++){document.getElementById("idk").click();document.getElementById("nx").click();}
ok(state.placed&&!state.placement,"1 fin : placed, plus de placement");
// 2. série : record et rappel
state.streak={count:4,last:addDays(day(),-1),best:4};homeTab="today";screenHome();
ok(/tu passes à 5 \(record/.test(app.textContent),"2 rappel de série");
Engine.finishDay(state,1,1);ok(state.streak.count===5&&state.streak.best===5,"2 record "+JSON.stringify(state.streak));
screenHome();ok(!app.querySelector(".streak-nudge"),"2 plus de rappel une fois la séance faite");
// 3. bouton plus facile (niveau 2, échec, sans guide ni étapes)
for(const id in state.notions)state.notions[id].lessonSeen=true;
session={fmt:"",plan:["prio|2","fracadd|1"],i:0,score:0,answered:0,start:Date.now(),elo0:state.elo.r,ids:new Set(),pinged:true};nextQuestion();
const d0=window.__q.d;document.getElementById("idk").click();
const rd=document.getElementById("redo");ok(!!rd,"3 bouton refaire");
if(d0>1)ok(/plus facile/.test(rd.textContent),"3 libellé plus facile ("+rd.textContent+")");
rd.click();ok(window.__q.d===Math.max(1,d0-1),"3 niveau baissé "+d0+"→"+window.__q.d);
answer(true);document.getElementById("nx").click();
answer(true);document.getElementById("nx").click();
// 4. bilan par notion
ok(!!app.querySelector(".sum-notions"),"4 bilan par notion");
ok(/Réussie|Réussies/.test(app.textContent)&&/En progrès|Reviendr/.test(app.textContent),"4 catégories : "+(app.querySelector(".sum-notions")||{}).textContent);
ok(/record/.test(app.textContent)||/série passe à/.test(app.textContent),"4 série au bilan");
// 5. clavier
const kp=keypadHtml({kind:"value",value:0.5,final:true});ok(/fraction/.test(kp)&&/clavier/.test(kp)&&/aria-label="barre de fraction"/.test(kp),"5 légendes clavier résultat");
ok(/puissance/.test(keypadHtml({kind:"expr",expr:"x^2"})),"5 légende puissance");
// 6. sauvegarde : record conservé
ok(Backup.unpack(JSON.parse(JSON.stringify(Backup.pack(state)))).streak.best===5,"6 record dans le code de sauvegarde");
// 7. interface (propositions du 21.11) : aperçu masqué, sauts groupés, clavier replié, un seul bouton principal, progression
session={fmt:"auto",plan:["prio|1","fracadd|1"],i:0,score:0,answered:0,start:Date.now(),elo0:state.elo.r,ids:new Set(),pinged:true};nextQuestion();
ok(document.getElementById("prev").innerHTML==="","7 aperçu vide au départ");
ok(!!app.querySelector(".skips #easy")&&!app.querySelector(".qmeta #easy"),"7 « Trop facile » sorti de l'en-tête");
ok(!!app.querySelector(".eyebrow .pbar"),"7 barre de progression de séance");
document.getElementById("idk").click();
ok(document.getElementById("kp").style.display==="none","7 clavier replié");
ok(app.querySelectorAll("#fb .btn-primary").length===1,"7 un seul bouton principal ("+app.querySelectorAll("#fb .btn-primary").length+")");
ok(/Cette question était/.test(app.textContent)&&!!app.querySelector('.vote button[data-v="down"]'),"7 votes visibles");
// 8. réglages : taille du texte et vibrations
screenSettings();app.querySelector('#fs button[data-v="1.3"]').click();ok(getComputedStyle(document.documentElement).fontSize==="20.8px"&&state.a11y.fs===1.3,"8 taille du texte "+getComputedStyle(document.documentElement).fontSize); /* 24.11 : taille dans le state (chantier O) */
app.querySelector('#vib button[data-v="0"]').click();ok(UI.vib===false&&JSON.parse(localStorage.getItem("m2m-ui")).vib===false,"8 vibrations désactivées");
app.querySelector('#fs button[data-v="1"]').click();
// 9. installer puis rappel, au bilan
localStorage.removeItem("m2m-ui");for(const k of ["installed","installLater","remSet","remNo"])delete UI[k];
state.history=[{date:addDays(day(),-1),n:1,score:1}];ok(returnCard()==="","9 rien le 1er jour");
state.history.push({date:day(),n:1,score:1});ok(/écran d'accueil/.test(returnCard()),"9 installer dès le 2e jour");
UI.installLater=day();ok(returnCard()==="","9 « plus tard » : plus rien");
state.history.unshift({date:addDays(day(),-2),n:1,score:1});ok(!/rappel/.test(returnCard()),"9 plus de carte rappel");
screenSettings();ok(!/Un rappel chaque jour/.test(app.textContent),"9 pas de rappel dans les réglages");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC\n"+fails.join("\n"):"OK")+"</pre>");
</script>
