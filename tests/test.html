<script>
const log = [];
let fails = 0;
const seen = {};
const fail = (m) => { fails++; const k = m.replace(/[-\d.,]+/g, "#").slice(0, 70); if (!seen[k]) { seen[k] = 1; log.push("ÉCHEC " + m); } };

// 1. Calculateur : formes équivalentes acceptées
const cases = [
  ["3/4", { kind: "value", value: 0.75 }, "correct"], ["0,75", { kind: "value", value: 0.75 }, "correct"],
  ["6/8", { kind: "value", value: 0.75 }, "correct"], ["0,7", { kind: "value", value: 0.75 }, "wrong"],
  ["6√2", { kind: "value", value: 6 * Math.SQRT2 }, "correct"], ["6*sqrt(2)", { kind: "value", value: 6 * Math.SQRT2 }, "correct"],
  ["8,49", { kind: "value", value: 6 * Math.SQRT2, round: 0.01 }, "correct"], ["12π", { kind: "value", value: 12 * Math.PI, round: 0.01 }, "correct"],
  ["2^-3", { kind: "value", value: 0.125 }, "correct"], ["1'200", { kind: "value", value: 1200 }, "correct"], ["x = 4", { kind: "value", value: 4 }, "correct"],
  ["(x-3)(x+3)", { kind: "expr", expr: "x^2-9", form: "product" }, "correct"], ["x²-9", { kind: "expr", expr: "(x-3)(x+3)", form: "product" }, "form"],
  ["(x+3)(x-3)", { kind: "expr", expr: "x^2-9", form: "expanded" }, "form"], ["x^2 - 9", { kind: "expr", expr: "(x+3)(x-3)", form: "expanded" }, "correct"],
  ["-x²+4x", { kind: "expr", expr: "-x^2+4x", form: "expanded" }, "correct"], ["3x(2x-5)", { kind: "expr", expr: "6x^2-15x", form: "product" }, "correct"],
  ["-(x-3)(x+3)", { kind: "expr", expr: "9-x^2", form: "product" }, "correct"], ["2 ; -5", { kind: "set", values: [-5, 2] }, "correct"],
  ["2", { kind: "set", values: [-5, 2] }, "close"], ["(2", { kind: "value", value: 2 }, "invalid"], ["aucune", { kind: "set", values: [] }, "correct"], ["2", { kind: "set", values: [] }, "wrong"], ["aucune", { kind: "set", values: [1] }, "wrong"], ["3 ; -1", { kind: "pair", values: [3, -1] }, "correct"], ["-1 ; 3", { kind: "pair", values: [3, -1] }, "close"], ["(3+√5)/2 ; (3-√5)/2", { kind: "set", values: [(3 - Math.sqrt(5)) / 2, (3 + Math.sqrt(5)) / 2] }, "correct"], ["3x", { kind: "value", value: 3 }, "invalid"],
];
// Saisies du clavier « intervalles » (13.11)
const S2 = { kind: "solset", ivs: [[-Infinity, false, 2, false], [2, false, Infinity, false]] }, S3 = { kind: "solset", ivs: [[-Infinity, false, 2, true], [5, true, Infinity, false]] };
cases.push(["ℝ \\ {2}", S2, "correct"], ["x ≠ 2", S2, "correct"], ["]-∞ ; 2[ ∪ ]2 ; +∞[", S2, "correct"], ["]-∞ ; 2] ∪ [5 ; ∞[", S3, "correct"], ["x ≤ 2 ∪ x ≥ 5", S3, "correct"],
  ["∅", { kind: "solset", ivs: [] }, "correct"], ["ℝ", { kind: "solset", ivs: [[-Infinity, false, Infinity, false]] }, "correct"], ["[√2 ; +∞[", { kind: "solset", ivs: [[Math.SQRT2, true, Infinity, false]] }, "correct"],
  ["x ≥ 3", { kind: "ineq", op: ">=", value: 3 }, "correct"], ["[3 ; +∞[", { kind: "ineq", op: ">=", value: 3 }, "correct"]);
for (const [inp, spec, want] of cases) {
  const r = checkAnswer(spec, inp);
  if (r.status !== want) fail("calc « " + inp + " » → " + r.status + " (attendu " + want + ")");
}

if (typeof FINE === "undefined" || FINE.length < 90) fail("src/gen3.js non chargé (erreur de syntaxe ?) : notions fines absentes");
// 2. Générateurs : réponse canonique acceptée, figure valide, pas de NaN
function canonical(spec) {
  if (spec.canon) return spec.canon;
  if (spec.kind === "solset") return SolSet.show(spec.ivs, false);
  if (spec.kind === "value") return String(spec.value);
  if (spec.kind === "set") return spec.values.length ? spec.values.join(" ; ") : "aucune";
  if (spec.kind === "pair") return spec.values.join(" ; ");
  if (spec.kind === "ineq") return "x " + spec.op + " " + spec.value;
  if (spec.kind === "expr" && spec.form === "expanded") {
    const t = Expr.parse(spec.expr), f = (x) => Expr.evaluate(t, { x });
    const c = f(0), a = (f(1) + f(-1)) / 2 - c, b = (f(1) - f(-1)) / 2;
    return a + "x^2 + (" + b + ")x + (" + c + ")";
  }
  if (spec.kind === "expr") return spec.expr;
}
let n = 0;
for (const id of Object.keys(GEN)) for (const d of [1, 2, 3]) for (let i = 0; i < 200; i++) {
  let q;
  try { q = GEN[id](d); } catch (e) { fail(id + " d" + d + " lève " + e.message); continue; }
  if (q.canon && q.spec) q.spec.canon = q.canon;
  n++;
  if (!q.q || /NaN|undefined|Infinity/.test(q.q + q.sol)) { fail(id + " d" + d + " texte : " + q.q); continue; }
  if (q.fig && !/^<svg/.test(q.fig)) fail(id + " figure invalide");
  if (q.fig && /NaN|undefined/.test(q.fig)) fail(id + " d" + d + " figure NaN");
  // Figure vide : un repère sans courbe ni point ne montre rien
  if (q.fig && /aria-label="graphique"/.test(q.fig) && !/<path d=" ?M/.test(q.fig) && !/f-dot/.test(q.fig)) fail(id + " d" + d + " figure vide (repère seul)");
  const s = q.spec;
  // La figure ne doit pas donner la réponse : aucune étiquette égale à la réponse, sauf si ce nombre est dans l'énoncé.
  if (q.fig) {
    const labels = [...q.fig.matchAll(/<text(?![^>]*f-tick)[^>]*>([^<]*)<\/text>/g)].map((m) => m[1].replace(",", ".").replace(/\s|cm|m|°|km|h|CHF|\?|=|[a-zA-Z]+\s*=/g, ""));
    const answers = s.kind === "value" ? [s.value] : s.kind === "set" || s.kind === "pair" ? s.values : [];
    const qtxt = q.q.replace(/\{,\}/g, ".");
    for (const a of answers) {
      const str = String(+(+a).toFixed(4));
      if (labels.includes(str) && !new RegExp("(^|[^0-9.])" + str.replace(".", "\\.") + "([^0-9]|$)").test(qtxt)) fail(id + " d" + d + " la figure révèle la réponse " + str);
    }
  }
  if (s.kind === "value" && !isFinite(s.value)) { fail(id + " d" + d + " valeur " + s.value); continue; }
  if (s.kind === "value" && s.round) {
    const r = checkAnswer(s, s.value.toFixed(2));
    if (r.status !== "correct") fail(id + " d" + d + " arrondi refusé " + s.value);
    continue;
  }
  const r = checkAnswer(s, canonical(s));
  if (r.status !== "correct") fail(id + " d" + d + " canonique refusée : " + canonical(s) + " → " + r.status + " " + (r.message || "") + " | " + q.q);
  if (s.kind === "expr") {
    const wrong = checkAnswer(s, s.expr + "+1");
    if (wrong.status === "correct") fail(id + " d" + d + " accepte une réponse fausse");
  }
  if (s.kind === "ineq" && checkAnswer(s, "x " + s.op + " " + (s.value + 1)).status === "correct") fail(id + " ineq accepte une borne fausse");
  if (s.kind === "value" && checkAnswer(s, String(s.value * 1.013 + 0.71)).status === "correct") fail(id + " d" + d + " accepte valeur+1");
}

// 2 bis. Problèmes : chaque partie, réponse canonique acceptée
for (const id of Object.keys(GEN).filter(hasProb)) for (const fn of probList(id)) for (let i = 0; i < 300; i++) {
  let p; try { p = fn(); } catch (e) { fail("PROB " + id + " lève " + e.message); continue; }
  n++;
  if (!GEN[id]) fail("PROB " + id + " sans notion");
  if (/NaN|undefined|Infinity/.test(p.q + p.sol + (p.fig || ""))) fail("PROB " + id + " NaN : " + p.q);
  if (!p.hints || p.hints.length < 2) fail("PROB " + id + " indices");
  // La figure d'un problème ne doit donner la réponse d'aucune partie (sauf nombre déjà dans l'énoncé)
  if (p.fig) {
    const labs = [...p.fig.matchAll(/<text(?![^>]*f-tick)[^>]*>([^<]*)<\/text>/g)].map((m) => m[1].replace(",", ".").replace(/\s|cm|m|°|km|h|CHF|\?|=/g, ""));
    const qt = p.q.replace(/\{,\}/g, ".");
    for (const pt of p.parts) if (pt.spec.kind === "value" && pt.spec.value !== 0) { const str = String(+(+pt.spec.value).toFixed(4)); if (labs.includes(str) && !new RegExp("(^|[^0-9.])" + str.replace(".", "\\.") + "([^0-9]|$)").test(qt)) fail("PROB " + id + " : la figure révèle la réponse " + str); }
  }
  p.parts.forEach((pt, k) => {
    const s = pt.spec, ans = s.round ? s.value.toFixed(2) : canonical(s);
    if (s.kind === "value" && !isFinite(s.value)) fail("PROB " + id + " partie " + k + " valeur " + s.value);
    else if (checkAnswer(s, ans).status !== "correct") fail("PROB " + id + " partie " + k + " refusée : " + ans);
  });
}

// 2 ter. Codes reproductibles
for (const id of Object.keys(GEN)) for (const d of [1, 2, 3, 4]) {
  if (d === 4 && !hasProb(id)) continue;
  const q1 = Engine.build(id, d), q2 = Engine.fromCode(q1.code);
  if (!q2 || q2.q !== q1.q || q2.sol !== q1.sol) fail("code non reproductible " + q1.code);
}

// 2 quater. Une mini-leçon par notion
for (const n of NOTIONS) {
  const L = LESSONS[n.id];
  if (!L) { fail("leçon manquante : " + n.id); continue; }
  if (!L.titre || !L.intro || !L.regle || !L.exemple.length || !L.piege) fail("leçon incomplète : " + n.id);
}

for (const [id, f] of Object.entries(typeof LESSON_FIGS !== "undefined" ? LESSON_FIGS : {})) { try { const g = f(); if (!/^<svg/.test(g) || /NaN|undefined/.test(g)) fail("figure de leçon invalide : " + id); } catch (e) { fail("figure de leçon " + id + " : " + e.message); } }
for (const id of Object.keys(LESSONS_V2)) if (!NOTIONS.some((n) => n.id === id)) fail("rappel réécrit pour une notion inconnue : " + id);
// 2 quinquies. Séances équilibrées et adaptées
{
  const mk = (p, elo) => { const st = Engine.newState(p); Engine.initNotions(st, Object.fromEntries(Engine.catalog(p, new Date("2027-03-01")).map((c) => [c.id, c.current ? "vu" : c.defaultStatus]))); st.elo.r = elo; return st; };
  const strong = mk({ system: "CH", grade: 13, track: "college", minutes: 5 }, 1750);
  const plan = Engine.planSession(strong, "mixte"), kinds = plan.map((e) => e.split("|")[2]);
  if (plan.join() && kinds.join() !== "drill,app,defi") fail("mixte : " + kinds.join(","));
  if (Engine.planSession(strong, "defi").length !== 1) fail("défi du jour : plus d'une question");
  if (Engine.planSession(strong, "auto").length !== 8) fail("série d'automatismes");
  // « Trop facile » : demi-victoire, notion relevée, remplaçante un cran au-dessus, cible relevée
  { const t = mk({ system: "CH", grade: 13, track: "college", minutes: 5 }, 1500), r0 = t.elo.r, id = "expo";
    const r = Engine.tooEasy(t, id, 1, "drill");
    if (!(t.elo.r > r0 && t.elo.r - r0 <= 24)) fail("trop facile : Mathélo " + r0 + " → " + t.elo.r);
    if (r.next !== "expo|2|app") fail("trop facile : remplaçante " + r.next);
    if (t.notions[id].easy !== 1) fail("trop facile : décalage");
    Engine.record(t, id, 2, 2, false); if (t.notions[id].easy !== 0) fail("échec : décalage non retombé");
    const r3 = Engine.tooEasy(t, "cart", 3, "app"); if (r3.next !== null && !r3.next.startsWith("cart|4")) fail("trop facile niveau 3 : " + r3.next); }
  // Notions anciennes : jamais triviales, au plus 1 par séance (2 en révision)
  { const t = mk({ system: "CH", grade: 13, track: "college", minutes: 5 }, 1750); let oldSeen = 0;
    for (let k = 0; k < 300; k++) for (const f of Object.keys(FORMATS)) {
      const p = Engine.planSession(t, f), olds = p.filter((e) => !Engine.isRecent(t, e.split("|")[0]));
      if (olds.length > (f === "revision" ? 2 : 1)) fail("trop d'anciennes notions (" + f + ") : " + olds.join(" "));
      for (const e of olds) { oldSeen++; const [id, d, kd] = e.split("|"); const tg = t.elo.r + TARGET[kd === "defi" && f === "defi" ? "defi4" : kd === "rev" ? "rev" : kd];
        if (+d < 3 || itemRating(t.profile, id, +d) < tg - 150) fail("ancienne notion triviale : " + e); } }
    if (oldSeen < 100) fail("notions anciennes presque jamais proposées : " + oldSeen);
    log.push("2e Collège, 1750 : " + oldSeen + " anciennes notions sur 1500 séances");
    t.notions.fracadd.m = 0.3; let w = 0;
    for (let k = 0; k < 200; k++) for (const e of Engine.planSession(t, "revision")) if (e.startsWith("fracadd|")) { w++; if (+e.split("|")[1] < 2) fail("fragile ancienne au niveau 1"); }
    log.push("fractions ratées : " + w + " fois en 200 révisions"); if (w < 50) fail("ancienne notion ratée pas revue"); }
  // équilibre sur 14 jours simulés
  const cnt = {}; strong.formats = [];
  for (let dd = 14; dd >= 1; dd--) { const date = addDays(day(), -dd); strong.today = null; const f = Engine.chooseFormat(strong, [], date); strong.formats.push({ date, f }); cnt[f] = (cnt[f] || 0) + 1; }
  log.push("formats sur 14 jours : " + JSON.stringify(cnt));
  if (Object.keys(cnt).length < 4 || Math.max(...Object.values(cnt)) > 5) fail("formats peu variés " + JSON.stringify(cnt));
  for (let k = 1; k < strong.formats.length; k++) if (strong.formats[k].f === strong.formats[k - 1].f) fail("même format deux jours de suite");
  for (const e of plan) { const id = e.split("|")[0]; if (!Engine.isRecent(strong, id)) fail("2e Collège : notion ancienne " + id); }
  if (!plan.some((e) => e.endsWith("|4|defi") || e.split("|")[1] === "3")) fail("élève fort sans vrai défi : " + plan.join(" "));
  log.push("2e Collège, Mathélo 1750 : " + plan.join("  "));
  const weak = mk({ system: "CH", grade: 11, minutes: 5 }, 900);
  log.push("11e, Mathélo 900, défi : " + Engine.planSession(weak, "defi").join("  ") + " | auto : " + Engine.planSession(weak, "auto").join(" "));
}

// 2 sexies. Compétences : chaque notion a ses libellés, chaque question sa compétence ; notes de 1 à 6
for (const n of NOTIONS) {
  const L = COMPS[n.id];
  if (!L || L.length !== 3 || L.some((x) => !x)) fail("compétences manquantes : " + n.id);
  if (ORDRE.CO[n.id] === undefined && ORDRE.MATU[n.id] === undefined && ORDRE.MP[n.id] === undefined) fail("notion hors de l'ordre du référentiel : " + n.id);
}
if (compNote({ r: [1, 1] }) !== null || compNote({ r: [1, 1, 1] }) !== 6 || compNote({ r: [0, 0, 0] }) !== 1 || compNote({ r: [1, 0.5, 1, 0, 1] }) !== 4.5) fail("note de compétence");
// Ouverture des notions de l'année dans l'ordre du référentiel, sans questionnaire ; « pas encore vu en classe »
{ const t = Engine.newState({ system: "CH", grade: 9, track: "college", minutes: 5 }); Engine.initNotions(t, Object.fromEntries(Engine.catalog(t.profile).map((c) => [c.id, c.defaultStatus])));
  Engine.unlock(t, new Date("2026-09-10"));
  const open = () => Object.entries(t.notions).filter(([, s]) => s.status === "encours").map(([id]) => id);
  if (open().length !== 3) fail("rentrée de 9e : " + open().length + " notions ouvertes (3 attendues) : " + open().join(" "));
  if (open().join() !== "decread,deccomp,decarr") fail("9e : ordre du référentiel non suivi : " + open().join(" "));
  Engine.notYet(t, "deccomp");
  if (t.notions.deccomp.status !== "nonvu" || open().length < 3 || open().includes("deccomp")) fail("pas encore vu : " + open().join(" "));
  Engine.unlock(t, new Date("2027-03-01"));
  const share = open().length / Object.values(t.notions).length;
  if (share < 0.5) fail("9e en mars : seulement " + open().length + " notions ouvertes");
  for (let k = 0; k < 3; k++) Engine.record(t, "decread", 1, 1, true);
  const cid = compOf("decread", 1); if (compNote(t.comps[cid]) !== 6) fail("compétence non notée : " + JSON.stringify(t.comps));
  log.push("9e : rentrée " + "decread,deccomp,decarr" + " ; mars " + open().length + " notions ouvertes"); }

// 3. Moteur : parcours complet
const prof = { system: "CH", grade: 11, minutes: 5 };
for (const p of [{ system: "CH", grade: 12, track: "college" }, { system: "CH", grade: 12, track: "mp" }, { system: "CH", grade: 13, track: "college" }, { system: "CH", grade: 13, track: "mp" }]) log.push(p.system + p.grade + (p.track || "") + " : " + Engine.catalog(p, new Date("2027-03-01")).length + " notions — " + Engine.catalog(p, new Date("2027-03-01")).filter((c) => c.current).map((c) => c.id).join(" "));
const st = Engine.newState(prof);
const cat = Engine.catalog(prof);
Engine.initNotions(st, Object.fromEntries(cat.map((c) => [c.id, c.current ? "vu" : c.defaultStatus])));
const plan = Engine.placementPlan(st);
if (plan.length !== 5) fail("positionnement : " + plan.length + " questions");
plan.forEach((id, i) => Engine.placementResult(st, id, i % 3 === 0 ? false : i % 3 === 1 ? true : null));
const sess = Engine.planSession(st, "app").map((e) => e.split("|")[0]);
if (sess.length !== 3) fail("séance applications : " + sess.length + " questions");
sess.forEach((id) => { const q = Engine.make(st, id); Engine.record(st, id, q.d, 1, true); });
Engine.finishDay(st, sess.length, sess.length);
if (st.streak.count !== 1) fail("série " + st.streak.count);
const r0 = st.elo.r; Engine.updateElo(st, "factor", 3, 1); if (st.elo.r <= r0) fail("Mathélo ne monte pas");
const r1 = st.elo.r; Engine.updateElo(st, "prio", 1, 0); if (st.elo.r >= r1) fail("Mathélo ne descend pas");
log.push("Mathélo : " + st.elo.r + " — " + eloLabel(prof, st.elo.r));

// 4. Badges
{ const b = Engine.newState({ system: "CH", grade: 9, minutes: 5 }); Engine.autoInit(b); b.placed = true;
  if (Badges.check(b).length) fail("badges sans rien faire : " + JSON.stringify(b.badges));
  Engine.finishDay(b, 1, 1); Badges.check(b); if (!b.badges.premier) fail("badge premier pas");
  const ids = Engine.eligible(b), id0 = ids[0];
  for (let k = 0; k < 3; k++) Engine.record(b, id0, 1, 1, false);
  for (let k = 0; k < 8; k++) Engine.record(b, id0, 1, 1, true);
  Badges.check(b); for (const x of ["comp5", "expert", "pente"]) if (!b.badges[x]) fail("badge " + x + " : " + JSON.stringify(Badges.bc(b)));
  for (let k = 0; k < 10; k++) Engine.record(b, id0, 2, 2, true);
  for (let k = 0; k < 8; k++) Engine.record(b, id0, 2, 1, true);
  for (let k = 0; k < 5; k++) Engine.record(b, id0, 3, 1, true);
  Badges.onLessonDown(b, id0); Engine.record(b, id0, 2, 1, true); Engine.record(b, id0, 2, 1, true);
  Badges.check(b); if (b.badges.compris) fail("ça y est trop tôt");
  Engine.record(b, id0, 2, 1, true); Badges.check(b);
  for (const x of ["retry", "d3", "compris", "notion"]) if (!b.badges[x]) fail("badge " + x);
  // Régularité : 5 jours la même semaine, retour après 10 jours
  const c = Engine.newState({ system: "CH", grade: 9, minutes: 5 }); Engine.autoInit(c);
  for (const d of ["2026-11-02", "2026-11-03", "2026-11-05", "2026-11-06", "2026-11-08"]) Badges.onDay(c, d);
  Badges.onDay(c, "2026-11-20"); Badges.check(c);
  if (!c.badges.semaine || !c.badges.rentree || c.badges.mois) fail("régularité " + JSON.stringify(c.bc));
  if (Badges.list(c).length !== 18) fail(Badges.list(c).length + " badges");
  { const m = Engine.newState({ system: "CH", grade: 12, track: "college", minutes: 5 }); Engine.autoInit(m); log.push("badges matu 1re : " + Badges.list(m).filter((x) => x.id.startsWith("th-")).map((x) => x.name).join(", ")); }
  log.push("badges : " + Object.keys(b.badges).join(" ")); }

// 4 bis. En ce moment en classe : ~2 créneaux sur 3 sur le chapitre, du plus simple au plus difficile
{ const s = Engine.newState({ system: "CH", grade: 10, minutes: 5 }); Engine.autoInit(s); s.placed = true;
  const sug = Engine.nowSuggest(s); if (sug.length < 3) fail("suggestions : " + sug.join(" "));
  const later = Engine.catalog(s.profile).filter((c) => c.current && s.notions[c.id].status === "avenir").map((c) => c.id).slice(-1)[0];
  Engine.setNow(s, [later]);
  if (s.notions[later].status !== "encours") fail("notion du moment non ouverte");
  let on = 0, tot = 0, order = true;
  for (let k = 0; k < 40; k++) for (const f of ["app", "auto", "mixte", "defi"]) {
    const pl = Engine.planSession(s, f); tot += pl.length; const mine = pl.filter((e) => e.startsWith(later + "|")); on += mine.length;
    const ds = mine.map((e) => +e.split("|")[1]); if (ds.some((d, i) => i && d < ds[i - 1])) order = false;
    if (f === "defi" && !mine.length) fail("défi hors chapitre");
  }
  if (on / tot < 0.55 || on / tot > 0.8) fail("part du chapitre : " + (on / tot).toFixed(2));
  if (!order) fail("chapitre pas du plus simple au plus difficile");
  if (Engine.nowStale(s) || !Engine.nowStale(s, addDays(day(), 21))) fail("relance à 3 semaines");
  log.push("chapitre du moment (" + later + ") : " + Math.round((100 * on) / tot) + " % des questions"); }

document.getElementById("out").textContent = "en cours (sauvegarde)";
// 5. Sauvegarde : aller-retour, et taille du code pour un élève très actif
(async () => {
  const u = Engine.newState({ system: "CH", grade: 11, minutes: 5 }); Engine.autoInit(u); u.placed = true;
  for (let day0 = 0; day0 < 60; day0++) for (const id of Engine.eligible(u).slice(0, 25)) Engine.record(u, id, 1 + (day0 % 3), 1 + (day0 % 2), day0 % 4 !== 0);
  Engine.finishDay(u, 3, 2); Badges.onLesson(u, "pyth"); Badges.check(u); Engine.notYet(u, Engine.eligible(u)[3]);
  const code = await Backup.encode(u), v = await Backup.decode(Backup.url(code));
  const norm = (s) => JSON.stringify({ n: Object.fromEntries(Object.entries(s.notions).map(([k, x]) => [k, { ...x, m: Math.round(x.m * 100) }])), c: Object.fromEntries(Object.entries(s.comps).map(([k, x]) => [k, x.r.map((r) => Math.round(r * 4))])), e: s.elo.r, b: s.badges, p: s.profile, k: s.streak });
  if (norm(u) !== norm(v)) { fail("sauvegarde : aller-retour différent"); const a = JSON.parse(norm(u)), z = JSON.parse(norm(v)); for (const k in a.n) if (JSON.stringify(a.n[k]) !== JSON.stringify(z.n[k])) { log.push(k + " " + JSON.stringify(a.n[k]) + " ≠ " + JSON.stringify(z.n[k])); break; } }
  const n0 = Engine.newState({ system: "CH", grade: 10, minutes: 5 }); Engine.autoInit(n0); n0.placed = true;
  const c0 = await Backup.encode(n0);
  if (!QR.svg(Backup.url(code)).startsWith("<svg")) fail("QR non produit");
  log.push("code de sauvegarde : " + c0.length + " car. (nouveau) ; " + code.length + " car. (60 jours, " + Object.keys(u.comps).length + " compétences)");
  document.getElementById("out").textContent = (fails ? fails + " échec(s)\n" : "OK\n") + log.join("\n") + "\n" + n + " questions générées ; positionnement : " + plan.join(", ") + "\nséance : " + sess.join(", ") + "\nnotions CH 11e en novembre : " + cat.map((c) => c.id + "=" + c.defaultStatus).join(" ");
})();
