<script>
// Défis propres à la 9e (25.11, src/defis_9.js) : 21 notions, 40 tirages chacune ; valeurs finies, non triviales,
// réponses distinctes, solution présente ; réservés à la 9e (pas en 11e) ; Engine.make niveau 4 en 9e = un défi PROBX.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
try {
  const ids = Object.keys(PROBX).filter((id) => PROBX[id].some((f) => { const p = f(); return p.co && p.co.every((g) => g >= 9 && g <= 11); }));
  /* 25.11 : défis du secondaire II (src/defis_sec2.js) : mêmes contrôles, classes co / mp */
  for (const id of ["optim", "arith", "fracper", "premiers", "rac"]) for (const f of PROBX[id] || []) { const p0 = f(); if (!p0.mp && !(p0.co && p0.co.some((g) => g >= 12))) continue; for (let s = 0; s < 40; s++) { const p = f(); ok(p.parts.every((x) => Number.isFinite(x.spec.value) && x.spec.value !== 0 && x.spec.value !== 1), id + " sec2 : valeur " + p.parts.map((x) => x.spec.value)); ok(!/undefined|NaN/.test(p.q + p.sol), id + " sec2 : texte"); } }
  for (const [g, tr, id] of [[12, "mp", "rac"], [12, "mp", "premiers"], [13, "mp", "optim"], [12, "college", "optim"], [12, "college", "fracper"]]) { const st = Engine.newState({ system: "CH", grade: g, track: tr, minutes: 5 }), q = Engine.make(st, id, 4); ok(q.parts && (q.mp || q.co), id + " : défi propre en " + tr + " " + g); }
  ok(ids.length >= 21 + 19, "notions avec défi de 9e–10e : " + ids.length);
  for (const id of ids) {
    for (let s = 1; s <= 40; s++) {
      const q = Engine.build(id, 4, s);
      ok(q && q.parts && q.parts.length >= 2 && q.q && q.sol && q.hints && q.hints.length, id + " " + s + " : structure");
      const vs = [].concat(...q.parts.map((p) => (p.spec.kind === "pair" ? p.spec.values : [p.spec.value])));
      ok(vs.every((v) => Number.isFinite(v)), id + " " + s + " : valeur non finie " + vs);
      ok(!q.co || q.parts.filter((p) => p.spec.kind !== "pair").every((p) => p.spec.value !== 0 && p.spec.value !== 1), id + " " + s + " : valeur triviale " + vs);
      ok(!/undefined|NaN|Infinity/.test(q.q + q.sol + q.parts.map((p) => p.label).join()), id + " " + s + " : texte « undefined/NaN »");
      ok(Engine.fromCode(q.code).q === q.q, id + " " + s + " : code reproductible");
    }
    const s9 = Engine.newState({ system: "CH", grade: 9, track: "college", minutes: 5 }), s11 = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 });
    const g0 = PROBX[id].map((f) => f()).find((p) => p.co && p.co[0] <= 11).co[0], sG = Engine.newState({ system: "CH", grade: g0, track: "college", minutes: 5 }), q9 = Engine.make(sG, id, 4), q11 = Engine.make(s11, id, 4);
    ok(q9.co && q9.co.includes(g0), id + " : en " + g0 + "e, le niveau 4 est un défi propre");
    const s12 = Engine.newState({ system: "CH", grade: 12, track: "college", minutes: 5 }), q12 = Engine.make(s12, id, 4); ok(!(q12.co && q12.co.some((g) => g <= 11)), id + " : pas de défi du Cycle au Collège");
  }
  log.push(ids.length + " notions × 40 tirages");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.slice(0, 15).join("\n") : "ok défis 9e : " + log.join(" | ");
</script>
