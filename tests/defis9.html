<script>
/* ======== defis9 (ancienne page tests/defis9.html) ======== */
Lot.section("defis9", { html: `<style>body{margin:0}#app{width:360px;max-width:360px;box-sizing:border-box}</style>
<main id="app"></main><pre id="out">en cours</pre>` }, function () {
// Défis propres à la 9e (25.11, src/defis_9.js) : 21 notions, 40 tirages chacune ; valeurs finies, non triviales,
// réponses distinctes, solution présente ; réservés à la 9e (pas en 11e) ; Engine.make niveau 4 en 9e = un défi PROBX.
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
try {
  const ids = Object.keys(PROBX).filter((id) => PROBX[id].some((f) => { const p = f(); return p.co && p.co.every((g) => g >= 9 && g <= 11); }));
  /* 25.11 : défis du secondaire II (src/defis_sec2.js) : mêmes contrôles, classes co / mp */
  for (const id of ["optim", "arith", "fracper", "premiers", "rac"]) for (const f of PROBX[id] || []) { const p0 = f(); if (!p0.mp && !(p0.co && p0.co.some((g) => g >= 12))) continue; for (let s = 0; s < 40; s++) { const p = f(); ok(p.parts.every((x) => Number.isFinite(x.spec.value) && x.spec.value !== 0 && x.spec.value !== 1), id + " sec2 : valeur " + p.parts.map((x) => x.spec.value)); ok(!/undefined|NaN/.test(p.q + p.sol), id + " sec2 : texte"); } }
  for (const [g, tr, id] of [[12, "mp", "rac"], [12, "mp", "premiers"], [13, "mp", "optim"], [12, "college", "optim"], [12, "college", "fracper"]]) { const st = Engine.newState({ system: "CH", grade: g, track: tr, minutes: 5 }), q = Engine.make(st, id, 4); ok(q.parts && (q.mp || q.co), id + " : défi propre en " + tr + " " + g); }
  ok(ids.length >= 21 + 19, "notions avec défi de 9e–10e : " + ids.length);
  for (const id of ids) {
    for (let s = 1; s <= 40; s++) {
      const q = Engine.build(id, 4, s);
      ok(q && q.parts && q.parts.length >= 2 && q.q && q.sol && q.hints && q.hints.length, id + " " + s + " : structure");
      /* 28.11 (nickel 10e, ch. 7) : partie à réponse littérale (spec.kind « expr », comme dans defis_2c.js) : expression lisible par le correcteur */
      const exOk = (e) => { try { Expr.parse(e); return true; } catch (er) { return false; } };
      ok(q.parts.every((p) => p.spec.kind !== "expr" || exOk(p.spec.expr)), id + " " + s + " : expression illisible");
      const vs = [].concat(...q.parts.filter((p) => p.spec.kind !== "expr").map((p) => (p.spec.kind === "pair" ? p.spec.values : [p.spec.value])));
      ok(vs.every((v) => Number.isFinite(v)), id + " " + s + " : valeur non finie " + vs);
      ok(!q.co || q.parts.filter((p) => p.spec.kind !== "pair").every((p) => p.spec.value !== 0 && p.spec.value !== 1), id + " " + s + " : valeur triviale " + vs);
      ok(!/undefined|NaN|Infinity/.test(q.q + q.sol + q.parts.map((p) => p.label).join()), id + " " + s + " : texte « undefined/NaN »");
      ok(Engine.fromCode(q.code).q === q.q, id + " " + s + " : code reproductible");
    }
    const s9 = Engine.newState({ system: "CH", grade: 9, track: "college", minutes: 5 }), s11 = Engine.newState({ system: "CH", grade: 11, track: "college", minutes: 5 });
    const g0 = PROBX[id].map((f) => f()).find((p) => p.co && p.co[0] <= 11).co[0], sG = Engine.newState({ system: "CH", grade: g0, track: "college", minutes: 5 }), q9 = Engine.make(sG, id, 4), q11 = Engine.make(s11, id, 4);
    ok(q9.co ? q9.co.includes(g0) : probList(id).length > 0, id + " : en " + g0 + "e, le niveau 4 est un défi propre (ou un défi commun quand la notion en a)"); /* 28.11 : formule a des défis communs (énergie, IMC, horizon) + le défi « taxi » propre à la 11e (grand problème de la semaine) : un tirage commun est voulu */
    const s12 = Engine.newState({ system: "CH", grade: 12, track: "college", minutes: 5 }), q12 = Engine.make(s12, id, 4); ok(!(q12.co && !q12.co.includes(12)), id + " : pas de défi du Cycle au Collège"); /* 27.11 : un défi réservé à [9, 12] (agent defisch2) est permis en 1re */
  }
  log.push(ids.length + " notions × 40 tirages");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.slice(0, 15).join("\n") : "ok défis 9e : " + log.join(" | ");
});
/* ======== now (ancienne page tests/now.html) ======== */
Lot.section("now", { html: `<style>body{margin:0}#app{width:360px;max-width:360px;box-sizing:border-box}</style>
<main id="app"></main><pre id="out">en cours</pre>` }, function () {
// 25.11 : chapitre « en classe » reconnu à un exercice typique (cartes), sans devinette par la date (plans différents).
const fails = [], ok = (c, m) => { if (!c) fails.push(m); }, log = [];
const over = (root) => [...root.querySelectorAll("*")].filter((e) => e.scrollWidth > e.clientWidth + 1 && !["auto", "scroll"].includes(getComputedStyle(e).overflowX) && e.clientWidth > 0 && !e.closest("mjx-container, .figwrap, .fab-cmt") && !e.matches(".brand")).map((e) => e.className || e.tagName);
try {
  ok(typeof nowGuess === "undefined", "plus de devinette par la date");
  for (const [g, tr] of [[9, "college"], [10, "college"], [11, "college"], [12, "college"], [13, "college"], [14, "college"], [15, "college"], [12, "mp"], [13, "mp"]]) {
    state = Engine.newState({ system: "CH", grade: g, track: tr, minutes: 5 }); Engine.autoInit(state); state.placed = true;
    const chs = nowChapters();
    ok(chs.length >= 2, g + tr + " : chapitres " + chs.length);
    screenNow();
    const cards = app.querySelectorAll(".now-card-pick");
    ok(cards.length === chs.length, g + tr + " : une carte par chapitre, d'emblée");
    ok([...cards].every((c) => c.querySelector(".now-sample .qtext")), g + tr + " : chaque carte a un exercice typique");
    ok(!app.querySelector(".now-was"), g + tr + " : aucun chapitre mis en avant au premier choix");
    ok(!over(app).length, g + tr + " : rien ne dépasse (cartes) " + over(app).slice(0, 3));
    const last = chs.length - 1; cards[last].click();
    ok(Engine.nowActive(state) && state.now.ids.every((id) => chs[last].ids.includes(id)) && state.now.ids.length <= 5, g + tr + " : une carte choisit son chapitre");
    screenNow();
    ok(app.querySelectorAll(".now-was").length === 1 && +app.querySelector(".now-was").dataset.i === last, g + tr + " : chapitre actuel signalé");
    document.getElementById("adv").click();
    ok(app.querySelectorAll(".check input").length > 0, g + tr + " : choix avancé notion par notion");
  }
  log.push("9 classes");
} catch (e) { fails.push("EXC " + e.message + " " + (e.stack || "").split("\n")[1]); }
document.getElementById("out").textContent = fails.length ? "ÉCHEC " + fails.slice(0, 12).join("\n") : "ok chapitre en classe : " + log.join(" | ");
});
Lot.lance();
</script>
