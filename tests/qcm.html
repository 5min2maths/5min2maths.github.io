<script>window.MathJax = { typesetPromise: () => Promise.resolve() }; try { localStorage.clear(); } catch (e) {}</script>
<script src="../src/curriculum.js"></script><script src="../src/ordre.js"></script><script src="../src/expr.js"></script><script src="../src/figures.js"></script><script src="../src/geo.js"></script><script src="../src/generators.js"></script><script src="../src/gen2.js"></script><script src="../src/gen3.js"></script><script src="../src/variantes.js"></script><script src="../src/competences.js"></script><script src="../src/ch11_prop.js"></script><script src="../src/ch11_litt.js"></script><script src="../src/ch1c_eq.js"></script><script src="../src/ch1c_sys.js"></script><script src="../src/ch11_no.js"></script><script src="../src/ch11_gm.js"></script><script src="../src/ch11_ang.js"></script><script src="../src/ch11_thales.js"></script><script src="../src/ch11_proba.js"></script><script src="../src/ch1c_no.js"></script><script src="../src/ch1c_fct.js"></script><script src="../src/ch1c_alg.js"></script><script src="../src/ch1c_f2b.js"></script><script src="../src/ch11_no2.js"></script><script src="../src/ch1c_geo.js"></script><script src="../src/ch1c_trig.js"></script><script src="../src/ch_mp1.js"></script><script src="../src/ch11_fct.js"></script><script src="../src/ch10_no.js"></script><script src="../src/ch_mp2.js"></script><script src="../src/riche.js"></script><script src="../src/riche_11b.js"></script><script src="../src/riche_11c.js"></script><script src="../src/riche_1c.js"></script><script src="../src/riche_sys1c.js"></script><script src="../src/badges.js"></script><script src="../src/backup.js"></script><script src="../src/qr.js"></script><script src="../src/lessons.js"></script><script src="../src/lessons2.js"></script><script src="../src/dyn.js"></script><script src="../src/active.js"></script><script src="../src/act_prop11.js"></script><script src="../src/act_litt11.js"></script><script src="../src/act_eq1c.js"></script><script src="../src/act_sys1c.js"></script><script src="../src/act_ch11b.js"></script><script src="../src/act_ch11c.js"></script><script src="../src/act_1c.js"></script><script src="../src/act_mp2.js"></script><script src="../src/act_manip.js"></script><script src="../src/sujet.js"></script><script src="../src/qcm.js"></script><script src="../src/engine.js"></script><script src="../src/app.js"></script>
<script>
// QCM de préparation (21.11) : sur toutes les notions, la bonne réponse écrite est acceptée par le correcteur, les choix sont distincts, aucun NaN.
const fails=[], ok=(c,m)=>{if(!c)fails.push(m)}, log=[];
const back=(f)=>f.replace(/\\approx\s*/,"").replace(/\\frac\{(\d*)\\sqrt\{(\d+)\}\}\{(\d+)\}/g,"$1√$2/$3").replace(/\\frac\{(\d+)\}\{(\d+)\}/g,"$1/$2").replace(/\\sqrt\{(\d+)\}/g,"√$1").replace(/\\pi/g,"π").replace(/ \\cdot 10\^\{(-?\d+)\}/g,"*10^($1)").replace(/\{,\}/g,",").replace(/'/g,"");
try{
let tot=0,usable=0,notUsable=[];
for(const [g,tr] of [[9,"college"],[10,"college"],[11,"college"],[12,"college"],[12,"mp"],[13,"college"]]){
  state=Engine.newState({system:"CH",grade:g,track:tr,minutes:5});Engine.autoInit(state);
  const ids=[...new Set(NOTIONS.filter(n=>placeOf(n,state.profile)&&placeOf(n,state.profile)[0]===g).map(n=>n.id))];
  for(const id of ids){ tot++; let okN=0;
    for(const d of [1,2,3]) for(let r=0;r<8;r++){ const it=qcmMake(id,d); if(!it) continue; okN++;
      const fs=it.choices.map(c=>c.f); ok(new Set(fs).size===fs.length,id+" choix en double "+fs.join(" | "));
      ok(it.choices.filter(c=>c.ok).length===1,id+" une seule bonne");
      ok(!/NaN|undefined|Infinity/.test(fs.join()+it.q.q),id+" NaN "+fs.join(" | "));
      const g0=it.choices.find(c=>c.ok).f;
      if(!/approx/.test(g0)){ const st=checkAnswer(it.q.spec,back(g0)).status; ok(st==="correct",id+"-"+d+" bonne réponse refusée : "+g0+" → "+back(g0)+" ("+st+") attendu "+it.q.spec.value); }
      for(const c of it.choices.filter(c=>!c.ok)){ if(/approx/.test(c.f)) continue; const st=checkAnswer(it.q.spec,back(c.f)).status; ok(st!=="correct",id+"-"+d+" un piège est accepté comme juste : "+c.f); }
    }
    if(okN) usable++; else notUsable.push(id);
  }
}
log.push("notions avec QCM : "+usable+" sur "+tot+" ; sans : "+notUsable.slice(0,40).join(" "));
// parcours : grille Avant → test rapide → grille ; puis 2e passage → colonne Après
state=Engine.newState({system:"CH",grade:11,track:"college",minutes:5});Engine.autoInit(state);state.placed=true;
state.prep={ids:["prio","fracadd","puiss","rel","pyth","eq1"],date:addDays(day(),4)};
homeTab="test";screenHome();ok(/Autoévaluation et test rapide/.test(app.textContent),"bouton");document.getElementById("qcm").click();
const rows=state.autotest.rows;ok(rows.length>=4&&rows.length<=8,"lignes 4 à 8 : "+rows.length);
ok(new Set(rows.map(r=>r.id)).size>=4,"plusieurs notions dans la grille");
ok(/Je sais…/.test(app.textContent)&&/Respecter les priorités/.test(app.textContent),"libellé « Je sais… »");
document.getElementById("atgo").click();ok(/Il te reste/.test(app.textContent),"il faut tout cocher");
const segs=[...document.querySelectorAll(".at-seg")];segs.forEach((g,k)=>g.querySelector('button[data-v="'+(k%2?2:1)+'"]').click());
document.getElementById("atgo").click();
let k=0;while(document.querySelector(".qcm-c")&&k<20){const bs=[...document.querySelectorAll(".qcm-c")];(k%3?bs.find(b=>!state.autotest.rows):null);const it=bs[0];it.click();ok(!!document.querySelector(".qcm-good"),"bonne réponse montrée");document.getElementById("nx").click();k++;}
ok(k===rows.length,"une question par ligne ("+k+"/"+rows.length+")");
ok(state.autotest.runs.length===1&&/Avant/.test(app.textContent)&&!/Après/.test(app.textContent.replace(/colonne « Après »/,"")),"grille finale, une colonne test");
const r0=state.autotest.runs[0].r, wrongBelieved=rows.filter(r=>r0[r.cid]===0&&state.autotest.avant[r.cid]===2).length;
ok((app.textContent.match(/Tu pensais savoir/g)||[]).length===wrongBelieved,"messages « tu pensais savoir » : "+wrongBelieved);
homeTab="test";screenHome();ok(/Ma grille d'autoévaluation/.test(app.textContent)&&/Dernier test rapide/.test(app.textContent),"accueil Test : grille gardée");
document.getElementById("qcm").click();ok(!!document.getElementById("again")&&!document.getElementById("atgo"),"retour direct à la grille");
document.getElementById("again").click();k=0;while(document.querySelector(".qcm-c")&&k<20){[...document.querySelectorAll(".qcm-c")][1].click();document.getElementById("nx").click();k++;}
ok(state.autotest.runs.length===2&&/Après/.test(app.textContent)&&/1er test/.test(app.textContent),"2e passage : colonne Après");
if(document.getElementById("rev")){document.getElementById("rev").click();ok(session&&session.plan.length>=2,"révision des compétences à revoir");}
state.prep={ids:["fracadd","rel"],date:addDays(day(),3)};screenQcm();ok(state.autotest.runs.length===0&&!!document.getElementById("atgo"),"autre test : nouvelle grille");
// lignes : une par notion au moins (même au-delà de 8 notions), niveau 3 avant les doublons de base, réponse tapée si pas de QCM
for(const ids of [["prio","fracadd","puiss","rel","pyth","eq1"],["prop","fracsimp","pctvar"],["reduire","distrib","eq1","valnum","rac","carres","fracops","pctvar","rel"]]){
  const R=atRows(ids);ok(ids.every(id=>R.some(r=>r.id===id)),"chaque notion a sa ligne : "+ids.join());ok(R.length<=Math.max(8,ids.length),"plafond "+R.length);
  if(ids.length<=4)ok(ids.every(id=>R.filter(r=>r.id===id).some(r=>r.lv>=2)||compsOf(id).length===1),"niveau exigeant présent "+ids.join());}
ok(atRows(["prio","fracadd","puiss"]).filter(r=>r.lv===3).length>=2,"niveau 3 avant les doublons de base");
// parcours mixte : QCM et réponses tapées
state.prep={ids:["prop","fracsimp","pctvar"],date:addDays(day(),3)};state.autotest=null;screenQcm();
[...document.querySelectorAll(".at-seg")].forEach(g=>g.querySelector('button[data-v="1"]').click());document.getElementById("atgo").click();
let typed=0,mc=0;for(let j=0;j<20;j++){if(document.querySelector(".qcm-c")){document.querySelector(".qcm-c").click();mc++;document.getElementById("nx").click();}else if(document.getElementById("idk")){document.getElementById("idk").click();typed++;document.getElementById("nx").click();}else break;}
ok(typed>=1&&mc>=1,"parcours mixte : "+typed+" tapées, "+mc+" à choix");
ok(Object.keys(state.autotest.runs[0].r).length===state.autotest.rows.length,"toutes les lignes ont un résultat");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
document.body.insertAdjacentHTML("beforeend","<pre id=out>"+(fails.length?"ÉCHEC "+fails.length+"\n"+[...new Set(fails)].slice(0,40).join("\n"):"OK")+"\n"+log.join("\n")+"</pre>");
</script>
