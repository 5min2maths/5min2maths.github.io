<script>
// Écrans badges / sauvegarde (rien n'est envoyé : canSend() est faux en file://).
state = Engine.newState({ system: "CH", grade: 9, track: "college", minutes: 5 }); Engine.autoInit(state); state.placed = true;
for (const d of ["2026-11-09", "2026-11-10", "2026-11-11"]) Badges.onDay(state, d);
for (let k = 0; k < 8; k++) Engine.record(state, "decread", 1, 1, true);
for (let k = 0; k < 4; k++) Engine.record(state, "decarr", 2, 2, true);
Engine.finishDay(state, 3, 3);
const w = location.hash.slice(1);
if (w === "summary") { session = { answered: 3, score: 2.5, elo0: state.elo.r - 12, ids: new Set(["decread"]) }; screenSummary(); }
else if (w === "backup") screenBackup();
else if (w === "restore") Backup.encode(state).then((c) => { state = null; screenRestore(c); });
else if (w === "privacy") screenPrivacy(screenHome);
else if (w === "home") screenHome();
else if (w === "nowpick") screenNow();
else if (w.startsWith("now-")) { state = Engine.newState({ system: "CH", grade: 12, track: w.slice(4), minutes: 5 }); Engine.autoInit(state); state.placed = true; screenNow(); document.querySelector("details.olds").open = true; }
else if (w === "nowset") { Engine.setNow(state, ["fracmul", "fracops"].filter((x) => state.notions[x]).concat(["prio"]).slice(0, 2)); screenHome(); }
else if (w === "nowstale") { Engine.setNow(state, ["prio"]); state.now.since = addDays(day(), -22); screenHome(); }
else screenComps();
</script>
