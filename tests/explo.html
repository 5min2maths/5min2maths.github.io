const fails=[],ok=(c,m)=>{if(!c&&fails.length<30)fails.push(m)};Element.prototype.scrollIntoView=function(){};
const log=[];
try{
 for(const c of CURIEUX){let n=0;const vals=new Set();
  for(let sd=1;sd<=200;sd++){const q=Curieux.build(c.key,sd),txt=q.q+q.bet.q+q.bet.choices.join()+q.calc.label+q.reveal+q.titre;
   ok(!/NaN|undefined|Infinity|\[object/.test(txt),c.key+" "+sd+" texte : "+txt.match(/.{0,30}(NaN|undefined|Infinity|\[object).{0,10}/));
   ok(isFinite(q.calc.value),c.key+" valeur");ok(![0,1].includes(q.calc.value),c.key+" valeur triviale "+q.calc.value);
   ok(q.bet.good>=0&&q.bet.good<q.bet.choices.length,c.key+" good");ok(new Set(q.bet.choices).size===q.bet.choices.length,c.key+" choix en double "+q.bet.choices);
   const spec={kind:"value",value:q.calc.value,...(q.calc.round?{round:q.calc.round}:{final:true})};
   const g=(a,b)=>b?g(b,a%b):a; let typed=String(+(+q.calc.value).toFixed(q.calc.round?Math.max(0,-Math.floor(Math.log10(q.calc.round))):6)).replace(".",",");
   if(!q.calc.round&&!Number.isInteger(q.calc.value)){for(let d=2;d<=100;d++){const nn=Math.round(q.calc.value*d);if(Math.abs(nn/d-q.calc.value)<1e-9){typed=nn+"/"+d;break;}}}
   if(q.calc.range){ok(q.calc.range[0]<=q.calc.value&&q.calc.value<=q.calc.range[1],c.key+" valeur hors fourchette");}else
   ok(checkAnswer(spec,typed).status==="correct",c.key+" "+sd+" réponse "+typed+" refusée : "+JSON.stringify(checkAnswer(spec,typed)));
   ok(Curieux.fromCode(q.code).q===q.q,c.key+" code non reproductible");vals.add(q.calc.value);n++;}
  log.push(c.key+" ("+c.fam+", "+c.uses.join("+")+") : "+vals.size+" valeurs");}
 // Accès selon la classe
 const st=(g)=>{const s=Engine.newState({system:"CH",grade:g,track:"college",minutes:5});Engine.autoInit(s);return s};
 const a9=Curieux.available(st(9)).map(c=>c.key),a11=Curieux.available(st(11)).map(c=>c.key),a12=Curieux.available(st(12)).map(c=>c.key);

 // Pas de répétition immédiate, familles alternées
 const s=st(12);let last=null,lastFam=null,rep=0,same=0;for(let k=0;k<40;k++){const q=Curieux.pick(s);s.curSeen=[...(s.curSeen||[]),q.key].slice(-20);if(q.key===last)rep++;if(q.fam===lastFam)same++;last=q.key;lastFam=q.fam;}

 // Écran
 state=s;const back=()=>{window._back=1};screenCurious(Curieux.build("vmoy",5),back);
 ok(document.getElementById("cs2").hidden,"étape 2 cachée avant le pari");
 document.querySelector("#cbet button[data-i='0']").click();ok(!document.getElementById("cs2").hidden,"étape 2 après le pari");
 const q=Curieux.build("vmoy",5);document.getElementById("cans").value=String(q.calc.value);document.getElementById("cok").click();
 ok(!document.getElementById("cs3").hidden,"étape 3 après bonne réponse");ok(/Juste/.test(document.getElementById("cfb").textContent),"message juste");
 ok(document.querySelector("#cbet button.act-ok-btn").dataset.i==="1","bonne réponse du pari marquée");ok(pageQ===q.code,"code pour les commentaires");
 screenCurious(Curieux.build("tva",3),back);document.querySelector("#cbet button").click();document.getElementById("cans").value="1";document.getElementById("cok").click();document.getElementById("cans").value="2";document.getElementById("cok").click();
 ok(!document.getElementById("cs3").hidden,"étape 3 après deux essais faux");
 document.getElementById("cback").click();
 // Fermi : fourchette, puis ordre de grandeur

 document.getElementById("cans").value=String(Math.round(fq.calc.value*1.6));document.getElementById("cok").click();ok(/ordre de grandeur/.test(document.getElementById("cfb").textContent),"Fermi : ordre de grandeur");

 screenCurious(Curieux.build("vmoy",5),back,"onglet");ok(sig&&sig.kind==="curieux"&&sig.code===Curieux.build("vmoy",5).code,"signal ouvert");
 document.querySelector("#cbet button[data-i='1']").click();ok(sig.aide==="P","pari juste noté "+sig.aide);

 screenCurious(Curieux.build("tva",3),back);ok(!sig,"pas de signal en consultation");
 homeTab="today";state.placed=true;screenHome();const cd=app.querySelector('.door[data-door="cur"]');ok(cd,"case Curieux sur l'accueil (22.11)");if(cd){cd.click();ok(document.getElementById("cbet"),"case Curieux → question curieuse");}
 document.body.insertAdjacentHTML("beforeend","<pre id=log>"+log.join("\n")+"</pre>");
}catch(e){fails.push("EXC "+e.message+" "+e.stack)}
