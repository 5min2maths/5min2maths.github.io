 // Récit lié au chapitre en classe (22.11)
 state=Engine.newState({system:"CH",grade:11,track:"college",minutes:5});Engine.autoInit(state);

 ok(!/départ en/.test(app.textContent),"plus de repères de classe");ok(/#243/.test(app.textContent),"numéro affiché");
