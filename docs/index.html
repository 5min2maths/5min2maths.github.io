<meta name="description" content="Chaque jour, quelques minutes de maths, à ton niveau.">

<style>
/* Concept : une page de cahier à petits carreaux ; encre bleue, marge rouge, une carte = une question. */
:root {
  --paper: #fbfcfe;
  --grid: #e3e9f4;
  --ink: #1d2b4f;
  --ink-soft: #5b6687;
  --blue: #2457d6;
  --blue-soft: #e4ecff;
  --margin: #e0565b;
  --card: #ffffff;
  --line: #ccd5e6;
  --ok: #1e8a5a;
  --ok-soft: #e1f5ea;
  --warn: #b7791f;
  --warn-soft: #fdf1dc;
  --bad: #c2413f;
  --bad-soft: #fbe5e4;
  --fluo: #e9ff47;
  --fluo-ink: #1d2b4f;
  --shadow: #1a3fa3;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10162a; --grid: #1b2440; --ink: #e6ebf7; --ink-soft: #9aa6c6; --blue: #7ea2ff; --blue-soft: #1d2c57;
    --margin: #ff7a7f; --card: #161e36; --line: #2a3557; --ok: #4fd39a; --ok-soft: #12352a; --warn: #f0b75a; --warn-soft: #3a2c12;
    --bad: #ff8a87; --bad-soft: #3d1a1d; --fluo: #d6f53a; --fluo-ink: #10162a; --shadow: #3c5fc4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10162a; --grid: #1b2440; --ink: #e6ebf7; --ink-soft: #9aa6c6; --blue: #7ea2ff; --blue-soft: #1d2c57;
  --margin: #ff7a7f; --card: #161e36; --line: #2a3557; --ok: #4fd39a; --ok-soft: #12352a; --warn: #f0b75a; --warn-soft: #3a2c12;
  --bad: #ff8a87; --bad-soft: #3d1a1d; --fluo: #d6f53a; --fluo-ink: #10162a; --shadow: #3c5fc4; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }

.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; color: var(--blue); }
.brand span { font-family: var(--font-mono); font-size: 0.8rem; color: var(--margin); }

/* Carte : la feuille d'exercice, avec sa marge rouge */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 18px 26px;
  position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.card::before { content: ""; position: absolute; left: 14px; top: 10px; bottom: 10px; width: 2px; background: var(--margin); opacity: 0.55; border-radius: 2px; }
.card.flat { padding: 16px; }
.card.flat::before { display: none; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 16px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; padding: 13px 20px; font-size: 1.05rem; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--blue); padding: 8px 10px; }
.btn-big { width: 100%; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 12px; border-radius: 999px; font-size: 0.95rem; }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }

/* Curseur de temps 1–2–5–10 */

/* Question */
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-weight: 700; font-size: 0.78rem; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--blue); }
.qtext { font-size: 1.12rem; }
.figwrap { display: flex; justify-content: center; }
.fig { width: 100%; max-width: 340px; height: auto; }
.fig .f-line, .fig line.f-line { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.fig .f-shape { fill: var(--blue-soft); stroke: var(--ink); stroke-width: 1.6; }
.fig .f-shape2 { fill: var(--grid); stroke: var(--ink); stroke-width: 1.4; }
.fig .f-fill { fill: var(--blue); stroke: none; }
.fig .f-fill2 { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.2; }
.fig .f-soft { fill: var(--grid); stroke: var(--line); }
.fig .f-accent { stroke: var(--margin); fill: none; }
.fig text.f-accent, .fig .f-accent.f-txt { fill: var(--margin); stroke: none; font-weight: 700; }
.fig .f-txt { fill: var(--ink); font-family: var(--font-body); }
.fig .f-on { fill: #fff; font-family: var(--font-body); font-weight: 700; }
.fig .f-dot { fill: var(--margin); }
.fig .f-jump { stroke: var(--margin); fill: none; stroke-width: 1.6; }
.fig .f-head { fill: var(--ink); }
.fig .f-headacc { fill: var(--margin); }

/* Saisie : calculateur */
.answer { display: flex; flex-direction: column; gap: 8px; }
.answer input {
  font-family: var(--font-mono); font-size: 1.15rem; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--paper); color: var(--ink); width: 100%;
}
.preview { min-height: 2.2em; padding: 6px 12px; border-radius: 10px; background: var(--paper); border: 1px dashed var(--line); display: flex; align-items: center; gap: 10px; overflow-x: auto; }
.preview .val { font-family: var(--font-mono); color: var(--ink-soft); font-size: 0.9rem; white-space: nowrap; }
.preview .err { color: var(--ink-soft); font-size: 0.85rem; }
.keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.keypad button { padding: 10px 0; font-family: var(--font-mono); font-size: 1.05rem; border-radius: 10px; }
.keypad .k-op { background: var(--blue-soft); border-color: transparent; color: var(--blue); font-weight: 700; }
.actions { display: flex; gap: 8px; }
.actions .btn-primary { flex: 1; }

/* Feedback à la Moodle */
.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.hint { background: var(--warn-soft); color: var(--warn); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb .sol { color: var(--ink); }
.fb b { font-family: var(--font-display); font-size: 1.05rem; }
.pop { animation: pop 380ms cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(0.96); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.vote { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.85rem; color: var(--ink-soft); flex-wrap: wrap; }
.vote button { padding: 6px 12px; font-size: 1rem; }
.vote button[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); }
.code { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft); user-select: all; }

/* Accueil */
.elo { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.elo .num { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--blue); }
.elo .delta { font-family: var(--font-mono); font-size: 0.85rem; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
.spark { width: 100%; height: 56px; }
.spark path.l { stroke: var(--blue); stroke-width: 2.2; fill: none; }
.spark path.a { fill: var(--blue-soft); stroke: none; }
.spark circle { fill: var(--margin); }
.streak { display: flex; align-items: center; gap: 10px; }
.streak .flame { font-size: 1.6rem; }
.streak b { font-family: var(--font-display); font-size: 1.5rem; }
.badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 0.92rem; }
.bar .track { height: 10px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }

/* Liste des notions (entrée) */
.notion { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.notion:last-child { border-bottom: none; }
.notion .ex { font-size: 0.9rem; color: var(--ink-soft); overflow-x: auto; }
.tri { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; width: max-content; }
.tri button { border: none; border-radius: 0; padding: 5px 10px; font-size: 0.82rem; background: transparent; }
.tri button + button { border-left: 1px solid var(--line); }
.tri button[aria-pressed="true"] { background: var(--blue); color: #fff; font-weight: 700; }

.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

/* ---- Identité : surligneur, pense-bête, boutons en relief, explosion de symboles ---- */
.mark { background: linear-gradient(100deg, transparent 2%, var(--fluo) 4%, var(--fluo) 94%, transparent 97%); color: var(--fluo-ink); padding: 0 0.12em; border-radius: 0.2em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
h1 { font-size: clamp(2rem, 7vw, 2.6rem); }
.tilt { box-shadow: 0 10px 24px -14px rgba(29, 43, 79, 0.45); }
.btn-primary { box-shadow: 0 5px 0 var(--shadow); transition: transform 80ms ease, box-shadow 80ms ease; }
.btn-primary:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.keypad button { box-shadow: 0 2px 0 var(--line); transition: transform 60ms ease; }
.keypad button:active { transform: translateY(2px); box-shadow: none; }
.elo .num { background: linear-gradient(transparent 58%, var(--fluo) 58%, var(--fluo) 92%, transparent 92%); color: var(--ink); padding: 0 4px; }
.burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.burst span { position: absolute; font-family: var(--font-display); font-weight: 800; color: var(--blue); animation: fly 900ms cubic-bezier(.15, .8, .3, 1) forwards; }
.burst span:nth-child(3n) { color: var(--margin); }
.burst span:nth-child(4n) { color: var(--ok); }
@keyframes fly { from { transform: translate(0, 0) rotate(0) scale(0.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .burst { display: none; } }
.part label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.98rem; }
.part .mk { font-family: var(--font-display); font-weight: 800; }
.part input:disabled { border-color: var(--ok); background: var(--ok-soft); }
.checks { display: flex; flex-direction: column; gap: 4px; }
.check { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.check:last-child { border-bottom: none; }
.check input { width: 20px; height: 20px; accent-color: var(--blue); flex: none; }
.datein { font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); max-width: 100%; }

/* Mini-leçons */
.lesson-card h2 { color: var(--blue); }
.rule { background: var(--blue-soft); border-radius: 10px; padding: 10px 12px; }
.trap { background: var(--bad-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; }
.trap b { color: var(--bad); }
.ex-list { display: flex; flex-direction: column; gap: 6px; padding-left: 12px; border-left: 3px solid var(--fluo); overflow-x: auto; }
details.lesson { border: 1px dashed var(--line); border-radius: 10px; padding: 6px 12px; font-size: 0.95rem; }
details.lesson summary { cursor: pointer; color: var(--blue); font-weight: 700; padding: 4px 0; }
details.lesson[open] { background: var(--paper); }

.qmeta .easy { margin-left: auto; padding: 4px 10px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px);
  background: var(--ink, #1d3f8f); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .95rem; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

</style>

// Catalogue des notions (recalibré le 12.11 sur les référentiels : PER / CO, programme du Collège de Genève 2021,

// CH : [année] (9-11 = CO, 12-13 = 1re-2e du Collège). Pas de mois : l'ordre des chapitres varie d'une école à l'autre.
// MP : [année, semestre du PEE] ; absent = comme au CO (notion antérieure) ; null = hors programme MP.
// FR : conservé pour plus tard (France masquée pendant la bêta genevoise).
const THEMES = {
  no: "Nombres et opérations",
  gm: "Grandeurs et mesures",
  fa: "Fonctions et algèbre",
  es: "Espace",

  { id: "vol", theme: "gm", label: "Volumes : pavé, prisme, cylindre", ex: "V = A_{\\text{base}} \\cdot h", CH: [9], FR: [8, 8] },
  { id: "prop", theme: "fa", label: "Proportionnalité, règle de trois", ex: "3 \\text{ kg} \\to 7{,}50 \\text{ CHF}, \\; 5 \\text{ kg} \\to ?", CH: [9], FR: [6, 3] },

  { id: "pyth", theme: "gm", label: "Théorème de Pythagore", ex: "a^2 + b^2 = c^2", CH: [10], MP: [12, "S2"], FR: [8, 3] },
  { id: "reduire", theme: "fa", label: "Réduire une expression", ex: "3x + 5 - x + 2 = 2x + 7", CH: [10], MP: [12, "S1"], FR: [7, 6] },

  { id: "echelle", theme: "fa", label: "Échelles et pentes", ex: "1 : 200 : \\; 3 \\text{ cm} \\to 6 \\text{ m}", CH: [10], FR: [9, 6] },
  { id: "affine", theme: "fa", label: "Fonctions affines", ex: "f(x) = ax + b", CH: [10], MP: [13, "S1"], FR: [9, 7] },
  { id: "polyreg", theme: "es", label: "Polygones réguliers", ex: "\\text{angle au centre} = \\frac{360°}{n}", CH: [10], FR: null },

// Mois de l'année scolaire (0 = septembre ; août compte comme septembre).
function schoolMonth(date) {
  const mo = date.getMonth(); // 0 = janvier
  if (mo >= 7) return Math.max(0, mo - 8);
  return mo + 4; // janvier = 4 … juin = 9, juillet = 10
}

// Calculateur d'expressions : lecture souple de la réponse de l'élève, calcul, mise en forme TeX,
// équivalence d'expressions (par évaluation en plusieurs points) et contrôle de forme.
// Inspiré de Probability Puzzles (atorch) : on ne fixe pas le format de la réponse.

const Expr = (() => {
  function tokenize(src) {
    const s = src
      .replace(/[−–]/g, "-").replace(/[×·∙⋅]/g, "*").replace(/[÷:]/g, "/")
      .replace(/²/g, "^2").replace(/³/g, "^3")
      .replace(/(\d)'(?=\d{3})/g, "$1")          // séparateur de milliers 1'200
      .replace(/(\d)\s+(?=\d{3}\b)/g, "$1")      // 1 200
      .replace(/\[/g, "(").replace(/\]/g, ")");
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.,]/.test(c)) {
        let j = i, seenSep = false;
        while (j < s.length && (/[0-9]/.test(s[j]) || (!seenSep && /[.,]/.test(s[j]) && /[0-9]/.test(s[j + 1] || "")))) {
          if (/[.,]/.test(s[j])) seenSep = true;
          j++;
        }
        if (j === i) throw new Error("Nombre mal écrit");
        toks.push({ t: "num", v: parseFloat(s.slice(i, j).replace(",", ".")) });
        i = j; continue;
      }
      if (c === "√") { toks.push({ t: "fn", v: "sqrt" }); i++; continue; }
      if (c === "∛") { toks.push({ t: "fn", v: "cbrt" }); i++; continue; }
      if (c === "π") { toks.push({ t: "const", v: "pi" }); i++; continue; }
      if (/[a-zA-Zéè]/.test(c)) {
        let j = i;
        while (j < s.length && /[a-zA-Zéè]/.test(s[j])) j++;
        const w = s.slice(i, j).toLowerCase();
        if (w === "sqrt" || w === "racine" || w === "rac") toks.push({ t: "fn", v: "sqrt" });
        else if (w === "cbrt") toks.push({ t: "fn", v: "cbrt" });
        else if (w === "ln") toks.push({ t: "fn", v: "ln" });
        else if (w === "log") toks.push({ t: "fn", v: "log" });
        else if (w === "e" && !/[a-z]/i.test(s[j] || "")) toks.push({ t: "const", v: "e" });
        else if (w === "pi") toks.push({ t: "const", v: "pi" });
        else for (const ch of w) toks.push({ t: "var", v: ch }); // xy = x·y
        i = j; continue;
      }
      if ("+-*/^();=".includes(c)) { toks.push({ t: "op", v: c }); i++; continue; }
      throw new Error("Caractère non reconnu : « " + c + " »");
    }
    return toks;
  }

  function parse(src) {
    const toks = tokenize(src);
    let p = 0;
    const peek = () => toks[p];
    const isOp = (v) => peek() && peek().t === "op" && peek().v === v;
    const startsFactor = () => {
      const k = peek();
      return k && (k.t === "num" || k.t === "var" || k.t === "const" || k.t === "fn" || (k.t === "op" && k.v === "("));
    };
    function list() {
      const items = [stripEq(expr())];
      while (isOp(";")) { p++; items.push(stripEq(expr())); }
      return items.length === 1 ? items[0] : { t: "list", items };
    }
    // « x = 4 » : on garde le membre de droite si le gauche est une variable seule.
    function stripEq(e) {
      if (isOp("=")) {
        p++;
        const r = expr();
        if (e.t === "var") return r;
        return { t: "eq", a: e, b: r };
      }
      return e;
    }
    function expr() {
      let a = term();
      while (isOp("+") || isOp("-")) {
        const o = toks[p++].v;
        a = { t: o === "+" ? "add" : "sub", a, b: term() };
      }
      return a;
    }
    function term() {
      let a = unary();
      for (;;) {
        if (isOp("*") || isOp("/")) {
          const o = toks[p++].v;
          a = { t: o === "*" ? "mul" : "div", a, b: unary() };
        } else if (startsFactor()) {
          a = { t: "mul", a, b: power(), implicit: true };
        } else break;
      }
      return a;
    }
    function unary() {
      if (isOp("-")) { p++; return { t: "neg", a: unary() }; }
      if (isOp("+")) { p++; return unary(); }
      return power();
    }
    function power() {
      const base = primary();
      if (isOp("^")) { p++; return { t: "pow", a: base, b: unary() }; }
      return base;
    }
    function primary() {
      const k = peek();
      if (!k) throw new Error("Expression incomplète");
      if (k.t === "num") { p++; return { t: "num", v: k.v }; }
      if (k.t === "var") { p++; return { t: "var", v: k.v }; }
      if (k.t === "const") { p++; return { t: "const", v: k.v }; }
      if (k.t === "fn") {
        p++;
        // √2, √(x+1), √x : l'argument est un facteur (avec sa puissance éventuelle)
        return { t: "fn", f: k.v, a: power() };
      }
      if (isOp("(")) {
        p++;
        const e = expr();
        if (!isOp(")")) throw new Error("Parenthèse non fermée");
        p++;
        return { t: "par", a: e };
      }
      throw new Error("Symbole inattendu : « " + k.v + " »");
    }
    const tree = list();
    if (p < toks.length) throw new Error("Symbole en trop : « " + toks[p].v + " »");
    return tree;
  }

  function evaluate(n, env = {}) {
    switch (n.t) {
      case "num": return n.v;
      case "const": return n.v === "e" ? Math.E : Math.PI;
      case "var": return env[n.v] !== undefined ? env[n.v] : NaN;
      case "par": return evaluate(n.a, env);
      case "neg": return -evaluate(n.a, env);
      case "add": return evaluate(n.a, env) + evaluate(n.b, env);
      case "sub": return evaluate(n.a, env) - evaluate(n.b, env);
      case "mul": return evaluate(n.a, env) * evaluate(n.b, env);
      case "div": return evaluate(n.a, env) / evaluate(n.b, env);
      case "pow": return Math.pow(evaluate(n.a, env), evaluate(n.b, env));
      case "fn": { const v = evaluate(n.a, env); return n.f === "sqrt" ? Math.sqrt(v) : n.f === "cbrt" ? Math.cbrt(v) : n.f === "ln" ? Math.log(v) : Math.log10(v); }
      default: return NaN;
    }
  }

  const fmtNum = (v) => String(+v.toPrecision(12)).replace(".", "{,}");
  function tex(n) {
    switch (n.t) {
      case "num": return fmtNum(n.v);
      case "const": return n.v === "e" ? "e" : "\\pi";
      case "var": return n.v;
      case "par": return "\\left(" + tex(n.a) + "\\right)";
      case "neg": return "-" + tex(n.a);
      case "add": return tex(n.a) + " + " + tex(n.b);
      case "sub": return tex(n.a) + " - " + tex(n.b);
      case "mul": return tex(n.a) + (n.implicit ? " " : " \\cdot ") + tex(n.b);
      case "div": return "\\frac{" + tex(unpar(n.a)) + "}{" + tex(unpar(n.b)) + "}";
      case "pow": return "{" + tex(n.a) + "}^{" + tex(unpar(n.b)) + "}";
      case "fn": return n.f === "sqrt" ? "\\sqrt{" + tex(unpar(n.a)) + "}" : n.f === "cbrt" ? "\\sqrt[3]{" + tex(unpar(n.a)) + "}" : "\\" + n.f + "\\left(" + tex(unpar(n.a)) + "\\right)";
      case "list": return n.items.map(tex).join(" \\; ; \\; ");
      case "eq": return tex(n.a) + " = " + tex(n.b);
      default: return "?";
    }
  }
  const unpar = (n) => (n.t === "par" ? n.a : n);

  const vars = (n, s = new Set()) => {
    if (!n) return s;
    if (n.t === "var") s.add(n.v);
    for (const k of ["a", "b"]) if (n[k]) vars(n[k], s);
    if (n.items) n.items.forEach((i) => vars(i, s));
    return s;
  };
  const hasSum = (n) => {
    n = unpar(n);
    if (n.t === "add" || n.t === "sub") return vars(n).size > 0;
    if (n.t === "neg") return hasSum(n.a);
    return false;
  };
  // Forme « produit » : le nœud principal est un produit ou une puissance (signe moins mis à part).
  function isProduct(n) {
    n = unpar(n);
    while (n.t === "neg") n = unpar(n.a);
    return n.t === "mul" || (n.t === "pow" && hasSum(n.a));
  }
  // Forme « développée » : aucun produit ni puissance d'une somme contenant une lettre.
  function isExpanded(n) {
    if (!n) return true;
    if (n.t === "mul" && (hasSum(n.a) || hasSum(n.b))) return false;
    if (n.t === "pow" && hasSum(n.a)) return false;
    if (n.t === "div" && vars(n.b).size > 0) return false;
    return ["a", "b"].every((k) => isExpanded(n[k]));
  }

  const SAMPLES = [-3.7, -1.3, 0.6, 2.2, 4.1];
  function sameValue(u, v, rel = 1e-9) {
    if (!isFinite(u) || !isFinite(v)) return false;
    return Math.abs(u - v) <= rel * Math.max(1, Math.abs(v));
  }
  // pos : lettres positives (formules de géométrie : racines définies).
  function equivalent(a, b, pos) {
    const vs = [...new Set([...vars(a), ...vars(b)])], S = pos ? [0.7, 1.3, 2.2, 3.7, 4.1, 5.9, 0.4] : SAMPLES;
    let valid = 0;
    for (let i = 0; i < S.length; i++) {
      const env = {};
      vs.forEach((v, j) => (env[v] = S[(i + 2 * j) % S.length] + (pos ? j * 0.37 : 0)));
      const want = evaluate(b, env);
      if (!isFinite(want)) continue; // point hors domaine de la réponse attendue
      valid++;
      if (!sameValue(evaluate(a, env), want, 1e-8)) return false;
    }
    return valid >= 2;
  }

  // Nombre de nœuds et présence d'une division par une expression littérale.
  const nodes = (n) => (!n || typeof n !== "object" ? 0 : 1 + nodes(n.a) + nodes(n.b));
  const hasDiv = (n) => !!n && typeof n === "object" && ((n.t === "div" && vars(n.b).size > 0) || hasDiv(n.a) || hasDiv(n.b));
  // « Une seule fraction » : un quotient (éventuellement précédé d'un signe), sans autre division littérale.
  function isOneFrac(n) {
    n = unpar(n);
    while (n.t === "neg") n = unpar(n.a);
    return n.t === "div" && !hasDiv(n.a) && !hasDiv(n.b);
  }
  return { parse, evaluate, tex, vars, isProduct, isExpanded, equivalent, sameValue, unpar, nodes, hasDiv, isOneFrac };
})();

// Ensembles de solutions (inéquations, domaines) : réunion d'intervalles [a, aIncl, b, bIncl].
const SolSet = (() => {
  const INF = /^\s*(\+?\s*(∞|inf(ini)?|oo))\s*$/i, NINF = /^\s*-\s*(∞|inf(ini)?|oo)\s*$/i;
  const num = (s) => {
    if (INF.test(s)) return Infinity;
    if (NINF.test(s)) return -Infinity;
    const t = Expr.parse(s);
    if (Expr.vars(t).size) throw new Error("Borne illisible : " + s);
    return Expr.evaluate(t);
  };
  const inside = (ivs, x) => ivs.some(([a, ai, b, bi]) => (x > a || (ai && x === a) || (ai && Expr.sameValue(x, a))) && (x < b || (bi && x === b) || (bi && Expr.sameValue(x, b))));
  // Lecture de la réponse de l'élève → liste d'intervalles (ou exclusions).
  function parse(input) {
    let s = String(input).trim().replace(/≤|=</g, "<=").replace(/≥|=>/g, ">=").replace(/≠|=\/=|<>/g, "!=").replace(/−/g, "-").replace(/\s+/g, " ");
    if (/^(aucune?s?|∅|\{\s*\}|vide|pas de solution|impossible)/i.test(s)) return [];
    const ALL = "(?:ℝ|R|IR|tous|tout)";
    if (new RegExp("^" + ALL + "$", "i").test(s)) return [[-Infinity, false, Infinity, false]];
    let m = s.match(new RegExp("^" + ALL + "\\s*(?:\\\\|\\-|privé de|sauf)\\s*\\{?([^}]*)\\}?$", "i"));
    if (m) return excl(m[1].split(/;|\s+et\s+/).map((x) => num(x)));
    const pieces = s.split(/\s*(?:∪|\bU\b|\bou\b|\bor\b)\s*/i);
    let out = [], ex = [];
    for (const pc of pieces) {
      let q = pc.trim();
      if (!q) continue;
      if ((m = q.match(/^([\[\]\(])\s*(.+?)\s*;\s*(.+?)\s*([\[\]\)])$/)) || (m = q.match(/^([\[\]\(])\s*([^,;]+?)\s*,\s*([^,;]+?)\s*([\[\]\)])$/))) {
        out.push([num(m[2]), m[1] === "[", num(m[3]), m[4] === "]"]); continue;
      }
      if ((m = q.match(/^(.+?)\s*(<=|<)\s*x\s*(<=|<)\s*(.+)$/i))) { out.push([num(m[1]), m[2] === "<=", num(m[4]), m[3] === "<="]); continue; }
      if ((m = q.match(/^(.+?)\s*(>=|>)\s*x\s*(>=|>)\s*(.+)$/i))) { out.push([num(m[4]), m[3] === ">=", num(m[1]), m[2] === ">="]); continue; }
      if ((m = q.match(/^x\s*(<=|>=|<|>|!=|=)\s*(.+)$/i))) { add(out, ex, m[1], num(m[2])); continue; }
      if ((m = q.match(/^(.+?)\s*(<=|>=|<|>)\s*x$/i))) { add(out, ex, { "<=": ">=", ">=": "<=", "<": ">", ">": "<" }[m[2]], num(m[1])); continue; }
      throw new Error("Écris par exemple « x <= -2 ou x > 3 », « -1 < x <= 4 » ou « ]-∞ ; 2] ∪ [5 ; +∞[ ».");
    }
    if (ex.length) { const e = excl(ex); return out.length ? out.concat(e) : e; }
    return out;
  }
  function add(out, ex, op, v) {
    if (op === "<") out.push([-Infinity, false, v, false]);
    else if (op === "<=") out.push([-Infinity, false, v, true]);
    else if (op === ">") out.push([v, false, Infinity, false]);
    else if (op === ">=") out.push([v, true, Infinity, false]);
    else if (op === "=") out.push([v, true, v, true]);
    else ex.push(v);
  }
  function excl(vals) {
    const v = [...vals].sort((a, b) => a - b), out = [];
    let lo = -Infinity;
    v.forEach((x) => { out.push([lo, false, x, false]); lo = x; });
    out.push([lo, false, Infinity, false]);
    return out;
  }
  // Points de test : bornes des deux ensembles, voisins immédiats, milieux, au-delà.
  function check(want, got) {
    const bs = [...new Set(want.concat(got).flatMap(([a, , b]) => [a, b]).filter(isFinite))].sort((a, b) => a - b);
    const pts = [], edges = new Set(bs);
    if (!bs.length) pts.push(0, 1e4, -1e4);
    bs.forEach((b, i) => { pts.push(b, b - 1e-6, b + 1e-6); if (i < bs.length - 1) pts.push((b + bs[i + 1]) / 2); });
    if (bs.length) pts.push(bs[0] - 1.7, bs[bs.length - 1] + 1.7, -1e5, 1e5);
    let edgeOnly = true, bad = false;
    for (const x of pts) if (inside(want, x) !== inside(got, x)) { bad = true; if (!edges.has(x)) edgeOnly = false; }
    if (!bad) return { status: "correct" };
    if (edgeOnly) return { status: "close", message: "Les intervalles sont justes : vérifie si les bornes sont comprises ou exclues." };
    return { status: "wrong" };
  }
  // Écriture : fraction simple si possible.
  const nstr = (v, tex) => {
    if (v === Infinity) return tex ? "+\\infty" : "+∞";
    if (v === -Infinity) return tex ? "-\\infty" : "-∞";
    if (Number.isInteger(v)) return String(v);
    for (let d = 2; d <= 30; d++) if (Math.abs(v * d - Math.round(v * d)) < 1e-9) return tex ? (v < 0 ? "-" : "") + "\\frac{" + Math.abs(Math.round(v * d)) + "}{" + d + "}" : Math.round(v * d) + "/" + d;
    return tex ? String(+v.toFixed(3)).replace(".", "{,}") : String(v);
  };
  function show(ivs, tex = true) {
    if (!ivs.length) return tex ? "\\varnothing" : "aucune";
    const sep = tex ? " \\cup " : " ∪ ";
    return ivs.map(([a, ai, b, bi]) => a === b ? (tex ? "\\{" + nstr(a, tex) + "\\}" : "[" + nstr(a) + " ; " + nstr(a) + "]") : (ai ? "[" : "]") + nstr(a, tex) + (tex ? " \\, ; \\, " : " ; ") + nstr(b, tex) + (bi ? "]" : "[")).join(sep);
  }
  return { parse, check, show, inside };
})();

// Vérifie la réponse de l'élève selon la spécification de la question.
// spec.kind : "value" (valeur numérique, round = précision demandée), "expr" (expression en x,
// form = "product" | "expanded"), "set" (liste de solutions), "choice" (index d'option).
// Résultat : { status: "correct" | "close" | "wrong" | "invalid" | "form", message }
function checkAnswer(spec, input) {
  if (spec.kind === "choice") return { status: input === spec.index ? "correct" : "wrong" };
  if (spec.kind === "ineq") {
    const m = String(input).replace(/≤/g, "<=").replace(/≥/g, ">=").match(/^\s*x\s*(<=|>=|<|>)\s*(.+)$/i);
    if (!m) return { status: "invalid", message: "Écris par exemple « x > 4 » ou « x <= -3 »." };
    let v;
    try { const t = Expr.parse(m[2]); v = Expr.evaluate(t); } catch (e) { return { status: "invalid", message: e.message }; }
    const okVal = Expr.sameValue(v, spec.value), okOp = m[1] === spec.op;
    if (okVal && okOp) return { status: "correct" };
    if (okVal) return { status: "close", message: "La borne est juste ; vérifie le sens de l'inégalité (et s'il faut retourner le signe)." };
    return { status: "wrong" };
  }
  if (spec.kind === "solset") {
    let got;
    try { got = SolSet.parse(input); } catch (e) { return { status: "invalid", message: e.message }; }
    return SolSet.check(spec.ivs, got);
  }
  const none = /aucun|∅|vide|pas de solution|impossible/i.test(String(input));
  if (spec.kind === "set" && (none || spec.values.length === 0)) return { status: none && spec.values.length === 0 ? "correct" : spec.values.length === 0 ? "wrong" : "wrong" };
  let tree;
  try { tree = Expr.parse(String(input)); }
  catch (e) { return { status: "invalid", message: e.message }; }
  if (spec.kind === "value") {
    if (Expr.vars(tree).size) return { status: "invalid", message: "La réponse est un nombre : pas de lettre." };
    const v = Expr.evaluate(tree);
    if (!isFinite(v)) return { status: "invalid", message: "Ce calcul n'a pas de valeur (division par zéro ?)." };
    if (spec.round) {
      if (Math.abs(v - spec.value) <= spec.round / 2 + 1e-9) return { status: "correct" };
      if (Math.abs(v - spec.value) <= spec.round * 5) return { status: "close", message: "Presque : vérifie l'arrondi (au " + (spec.round === 0.01 ? "centième" : spec.round === 0.1 ? "dixième" : "près") + ")." };
      return { status: "wrong" };
    }
    if (Expr.sameValue(v, spec.value)) return { status: "correct" };
    if (Math.abs(v - spec.value) <= 1e-3 * Math.max(1, Math.abs(spec.value))) return { status: "close", message: "Très proche : donne la valeur exacte (fraction, racine, π…)." };
    return { status: "wrong" };
  }
  if (spec.kind === "set") {
    const items = tree.t === "list" ? tree.items : [tree];
    if (items.some((i) => Expr.vars(i).size)) return { status: "invalid", message: "Sépare les solutions par « ; »." };
    const got = items.map((i) => Expr.evaluate(i));
    const want = spec.values;
    const okAll = want.every((w) => got.some((g) => Expr.sameValue(g, w))) && got.every((g) => want.some((w) => Expr.sameValue(g, w)));
    if (okAll) return { status: "correct" };
    if (want.some((w) => got.some((g) => Expr.sameValue(g, w)))) return { status: "close", message: "Il manque une solution, ou il y en a une en trop." };
    return { status: "wrong" };
  }
  if (spec.kind === "pair") {
    const items = tree.t === "list" ? tree.items : [tree];
    const n = spec.values.length;
    if (items.length !== n || items.some((i) => Expr.vars(i).size)) return { status: "invalid", message: n === 3 ? "Donne trois nombres séparés par « ; » (x, puis y, puis z)." : "Donne deux nombres séparés par « ; » (x d'abord, puis y)." };
    if (n === 3) { const g = items.map((i) => Expr.evaluate(i)); if (g.every((v, k) => Expr.sameValue(v, spec.values[k]))) return { status: "correct" }; return g.filter((v, k) => Expr.sameValue(v, spec.values[k])).length >= 1 ? { status: "close", message: "Une partie est juste : vérifie chaque valeur dans les trois équations." } : { status: "wrong" }; }
    const [u, v] = items.map((i) => Expr.evaluate(i));
    if (Expr.sameValue(u, spec.values[0]) && Expr.sameValue(v, spec.values[1])) return { status: "correct" };
    if (Expr.sameValue(u, spec.values[1]) && Expr.sameValue(v, spec.values[0])) return { status: "close", message: "Les deux valeurs sont justes, mais dans le mauvais ordre : x d'abord." };
    return { status: "wrong" };
  }
  if (spec.kind === "expr") {
    const target = Expr.parse(spec.expr);
    if (tree.t === "list" || tree.t === "eq") return { status: "invalid", message: "Donne une seule expression." };
    if (!Expr.equivalent(tree, target, spec.pos)) return { status: "wrong" };
    if (spec.form === "nodiv" && Expr.hasDiv(tree)) return { status: "form", message: "C'est égal, mais on peut encore simplifier : il ne doit plus rester de fraction." };
    if (spec.form === "onefrac" && !Expr.isOneFrac(tree)) return { status: "form", message: "C'est égal, mais écris le résultat comme une seule fraction." };
    if (spec.maxNodes && Expr.nodes(tree) > spec.maxNodes) return { status: "form", message: "C'est égal, mais la fraction n'est pas simplifiée." };
    if (spec.form === "product" && !Expr.isProduct(tree)) return { status: "form", message: "C'est égal, mais ce n'est pas factorisé : écris un produit." };
    if (spec.form === "expanded" && !Expr.isExpanded(tree)) return { status: "form", message: "C'est égal, mais il reste des parenthèses : développe complètement." };
    return { status: "correct" };
  }
  return { status: "invalid" };
}

// Figures SVG générées avec les valeurs de chaque question (aucune image externe).
// Couleurs par classes CSS (.f-line, .f-fill, .f-accent, .f-soft, .f-txt) pour suivre le thème clair / sombre.

const FIG = (() => {
  const svg = (w, h, body, label) =>

      const a = R.nz(-4, 4), b = R.nz(-6, 6);
      return { q: "Calcule " + M(poly([a, b, 0])) + " pour " + M("x = " + x) + ".", spec: { kind: "value", value: a * x * x + b * x }, sol: M(a + " \\cdot " + par(x) + "^2 " + (b < 0 ? "- " + -b : "+ " + b) + " \\cdot " + par(x) + " = " + (a * x * x + b * x)) };
    }
    let a, b; do { a = R.int(-6, 8); b = R.nz(-6, 6); } while (a + b === 0);
    return { q: "Calcule " + M("\\frac{(a - b)^2}{a + b}") + " pour " + M("a = " + a) + " et " + M("b = " + b) + ".", spec: { kind: "value", value: (a - b) ** 2 / (a + b) }, sol: M("\\frac{" + par(a - b) + "^2}{" + (a + b) + "} = " + frac((a - b) ** 2, a + b)) };
  },

  reduire(d) {
    if (d === 1) {
      const a = R.int(2, 9), b = R.nz(-9, 9), c = R.nz(-5, 5), e = R.nz(-9, 9);
      const t = poly([a, b]) + (c < 0 ? " - " : " + ") + (Math.abs(c) === 1 ? "" : Math.abs(c)) + "x" + (e < 0 ? " - " : " + ") + Math.abs(e);
      return { q: "Réduis : " + M(t), spec: { kind: "expr", expr: (a + c) + "x+(" + (b + e) + ")", form: "expanded" }, sol: M(poly([a + c, b + e])) };
    }
    if (d === 2) {
      const a = R.int(2, 6), b = R.nz(-6, 6), c = R.nz(-5, 5), e = R.nz(-6, 6), f = R.nz(-9, 9);
      const t = poly([a, b, 0]) + (c < 0 ? " - " : " + ") + Math.abs(c) + "x^2" + (e < 0 ? " - " : " + ") + Math.abs(e) + "x" + (f < 0 ? " - " : " + ") + Math.abs(f);
      return { q: "Réduis : " + M(t), spec: { kind: "expr", expr: (a + c) + "x^2+(" + (b + e) + ")x+(" + f + ")", form: "expanded" }, sol: M(poly([a + c, b + e, f])) };
    }
    const a = R.int(2, 5), b = R.int(1, 7), c = R.int(2, 5), e = R.int(1, 7);
    return { q: "Réduis : " + M("-(" + a + "x - " + b + ") + " + c + "(x - " + e + ")"), spec: { kind: "expr", expr: "-" + a + "x+" + b + "+" + c + "x-" + c * e, form: "expanded" }, sol: M("-" + a + "x + " + b + " + " + c + "x - " + c * e + " = " + poly([c - a, b - c * e])) };
  },

  distrib(d) {
    if (d === 1) {
      const k = R.pick([-6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 7]), a = R.int(1, 6), b = R.nz(-9, 9);
      return { fig: FIG.tiles(160, 70, poly([a, b]).replace(/\^2/g,"²"), String(k)), q: "Développe : " + M(k + "(" + poly([a, b]) + ")"), spec: { kind: "expr", expr: k + "*(" + a + "x+(" + b + "))", form: "expanded" }, sol: M(poly([k * a, k * b])) };
    }
    if (d === 2) {
      const a = R.nz(-8, 8), b = R.nz(-8, 8);
      return { fig: FIG.tiles(170, 90, "x " + (a < 0 ? "− " + -a : "+ " + a), "x " + (b < 0 ? "− " + -b : "+ " + b)), q: "Développe et réduis : " + M("(" + poly([1, a]) + ")(" + poly([1, b]) + ")"), spec: { kind: "expr", expr: "(x+(" + a + "))(x+(" + b + "))", form: "expanded" }, sol: M("x^2 " + (b < 0 ? "- " + -b : "+ " + b) + "x " + (a < 0 ? "- " + -a : "+ " + a) + "x " + (a * b < 0 ? "- " + -a * b : "+ " + a * b) + " = " + poly([1, a + b, a * b])) };
    }
    const a = R.int(2, 5), b = R.nz(-7, 7), c = R.int(2, 5), e = R.nz(-7, 7);
    return { q: "Développe et réduis : " + M("(" + poly([a, b]) + ")(" + poly([c, e]) + ")"), spec: { kind: "expr", expr: "(" + a + "x+(" + b + "))(" + c + "x+(" + e + "))", form: "expanded" }, sol: M(poly([a * c, a * e + b * c, b * e])) };
  },

  idrem(d) {
    const a = R.int(1, 9);
    if (d === 1) return { fig: FIG.tiles(120, 120, "x + " + a, "x + " + a), q: "Développe : " + M("(x + " + a + ")^2"), spec: { kind: "expr", expr: "(x+" + a + ")^2", form: "expanded" }, sol: M("x^2 + 2 \\cdot " + a + "x + " + a + "^2 = " + poly([1, 2 * a, a * a])) };
    if (d === 2) {
      if (R.rand() < 0.5) return { q: "Développe : " + M("(x - " + a + ")^2"), spec: { kind: "expr", expr: "(x-" + a + ")^2", form: "expanded" }, sol: M(poly([1, -2 * a, a * a])) + " (n'oublie pas le double produit)." };
      return { q: "Développe : " + M("(x + " + a + ")(x - " + a + ")"), spec: { kind: "expr", expr: "x^2-" + a * a, form: "expanded" }, sol: M("x^2 - " + a * a) };
    }
    const k = R.int(2, 5), b = R.int(1, 7);
    return { q: "Développe : " + M("(" + k + "x - " + b + ")^2"), spec: { kind: "expr", expr: "(" + k + "x-" + b + ")^2", form: "expanded" }, sol: M(k * k + "x^2 - " + 2 * k * b + "x + " + b * b) };
  },

  factor(d) {
    if (d === 1) {
      const g = R.int(2, 6), a = R.int(1, 5), b = R.nz(-7, 7);
      if (gcd(a, b) !== 1) return GEN.factor(1);
      return { fig: FIG.tiles(170, 70, "?", "?"), q: "Factorise : " + M(poly([g * a, g * b, 0])), spec: { kind: "expr", expr: g + "x(" + a + "x+(" + b + "))", form: "product" }, sol: M(g + "x(" + poly([a, b]) + ")") + " : mise en évidence de " + M(g + "x") + "." };
    }
    if (d === 2) {
      const a = R.int(1, 9), k = R.pick([1, 1, 2, 3]);
      const t = (k === 1 ? "" : k * k) + "x^2 - " + a * a;
      return { q: "Factorise : " + M(t), spec: { kind: "expr", expr: "(" + k + "x-" + a + ")(" + k + "x+" + a + ")", form: "product" }, sol: M("(" + (k === 1 ? "" : k) + "x - " + a + ")(" + (k === 1 ? "" : k) + "x + " + a + ")") + " : identité " + M("a^2 - b^2") + "." };
    }
    if (R.rand() < 0.5) {
      const a = R.nz(-9, 9);
      return { q: "Factorise : " + M(poly([1, 2 * a, a * a])), spec: { kind: "expr", expr: "(x+(" + a + "))^2", form: "product" }, sol: M("(" + poly([1, a]) + ")^2") };
    }
    let a, b; do { a = R.nz(-8, 8); b = R.nz(-8, 8); } while (a === -b || a === b);
    return { q: "Factorise : " + M(poly([1, a + b, a * b])), spec: { kind: "expr", expr: "(x+(" + a + "))(x+(" + b + "))", form: "product" }, sol: M("(" + poly([1, a]) + ")(" + poly([1, b]) + ")") + " : deux nombres de somme " + M(a + b) + " et de produit " + M(a * b) + "." };
  },

  eq1(d) {
    if (d === 1) {
      const a = R.nz(-6, 7), x = R.nz(-9, 9), b = R.nz(-12, 12);
      return { fig: FIG.balance(poly([a, b]).replace(/\^2/g,"²"), String(a * x + b)), q: "Résous : " + M(poly([a, b]) + " = " + (a * x + b)), spec: { kind: "value", value: x }, sol: M(a + "x = " + (a * x + b - b) + " \\iff x = " + x) };
    }
    if (d === 2) {
      let a, c; do { a = R.int(2, 6); c = R.int(1, 5); } while (a === c);
      const b = R.nz(-6, 6), e = R.nz(-9, 9);
      const x = (e - a * b) / (a - c);
      return { fig: FIG.balance(a + "(x " + (b < 0 ? "− " + -b : "+ " + b) + ")", poly([c, e])), q: "Résous : " + M(a + "(x " + (b < 0 ? "- " + -b : "+ " + b) + ") = " + poly([c, e])), spec: { kind: "value", value: x }, sol: M(a + "x " + (a * b < 0 ? "- " + -a * b : "+ " + a * b) + " = " + poly([c, e]) + " \\iff " + (a - c) + "x = " + (e - a * b) + " \\iff x = " + frac(e - a * b, a - c)) };
    }
    const p = R.pick([2, 3, 4]), r = R.pick([3, 5, 6]), b = R.nz(-5, 5);
    if (p === r) return GEN.eq1(3);
    // x/p + b = x/r  →  x(1/p - 1/r) = -b
    const x = -b / (1 / p - 1 / r);
    return { q: "Résous : " + M("\\frac{x}{" + p + "} " + (b < 0 ? "- " + -b : "+ " + b) + " = \\frac{x}{" + r + "}"), spec: { kind: "value", value: x }, sol: "On multiplie par " + M(p * r / gcd(p, r)) + " : la solution est " + M("x = " + frac(-b * p * r, r - p)) + "." };
  },

  eq2(d) {
    if (d === 1) {
      const a = R.nz(-9, 9), b = R.nz(-9, 9);
      return { q: "Résous : " + M("(" + poly([1, -a]) + ")(" + poly([1, b]) + ") = 0") + ". Sépare les solutions par « ; ».", spec: { kind: "set", values: [...new Set([a, -b])] }, sol: "Un produit est nul si l'un des facteurs est nul : " + M("x = " + a) + " ou " + M("x = " + -b) + "." };
    }
    if (d === 2) {
      const k = R.int(2, 12);
      return { q: "Résous : " + M("x^2 - " + k + "x = 0") + ". Sépare les solutions par « ; ».", spec: { kind: "set", values: [0, k] }, sol: M("x(x - " + k + ") = 0") + " : " + M("x = 0") + " ou " + M("x = " + k) + "." };
    }
    const a = R.int(2, 5), b = R.int(1, 9);
    if (gcd(a, b) !== 1) return GEN.eq2(3);
    return { q: "Résous : " + M(a * a + "x^2 - " + b * b + " = 0") + ". Sépare les solutions par « ; ».", spec: { kind: "set", values: [b / a, -b / a] }, sol: M("(" + a + "x - " + b + ")(" + a + "x + " + b + ") = 0") + " : " + M("x = " + frac(b, a)) + " ou " + M("x = -" + frac(b, a)) + "." };
  },

  prop(d) {
    if (d === 1) {
      const k = R.int(2, 6), u = R.int(2, 9), n = R.int(2, 12);
      return { fig: FIG.items(k, k + " cahiers → " + k * u + " CHF"), q: M(k) + " cahiers coûtent " + M(k * u) + " CHF. Combien coûtent " + M(n) + " cahiers ?", spec: { kind: "value", value: n * u }, sol: "Un cahier coûte " + M(u) + " CHF, donc " + M(n + " \\cdot " + u + " = " + n * u) + " CHF." };
    }
    if (d === 2) {
      const g = 25 * R.int(4, 16), p1 = R.pick([4, 6, 8]), p2 = R.pick([3, 5, 10, 12]);
      return { fig: FIG.items(p1, p1 + " personnes → " + g + " g"), q: "Pour " + M(p1) + " personnes, une recette demande " + M(g) + " g de farine. Combien en faut-il pour " + M(p2) + " personnes ?", spec: { kind: "value", value: (g * p2) / p1 }, sol: M("\\frac{" + g + "}{" + p1 + "} \\cdot " + p2 + " = " + dec((g * p2) / p1)) + " g." };
    }
    const rate = R.pick([0.92, 0.94, 0.95, 1.05, 1.08]), e = 10 * R.int(2, 30);
    return { q: "1 euro vaut " + M(dec(rate)) + " CHF. Combien d'euros obtient-on pour " + M(dec(e * rate)) + " CHF ?", spec: { kind: "value", value: e }, sol: M(dec(e * rate) + " : " + dec(rate) + " = " + e) + " euros." };
  },

  vitesse(d) {
    if (d === 1) {
      const v = 10 * R.int(3, 12), t = R.int(2, 5);
      return { fig: FIG.road(v * t + " km", t + " h"), q: "Une voiture parcourt " + M(v * t) + " km en " + M(t) + " h. Quelle est sa vitesse moyenne (en km/h) ?", spec: { kind: "value", value: v }, sol: M("v = \\frac{" + v * t + "}{" + t + "} = " + v) + " km/h." };
    }
    if (d === 2) {
      const v = R.pick([60, 72, 80, 90, 120]), mins = R.pick([15, 20, 30, 40, 45]), dist = (v * mins) / 60;
      return { fig: FIG.road(FIG.fmt(dist) + " km", v + " km/h"), q: "À " + M(v) + " km/h, combien de minutes faut-il pour parcourir " + M(dec(dist)) + " km ?", spec: { kind: "value", value: mins }, sol: M("t = \\frac{" + dec(dist) + "}{" + v + "} \\text{ h} = " + mins) + " min." };
    }
    const v = 18 * R.int(1, 7);
    return { q: "Convertis " + M(v) + " km/h en m/s.", spec: { kind: "value", value: v / 3.6 }, sol: M(v + " : 3{,}6 = " + dec(v / 3.6)) + " m/s." };
  },

  echelle(d) {
    if (d === 1) {
      const k = R.pick([100, 200, 500, 1000]), c = R.int(2, 12);
      return { fig: FIG.scaling(k, "1:" + k), q: "Sur un plan à l'échelle " + M("1 : " + k) + ", un mur mesure " + M(c) + " cm. Quelle est sa longueur réelle, en mètres ?", spec: { kind: "value", value: (c * k) / 100 }, sol: M(c + " \\cdot " + k + " = " + c * k) + " cm, soit " + M(dec((c * k) / 100)) + " m." };
    }
    if (d === 2) {
      const k = R.int(2, 5), A = R.int(2, 12);
      return { fig: FIG.scaling(k, ""), q: "On agrandit une figure de rapport " + M(k) + ". Son aire était de " + M(A) + " cm². Quelle est sa nouvelle aire (en cm²) ?", spec: { kind: "value", value: A * k * k }, sol: "Les aires sont multipliées par " + M(k + "^2 = " + k * k) + " : " + M(A * k * k) + " cm²." };
    }
    const k = R.int(2, 4), V = R.int(2, 9);
    return { fig: FIG.scaling(k, ""), q: "Une maquette est " + M(k) + " fois plus petite que l'objet réel. Son volume est de " + M(V) + " dm³. Quel est le volume de l'objet réel (en dm³) ?", spec: { kind: "value", value: V * k ** 3 }, sol: "Les volumes sont multipliés par " + M(k + "^3 = " + k ** 3) + " : " + M(V * k ** 3) + " dm³." };
  },

  aires(d) {
    if (d === 1) {
      const b = R.int(3, 15), h = 2 * R.int(2, 8);
      return { fig: FIG.triangleFig(b + " cm", h + " cm"), q: "Calcule l'aire d'un triangle de base " + M(b) + " cm et de hauteur " + M(h) + " cm (en cm²).", spec: { kind: "value", value: (b * h) / 2 }, sol: M("\\frac{" + b + " \\cdot " + h + "}{2} = " + (b * h) / 2) + " cm²." };
    }
    if (d === 2) {
      const B = R.int(6, 14), b = R.int(2, B - 2), h = 2 * R.int(2, 6);
      return { fig: FIG.trapezoid(B + " cm", b + " cm", h + " cm"), q: "Calcule l'aire d'un trapèze de bases " + M(B) + " cm et " + M(b) + " cm, de hauteur " + M(h) + " cm (en cm²).", spec: { kind: "value", value: ((B + b) * h) / 2 }, sol: M("\\frac{(" + B + " + " + b + ") \\cdot " + h + "}{2} = " + ((B + b) * h) / 2) + " cm²." };
    }
    const r = R.int(2, 9);
    return { fig: FIG.disk("r = " + r + " cm"), q: "Calcule l'aire d'un disque de rayon " + M(r) + " cm (valeur exacte avec π, ou arrondie au centième).", spec: { kind: "value", value: Math.PI * r * r, round: 0.01, exactOk: true }, sol: M("\\pi \\cdot " + r + "^2 = " + r * r + "\\pi \\approx " + dec((Math.PI * r * r).toFixed(2))) + " cm²." };
  },

  pyth(d) {
    const tr = R.pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10]]), k = R.int(1, 3);
    const [a, b, c] = tr.map((v) => v * k);
    if (d === 1) return { fig: FIG.rightTriangle([a + " cm", b + " cm", "?"]), q: "Un triangle rectangle a des cathètes de " + M(a) + " cm et " + M(b) + " cm. Calcule l'hypoténuse (en cm).", spec: { kind: "value", value: c }, sol: M("\\sqrt{" + a + "^2 + " + b + "^2} = \\sqrt{" + c * c + "} = " + c) + " cm." };
    if (d === 2) return { fig: FIG.rightTriangle([a + " cm", "?", c + " cm"]), q: "Dans un triangle rectangle, l'hypoténuse mesure " + M(c) + " cm et une cathète " + M(a) + " cm. Calcule l'autre cathète (en cm).", spec: { kind: "value", value: b }, sol: M("\\sqrt{" + c + "^2 - " + a + "^2} = \\sqrt{" + b * b + "} = " + b) + " cm." };
    const s = R.int(2, 9);
    return { fig: FIG.square(s + " cm"), q: "Calcule la diagonale d'un carré de côté " + M(s) + " cm (valeur exacte, ou arrondie au centième).", spec: { kind: "value", value: s * Math.SQRT2, round: 0.01, exactOk: true }, sol: M("\\sqrt{" + s + "^2 + " + s + "^2} = " + s + "\\sqrt{2} \\approx " + dec((s * Math.SQRT2).toFixed(2))) + " cm." };
  },

  vol(d) {
    if (d === 1) {
      const a = R.int(2, 9), b = R.int(2, 9), c = R.int(2, 9);
      return { fig: FIG.box(a + " cm", b + " cm", c + " cm"), q: "Calcule le volume d'un pavé droit de " + M(a) + " cm × " + M(b) + " cm × " + M(c) + " cm (en cm³).", spec: { kind: "value", value: a * b * c }, sol: M(a + " \\cdot " + b + " \\cdot " + c + " = " + a * b * c) + " cm³." };
    }
    if (d === 2) {
      const c = R.int(2, 9), h = 3 * R.int(1, 5);
      return { fig: FIG.pyramid(c + " cm", "h = " + h), q: "Calcule le volume d'une pyramide à base carrée de côté " + M(c) + " cm et de hauteur " + M(h) + " cm (en cm³).", spec: { kind: "value", value: (c * c * h) / 3 }, sol: M("\\frac{" + c + "^2 \\cdot " + h + "}{3} = " + (c * c * h) / 3) + " cm³." };
    }
    const r = R.int(1, 6), h = 3 * R.int(1, 4);
    return { fig: FIG.cone("r = " + r, "h = " + h), q: "Calcule le volume d'un cône de rayon " + M(r) + " cm et de hauteur " + M(h) + " cm (valeur exacte avec π, ou arrondie au centième).", spec: { kind: "value", value: (Math.PI * r * r * h) / 3, round: 0.01, exactOk: true }, sol: M("\\frac{\\pi \\cdot " + r + "^2 \\cdot " + h + "}{3} = " + (r * r * h) / 3 + "\\pi \\approx " + dec(((Math.PI * r * r * h) / 3).toFixed(2))) + " cm³." };
  },

  thales(d) {
    const k = R.pick([2, 3, 4]), ad = R.int(2, 6), ae = R.int(2, 6), de = R.int(2, 7);
    const ab = ad * k, ac = ae * k, bc = de * k;
    if (d === 1) return { fig: FIG.thales([[95, 96, "?"], [165, 168, String(bc)]]), q: "Dans un triangle " + M("ABC") + ", " + M("D \\in [AB]") + ", " + M("E \\in [AC]") + " et " + M("(DE) \\parallel (BC)") + ". On sait que " + M("AD = " + ad) + ", " + M("AB = " + ab) + " et " + M("BC = " + bc) + ". Calcule " + M("DE") + ".", spec: { kind: "value", value: de }, sol: M("\\frac{DE}{BC} = \\frac{AD}{AB} = \\frac{" + ad + "}{" + ab + "}") + ", donc " + M("DE = " + bc + " \\cdot \\frac{" + ad + "}{" + ab + "} = " + de) + "." };
    if (d === 2) return { fig: FIG.thales([[110, 52, String(ad)], [80, 124, String(ab - ad)], [205, 52, String(ae)]]), q: "Même configuration de Thalès : " + M("AD = " + ad) + ", " + M("DB = " + (ab - ad)) + " et " + M("AE = " + ae) + ". Calcule " + M("AC") + ".", spec: { kind: "value", value: ac }, sol: M("AB = " + ab) + " ; " + M("AC = " + ae + " \\cdot \\frac{" + ab + "}{" + ad + "} = " + ac) + "." };
    const b = R.pick([1, 1.2, 1.5, 2]), o = R.pick([1.5, 2, 2.5]), O = R.int(4, 12) * o;
    return { q: "Un bâton vertical de " + M(dec(b)) + " m a une ombre de " + M(dec(o)) + " m. Au même moment, l'ombre d'un arbre mesure " + M(dec(O)) + " m. Quelle est la hauteur de l'arbre (en m) ?", spec: { kind: "value", value: (b * O) / o }, sol: M("h = " + dec(b) + " \\cdot \\frac{" + dec(O) + "}{" + dec(o) + "} = " + dec((b * O) / o)) + " m." };
  },

  affine(d) {
    const a = R.nz(-5, 5), b = R.nz(-9, 9);
    if (d === 1) {
      const x = R.nz(-6, 6);
      return { fig: FIG.lineGraph(a, b, [[x, a * x + b, "?"]]), q: "Soit " + M("f(x) = " + poly([a, b])) + ". Calcule " + M("f(" + x + ")") + ".", spec: { kind: "value", value: a * x + b }, sol: M("f(" + x + ") = " + a + " \\cdot " + par(x) + (b < 0 ? " - " + -b : " + " + b) + " = " + (a * x + b)) };
    }
    if (d === 2) {
      const x1 = R.int(-4, 1), x2 = x1 + R.int(1, 4);
      return { fig: FIG.lineGraph(a, b, [[x1, a * x1 + b, "A"], [x2, a * x2 + b, "B"]]), q: "Une droite passe par " + M("A(" + x1 + " ; " + (a * x1 + b) + ")") + " et " + M("B(" + x2 + " ; " + (a * x2 + b) + ")") + ". Calcule sa pente.", spec: { kind: "value", value: a }, sol: M("\\frac{" + (a * x2 + b) + " - " + par(a * x1 + b) + "}{" + x2 + " - " + par(x1) + "} = " + a) };
    }
    const x = R.nz(-6, 6), y = a * x + b;

    const A = R.int(4, 9), B = R.int(4, 9), C = R.int(Math.abs(A - B) + 1, A + B - 1);
    const gam = deg(Math.acos((A * A + B * B - C * C) / (2 * A * B)));
    return { fig: FIG.anyTriangle(["a = " + A, "b = " + B, "c = " + C, "γ = ?", "C"]), q: "Un triangle a pour côtés " + M("a = " + A) + ", " + M("b = " + B) + " et " + M("c = " + C) + ". Calcule l'angle " + M("\\gamma") + " (opposé à " + M("c") + ") en degrés, au centième.", spec: { kind: "value", value: gam, round: 0.01 }, sol: M("\\cos\\gamma = \\frac{" + A * A + " + " + B * B + " - " + C * C + "}{2 \\cdot " + A + " \\cdot " + B + "}") + ", " + M("\\gamma \\approx " + dec(gam.toFixed(2)) + "°") };
  },

  expo(d) {
    if (d === 1) {
      const b = R.pick([2, 3, 5]), n = R.int(2, b === 2 ? 7 : 4);
      return { fig: FIG.parabola((x) => Math.pow(b, x) / 3, [], null, false), q: "Résous : " + M(b + "^x = " + b ** n) + ".", spec: { kind: "value", value: n }, sol: M(b ** n + " = " + b + "^" + n) + ", donc " + M("x = " + n) + "." };
    }
    if (d === 2) {
      const b = R.pick([2, 3]), k = R.int(-2, 3), n = R.int(2, b === 2 ? 6 : 4);
      return { q: "Résous : " + M(b + "^{x " + (k < 0 ? "- " + -k : "+ " + k) + "} = " + b ** n) + ".", spec: { kind: "value", value: n - k }, sol: M("x " + (k < 0 ? "- " + -k : "+ " + k) + " = " + n) + ", donc " + M("x = " + (n - k)) + "." };
    }
    const C = 1000 * R.int(1, 9), t = R.pick([1, 1.5, 2, 2.5, 3]), n = R.int(3, 12);
    const v = C * Math.pow(1 + t / 100, n);
    return { fig: FIG.parabola((x) => Math.pow(1.3, x)), q: "Un capital de " + M(C) + " CHF est placé à " + M(dec(t) + "\\,\\%") + " d'intérêt composé par an. Que vaut-il après " + M(n) + " ans (au centime) ?", spec: { kind: "value", value: v, round: 0.01 }, sol: M(C + " \\cdot " + dec(1 + t / 100) + "^{" + n + "} \\approx " + dec(v.toFixed(2))) + " CHF." };
  },

  log(d) {
    if (d === 1) {
      const b = R.pick([2, 3, 10]), n = R.int(-2, b === 2 ? 6 : 4);
      const x = Math.pow(b, n), xs = n >= 0 ? String(x) : "\\frac{1}{" + b ** -n + "}";
      return { q: "Calcule " + M("\\log_{" + b + "} " + xs) + ".", spec: { kind: "value", value: n }, sol: M(b + "^{" + n + "} = " + xs) + ", donc " + M("\\log_{" + b + "} " + xs + " = " + n) + "." };
    }
    if (d === 2) {
      const b = R.pick([2, 3, 5]), c = R.pick([7, 10, 15, 20, 50].filter((v) => v !== b));
      return { fig: FIG.parabola((x) => Math.pow(b, x) / 4, [], null, false), q: "Résous " + M(b + "^x = " + c) + " (valeur exacte avec ln, ou au centième).", spec: { kind: "value", value: Math.log(c) / Math.log(b), round: 0.01, exactOk: true }, sol: M("x = \\frac{\\ln " + c + "}{\\ln " + b + "} \\approx " + dec((Math.log(c) / Math.log(b)).toFixed(2))) };
    }
    const a = R.pick([2, 4, 5, 20, 25]), b2 = 100 / a * R.pick([1, 10]);
    return { q: "Calcule sans calculatrice : " + M("\\log " + a + " + \\log " + b2) + ".", spec: { kind: "value", value: Math.log10(a * b2) }, sol: M("\\log(" + a + " \\cdot " + b2 + ") = \\log " + a * b2 + " = " + Math.round(Math.log10(a * b2))) + "." };
  },

  absval(d) {
    const a = R.nz(-6, 6), b = R.int(1, 8);
    if (d === 1) return { fig: FIG.numberLine(a, []), q: "Résous : " + M("|x " + (a < 0 ? "+ " + -a : "- " + a) + "| = " + b) + ".", spec: { kind: "set", values: [a - b, a + b] }, sol: M("x " + (a < 0 ? "+ " + -a : "- " + a) + " = " + b) + " ou " + M("= -" + b) + " : " + M("x = " + (a + b)) + " ou " + M("x = " + (a - b)) + "." };
    if (d === 2) {
      const k = R.pick([2, 3]), c = R.nz(-6, 6);
      return { q: "Résous : " + M("|" + k + "x " + (c < 0 ? "- " + -c : "+ " + c) + "| = " + b) + ".", spec: { kind: "set", values: [(b - c) / k, (-b - c) / k] }, sol: M(k + "x " + (c < 0 ? "- " + -c : "+ " + c) + " = \\pm " + b) + " : " + M("x = " + frac(b - c, k)) + " ou " + M("x = " + frac(-b - c, k)) + "." };
    }
    return { q: "Résous : " + M("|x " + (a < 0 ? "+ " + -a : "- " + a) + "| + " + b + " = " + (b > 1 ? R.int(0, b - 1) : 0)) + ". (S'il n'y a pas de solution, écris « aucune ».)", spec: { kind: "set", values: [] }, sol: "Une valeur absolue est positive ou nulle : " + M("|\\ldots| = " + "\\text{un nombre négatif}") + " est impossible. Aucune solution." };
  },

  ineq(d) {
    const x0 = R.nz(-6, 6);
    if (d === 1) {
      const a = R.int(2, 6), b = R.nz(-9, 9), op = R.pick([">", "<", ">=", "<="]);
      const tx = { ">": ">", "<": "<", ">=": "\\ge", "<=": "\\le" }[op];
      return { q: "Résous : " + M(poly([a, b]) + " " + tx + " " + (a * x0 + b)) + ". Réponds par exemple « x > 4 » ou « x <= -3 ».", spec: { kind: "ineq", op, value: x0 }, sol: M(a + "x " + tx + " " + a * x0 + " \\iff x " + tx + " " + x0) };
    }
    const a = -R.int(2, 6), b = R.nz(-9, 9), op = R.pick([">", "<", ">=", "<="]);
    const flip = { ">": "<", "<": ">", ">=": "<=", "<=": ">=" }[op];
    const tx = { ">": ">", "<": "<", ">=": "\\ge", "<=": "\\le" };
    return { q: "Résous : " + M(poly([a, b]) + " " + tx[op] + " " + (a * x0 + b)) + ". Réponds par exemple « x > 4 » ou « x <= -3 ».", spec: { kind: "ineq", op: flip, value: x0 }, sol: M(a + "x " + tx[op] + " " + a * x0) + " ; on divise par " + M(a) + " (négatif) et on retourne le signe : " + M("x " + tx[flip] + " " + x0) + "." };
  },

  trigcercle(d) {
    if (d === 1) {
      const dg = R.pick([30, 45, 60, 90, 120, 135, 150, 180, 210, 270, 300, 360]);
      const g = gcd(dg, 180);
      return { fig: FIG.unitCircle(dg), q: "Convertis " + M(dg + "°") + " en radians (par exemple « π/4 »).", spec: { kind: "value", value: rad(dg) }, sol: M(dg + "° = " + dg + " \\cdot \\frac{\\pi}{180} = " + (dg / g === 1 ? "" : dg / g) + "\\pi" + (180 / g === 1 ? "" : "/" + 180 / g)) };
    }
    const angles = [[30, "1/2", "√3/2"], [45, "√2/2", "√2/2"], [60, "√3/2", "1/2"], [120, "√3/2", "-1/2"], [135, "√2/2", "-√2/2"], [150, "1/2", "-√3/2"], [210, "-1/2", "-√3/2"], [225, "-√2/2", "-√2/2"], [240, "-√3/2", "-1/2"], [300, "-√3/2", "1/2"], [315, "-√2/2", "√2/2"], [330, "-1/2", "√3/2"]];
    const [dg, sn, cs] = R.pick(angles);
    if (d === 2) {
      const f = R.pick(["sin", "cos"]);
      return { fig: FIG.unitCircle(dg), q: "Donne la valeur exacte de " + M("\\" + f + " " + dg + "°") + " (par exemple « √3/2 »).", spec: { kind: "value", value: f === "sin" ? Math.sin(rad(dg)) : Math.cos(rad(dg)) }, sol: M("\\" + f + " " + dg + "° = " + (f === "sin" ? sn : cs).replace("√", "\\sqrt{").replace(/\{(\d)/, "{$1}")) + " (lis l'" + (f === "sin" ? "ordonnée" : "abscisse") + " du point)." };
    }
    return { fig: FIG.unitCircle(dg, "?"), q: "Donne les coordonnées exactes du point du cercle trigonométrique associé à " + M(dg + "°") + ". Réponds « x ; y ».", spec: { kind: "pair", values: [Math.cos(rad(dg)), Math.sin(rad(dg))] }, sol: M("(\\cos " + dg + "° ; \\sin " + dg + "°)") + " = (" + cs + " ; " + sn + ")" };
  },

  trigeq(d) {
    if (d === 1) {
      const [v, a] = R.pick([["1/2", 30], ["√2/2", 45], ["√3/2", 60], ["-1/2", 210], ["-√2/2", 225], ["-√3/2", 240]]);
      const sols = a < 180 ? [a, 180 - a] : [a, 540 - a];
      return { fig: FIG.unitLine("y", (a < 180 ? 1 : -1) * Math.abs(Math.sin(rad(a))), "y = " + v), q: "Résous " + M("\\sin x = " + v.replace("√", "\\sqrt{").replace(/\{(\d)/, "{$1}")) + " pour " + M("x \\in [0° ; 360°[") + " (en degrés, sépare par « ; »).", spec: { kind: "set", values: sols }, sol: M("x = " + sols[0] + "°") + " ou " + M("x = " + sols[1] + "°") + " (symétrie par rapport à l'axe vertical)." };
    }
    if (d === 2) {
      const [v, a] = R.pick([["1/2", 60], ["√2/2", 45], ["√3/2", 30], ["-1/2", 120], ["-√2/2", 135], ["-√3/2", 150]]);
      return { fig: FIG.unitLine("x", Math.cos(rad(a)), "x = " + v), q: "Résous " + M("\\cos x = " + v.replace("√", "\\sqrt{").replace(/\{(\d)/, "{$1}")) + " pour " + M("x \\in [0° ; 360°[") + " (en degrés).", spec: { kind: "set", values: [a, 360 - a] }, sol: M("x = " + a + "°") + " ou " + M("x = " + (360 - a) + "°") + " (symétrie par rapport à l'axe horizontal)." };
    }
    const [v, a] = R.pick([["1", 45], ["√3", 60], ["√3/3", 30], ["-1", 135], ["-√3", 120]]);
    return { fig: FIG.unitLine("x", 1, "tan"), q: "Résous " + M("\\tan x = " + v.replace("√", "\\sqrt{").replace(/\{(\d)/, "{$1}")) + " pour " + M("x \\in [0° ; 360°[") + ".", spec: { kind: "set", values: [a, a + 180] }, sol: M("x = " + a + "°") + " ou " + M("x = " + (a + 180) + "°") + " (la tangente a une période de 180°)." };
  },

  stats(d) {
    const n = d === 2 ? 2 * R.int(3, 4) : R.int(5, 7);
    const xs = Array.from({ length: n }, () => R.int(2, 20));
    const sum = xs.reduce((a, b) => a + b, 0), mean = sum / n;
    if (d === 1) return { fig: FIG.barChart(xs), q: "Calcule la moyenne de la série : " + M(xs.join(" ; ")) + ".", spec: { kind: "value", value: mean }, sol: M("\\frac{" + sum + "}{" + n + "} = " + frac(sum, n)) + (Number.isInteger(mean) ? "" : " " + M("\\approx " + dec(mean.toFixed(2)))) };
    if (d === 2) {
      const so = [...xs].sort((a, b) => a - b), med = (so[n / 2 - 1] + so[n / 2]) / 2;
      return { fig: FIG.barChart(xs), q: "Donne la médiane de la série : " + M(xs.join(" ; ")) + ".", spec: { kind: "value", value: med }, sol: "Série triée : " + M(so.join(" ; ")) + " ; médiane " + M("\\frac{" + so[n / 2 - 1] + " + " + so[n / 2] + "}{2} = " + dec(med)) };
    }
    const sd = Math.sqrt(xs.reduce((a, x) => a + (x - mean) ** 2, 0) / n);
    return { fig: FIG.barChart(xs), q: "Calcule l'écart-type " + M("\\sigma") + " de la série " + M(xs.join(" ; ")) + ", au centième.", spec: { kind: "value", value: sd, round: 0.01 }, sol: "Moyenne " + M(dec(mean.toFixed(2))) + " ; " + M("\\sigma = \\sqrt{\\frac{\\sum (x_i - \\bar{x})^2}{" + n + "}} \\approx " + dec(sd.toFixed(2))) };
  },
});

// ---------- Niveau 4 : problèmes en plusieurs parties (modélisation, plusieurs étapes) ----------
// Chaque problème : { q, fig, parts: [{ label, spec }], hints: [outil, calcul], sol }.
const r2 = (v) => Math.round(v * 100) / 100;
const PROB = {
  f2() {
    const p = R.pick([2, 3]), q = R.pick([0.4, 0.6, 0.8, 1]), c = 5 * p * q, b = 5 * (p - q);
    const tm = (p - q) / 2, hm = -5 * (tm - p) * (tm + q);
    return { fig: FIG.parabola((t) => (-5 * (t - p) * (t + q)) / 3, [], null, false), q: "Une plongeuse saute d'un plongeoir. Sa hauteur au-dessus de l'eau (en m) après " + M("t") + " secondes est " + M("h(t) = -5t^2 + " + dec(b) + "t + " + dec(c)) + ".",
      parts: [{ label: "a) Hauteur du plongeoir (m)", spec: { kind: "value", value: c } }, { label: "b) Instant où elle entre dans l'eau (s)", spec: { kind: "value", value: p } }, { label: "c) Hauteur maximale atteinte (m)", spec: { kind: "value", value: hm, round: 0.01, exactOk: true } }],
      hints: ["Associe chaque question à un outil : départ → t = 0 ; entrée dans l'eau → h(t) = 0 ; hauteur max → sommet.", "a) h(0). b) Résous −5t² + " + dec(b) + "t + " + dec(c) + " = 0 et garde la solution positive. c) t = −b / 2a, puis h(t)."],
      sol: "a) " + M("h(0) = " + dec(c)) + " m. b) " + M("h(t) = -5(t - " + p + ")(t + " + dec(q) + ") = 0") + " : " + M("t = " + p) + " s. c) " + M("t = " + dec(tm)) + " s, " + M("h = " + dec(r2(hm))) + " m." };
  },
  factor() {
    const L = 20 * R.int(2, 6), k = R.int(5, L / 4 - 1);
    return { fig: FIG.rectFig(2, 1, "mur (pas de clôture)", "x"), q: "Avec " + M(L) + " m de clôture, on entoure un enclos rectangulaire le long d'un mur (le mur forme un côté). On note " + M("x") + " la largeur (perpendiculaire au mur).",
      parts: [{ label: "a) Aire (m²) si x = " + k, spec: { kind: "value", value: k * (L - 2 * k) } }, { label: "b) Largeur x qui donne l'aire maximale (m)", spec: { kind: "value", value: L / 4 } }, { label: "c) Aire maximale (m²)", spec: { kind: "value", value: (L / 4) * (L / 2) } }],
      hints: ["Exprime l'aire en fonction de x : la longueur vaut " + L + " − 2x. L'aire maximale est au sommet de la parabole.", "A(x) = x(" + L + " − 2x) = −2x² + " + L + "x ; sommet en x = −b / 2a."],
      sol: M("A(x) = x(" + L + " - 2x)") + ". a) " + M(k * (L - 2 * k)) + " m². b) " + M("x = \\frac{" + L + "}{4} = " + L / 4) + " m. c) " + M(L / 4 + " \\cdot " + L / 2 + " = " + (L / 4) * (L / 2)) + " m²." };
  },
  pct() {
    const P = 20 * R.int(3, 25), up = R.pick([10, 20, 25, 30, 50]), dn = R.pick([10, 20, 25, 40]);
    const p1 = P * (1 + up / 100), p2 = p1 * (1 - dn / 100), glob = (p2 / P - 1) * 100;
    return { fig: FIG.percentBar(up, P, " CHF"), q: "Un vélo coûte " + M(P) + " CHF. Son prix augmente de " + M(up + "\\,\\%") + ", puis baisse de " + M(dn + "\\,\\%") + " pendant les soldes.",
      parts: [{ label: "a) Prix après la hausse (CHF)", spec: { kind: "value", value: p1 } }, { label: "b) Prix soldé (CHF)", spec: { kind: "value", value: p2 } }, { label: "c) Variation globale en % (négative si baisse)", spec: { kind: "value", value: glob, round: 0.01 } }],
      hints: ["Les pourcentages successifs se multiplient : on ne les additionne pas.", "Multiplie par " + dec(1 + up / 100) + " puis par " + dec(1 - dn / 100) + " ; variation globale = (prix final / prix initial − 1) · 100."],
      sol: "a) " + M(P + " \\cdot " + dec(1 + up / 100) + " = " + dec(p1)) + ". b) " + M(dec(p1) + " \\cdot " + dec(1 - dn / 100) + " = " + dec(r2(p2))) + ". c) " + M(dec(r2(glob)) + "\\,\\%") + " (et non " + (up - dn) + " %)." };
  },
  pyth() {
    const [a, b, c] = R.pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]]).map((v) => v * R.int(2, 5));
    return { fig: FIG.rectFig(b, a, b + " m ?", a + " m"), q: "Un terrain rectangulaire a une diagonale de " + M(c) + " m et un côté de " + M(a) + " m.",
      parts: [{ label: "a) Autre côté (m)", spec: { kind: "value", value: b } }, { label: "b) Aire du terrain (m²)", spec: { kind: "value", value: a * b } }, { label: "c) Longueur de clôture pour en faire le tour (m)", spec: { kind: "value", value: 2 * (a + b) } }],
      hints: ["La diagonale découpe le rectangle en deux triangles rectangles : Pythagore.", "Autre côté = √(" + c + "² − " + a + "²), puis aire = longueur · largeur et périmètre = 2(longueur + largeur)."],
      sol: "a) " + M("\\sqrt{" + c * c + " - " + a * a + "} = " + b) + " m. b) " + M(a * b) + " m². c) " + M(2 * (a + b)) + " m." };
  },
  vol() {
    const r = R.int(2, 6), hh = R.int(5, 15), rho = R.pick([2.7, 7.8, 8.9, 0.9]), mat = { 2.7: "aluminium", 7.8: "acier", 8.9: "cuivre", 0.9: "glace" }[rho];
    const V = Math.PI * r * r * hh, m = V * rho;
    return { fig: FIG.cylinder("r = " + r, "h = " + hh), q: "Une pièce en " + mat + " (" + M("\\rho = " + dec(rho)) + " g/cm³) est un cylindre de rayon " + M(r) + " cm et de hauteur " + M(hh) + " cm.",
      parts: [{ label: "a) Volume (cm³, au centième)", spec: { kind: "value", value: V, round: 0.01, exactOk: true } }, { label: "b) Masse (g, au centième)", spec: { kind: "value", value: m, round: 0.01 } }, { label: "c) Nombre de pièces complètes dans 10 kg", spec: { kind: "value", value: Math.floor(10000 / m) } }],
      hints: ["Volume du cylindre, puis masse = masse volumique · volume. Attention : 10 kg = 10 000 g.", "V = π · " + r + "² · " + hh + " ; m = " + dec(rho) + " · V ; pièces = partie entière de 10 000 / m."],
      sol: "a) " + M(r * r * hh + "\\pi \\approx " + dec(r2(V))) + " cm³. b) " + M("\\approx " + dec(r2(m))) + " g. c) " + M("10\\,000 : " + dec(r2(m)) + " \\approx " + dec(r2(10000 / m))) + ", donc " + M(Math.floor(10000 / m)) + " pièces." };
  },
  sys2() {
    const pa = R.int(12, 20), pe = R.int(5, 10), na = R.int(2, 5), ne = R.int(2, 5), nb = R.int(1, 4), nf = R.int(3, 7);
    if (na * nf === nb * ne) return PROB.sys2();
    const ga = R.int(2, 6), ge = R.int(10, 25);
    return { q: "Au musée, " + M(na) + " adultes et " + M(ne) + " enfants paient " + M(na * pa + ne * pe) + " CHF ; " + M(nb) + " adultes et " + M(nf) + " enfants paient " + M(nb * pa + nf * pe) + " CHF.",
      parts: [{ label: "a) Prix d'un billet adulte (CHF)", spec: { kind: "value", value: pa } }, { label: "b) Prix d'un billet enfant (CHF)", spec: { kind: "value", value: pe } }, { label: "c) Prix pour une classe : " + ga + " adultes et " + ge + " enfants (CHF)", spec: { kind: "value", value: ga * pa + ge * pe } }],
      hints: ["Deux inconnues (prix adulte a, prix enfant e), deux informations : un système.", na + "a + " + ne + "e = " + (na * pa + ne * pe) + " et " + nb + "a + " + nf + "e = " + (nb * pa + nf * pe) + " : élimine une inconnue."],
      sol: "a) " + M("a = " + pa) + " CHF. b) " + M("e = " + pe) + " CHF. c) " + M(ga + " \\cdot " + pa + " + " + ge + " \\cdot " + pe + " = " + (ga * pa + ge * pe)) + " CHF." };
  },
  log() {
    const C = 1000 * R.int(2, 9), t = R.pick([2, 3, 4, 5]), n0 = R.int(3, 8);
    const v = C * Math.pow(1 + t / 100, n0), years = Math.ceil(Math.log(2) / Math.log(1 + t / 100));
    return { fig: FIG.parabola((x) => Math.pow(1 + t / 100, x * 3) * 2 - 2), q: "On place " + M(C) + " CHF à " + M(t + "\\,\\%") + " d'intérêt composé par an.",
      parts: [{ label: "a) Capital après " + n0 + " ans (CHF, au centime)", spec: { kind: "value", value: v, round: 0.01 } }, { label: "b) Nombre d'années pour que le capital double (années entières)", spec: { kind: "value", value: years } }],
      hints: ["Chaque année, le capital est multiplié par " + dec(1 + t / 100) + ". Doubler : résoudre " + dec(1 + t / 100) + "ⁿ = 2.", "n = ln 2 / ln " + dec(1 + t / 100) + ", puis arrondir à l'année supérieure."],
      sol: "a) " + M(C + " \\cdot " + dec(1 + t / 100) + "^{" + n0 + "} \\approx " + dec(r2(v))) + " CHF. b) " + M("n = \\frac{\\ln 2}{\\ln " + dec(1 + t / 100) + "} \\approx " + dec(r2(Math.log(2) / Math.log(1 + t / 100)))) + ", donc " + M(years) + " ans." };
  },
  eq2() {
    const x = R.int(3, 12), k = R.int(2, 8);

const sg = (v) => (v < 0 ? " - " + -v : " + " + v); // « + 3 » / « - 3 »

const rat = (v) => { // écriture saisissable d'un rationnel simple
  if (Number.isInteger(v)) return String(v);
  for (let d = 2; d <= 60; d++) if (Math.abs(v * d - Math.round(v * d)) < 1e-9) return Math.round(v * d) + "/" + d;
  return String(v);
};
const ratT = (v) => { // TeX
  if (Number.isInteger(v)) return String(v);
  for (let d = 2; d <= 60; d++) if (Math.abs(v * d - Math.round(v * d)) < 1e-9) return frac(Math.round(v * d), d);
  return dec(v);
};
const pmul = (a, b) => { const r = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => (r[i + j] += x * y))); return r; };
const padd = (a, b) => { const n = Math.max(a.length, b.length), A = Array(n - a.length).fill(0).concat(a), B = Array(n - b.length).fill(0).concat(b); return A.map((x, i) => x + B[i]); };
const pscale = (a, k) => a.map((x) => x * k);
const peval = (a, x) => a.reduce((s, c) => s * x + c, 0);
const ptrim = (a) => { let i = 0; while (i < a.length - 1 && a[i] === 0) i++; return a.slice(i); };
const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R.rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const lin = (a, b, v = "x") => poly([a, b], v);
const cx = (c) => (c === 1 ? "" : c === -1 ? "-" : String(c)); // coefficient devant une lettre
const nb = (v) => { const [i, f] = String(+(+v).toFixed(6)).split("."); return (Math.abs(+i) >= 10000 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, "{'}") : i) + (f ? "{,}" + f : ""); }; // 10'000
// Ensemble des solutions d'une inéquation f(x) op 0 : zéros (inclus si op large), pôles (exclus).
