    return { fig: FIG.road(dd + " km", "aller-retour"), q: "Une voiture fait un aller de " + M(dd) + " km à " + M(v1) + " km/h et le retour à " + M(v2) + " km/h. Quelle est sa vitesse moyenne sur l'ensemble du trajet (en km/h) ?", spec: { kind: "value", value: vm }, sol: "Durée totale " + M(dec(dd / v1) + " + " + dec(dd / v2) + " = " + dec(tt)) + " h pour " + M(2 * dd) + " km : " + M("v = \\frac{" + 2 * dd + "}{" + dec(tt) + "} = " + ratT(vm)) + " km/h (et non la moyenne des deux vitesses)." };
  },

  // ===== CO 10e =====
  disque(d) {
    const r = R.int(2, 12);
    if (d === 1) return { fig: FIG.disk("r = " + r + " cm"), q: "Calcule le périmètre d'un cercle de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: 2 * Math.PI * r, round: 0.01, exactOk: true }, sol: M("P = 2\\pi r = " + 2 * r + "\\pi \\approx " + dec((2 * Math.PI * r).toFixed(2))) + " cm." };
    if (d === 2) {
      if (R.rand() < 0.5) return { fig: FIG.disk("r = " + r + " cm"), q: "Calcule l'aire d'un disque de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r, round: 0.01, exactOk: true }, sol: M("A = \\pi r^2 = " + r * r + "\\pi \\approx " + dec((Math.PI * r * r).toFixed(2))) + " cm²." };
      const D = 2 * r; return { fig: FIG.disk("d = " + D + " cm"), q: "Un disque a un diamètre de " + M(D) + " cm. Calcule son aire (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r, round: 0.01, exactOk: true }, sol: "Rayon " + M(r) + " cm ; " + M("A = \\pi \\cdot " + r + "^2 = " + r * r + "\\pi \\approx " + dec((Math.PI * r * r).toFixed(2))) + " cm²." };
    }
    const a = R.pick([30, 45, 60, 72, 90, 120, 135, 150, 240]);
    if (R.rand() < 0.5) return { fig: FIG.sector("r = " + r, a, a + "°"), q: "Calcule l'aire d'un secteur circulaire de rayon " + M(r) + " cm et d'angle " + M(a + "°") + " (au centième, en cm²).", spec: { kind: "value", value: (Math.PI * r * r * a) / 360, round: 0.01, exactOk: true }, sol: M("A = \\pi r^2 \\cdot \\frac{" + a + "}{360} = " + ratT((r * r * a) / 360) + "\\pi \\approx " + dec(((Math.PI * r * r * a) / 360).toFixed(2))) + " cm²." };
    return { fig: FIG.sector("r = " + r, a, a + "°"), q: "Calcule la longueur de l'arc d'un secteur de rayon " + M(r) + " cm et d'angle " + M(a + "°") + " (au centième, en cm).", spec: { kind: "value", value: (2 * Math.PI * r * a) / 360, round: 0.01, exactOk: true }, sol: M("\\ell = 2\\pi r \\cdot \\frac{" + a + "}{360} = " + ratT((2 * r * a) / 360) + "\\pi \\approx " + dec(((2 * Math.PI * r * a) / 360).toFixed(2))) + " cm." };
  },

  vol(d) {
    if (d === 1) {
      const a = R.int(2, 12), b = R.int(2, 9), c = R.int(2, 9);
      if (R.rand() < 0.3) return { fig: FIG.box(a + " cm", a + " cm", a + " cm"), q: "Calcule le volume d'un cube d'arête " + M(a) + " cm (en cm³).", spec: { kind: "value", value: a ** 3 }, sol: M("V = " + a + "^3 = " + a ** 3) + " cm³." };
      return { fig: FIG.box(a + " cm", b + " cm", c + " cm"), q: "Calcule le volume d'un pavé droit de " + M(a) + " cm × " + M(b) + " cm × " + M(c) + " cm (en cm³).", spec: { kind: "value", value: a * b * c }, sol: M(a + " \\cdot " + b + " \\cdot " + c + " = " + a * b * c) + " cm³." };
    }
    if (d === 2) {
      const b = 2 * R.int(2, 7), h = R.int(3, 9), H = R.int(4, 15);
      return { fig: FIG.prism(b + " cm", h + " cm", H + " cm"), q: "Un prisme droit a pour base un triangle de base " + M(b) + " cm et de hauteur " + M(h) + " cm. Sa hauteur (longueur du prisme) est " + M(H) + " cm. Calcule son volume (en cm³).", spec: { kind: "value", value: (b * h * H) / 2 }, sol: "Aire de la base " + M("\\frac{" + b + " \\cdot " + h + "}{2} = " + (b * h) / 2) + " cm² ; " + M("V = " + (b * h) / 2 + " \\cdot " + H + " = " + (b * h * H) / 2) + " cm³." };
    }
    const r = R.int(2, 9), h = R.int(3, 20);
    if (R.rand() < 0.5) return { fig: FIG.cylinder("r = " + r, "h = " + h), q: "Calcule le volume d'un cylindre de rayon " + M(r) + " cm et de hauteur " + M(h) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r * h, round: 0.01, exactOk: true }, sol: M("V = \\pi r^2 h = " + r * r * h + "\\pi \\approx " + dec((Math.PI * r * r * h).toFixed(2))) + " cm³." };
    const L = R.int(2, 9);
    return { fig: FIG.cylinder("r = " + r + " cm", "h = ?"), q: "Un cylindre de rayon " + M(r) + " cm contient " + M(dec(L)) + " L. Quelle est sa hauteur, en cm, au dixième ?", spec: { kind: "value", value: (L * 1000) / (Math.PI * r * r), round: 0.1 }, sol: M(dec(L) + "\\ \\text{L} = " + L * 1000 + "\\ \\text{cm}^3") + " ; " + M("h = \\frac{" + L * 1000 + "}{\\pi \\cdot " + r * r + "} \\approx " + dec(((L * 1000) / (Math.PI * r * r)).toFixed(1))) + " cm." };
  },

  polyreg(d) {
    const n = R.pick([5, 6, 8, 9, 10, 12]);
    if (d === 1) return { fig: FIG.regPoly(n, "?"), q: "Quelle est la mesure de l'angle au centre d'un polygone régulier à " + M(n) + " côtés (en degrés) ?", spec: { kind: "value", value: 360 / n }, sol: M("\\frac{360°}{" + n + "} = " + dec(360 / n) + "°") + "." };
    if (d === 2) return { fig: FIG.regPoly(n, ""), q: "Quelle est la mesure d'un angle intérieur d'un polygone régulier à " + M(n) + " côtés (en degrés) ?", spec: { kind: "value", value: ((n - 2) * 180) / n }, sol: "Somme des angles : " + M("(" + n + " - 2) \\cdot 180° = " + (n - 2) * 180 + "°") + " ; un angle : " + M(dec(((n - 2) * 180) / n) + "°") + "." };
    const m = R.pick([5, 6, 8, 9, 10, 12, 15, 18, 20]), a = ((m - 2) * 180) / m;
    return { q: "Un angle intérieur d'un polygone régulier mesure " + M(dec(a) + "°") + ". Combien le polygone a-t-il de côtés ?", spec: { kind: "value", value: m }, sol: "L'angle au centre vaut " + M("180° - " + dec(a) + "° = " + dec(180 - a) + "°") + " ; " + M("n = \\frac{360}{" + dec(180 - a) + "} = " + m) + "." };
  },

  // ===== CO 11e =====
  volcone(d) {
    if (d === 1) {
      const c = R.int(2, 9), h = 3 * R.int(1, 5);
      return { fig: FIG.pyramid(c + " cm", "h = " + h), q: "Calcule le volume d'une pyramide à base carrée de côté " + M(c) + " cm et de hauteur " + M(h) + " cm (en cm³).", spec: { kind: "value", value: (c * c * h) / 3 }, sol: M("V = \\frac{1}{3} \\cdot " + c + "^2 \\cdot " + h + " = " + (c * c * h) / 3) + " cm³." };
    }
    if (d === 2) {
      const r = R.int(1, 8), h = 3 * R.int(1, 5);
      if (R.rand() < 0.5) return { fig: FIG.cone("r = " + r, "h = " + h), q: "Calcule le volume d'un cône de rayon " + M(r) + " cm et de hauteur " + M(h) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: (Math.PI * r * r * h) / 3, round: 0.01, exactOk: true }, sol: M("V = \\frac{1}{3}\\pi r^2 h = " + (r * r * h) / 3 + "\\pi \\approx " + dec(((Math.PI * r * r * h) / 3).toFixed(2))) + " cm³." };
      return { fig: FIG.sphere("r = " + r), q: "Calcule le volume d'une boule de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: (4 / 3) * Math.PI * r ** 3, round: 0.01, exactOk: true }, sol: M("V = \\frac{4}{3}\\pi r^3 = " + ratT((4 * r ** 3) / 3) + "\\pi \\approx " + dec(((4 / 3) * Math.PI * r ** 3).toFixed(2))) + " cm³." };
    }
    if (R.rand() < 0.5) {
      const r = R.int(3, 9), g = r + R.int(2, 6), h = Math.sqrt(g * g - r * r);
      return { fig: FIG.cone("r = " + r, "g = " + g), q: "Un cône a un rayon de " + M(r) + " cm et une génératrice de " + M(g) + " cm. Calcule son volume, au centième (en cm³).", spec: { kind: "value", value: (Math.PI * r * r * h) / 3, round: 0.01 }, sol: "Hauteur par Pythagore : " + M("h = \\sqrt{" + g + "^2 - " + r + "^2} = \\sqrt{" + (g * g - r * r) + "}") + " ; " + M("V = \\frac{1}{3}\\pi \\cdot " + r * r + " \\cdot h \\approx " + dec(((Math.PI * r * r * h) / 3).toFixed(2))) + " cm³." };
    }
    const r = R.int(2, 6), h = R.int(4, 12), hc = 3 * R.int(1, 3);
    const v = Math.PI * r * r * h + (Math.PI * r * r * hc) / 3;
    return { fig: FIG.cylinder("r = " + r, "h = " + h), q: "Une fusée est formée d'un cylindre (rayon " + M(r) + " cm, hauteur " + M(h) + " cm) surmonté d'un cône de même rayon et de hauteur " + M(hc) + " cm. Calcule son volume total, au centième (en cm³).", spec: { kind: "value", value: v, round: 0.01, exactOk: true }, sol: M(r * r * h + "\\pi + " + (r * r * hc) / 3 + "\\pi = " + (r * r * h + (r * r * hc) / 3) + "\\pi \\approx " + dec(v.toFixed(2))) + " cm³." };
  },

  gquot(d) {
    if (d === 1) {
      if (R.rand() < 0.5) { const v = 18 * R.int(1, 7); return { q: "Convertis " + M(v) + " km/h en m/s.", spec: { kind: "value", value: v / 3.6 }, sol: M("1\\ \\text{m/s} = 3{,}6\\ \\text{km/h}") + " : " + M(v + " : 3{,}6 = " + dec(v / 3.6)) + " m/s." }; }
      const v = 5 * R.int(1, 8); return { q: "Convertis " + M(v) + " m/s en km/h.", spec: { kind: "value", value: v * 3.6 }, sol: M(v + " \\cdot 3{,}6 = " + dec(v * 3.6)) + " km/h." };
    }
    if (d === 2) {
      const m = R.pick([[2.7, "d'aluminium", "de l'aluminium"], [7.9, "de fer", "du fer"], [11.3, "de plomb", "du plomb"], [0.9, "de glace", "de la glace"], [19.3, "d'or", "de l'or"]]), V = R.int(5, 80);
      if (R.rand() < 0.5) return { fig: FIG.box("", "", ""), q: "Un bloc " + m[1] + " a un volume de " + M(V) + " cm³ et une masse de " + M(dec(+(m[0] * V).toFixed(2))) + " g. Calcule sa masse volumique (en g/cm³).", spec: { kind: "value", value: m[0] }, sol: M("\\rho = \\frac{m}{V} = \\frac{" + dec(+(m[0] * V).toFixed(2)) + "}{" + V + "} = " + dec(m[0])) + " g/cm³." };
      return { fig: FIG.box("", "", ""), q: "La masse volumique " + m[2] + " est " + M(dec(m[0])) + " g/cm³. Quelle est la masse d'un bloc de " + M(V) + " cm³ (en g) ?", spec: { kind: "value", value: +(m[0] * V).toFixed(4) }, sol: M("m = \\rho \\cdot V = " + dec(m[0]) + " \\cdot " + V + " = " + dec(+(m[0] * V).toFixed(4))) + " g." };
    }
    const q = R.pick([5, 8, 10, 12, 15, 20, 25]), V = R.int(2, 9) * 60;
    return { q: "Un robinet a un débit de " + M(q) + " L/min. Combien de minutes faut-il pour remplir une cuve de " + M(dec(V / 1000)) + " m³ ?", spec: { kind: "value", value: V / q }, sol: M(dec(V / 1000) + "\\ \\text{m}^3 = " + V + "\\ \\text{L}") + " ; " + M("t = \\frac{" + V + "}{" + q + "} = " + dec(V / q)) + " min." };
  },

  formule(d) {
    const F = d === 1
      ? R.pick([
          { f: "v = \\frac{d}{t}", ask: "d", ans: "v*t", sol: "On multiplie par " + M("t") + " : " + M("d = v \\cdot t") },
          { f: "P = 4c", ask: "c", ans: "P/4", sol: M("c = \\frac{P}{4}") },
          { f: "U = R \\cdot I", ask: "I", ans: "U/R", sol: M("I = \\frac{U}{R}") },
          { f: "y = 3x + b", ask: "b", ans: "y - 3x", sol: M("b = y - 3x") },
        ])
      : d === 2
      ? R.pick([
          { f: "A = \\frac{b \\cdot h}{2}", ask: "h", ans: "2A/b", sol: "On multiplie par 2 puis on divise par " + M("b") + " : " + M("h = \\frac{2A}{b}") },
          { f: "P = 2(x + y)", ask: "y", ans: "P/2 - x", sol: M("\\frac{P}{2} = x + y") + " donc " + M("y = \\frac{P}{2} - x") },
          { f: "v = \\frac{d}{t}", ask: "t", ans: "d/v", sol: M("t = \\frac{d}{v}") },
          { f: "y = mx + h", ask: "m", ans: "(y - h)/x", sol: M("mx = y - h") + " donc " + M("m = \\frac{y - h}{x}") },
        ])
      : R.pick([
          { f: "V = \\frac{1}{3}\\pi r^2 h", ask: "h", ans: "3V/(pi*r^2)", sol: M("h = \\frac{3V}{\\pi r^2}") },
          { f: "A = \\pi r^2", ask: "r", ans: "sqrt(A/pi)", sol: M("r^2 = \\frac{A}{\\pi}") + " donc " + M("r = \\sqrt{\\frac{A}{\\pi}}") + " (un rayon est positif)" },
          { f: "A = \\frac{(c + b) \\cdot h}{2}", ask: "b", ans: "2A/h - c", sol: M("c + b = \\frac{2A}{h}") + " donc " + M("b = \\frac{2A}{h} - c") },
          { f: "c^2 = a^2 + b^2", ask: "a", ans: "sqrt(c^2 - b^2)", sol: M("a = \\sqrt{c^2 - b^2}") + " (une longueur est positive)" },
        ]);
    return { q: "Dans la formule " + M(F.f) + ", exprime " + M(F.ask) + " en fonction des autres lettres. (Écris par exemple « " + F.ask + " = … » ou seulement l'expression.)", spec: { kind: "expr", expr: F.ans, pos: true }, canon: F.ans, sol: F.sol + "." };
  },

  simil(d) {
    const k = R.pick([1.5, 2, 2.5, 3, 4]);
    if (d === 1) {
      const a = R.int(2, 8), b = R.int(3, 9), c = R.int(3, 9);
      return { fig: FIG.simTri([a, b, c].map((v) => v + ""), [dec(a * k), "?", ""]), q: "Deux triangles sont semblables. Les côtés du petit mesurent " + M(a) + ", " + M(b) + " et " + M(c) + " cm. Le côté du grand qui correspond à " + M(a) + " cm mesure " + M(dec(a * k)) + " cm. Combien mesure le côté du grand qui correspond à " + M(b) + " cm ?", spec: { kind: "value", value: b * k }, sol: "Rapport " + M("k = \\frac{" + dec(a * k) + "}{" + a + "} = " + dec(k)) + " ; " + M(b + " \\cdot " + dec(k) + " = " + dec(b * k)) + " cm." };
    }
    if (d === 2) {
      const A = R.int(3, 20);
      return { fig: FIG.scaling(k, ""), q: "On agrandit une figure de rapport " + M(dec(k)) + ". Son aire était de " + M(A) + " cm². Quelle est la nouvelle aire (en cm²) ?", spec: { kind: "value", value: A * k * k }, sol: "Les aires sont multipliées par " + M("k^2 = " + dec(k * k)) + " : " + M(dec(A * k * k)) + " cm²." };
    }
    const kk = R.pick([2, 3, 4, 5]), A1 = R.int(2, 12);
    if (R.rand() < 0.5) return { q: "Deux figures semblables ont pour aires " + M(A1) + " cm² et " + M(A1 * kk * kk) + " cm². Le périmètre de la petite vaut " + M(A1 + 7) + " cm. Quel est le périmètre de la grande (en cm) ?", spec: { kind: "value", value: (A1 + 7) * kk }, sol: M("k^2 = \\frac{" + A1 * kk * kk + "}{" + A1 + "} = " + kk * kk) + " donc " + M("k = " + kk)+ " ; les longueurs sont multipliées par " + M(kk) + " : " + M((A1 + 7) * kk) + " cm." };
    return { fig: FIG.box("", "", ""), q: "Une maquette est à l'échelle " + M("1 : " + kk * 10) + ". Le volume de la maquette est de " + M(A1) + " cm³. Quel est le volume réel, en litres ?", spec: { kind: "value", value: (A1 * (kk * 10) ** 3) / 1000 }, sol: "Les volumes sont multipliés par " + M("k^3 = " + (kk * 10) ** 3) + " : " + M(A1 * (kk * 10) ** 3 + "\\ \\text{cm}^3 = " + dec((A1 * (kk * 10) ** 3) / 1000) + "\\ \\text{L}") + "." };
  },

  proba(d) {
    if (d === 1) {
      const c = { rouges: R.int(2, 6), bleues: R.int(2, 6), vertes: R.int(1, 4) }, n = c.rouges + c.bleues + c.vertes, col = R.pick(["rouges", "bleues", "vertes"]);
      return { fig: FIG.urn(c), q: "Une urne contient " + M(c.rouges) + " boules rouges, " + M(c.bleues) + " bleues et " + M(c.vertes) + " vertes. On tire une boule au hasard. Quelle est la probabilité qu'elle soit " + col.slice(0, -1) + " ? (fraction acceptée)", spec: { kind: "value", value: c[col] / n }, sol: "Cas favorables sur cas possibles : " + M("\\frac{" + c[col] + "}{" + n + "}" + (gcd(c[col], n) > 1 ? " = " + frac(c[col], n) : "")) + "." };
    }
    if (d === 2) {
      const s = R.int(3, 11), cnt = 6 - Math.abs(7 - s);
      return { q: "On lance deux dés équilibrés et on additionne les points. Quelle est la probabilité d'obtenir " + M(s) + " ? (fraction acceptée)", spec: { kind: "value", value: cnt / 36 }, sol: "Tableau 6 × 6 : " + M(cnt) + " cases donnent " + M(s) + " sur 36, soit " + M(frac(cnt, 36)) + "." };
    }
    const r = R.int(3, 6), b = R.int(2, 5), n = r + b;
    return { fig: FIG.urn({ rouges: r, bleues: b }), q: "Une urne contient " + M(r) + " boules rouges et " + M(b) + " bleues. On tire deux boules sans remise. Quelle est la probabilité d'obtenir deux boules de la même couleur ? (fraction acceptée)", spec: { kind: "value", value: (r * (r - 1) + b * (b - 1)) / (n * (n - 1)) }, sol: "Arbre : " + M("\\frac{" + r + "}{" + n + "} \\cdot \\frac{" + (r - 1) + "}{" + (n - 1) + "} + \\frac{" + b + "}{" + n + "} \\cdot \\frac{" + (b - 1) + "}{" + (n - 1) + "} = " + frac(r * (r - 1) + b * (b - 1), n * (n - 1))) + "." };
  },

  probeq(d) {
    if (d === 1) {
      const n = R.int(5, 40), s = 3 * n + 3;
      return { q: "La somme de trois nombres entiers consécutifs vaut " + M(s) + ". Quel est le plus petit ?", spec: { kind: "value", value: n }, sol: M("n + (n + 1) + (n + 2) = " + s + " \\iff 3n + 3 = " + s + " \\iff n = " + n) + "." };
    }
    if (d === 2) {
      if (R.rand() < 0.5) {
        const k = 3 * R.int(4, 40), n = (5 * k) / 3;
        return { q: "Une personne possède une somme en pièces de 2 francs. Elle l'échange contre des pièces de 5 francs et a alors " + M(k) + " pièces de moins. Quelle somme possède-t-elle (en francs) ?", spec: { kind: "value", value: 2 * n }, sol: M("n") + " pièces de 2 : " + M("2n = 5(n - " + k + ") \\iff 3n = " + 5 * k + " \\iff n = " + n) + " ; somme " + M(2 * n) + " francs." };
      }
      const a = R.int(8, 16), age = R.int(30, 45), y = R.int(3, 12); // dans y ans, le parent aura le double de l'âge de l'enfant
      const e = age + y - 2 * y; if (e <= 0 || (age + y) % 2) return GEN.probeq(2);
      const enf = (age + y) / 2 - y; if (enf < 1 || enf >= age) return GEN.probeq(2);
      return { q: "Un parent a " + M(age) + " ans et son enfant " + M("x") + " ans. Dans " + M(y) + " ans, le parent aura le double de l'âge de l'enfant. Quel âge a l'enfant aujourd'hui ?", spec: { kind: "value", value: enf }, sol: M(age + " + " + y + " = 2(x + " + y + ") \\iff x = " + enf) + "." };
    }
    if (R.rand() < 0.5) {
      const n = R.int(3, 15);
      return { q: "Le produit de deux entiers naturels consécutifs vaut " + M(n * (n + 1)) + ". Quel est le plus petit ?", spec: { kind: "value", value: n }, sol: M("n(n + 1) = " + n * (n + 1) + " \\iff n^2 + n - " + n * (n + 1) + " = 0") + " ; " + M("n = " + n) + " (l'autre solution, " + M(-(n + 1)) + ", n'est pas naturelle)." };
    }
    const L = R.int(4, 15), l = R.int(2, L - 1);
    return { fig: FIG.rectFig(L, l, "?", "?"), q: "Un rectangle a un périmètre de " + M(2 * (L + l)) + " cm et une aire de " + M(L * l) + " cm². Quelle est sa longueur (le plus grand côté, en cm) ?", spec: { kind: "value", value: L }, sol: M("x(" + (L + l) + " - x) = " + L * l + " \\iff x^2 - " + (L + l) + "x + " + L * l + " = 0") + " : " + M("x = " + l) + " ou " + M("x = " + L) + " ; la longueur vaut " + M(L) + " cm." };
  },

  // ===== Collège 1re =====
  polyop(d) {
    let cs, q, sol;
    if (d === 1) {
      const a = R.nz(-4, 4), b = R.nz(-7, 7), c = R.nz(-4, 4), e = R.nz(-7, 7);

      cs = padd(pmul([a, b], [a, b]), pscale(pmul([c, e], [c, -e]), -1));
      q = "(" + lin(a, b) + ")^2 - (" + lin(c, e) + ")(" + lin(c, -e) + ")";
      sol = M("(" + lin(a, b) + ")^2 = " + poly(pmul([a, b], [a, b]))) + " et " + M("(" + lin(c, e) + ")(" + lin(c, -e) + ") = " + poly(pmul([c, e], [c, -e]))) + " ; on soustrait : " + M(poly(cs));
    } else {
      const a = R.pick([1, 2]), b = R.nz(-3, 3), p = R.nz(-4, 4), r = R.nz(-5, 5), s = R.nz(-5, 5);

      sol = M("(" + lin(a, b) + ")^3 = " + poly(pmul(pmul([a, b], [a, b]), [a, b]))) + " ; " + M("(" + lin(1, p) + ")(" + poly([1, 0, r]) + ") = " + poly(pmul([1, p], [1, 0, r]))) + " ; différence : " + M(poly(ptrim(cs)));

    }

  },

  factor2(d) {

    if (d === 1) {
      if (R.rand() < 0.5) { const a = R.int(2, 6), k = R.int(1, 9); ex = poly([a, 0, -a * k * k]); fac = a + "(x - " + k + ")(x + " + k + ")"; sol = "Mise en évidence de " + M(a) + ", puis " + M("x^2 - " + k * k) + " (différence de carrés)"; }

      const p = R.nz(-7, 7), q = R.nz(-7, 7), a = R.pick([1, 1, 2, 3]);

      ex = poly(pscale(pmul([1, -p], [1, -q]), a));
      fac = (a > 1 ? a : "") + "(" + xm(p) + ")(" + xm(q) + ")";
      sol = (a > 1 ? "Mise en évidence de " + M(a) + ", puis " : "") + "deux nombres de somme " + M(-(p + q)) + " et de produit " + M(p * q) + " : " + M(-p) + " et " + M(-q);

        let a, b, c, e; do { a = R.int(2, 4); b = R.nz(-5, 5); c = R.int(1, 3); e = R.nz(-5, 5); } while (gcd(a, Math.abs(b)) !== 1 || gcd(c, Math.abs(e)) !== 1 || a * e === b * c);

  sys2(d) {

  },

  sys3(d) {
    const x = R.nz(-4, 5), y = R.nz(-4, 5), z = R.nz(-4, 5);
    const T = (c, v, first) => (c === 0 ? "" : (first ? (c < 0 ? "-" : "") : c < 0 ? " - " : " + ") + (Math.abs(c) === 1 ? "" : Math.abs(c)) + v);

    const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);

    else { do m = [0, 1, 2].map(() => [R.nz(-4, 4), R.nz(-4, 4), R.nz(-4, 4)]); while (det(m) === 0 || m.some((r) => r.every((v) => Math.abs(v) === 1))); }

  },

  euclide(d) {

  // ===== Collège 2e =====
  polydiv(d) {

  droites(d) {

    }
    if (d === 2) {
      const x0 = R.nz(-4, 4), y0 = R.int(-5, 5), perp = R.rand() < 0.6, mm = perp ? -1 / m : m, hh = y0 - mm * x0;

    }
    let a, b, c, e; do { a = R.nz(-4, 4); b = R.nz(-4, 4); c = R.nz(-4, 4); e = R.nz(-4, 4); } while (a * e - b * c === 0);
    const x = R.nz(-5, 5), y = R.nz(-5, 5);
    const T = (u, v, w) => (u === 1 ? "" : u === -1 ? "-" : u) + "x " + (v < 0 ? "- " + (v === -1 ? "" : -v) : "+ " + (v === 1 ? "" : v)) + "y = " + w;

  },

  cercle(d) {
    const a = R.int(-5, 5), b = R.int(-5, 5), r = R.int(1, 7);
    const sq = (v, n) => (v === 0 ? n + "^2" : "(" + n + sg(-v) + ")^2");

    if (d === 2) {
      const D = -2 * a, E = -2 * b, F = a * a + b * b - r * r;
      const T = "x^2 + y^2" + (D ? sg(D) + "x" : "") + (E ? sg(E) + "y" : "") + (F ? sg(F) : "") + " = 0";
      return { q: "Détermine le rayon du cercle " + M(T) + ".", spec: { kind: "value", value: r }, sol: "On complète les carrés : " + M(sq(a, "x") + " + " + sq(b, "y") + " = " + r * r) + ", donc " + M("r = " + r) + "." };
    }
    const pts = [[3, 4], [4, 3], [5, 0], [0, 5], [-3, 4], [-4, 3], [-5, 0], [0, -5], [3, -4], [4, -3], [-3, -4], [-4, -3]];
    let P, Q; do { P = R.pick(pts); Q = R.pick(pts); } while (P[0] === Q[0]);
    const A = Q[1] - P[1], B = -(Q[0] - P[0]), C = A * P[0] + B * P[1], g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    const a2 = A / g, b2 = B / g, c2 = C / g;
    return { q: "Détermine les abscisses des points d'intersection du cercle " + M("x^2 + y^2 = 25") + " et de la droite " + M((a2 === 1 ? "" : a2 === -1 ? "-" : a2) + "x " + (b2 < 0 ? "- " + (b2 === -1 ? "" : -b2) : "+ " + (b2 === 1 ? "" : b2)) + "y = " + c2) + ".", spec: { kind: "set", values: [P[0], Q[0]] }, sol: "On isole une inconnue dans l'équation de la droite et on substitue : équation du 2e degré, " + M("x = " + P[0]) + " ou " + M("x = " + Q[0]) + " (points " + M("(" + P.join(" ; ") + ")") + " et " + M("(" + Q.join(" ; ") + ")") + ")." };
  },
});

      () => { const a = R.pick([1, 2, 4, 5, 7, 8]), u = R.pick([0, 0, 1, 2]); return QV("Écris le nombre " + M(u + "{,}" + a + a + a + "\\ldots") + " sous forme de fraction.", u + a / 9, M("0{,}111\\ldots = \\frac{1}{9}") + ", donc " + M("0{,}" + a + a + a + "\\ldots = \\frac{" + a + "}{9}") + (u ? " et " + M(u + " + \\frac{" + a + "}{9} = \\frac{" + (9 * u + a) + "}{9}") : "") + "."); },

  { id: "fractout", theme: "no", label: "Fraction d'une quantité", ex: "\\frac{3}{4} \\text{ de } 20 = 15", CH: [9], again: [10], codes: "9NO6\\.0[79]|10NO2\\.12",

  { id: "volpave", theme: "gm", label: "Cube et pavé : volume et aire", ex: "V = a \\cdot b \\cdot c", CH: [9], codes: "9GM3\\.01",

  { id: "solides", theme: "es", label: "Solides : faces, arêtes, sommets", ex: "\\text{pavé : 6 faces, 12 arêtes, 8 sommets}", CH: [9], again: [10], codes: "9ES4\\.01|10ES1\\.01",
    hint: "Prisme droit dont la base a n côtés : n + 2 faces, 2n sommets, 3n arêtes.",

  { id: "proptab", theme: "fa", label: "Tableau de proportionnalité", ex: "\\times\\,2{,}5", CH: [9], again: [10], codes: "9FA1\\.01",

    lesson: ["Reconnaître la proportionnalité", "Deux grandeurs sont proportionnelles si l'une s'obtient en multipliant l'autre par un nombre fixe.", "Ce nombre est le coefficient de proportionnalité : on le trouve en divisant une valeur de la 2e ligne par la valeur correspondante de la 1re.", ["\\(2 \\to 7\\) et \\(6 \\to 21\\) : coefficient \\(3{,}5\\)", "\\(4 \\to 10\\), donc \\(6 \\to 15\\) (coefficient \\(2{,}5\\))"], "Ajouter le même nombre partout ne donne pas une proportionnalité : \\(2 \\to 5\\) et \\(4 \\to 7\\) n'est pas proportionnel."],
    g: [

      () => { const k = R.pick([1.5, 2.5, 3.5]), a = R.pick([2, 4, 6]), b = a + R.pick([2, 4, 6, 8]); return QV("Le tableau est un tableau de proportionnalité : " + M(a + " \\to " + fx(k * a)) + " et " + M(b + " \\to \\; ?") + ". Quel nombre manque ?", fx(k * b), "Coefficient : " + M(fx(k * a) + " : " + a + " = " + dec(k)) + ". Donc " + M(b + " \\cdot " + dec(k) + " = " + dec(fx(k * b))) + "."); },
    ] },

  { id: "geocomb", theme: "es", label: "Problèmes combinant plusieurs théorèmes", ex: "h = \\frac{a \\cdot b}{c}", CH: [12], MP: [12, "S2"], codesMATU: "1\\.GE\\.03f|1\\.GE\\.06c",

    lesson: ["Enchaîner les théorèmes", "Un problème demande souvent deux étapes.", "On repère les triangles rectangles de la figure. Pythagore donne une longueur manquante ; l'aire calculée de deux façons donne une hauteur (\\(a \\cdot b = c \\cdot h\\)) ; la trigonométrie donne un angle.", ["Triangle 3, 4, 5 : aire 6, hauteur sur l'hypoténuse \\(\\frac{3 \\cdot 4}{5} = 2{,}4\\)", "Pavé : la diagonale de la base, puis l'angle avec \\(\\tan\\)"], "Dans l'espace, dessine à part le triangle rectangle que tu utilises."],
    g: [
      () => { const [a, b, c] = R.pick(TRIPLES); return QV("Un triangle rectangle a une hypoténuse de " + M(c) + " cm et un côté de l'angle droit de " + M(a) + " cm. Calcule son aire (en cm²).", a * b / 2, "Autre côté : " + M("\\sqrt{" + c + "^2 - " + a + "^2} = " + b) + " cm. Aire : " + M("\\frac{" + a + " \\cdot " + b + "}{2} = " + a * b / 2) + " cm².", { fig: GF.rightTri(a, b, { la: a + " cm", lc: c + " cm" }) }); },
      () => { const [a, b, c] = R.pick([[3, 4, 5], [6, 8, 10], [9, 12, 15], [12, 16, 20], [15, 20, 25], [5, 12, 13], [7, 24, 25]]); return QV("Un triangle rectangle a des côtés de l'angle droit de " + M(a) + " cm et " + M(b) + " cm. Calcule la hauteur relative à l'hypoténuse (en cm). Donne la valeur exacte.", a * b / c, "Hypoténuse : " + M(c) + " cm. L'aire s'écrit de deux façons : " + M("\\frac{" + a + " \\cdot " + b + "}{2} = \\frac{" + c + " \\cdot h}{2}") + ", donc " + M("h = " + frac(a * b, c)) + " cm.", { fig: GF.altitude((a * a) / c, (b * b) / c, { lp: "", lq: "", lh: "h = ?", la: a + " cm", lb: b + " cm" }) }); },
      () => { const [a, b, d] = R.pick(TRIPLES.slice(0, 6)), c = R.int(2, 12), ang = Math.atan(c / d) * 180 / Math.PI; return QV("Un pavé droit a une base de " + M(a) + " cm sur " + M(b) + " cm et une hauteur de " + M(c) + " cm. Quel angle sa grande diagonale fait-elle avec la base, en degrés ? Arrondis au dixième.", ang, "Diagonale de la base : " + M("\\sqrt{" + a + "^2 + " + b + "^2} = " + d) + " cm. " + M("\\tan \\alpha = \\frac{" + c + "}{" + d + "}") + ", donc " + M("\\alpha \\approx " + dec(ang.toFixed(1)) + "°") + ".", { round: 0.1, fig: FIG.box(a + " cm", b + " cm", c + " cm") }); },
    ] },
  { id: "fracetage", theme: "fa", label: "Fractions à étages", ex: "\\frac{1 + \\frac{2}{x}}{1 - \\frac{2}{x}} = \\frac{x + 2}{x - 2}", CH: [13], MP: null, codesMATU: "2\\.AL\\.02e",
    hint: "Multiplie le numérateur et le dénominateur de la grande fraction par le dénominateur commun des petites.",
    lesson: ["Fractions à étages", "Une fraction dont les termes contiennent eux-mêmes des fractions.", "On multiplie le numérateur et le dénominateur de la grande fraction par un dénominateur commun des petites fractions ; ou bien on écrit chaque étage comme une seule fraction, puis on multiplie par l'inverse.", ["\\(\\frac{1 + \\frac{2}{x}}{1 - \\frac{2}{x}} = \\frac{x + 2}{x - 2}\\) (on multiplie par \\(x\\))", "\\(\\frac{\\frac{6}{x}}{\\frac{2}{x^2}} = \\frac{6}{x} \\cdot \\frac{x^2}{2} = 3x\\)"], "On multiplie tous les termes des deux étages, pas seulement les fractions."],
    g: [
      () => { const b = R.int(2, 5), k = R.int(2, 6); return QX("Simplifie : " + M("\\dfrac{\\frac{" + k * b + "}{x}}{\\frac{" + b + "}{x^2}}"), k + "x", M("\\frac{" + k * b + "}{x} \\cdot \\frac{x^2}{" + b + "} = " + k + "x")); },
      () => { const a = R.int(2, 9); return { q: "Écris comme une seule fraction : " + M("\\dfrac{1 + \\frac{" + a + "}{x}}{1 - \\frac{" + a + "}{x}}"), spec: { kind: "expr", expr: "(x+" + a + ")/(x-" + a + ")", form: "onefrac" }, canon: "(x+" + a + ")/(x-" + a + ")", sol: "On multiplie les deux étages par " + M("x") + " : " + M("\\frac{x + " + a + "}{x - " + a + "}") + "." }; },
      () => { const a = R.int(2, 9); return { q: "Écris comme une seule fraction simplifiée : " + M("\\dfrac{\\frac{1}{x} - \\frac{1}{" + a + "}}{x - " + a + "}"), spec: { kind: "expr", expr: "-1/(" + a + "x)", form: "onefrac" }, canon: "-1/(" + a + "x)", sol: "Numérateur : " + M("\\frac{" + a + " - x}{" + a + "x}") + ". On divise par " + M("x - " + a) + " : " + M("\\frac{-(x - " + a + ")}{" + a + "x(x - " + a + ")} = -\\frac{1}{" + a + "x}") + "." }; },
    ] },
  { id: "probrat", theme: "fa", label: "Problèmes menant à une équation rationnelle", ex: "\\frac{1}{3} + \\frac{1}{6} = \\frac{1}{t}", CH: [13], MP: null, codesMATU: "2\\.AL\\.03c",
    hint: "Travail en commun : additionne les parts faites en une heure (1/a + 1/b = 1/t). Vitesse : temps = distance / vitesse.",
    lesson: ["Problèmes rationnels", "L'inconnue apparaît au dénominateur.", "Travail en commun : en une heure, on fait \\(\\frac{1}{a} + \\frac{1}{b}\\) du travail, donc \\(\\frac{1}{a} + \\frac{1}{b} = \\frac{1}{t}\\). Mouvement : \\(t = \\frac{d}{v}\\).", ["Robinets de 3 h et 6 h : \\(\\frac{1}{3} + \\frac{1}{6} = \\frac{1}{2}\\), donc 2 h ensemble", "\\(\\frac{60}{v} - \\frac{60}{v + 5} = 1\\) mène à \\(v^2 + 5v - 300 = 0\\)"], "Ensemble, on va plus vite que le plus rapide des deux : vérifie que la réponse est plausible."],
    g: [
      () => { const [a, b, t] = R.pick([[3, 6, 2], [4, 12, 3], [6, 12, 4], [10, 15, 6], [12, 24, 8], [20, 30, 12], [6, 3, 2], [15, 10, 6]]); return QV("Un robinet remplit un bassin en " + M(a) + " heures, un autre en " + M(b) + " heures. En combien d'heures le remplissent-ils ensemble ?", t, M("\\frac{1}{" + a + "} + \\frac{1}{" + b + "} = \\frac{1}{" + t + "}") + " : " + M(t) + " heures."); },
      () => { const [a, b, t] = R.pick([[3, 6, 2], [4, 12, 3], [6, 12, 4], [10, 15, 6], [12, 24, 8], [20, 30, 12]]); return QV("Deux peintres mettent ensemble " + M(t) + " heures pour repeindre une salle. Le premier, seul, mettrait " + M(a) + " heures. Combien d'heures mettrait le second, seul ?", b, M("\\frac{1}{" + a + "} + \\frac{1}{x} = \\frac{1}{" + t + "}") + ", donc " + M("\\frac{1}{x} = \\frac{1}{" + t + "} - \\frac{1}{" + a + "} = \\frac{1}{" + b + "}") + " : " + M(b) + " heures."); },
      () => { const [v, d] = R.pick([[10, 30], [15, 60], [20, 100], [25, 150], [30, 210]]); return QV("Un cycliste parcourt " + M(d) + " km. En roulant " + M(5) + " km/h plus vite, il mettrait une heure de moins. Quelle est sa vitesse (en km/h) ?", v, M("\\frac{" + d + "}{v} - \\frac{" + d + "}{v + 5} = 1") + " mène à " + M("v^2 + 5v - " + 5 * d + " = 0") + ", dont la solution positive est " + M("v = " + v) + " km/h."); },
    ] },
  { id: "bijection", theme: "fa", label: "Injection, bijection", ex: "f : [h \\, ; +\\infty[ \\to [k \\, ; +\\infty[", CH: [13], MP: null, codesMATU: "2\\.FO\\.02",
    hint: "Injective : deux nombres différents n'ont jamais la même image (toute horizontale coupe le graphe au plus une fois).",
    lesson: ["Bijection", "Une bijection associe à chaque élément de l'arrivée exactement une préimage.", "Injective : toute droite horizontale coupe le graphe au plus une fois. Pour rendre bijective \\(f(x) = (x - h)^2 + k\\), on restreint le départ à \\([h \\, ; +\\infty[\\) (une seule branche) et l'arrivée à l'ensemble des images \\([k \\, ; +\\infty[\\).", ["\\(x^3\\) et \\(2x + 1\\) sont injectives sur \\(\\mathbb{R}\\) ; \\(x^2\\) ne l'est pas", "\\((x - 3)^2 + 1\\) : bijection de \\([3 \\, ; +\\infty[\\) vers \\([1 \\, ; +\\infty[\\)"], "\\(x^2\\) n'est pas injective sur \\(\\mathbb{R}\\) : \\((-2)^2 = 2^2\\)."],
    g: [
      () => { const h = R.nz(-6, 6), k = R.nz(-6, 6), askK = R.rand() < 0.5; return QV("La fonction " + M("f(x) = (x" + sg(-h) + ")^2" + sg(k)) + " est une bijection de " + M("[a \\, ; +\\infty[") + " vers " + M("[b \\, ; +\\infty[") + ", avec " + M("a") + " le plus petit possible. Que vaut " + M(askK ? "b" : "a") + " ?", askK ? k : h, "Le sommet de la parabole est " + M("(" + h + " \\, ; " + k + ")") + " : on garde la branche de droite, " + M("a = " + h) + ", et les images forment " + M("[" + k + " \\, ; +\\infty[") + "."); },
      () => { const h = R.nz(-5, 5), k = R.nz(-6, 6), askK = R.rand() < 0.5; return QV("La fonction " + M("f(x) = " + poly([1, -2 * h, h * h + k])) + " est une bijection de " + M("[a \\, ; +\\infty[") + " vers " + M("[b \\, ; +\\infty[") + ", avec " + M("a") + " le plus petit possible. Que vaut " + M(askK ? "b" : "a") + " ?", askK ? k : h, "Sommet : " + M("x = " + h) + ", " + M("f(" + h + ") = " + k) + ". Donc " + M("a = " + h) + " et " + M("b = " + k) + "."); },
      () => { const L = [["x^2", 0], ["x^3", 1], ["2x + 1", 1], ["|x|", 0], ["\\frac{1}{x}", 1], ["x^2 + 1", 0], ["\\sqrt{x}", 1], ["-3x", 1], ["x^4", 0], ["(x - 1)^2", 0]], fs = pickN(L, 5), ok = fs.filter((f) => f[1]); return QV("Combien de ces fonctions sont injectives sur leur domaine de définition ? " + fs.map((f) => M(f[0])).join(" ; "), ok.length, ok.length ? "Injectives : " + ok.map((f) => M(f[0])).join(", ") + ". Les autres prennent deux fois la même valeur (par exemple en " + M("x") + " et en " + M("-x") + " ou de part et d'autre du sommet)." : "Aucune : chacune prend deux fois la même valeur."); },
    ] },
  { id: "decomp", theme: "fa", label: "Décomposer une fonction", ex: "\\sqrt{3x + 1} = f(g(x))", CH: [13], MP: null, codesMATU: "2\\.FO\\.01c",
    hint: "Demande-toi quelle opération on fait en dernier : c'est la fonction extérieure f ; ce qui est à l'intérieur est g.",
    lesson: ["Décomposer", "Une fonction compliquée est souvent une composée de fonctions simples.", "Dans \\(h(x) = f(g(x))\\), \\(g\\) est « l'intérieur » (calculé en premier) et \\(f\\) « l'extérieur » (calculé en dernier).", ["\\(\\sqrt{3x + 1}\\) : \\(g(x) = 3x + 1\\), \\(f(x) = \\sqrt{x}\\)", "\\(\\frac{1}{x^2 + 4}\\) : \\(g(x) = x^2 + 4\\), \\(f(x) = \\frac{1}{x}\\)"], "L'ordre compte : \\(\\sqrt{x} + 1\\) et \\(\\sqrt{x + 1}\\) ne se décomposent pas de la même façon."],
    g: [
      () => { const a = R.int(2, 7), b = R.nz(-9, 9); return QX("On écrit " + M("h(x) = \\sqrt{" + lin(a, b) + "}") + " sous la forme " + M("h(x) = f(g(x))") + " avec " + M("f(x) = \\sqrt{x}") + ". Donne " + M("g(x)") + ".", pex([a, b]), M("g(x) = " + lin(a, b)) + " : c'est ce qui se trouve sous la racine."); },
      () => { const c = R.int(1, 9), n = R.pick([3, 4, 5]); if (R.rand() < 0.5) return QX("On écrit " + M("h(x) = \\frac{1}{x^2 + " + c + "}") + " sous la forme " + M("h(x) = f(g(x))") + " avec " + M("f(x) = \\frac{1}{x}") + ". Donne " + M("g(x)") + ".", "x^2+" + c, M("g(x) = x^2 + " + c) + " : c'est le dénominateur."); const a = R.int(2, 5), b = R.nz(-7, 7); return QX("On écrit " + M("h(x) = (" + lin(a, b) + ")^" + n) + " sous la forme " + M("h(x) = f(g(x))") + " avec " + M("f(x) = x^" + n) + ". Donne " + M("g(x)") + ".", pex([a, b]), M("g(x) = " + lin(a, b)) + " : c'est le contenu de la parenthèse."); },
      () => { const a = R.pick([2, 3, -1, -2]), b = R.nz(-6, 6), c = R.nz(-8, 8); return QX("On écrit " + M("h(x) = " + (a === -1 ? "-" : a) + "(x" + sg(b) + ")^2" + sg(c)) + " sous la forme " + M("h(x) = f(g(x))") + " avec " + M("g(x) = x" + sg(b)) + ". Donne " + M("f(x)") + ".", pex([a, 0, c]), "On remplace " + M("x" + sg(b)) + " par " + M("x") + " : " + M("f(x) = " + poly([a, 0, c])) + "."); },
    ] },
  { id: "polyexpr", theme: "fa", label: "Expression d'une fonction polynomiale", ex: "f(x) = a(x - x_1)(x - x_2)(x - x_3)", CH: [13], MP: null, codesMATU: "2\\.FO\\.04d|2\\.FO\\.12c",
    hint: "Les zéros donnent les facteurs : f(x) = a(x − x₁)(x − x₂)(x − x₃). Un point de plus donne a.",
    lesson: ["Retrouver un polynôme", "Les zéros déterminent un polynôme à un facteur près.", "Si \\(f\\) de degré 3 a pour zéros \\(x_1, x_2, x_3\\) : \\(f(x) = a(x - x_1)(x - x_2)(x - x_3)\\). Un zéro double donne un facteur au carré (la courbe touche l'axe sans le traverser). On trouve \\(a\\) avec un autre point.", ["Zéros \\(-1, 1, 2\\) et \\(f(0) = 4\\) : \\(a \\cdot 1 \\cdot (-1) \\cdot (-2) = 4\\), donc \\(a = 2\\)", "Boîte sans couvercle : \\(V(x) = x(L - 2x)^2\\)"], "Le signe de \\(a\\) se voit sur le graphe : si la courbe monte à droite, \\(a > 0\\)."],
    g: [
      () => { const rs = pickN([-3, -2, -1, 1, 2, 3], 3).sort((x, y) => x - y), a = R.pick([1, 2, -1, -2, 3]), y0 = a * -rs[0] * -rs[1] * -rs[2]; return QV("Une fonction polynomiale de degré 3 a pour zéros " + M(rs.join(" ;\\ ")) + " et vérifie " + M("f(0) = " + y0) + ". On écrit " + M("f(x) = a(x" + sg(-rs[0]) + ")(x" + sg(-rs[1]) + ")(x" + sg(-rs[2]) + ")") + ". Que vaut " + M("a") + " ?", a, M("f(0) = a \\cdot " + par(-rs[0]) + " \\cdot " + par(-rs[1]) + " \\cdot " + par(-rs[2]) + " = " + -rs[0] * -rs[1] * -rs[2] + "a = " + y0) + ", donc " + M("a = " + a) + "."); },
      () => { const p = R.pick([-2, -1, 1, 2]), q = R.pick([-3, -1, 1, 3].filter((v) => v !== p)), a = R.pick([1, 2, -1, -2]), y0 = -a * p * p * q; return QV("Une fonction polynomiale de degré 3 a un zéro double en " + M(p) + ", un zéro simple en " + M(q) + ", et vérifie " + M("f(0) = " + y0) + ". On écrit " + M("f(x) = a(x" + sg(-p) + ")^2(x" + sg(-q) + ")") + ". Que vaut " + M("a") + " ?", a, M("f(0) = a \\cdot " + p * p + " \\cdot " + par(-q) + " = " + -p * p * q + "a = " + y0) + ", donc " + M("a = " + a) + "."); },
      () => { const L = R.pick([10, 12, 20, 30]), x = R.int(1, L / 2 - 2); return QV("Aux quatre coins d'un carton carré de " + M(L) + " cm de côté, on découpe des carrés de côté " + M("x") + ", puis on relève les bords pour former une boîte sans couvercle. Quel est le volume de la boîte pour " + M("x = " + x) + " cm (en cm³) ?", x * (L - 2 * x) ** 2, M("V(x) = x(" + L + " - 2x)^2") + " : " + M("V(" + x + ") = " + x + " \\cdot " + (L - 2 * x) + "^2 = " + nb(x * (L - 2 * x) ** 2)) + " cm³."); },
    ] },
  { id: "homogrec", theme: "fa", label: "Réciproque d'une fonction homographique", ex: "f(x) = \\frac{2x + 1}{x - 3}", CH: [13], MP: null, codesMATU: "2\\.FO\\.06d",
    hint: "Écris y = f(x), isole x en fonction de y, puis échange les lettres.",

    g: [
      () => { const a = R.int(2, 9), b = R.nz(-7, 7); return QX("Soit " + M("f(x) = \\frac{" + a + "}{x" + sg(-b) + "}") + ". Donne l'expression de " + M("f^{-1}(x)") + ".", a + "/x+(" + b + ")", M("y = \\frac{" + a + "}{x" + sg(-b) + "} \\iff x" + sg(-b) + " = \\frac{" + a + "}{y}") + ", donc " + M("f^{-1}(x) = \\frac{" + a + "}{x}" + sg(b)) + "."); },
      () => { const a = R.int(2, 5), b = R.nz(-6, 6), d = R.nz(-6, 6); if (a * d === b) return GEN.homogrec(2); const ex = "((" + b + ")-(" + d + ")*x)/(x-" + a + ")"; return { q: "Soit " + M("f(x) = \\frac{" + lin(a, b) + "}{x" + sg(d) + "}") + ". Donne l'expression de " + M("f^{-1}(x)") + " sous la forme d'une seule fraction.", spec: { kind: "expr", expr: ex, form: "onefrac" }, canon: ex, sol: M("y(x" + sg(d) + ") = " + lin(a, b) + " \\iff x(y - " + a + ") = " + b + sg(-d).replace(/(\d+)$/, "$1y")) + ", donc " + M("f^{-1}(x) = \\frac{" + poly([-d, b]) + "}{x - " + a + "}") + "." }; },
      () => { const a = R.int(2, 5), b = R.nz(-6, 6), x0 = R.int(-5, 6), d = 1 - x0, k = a * x0 + b; if (a * d === b) return GEN.homogrec(3); return QV("Soit " + M("f(x) = \\frac{" + lin(a, b) + "}{x" + sg(d) + "}") + ". Calcule " + M("f^{-1}(" + k + ")") + ".", x0, "On cherche " + M("x") + " tel que " + M("f(x) = " + k) + " : " + M(lin(a, b) + " = " + k + "(x" + sg(d) + ")") + ", donc " + M("x = " + x0) + "."); },
    ] },
  { id: "trigassoc", theme: "es", label: "Angles associés, relations fondamentales", ex: "\\sin(180° - \\alpha) = \\sin \\alpha", CH: [13], MP: [13, "S2"], codesMATU: "2\\.FO\\.07[de]",

    lesson: ["Angles associés", "Les symétries du cercle trigonométrique relient les sinus et cosinus.", "\\(\\sin(180° - \\alpha) = \\sin \\alpha\\), \\(\\cos(180° - \\alpha) = -\\cos \\alpha\\), \\(\\sin(-\\alpha) = -\\sin \\alpha\\), \\(\\cos(-\\alpha) = \\cos \\alpha\\), \\(\\sin(90° - \\alpha) = \\cos \\alpha\\). Toujours : \\(\\sin^2 \\alpha + \\cos^2 \\alpha = 1\\) et \\(\\tan \\alpha = \\frac{\\sin \\alpha}{\\cos \\alpha}\\).", ["\\(\\sin \\alpha = 0{,}6\\) : \\(\\sin(180° - \\alpha) = 0{,}6\\)", "\\(\\sin \\alpha = \\frac{3}{5}\\), \\(\\alpha\\) aigu : \\(\\cos \\alpha = \\frac{4}{5}\\)"], "Pour un angle obtus, le cosinus est négatif."],

const ineqT = (k, c, op, v) => lin(k, c) + " " + OPT[op] + " " + v; // « kx + c op v »
const flipOp = { ">": "<", "<": ">", ">=": "<=", "<=": ">=" };
// x op b → intervalle [a, aIncl, b, bIncl]
const ivOf = (op, b) => (op === ">" ? [b, false, Infinity, false] : op === ">=" ? [b, true, Infinity, false] : op === "<" ? [-Infinity, false, b, false] : [-Infinity, false, b, true]);
// Intersection de deux intervalles (null si vide)
function ivAnd(p, q) {
  let a = p[0], ai = p[1], b = p[2], bi = p[3];
  if (q[0] > a || (q[0] === a && !q[1])) { a = q[0]; ai = q[1] && (q[0] > p[0] || p[1]); }
  if (q[2] < b || (q[2] === b && !q[3])) { b = q[2]; bi = q[3] && (q[2] < p[2] || p[3]); }
  if (a > b || (a === b && !(ai && bi))) return null;
  return [a, ai, b, bi];
}
// Inéquation « kx + c op k·b + c » dont la solution est « x op' b » (op' retourné si k < 0).
function ineqLine(k, b, opSol) {
  const c = R.nz(-9, 9), op = k < 0 ? flipOp[opSol] : opSol;
  return ineqT(k, c, op, k * b + c);
}

};
(function registerFine() {
  for (const id of FINE_REMOVED) {
    const i = NOTIONS.findIndex((n) => n.id === id);
    if (i >= 0) NOTIONS.splice(i, 1);
    delete GEN[id]; delete HINTS_EXTRA[id]; delete LESSONS_EXTRA[id];
    if (typeof PROB !== "undefined") delete PROB[id];
    if (typeof PROB_EXTRA !== "undefined") delete PROB_EXTRA[id];
  }
  for (const [id, ch] of Object.entries(FINE_PATCH)) { const n = NOTIONS.find((x) => x.id === id); if (n) Object.assign(n, ch); }
  for (const f of FINE) {
    const n = { id: f.id, theme: f.theme, label: f.label, ex: f.ex, CH: f.CH, FR: null };
    if (f.again) n.again = f.again;
    if (f.MP !== undefined) n.MP = f.MP;
    // rangée après la dernière notion de la même année (ordre d'affichage)
    let at = -1; NOTIONS.forEach((x, i) => { if (x.CH && f.CH && x.CH[0] <= f.CH[0]) at = i; });
    if (f.CH) NOTIONS.splice(at + 1, 0, n); else NOTIONS.push(n);
    GEN[f.id] = (d) => f.g[Math.min(d, f.g.length) - 1]();
    HINTS_EXTRA[f.id] = f.hint;
    LESSONS_EXTRA[f.id] = f.lesson;
  }
})();

// Compétence d'une question : notion + niveau (le problème compte pour le niveau 3).
function compOf(id, d) {
  const L = COMPS[id];
  if (!L) return id + ":0";
  const k = Math.min(d, 3) - 1, i = L.indexOf(L[k]);
  return id + ":" + i;
}
// Compétences distinctes d'une notion : [{ cid, label }].
function compsOf(id) {
  const L = COMPS[id] || [NOTIONS.find((n) => n.id === id).label];
  return L.map((label, i) => ({ cid: id + ":" + i, label, i })).filter((c) => L.indexOf(c.label) === c.i);
}
// Note sur l'échelle suisse (1 à 6, demi-points) à partir des 8 dernières réponses ; null avant 3 réponses.
function compNote(rec) {
  if (!rec || rec.r.length < 3) return null;
  const avg = rec.r.reduce((a, b) => a + b, 0) / rec.r.length;
  return Math.round((1 + 5 * avg) * 2) / 2;
}

// Badges (13.11) : régularité (pas de série qui se perd), maîtrise (notes de compétences), persévérance, curiosité.
// Tout reste sur l'appareil ; un badge gagné ne se perd jamais. Compteurs dans state.bc, badges gagnés dans state.badges.
const BADGE_FAM = { reg: "Régularité", mai: "Maîtrise", per: "Persévérance", cur: "Curiosité" };
const weekOf = (s) => { const d = new Date(s + "T12:00:00"); return addDays(s, -((d.getDay() + 6) % 7)); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);

const Badges = {
  bc(state) {
    if (!state.bc) {
      // Profil existant : on repart de l'historique déjà enregistré.
      const days = (state.history || []).filter((x) => x.n > 0).map((x) => x.date), weeks = {};
      for (const d of days) weeks[weekOf(d)] = (weeks[weekOf(d)] || 0) + 1;
      state.bc = { days: days.length, last: days[days.length - 1] || null, weeks, full: Object.values(weeks).filter((n) => n >= 5).length, rentree: false,
        retry: 0, d3: 0, lessons: [], fb: Object.keys(state.votes || {}).filter((k) => state.votes[k].v !== "facile").length + (state.comments || []).length,
        low: {}, pente: false, down: {}, compris: false };
    }
    return state.bc;
  },
  // Notes des compétences.
  notes(state) { return Object.values(state.comps || {}).map(compNote).filter((n) => n !== null); },
  // Notion maîtrisée : toutes ses compétences notées 5 ou plus.
  notionProgress(state, id) { const cs = compsOf(id); return [cs.filter((c) => (compNote((state.comps || {})[c.cid]) ?? 0) >= 5).length, cs.length]; },
  // Notions ouvertes de l'année (vues ou en cours) d'un thème.
  openOf(state, th) {
    return Engine.catalog(state.profile).filter((c) => c.current && c.theme === th && state.notions[c.id] && ["vu", "encours"].includes(state.notions[c.id].status)).map((c) => c.id);
  },
  // Icône d'un badge de thème, d'après son libellé.
  themeIcon(label) {
    const T = [[/vectoriel|coordonn|droites param/i, "🧭"], [/probab|statist|données/i, "🎲"], [/complexe/i, "🌀"], [/analyse/i, "📉"], [/trigo/i, "📐"], [/géom|volume|espace/i, "📐"],
      [/syst|équation|inéquation/i, "⚖️"], [/fonction|puissance|log/i, "📈"], [/algèbre|algébrique/i, "🔣"], [/nombre|numérique/i, "🔢"], [/grandeur|mesure/i, "📏"]];
    return (T.find(([r]) => r.test(label)) || [0, "🏆"])[1];
  },
  // Badges de l'élève : les badges de thème suivent le découpage de son référentiel (CO, matu ou MP).
  list(state) {
    const themes = state && state.profile ? Engine.themeOrder(Engine.catalog(state.profile).filter((c) => c.current)) : Object.keys(THEMES);
    const L = [
      { id: "premier", fam: "reg", icon: "👣", name: "Premier pas", crit: "Terminer une première séance.", prog: (s, b) => [Math.min(b.days, 1), 1] },
      { id: "semaine", fam: "reg", icon: "📅", name: "Semaine pleine", crit: "S'entraîner 5 jours dans une même semaine (du lundi au dimanche).", prog: (s, b) => [Math.min(5, b.weeks[weekOf(day())] || 0, 5), 5, b.full >= 1] },
      { id: "mois", fam: "reg", icon: "🗓️", name: "Un mois fidèle", crit: "4 semaines pleines, pas forcément d'affilée.", prog: (s, b) => [Math.min(b.full, 4), 4] },
      { id: "rentree", fam: "reg", icon: "🎒", name: "Rentrée", crit: "Reprendre l'entraînement après au moins 10 jours de pause.", prog: (s, b) => [b.rentree ? 1 : 0, 1] },
      { id: "s50", fam: "reg", icon: "🏅", name: "50 séances", crit: "50 jours d'entraînement au total.", prog: (s, b) => [Math.min(b.days, 50), 50] },
      { id: "comp5", fam: "mai", icon: "⭐", name: "Première compétence", crit: "Une compétence atteint la note 5.", prog: (s) => [this.notes(s).some((n) => n >= 5) ? 1 : 0, 1] },
      { id: "notion", fam: "mai", icon: "🎯", name: "Notion maîtrisée", crit: "Toutes les compétences d'une notion à 5 ou plus.",
        prog: (s) => Object.keys(s.notions).map((id) => this.notionProgress(s, id)).reduce((a, p) => (p[1] && p[0] / p[1] > a[0] / a[1] ? p : a), [0, 3]) },
      { id: "expert", fam: "mai", icon: "💎", name: "Expert", crit: "Une compétence atteint la note 6.", prog: (s) => [this.notes(s).some((n) => n >= 6) ? 1 : 0, 1] },
      ...themes.map((th) => ({ id: "th-" + th, fam: "mai", icon: this.themeIcon(Engine.themeLabel(th)), name: Engine.themeLabel(th),
        crit: th.includes(".") ? "Toutes les notions ouvertes de ce chapitre maîtrisées." : "Toutes les notions ouvertes de ce thème cette année maîtrisées (au moins 2 notions).",
        // Au moins 2 notions, sauf pour un chapitre qui n'en compte qu'une (ex. Ensembles).
        prog: (s) => {
          const ids = this.openOf(s, th), all = Engine.catalog(s.profile).filter((c) => c.current && c.theme === th).length;
          const ok = ids.filter((id) => { const p = this.notionProgress(s, id); return p[0] === p[1]; }).length;
          return [ok, Math.max(Math.min(2, all), ids.length, 1)];
        } })),
      { id: "retry", fam: "per", icon: "🔁", name: "Deuxième essai", crit: "Réussir 10 fois une question au deuxième essai.", prog: (s, b) => [Math.min(b.retry, 10), 10] },
      { id: "compris", fam: "per", icon: "💡", name: "Ça y est !", crit: "Après « pas compris » sur un rappel de cours, réussir 3 questions de suite de cette notion.",
        prog: (s, b) => [b.compris ? 3 : Math.max(0, ...Object.values(b.down)), 3] },
      { id: "pente", fam: "per", icon: "⛰️", name: "Remonter la pente", crit: "Faire passer une compétence de 3 ou moins à 5 ou plus.", prog: (s, b) => [b.pente ? 1 : 0, 1] },
      { id: "d3", fam: "per", icon: "🧗", name: "Niveau supérieur", crit: "Réussir 5 questions de difficulté 3 du premier coup.", prog: (s, b) => [Math.min(b.d3, 5), 5] },
      { id: "lecteur", fam: "cur", icon: "📖", name: "Lecteur", crit: "Ouvrir 10 rappels de cours différents.", prog: (s, b) => [Math.min(b.lessons.length, 10), 10] },
      { id: "testeur", fam: "cur", icon: "💬", name: "Testeur", crit: "Donner un avis (👍 / 👎) ou envoyer un commentaire.", prog: (s, b) => [Math.min(b.fb, 1), 1] },
    ];
    return L;
  },
  // Badges nouvellement gagnés : ajoutés à state.badges et à la file d'annonce state.badgesNew.
  check(state) {
    if (!state || !state.profile) return [];
    const b = this.bc(state), got = (state.badges = state.badges || {}), fresh = [];
    for (const x of this.list(state)) {
      if (got[x.id]) continue;
      const p = x.prog(state, b);
      if (p[2] || (p[1] > 0 && p[0] >= p[1])) { got[x.id] = day(); fresh.push(x.id); }
    }
    if (fresh.length) state.badgesNew = (state.badgesNew || []).concat(fresh);
    return fresh;
  },

  // ---- Événements ----
  onDay(state, today) {
    const b = this.bc(state);
    if (b.last === today) return;
    if (b.last && daysBetween(b.last, today) >= 10) b.rentree = true;
    b.days++; b.last = today;
    const w = weekOf(today);
    b.weeks[w] = (b.weeks[w] || 0) + 1;
    if (b.weeks[w] === 5) b.full++;
    for (const k of Object.keys(b.weeks)) if (daysBetween(k, today) > 60) delete b.weeks[k];
  },
  onAnswer(state, id, d, tries, solved, partial) {
    const b = this.bc(state), first = partial !== undefined ? partial >= 0.99 : solved && tries === 1;
    if (partial === undefined && solved && tries === 2) b.retry++;
    if (first && d >= 3) b.d3++;
    if (b.down[id] !== undefined && !b.compris) {
      b.down[id] = first ? b.down[id] + 1 : 0;
      if (b.down[id] >= 3) { b.compris = true; b.down = {}; }
    }
  },
  onComp(state, cid, before, after) {
    const b = this.bc(state);
    if (before !== null && before <= 3) b.low[cid] = 1;
    if (after !== null && after <= 3) b.low[cid] = 1;
    if (b.low[cid] && after !== null && after >= 5) b.pente = true;
  },
  onLesson(state, id) { const b = this.bc(state); if (!b.lessons.includes(id)) b.lessons.push(id); },
  onLessonDown(state, id) { const b = this.bc(state); if (!b.compris) b.down[id] = 0; },
  onFeedback(state) { this.bc(state).fb++; },

  // ---- Affichage ----
  COLORS: { reg: ["#f08a24", "#fde7cf"], mai: ["#2457d6", "#e4ecff"], per: ["#1e8a5a", "#e1f5ea"], cur: ["#8a3fd1", "#f0e4fb"] },
  icon(x, on, px = 56) {
    const [c, soft] = this.COLORS[x.fam];
    const pts = [...Array(6)].map((_, i) => { const a = Math.PI / 6 + (i * Math.PI) / 3; return (50 + 44 * Math.cos(a)).toFixed(1) + "," + (50 + 44 * Math.sin(a)).toFixed(1); }).join(" ");
    return `<svg class="bdg-ic${on ? "" : " off"}" viewBox="0 0 100 100" width="${px}" height="${px}" aria-hidden="true"><polygon points="${pts}" fill="${on ? soft : "none"}" stroke="${on ? c : "currentColor"}" stroke-width="${on ? 7 : 4}" stroke-dasharray="${on ? "" : "6 6"}"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="40">${x.icon}</text></svg>`;
  },
};

// Code de sauvegarde (13.11) : toute la progression dans un code (texte, lien, QR), sans serveur ni compte.
// Format compact : seules les notions modifiées, dates en jours relatifs, puis compression (deflate) et base64url.
const Backup = {
  ST: { vu: "v", encours: "e", avenir: "a", nonvu: "n" },
  pack(s) {
    const t = day(), off = (d) => (d ? daysBetween(t, d) : null), r2 = (x) => Math.round(x * 100) / 100;
    const n = {}, defs = Object.fromEntries(Engine.catalog(s.profile).map((c) => [c.id, c.defaultStatus]));
    for (const [id, x] of Object.entries(s.notions || {})) {
      const def = Engine.newNotion(x.status);
      if (!x.seen && !x.placed && !x.lessonSeen && !x.easy && !x.retry && x.m === def.m && x.box === def.box) { if (x.status !== defs[id]) n[id] = [this.ST[x.status]]; continue; }
      n[id] = [this.ST[x.status] || "v", r2(x.m), x.box, off(x.due), x.seen, x.ok, (x.placed ? 1 : 0) | (x.lessonSeen ? 2 : 0), x.easy || 0, off(x.retry)];
    }
    const c = {};
    for (const [cid, x] of Object.entries(s.comps || {})) c[cid] = [x.r.map((v) => Math.round(v * 4)).join(""), x.n, off(x.last)];
    const b = s.bc ? { ...s.bc, last: off(s.bc.last), weeks: Object.fromEntries(Object.entries(s.bc.weeks).map(([k, v]) => [off(k), v])) } : null;
    return {
      v: 1, t, p: s.profile, n, c, cr: off(s.created),
      e: [s.elo.r, s.elo.n, (s.elo.log || []).slice(-8).map(([d, r]) => [off(d), r])],
      k: [s.streak.count, off(s.streak.last)],
      h: (s.history || []).slice(-14).map((x) => [off(x.date), x.n, r2(x.score)]),
      b, pr: s.prep || null, nw: s.now || null, g: Object.fromEntries(Object.entries(s.badges || {}).map(([k, d]) => [k, off(d)])),
    };
  },
  unpack(o) {
    if (!o || o.v !== 1 || !o.p || !o.n) throw new Error("code");
    const t = day(), on = (k) => (k === null || k === undefined ? null : addDays(t, k)), ST = Object.fromEntries(Object.entries(this.ST).map(([a, b]) => [b, a]));
    const s = Engine.newState(o.p);
    s.created = on(o.cr) || t;
    Engine.initNotions(s, Object.fromEntries(Engine.catalog(o.p).map((c) => [c.id, c.defaultStatus])));
    for (const [id, a] of Object.entries(o.n)) {
      if (!s.notions[id]) continue;
      const st = ST[a[0]] || "vu";
      if (a.length === 1) { s.notions[id] = Engine.newNotion(st); continue; }
      const x = { status: st, m: a[1], box: a[2], due: on(a[3]) || t, seen: a[4], ok: a[5] };
      if (a[6] & 1) x.placed = true;
      if (a[6] & 2) x.lessonSeen = true;
      if (a[7]) x.easy = a[7];
      if (a[8] !== null && a[8] !== undefined) x.retry = on(a[8]);

    }
    s.comps = Object.fromEntries(Object.entries(o.c || {}).map(([cid, [r, n, l]]) => [cid, { r: [...r].map((ch) => +ch / 4), n, last: on(l) }]));
    s.elo = { r: o.e[0], n: o.e[1], log: o.e[2].map(([d, r]) => [on(d), r]) };
    s.streak = { count: o.k[0], last: on(o.k[1]) };
    s.history = o.h.map(([d, n, sc]) => ({ date: on(d), n, score: sc }));
    if (o.b) s.bc = { ...o.b, last: on(o.b.last), weeks: Object.fromEntries(Object.entries(o.b.weeks).map(([k, v]) => [on(+k), v])) };
    s.badges = Object.fromEntries(Object.entries(o.g || {}).map(([k, d]) => [k, on(d)]));
    if (o.pr) s.prep = o.pr;
    if (o.nw) s.now = o.nw;

  },
  b64(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
  unb64(s) { const t = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(t, (c) => c.charCodeAt(0)); },
  async pipe(bytes, Stream, mode) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream(mode))).arrayBuffer()); },
  // Code : « 1 » + deflate si le navigateur sait compresser, sinon « 0 » + JSON brut.
  async encode(state) {
    const raw = new TextEncoder().encode(JSON.stringify(this.pack(state)));

  url(code) { return location.origin + location.pathname + "#r=" + code; },
};

// Tables : norme ISO/IEC 18004 (blocs de correction, niveau L). Vérifié par décodage OpenCV (tests/qr.html).
const QR_L = [null, [1, 26, 19], [1, 44, 34], [1, 70, 55], [1, 100, 80], [1, 134, 108], [2, 86, 68], [2, 98, 78], [2, 121, 97], [2, 146, 116],
  [2, 86, 68, 2, 87, 69], [4, 101, 81], [2, 116, 92, 2, 117, 93], [4, 133, 107], [3, 145, 115, 1, 146, 116], [5, 109, 87, 1, 110, 88],
  [5, 122, 98, 1, 123, 99], [1, 135, 107, 5, 136, 108], [5, 150, 120, 1, 151, 121], [3, 141, 113, 4, 142, 114], [3, 135, 107, 5, 136, 108],
  [4, 144, 116, 4, 145, 117], [2, 139, 111, 7, 140, 112], [4, 151, 121, 5, 152, 122], [6, 147, 117, 4, 148, 118], [8, 132, 106, 4, 133, 107],
  [10, 142, 114, 2, 143, 115], [8, 152, 122, 4, 153, 123], [3, 147, 117, 10, 148, 118], [7, 146, 116, 7, 147, 117], [5, 145, 115, 10, 146, 116],
  [13, 145, 115, 3, 146, 116], [17, 145, 115], [17, 145, 115, 1, 146, 116], [13, 145, 115, 6, 146, 116], [12, 151, 121, 7, 152, 122],
  [6, 151, 121, 14, 152, 122], [17, 152, 122, 4, 153, 123], [4, 152, 122, 18, 153, 123], [20, 147, 117, 4, 148, 118], [19, 148, 118, 6, 149, 119]];

const QR = {
  blocks(v) { const t = QR_L[v], out = []; for (let i = 0; i < t.length; i += 3) for (let k = 0; k < t[i]; k++) out.push([t[i + 1], t[i + 2]]); return out; },
  dataLen(v) { return this.blocks(v).reduce((a, b) => a + b[1], 0); },
  rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  },
  mul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z; },
  ecc(data, deg) {
    const div = new Array(deg).fill(0); div[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { div[j] = this.mul(div[j], root); if (j + 1 < deg) div[j] ^= div[j + 1]; } root = this.mul(root, 2); }
    const res = new Array(deg).fill(0);
    for (const b of data) { const f = b ^ res.shift(); res.push(0); for (let i = 0; i < deg; i++) res[i] ^= this.mul(div[i], f); }
    return res;
  },
  align(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17, step = Math.floor((v * 8 + n * 3 + 5) / (n * 4 - 4)) * 2, r = [6];
    for (let p = size - 7; r.length < n; p -= step) r.splice(1, 0, p);
    return r;
  },
  // Matrice de modules (true = noir) pour une liste d'octets ; null si trop long (> 2953 octets).
  encode(bytes) {
    let v = 1;
    for (; v <= 40; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= this.dataLen(v) * 8) break;
    if (v > 40) return null;
    const cap = this.dataLen(v) * 8, bits = [];
    const put = (x, n) => { for (let i = n - 1; i >= 0; i--) bits.push((x >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); for (const b of bytes) put(b, 8);
    put(0, Math.min(4, cap - bits.length)); put(0, (8 - (bits.length % 8)) % 8);
    for (let p = 0xec; bits.length < cap; p ^= 0xec ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    // Blocs, correction, entrelacement.
    const bl = this.blocks(v), deg = bl[0][0] - bl[0][1], parts = [];
    let k = 0;
    for (const [, d] of bl) { const dat = data.slice(k, k + d); k += d; parts.push([dat, this.ecc(dat, deg)]); }
    const seq = [], maxD = Math.max(...bl.map((b) => b[1]));
    for (let i = 0; i < maxD; i++) for (const [d] of parts) if (i < d.length) seq.push(d[i]);
    for (let i = 0; i < deg; i++) for (const [, e] of parts) seq.push(e[i]);
    // Motifs fixes.
    const size = v * 4 + 17, m = [...Array(size)].map(() => Array(size).fill(false)), fn = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, on) => { m[y][x] = on; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy)); if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = this.align(v), na = al.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const format = (mask) => {
      const d = (1 << 3) | mask; let r = d; // niveau L = 01
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = (i) => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    format(0);
    if (v >= 7) {
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      const b = (v << 12) | r;
      for (let i = 0; i < 18; i++) { const on = ((b >>> i) & 1) === 1, a = size - 11 + (i % 3), c = Math.floor(i / 3); set(a, c, on); set(c, a, on); }
    }
    // Données en zigzag.
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < seq.length * 8) { m[y][x] = ((seq[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }
    // Masque : le moins pénalisé.
    const MASKS = [(x, y) => (x + y) % 2, (x, y) => y % 2, (x) => x % 3, (x, y) => (x + y) % 3, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2,
      (x, y) => ((x * y) % 2) + ((x * y) % 3), (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2];
    const apply = (k) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[k](x, y) === 0) m[y][x] = !m[y][x]; };
    let best = null;
    for (let k = 0; k < 8; k++) {
      apply(k); format(k);
      const p = this.penalty(m);
      if (!best || p < best.p) best = { k, p };
      apply(k);
    }
    apply(best.k); format(best.k);
    return m;
  },
  penalty(m) {
    const n = m.length; let p = 0, dark = 0;
    const lines = (get) => {
      for (let a = 0; a < n; a++) {
        let run = 1;
        for (let b = 1; b <= n; b++) {
          if (b < n && get(a, b) === get(a, b - 1)) run++;
          else { if (run >= 5) p += run - 2; run = 1; }
        }
        for (let b = 0; b + 7 <= n; b++) { // motif 1:1:3:1:1 bordé de clair
          const s = [0, 1, 2, 3, 4, 5, 6].map((k) => get(a, b + k));

    };

    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (m[y][x]) dark++;
      if (x < n - 1 && y < n - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
    }

  },
  // SVG noir sur blanc (même en mode sombre : les lecteurs le préfèrent), marge de 4 modules.
  svg(text, px = 260) {
    const m = this.encode([...new TextEncoder().encode(text)]);
    if (!m) return "";

    let d = "";

    return `<svg class="qr" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" width="${px}" height="${px}" role="img" aria-label="QR code de sauvegarde" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  },
};
