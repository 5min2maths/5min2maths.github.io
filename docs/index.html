    if (R.rand() < 0.5) {
      const a = R.pick([6, 8, 9, 10, 12, 15]), b = R.pick([4, 6, 10, 14, 16, 20]); if (a === b) return GEN.arith(3);
      const l = (a * b) / gcd(a, b);
      return { q: "Deux bus partent ensemble de la gare à 8 h. L'un repart toutes les " + M(a) + " minutes, l'autre toutes les " + M(b) + " minutes. Dans combien de minutes repartiront-ils de nouveau ensemble ?", spec: { kind: "value", value: l }, sol: "C'est le PPMC de " + M(a) + " et " + M(b) + " : " + M(l) + " minutes." };
    }
    return { fig: FIG.tiles(p, q, g * p + " cm", g * q + " cm"), q: "On veut paver un rectangle de " + M(g * p) + " cm sur " + M(g * q) + " cm avec des carrés tous identiques, les plus grands possible. Quel est le côté d'un carré (en cm) ?", spec: { kind: "value", value: g }, sol: "Le côté divise les deux longueurs et doit être le plus grand : PGDC " + M("= " + g) + " cm." };
  },

  diagr(d) {
    if (d === 1) {
      const n = R.pick([4, 5, 6]), xs = Array.from({ length: n }, () => R.int(2, 20)), sum = xs.reduce((a, b) => a + b, 0);
      if ((sum * 2) % n) return GEN.diagr(1);
      return { fig: FIG.barChart(xs), q: "Calcule la moyenne de la série : " + M(xs.join(" ; ")) + ".", spec: { kind: "value", value: sum / n }, sol: M("\\frac{" + xs.join(" + ") + "}{" + n + "} = \\frac{" + sum + "}{" + n + "} = " + dec(sum / n)) + "." };
    }
    if (d === 2) {
      const tot = R.pick([20, 25, 40, 50, 80]), k = R.pick([2, 3, 4, 5, 6, 8, 10]), part = Math.round((tot * k) / 20);
      const ang = (part / tot) * 360;
      if (!Number.isInteger(ang)) return GEN.diagr(2);
      return { fig: FIG.sector("", ang, "?"), q: "Dans une classe de " + M(tot) + " élèves, " + M(part) + " viennent à vélo. Dans un diagramme circulaire, quel angle (en degrés) a le secteur « vélo » ?", spec: { kind: "value", value: ang }, sol: M("\\frac{" + part + "}{" + tot + "} \\cdot 360° = " + ang + "°") + "." };
    }
    const notes = [4, 4.5, 5, 5.5, 6], eff = notes.map(() => R.int(1, 6));
    const n = eff.reduce((a, b) => a + b, 0); if (n < 8) return GEN.diagr(3);
    const s = notes.reduce((a, v, i) => a + v * eff[i], 0), m = s / n;
    return { fig: FIG.barChart(eff), q: "Notes d'un test : " + notes.map((v, i) => M(dec(v)) + " (" + eff[i] + " élève" + (eff[i] > 1 ? "s" : "") + ")").join(", ") + ". Calcule la moyenne de la classe, au centième.", spec: { kind: "value", value: m, round: 0.01 }, sol: "Somme pondérée " + M(dec(s)) + " pour " + M(n) + " élèves : " + M(dec(s) + " : " + n + " \\approx " + dec(m.toFixed(2))) + "." };
  },

  aires(d) {
    if (d === 1) {
      const b = R.int(3, 15), h = 2 * R.int(2, 8);
      if (R.rand() < 0.5) return { fig: FIG.triangleFig(b + " cm", h + " cm"), q: "Calcule l'aire d'un triangle de base " + M(b) + " cm et de hauteur " + M(h) + " cm (en cm²).", spec: { kind: "value", value: (b * h) / 2 }, sol: M("\\frac{" + b + " \\cdot " + h + "}{2} = " + (b * h) / 2) + " cm²." };
      const L = R.int(4, 15), l = R.int(2, 9);
      return { fig: FIG.rectFig(L, l, L + " cm", l + " cm"), q: "Calcule le périmètre d'un rectangle de " + M(L) + " cm sur " + M(l) + " cm (en cm).", spec: { kind: "value", value: 2 * (L + l) }, sol: M("2 \\cdot (" + L + " + " + l + ") = " + 2 * (L + l)) + " cm." };
    }
    if (d === 2) {
      const B = R.int(6, 14), b = R.int(2, B - 2), h = 2 * R.int(2, 6);
      if (R.rand() < 0.5) return { fig: FIG.trapezoid(B + " cm", b + " cm", h + " cm"), q: "Calcule l'aire d'un trapèze de bases " + M(B) + " cm et " + M(b) + " cm, de hauteur " + M(h) + " cm (en cm²).", spec: { kind: "value", value: ((B + b) * h) / 2 }, sol: M("\\frac{(" + B + " + " + b + ") \\cdot " + h + "}{2} = " + ((B + b) * h) / 2) + " cm²." };
      const d1 = 2 * R.int(2, 8), d2 = R.int(3, 12);
      return { q: "Calcule l'aire d'un losange dont les diagonales mesurent " + M(d1) + " cm et " + M(d2) + " cm (en cm²).", spec: { kind: "value", value: (d1 * d2) / 2 }, sol: "Le losange se découpe en 4 triangles rectangles : " + M("\\frac{" + d1 + " \\cdot " + d2 + "}{2} = " + (d1 * d2) / 2) + " cm²." };
    }
    const A = 2 * R.int(6, 40), b = R.pick([4, 6, 8, 10, 12]);
    if (R.rand() < 0.5) return { fig: FIG.triangleFig(b + " cm", "h = ?"), q: "Un triangle a une aire de " + M(A) + " cm² et une base de " + M(b) + " cm. Calcule la hauteur correspondante (en cm).", spec: { kind: "value", value: (2 * A) / b }, sol: M("h = \\frac{2A}{b} = \\frac{" + 2 * A + "}{" + b + "} = " + ratT((2 * A) / b)) + " cm." };
    const L = R.int(6, 14), l = R.int(4, 9), c = R.int(2, Math.min(l, 5) - 1 || 2);
    if (c >= l || c >= L) return GEN.aires(3);
    return { fig: FIG.rectFig(L, l, L + " cm", l + " cm"), q: "Dans un rectangle de " + M(L) + " cm sur " + M(l) + " cm, on découpe un carré de côté " + M(c) + " cm dans un coin. Quelle est l'aire de la figure restante (en cm²) ?", spec: { kind: "value", value: L * l - c * c }, sol: M(L + " \\cdot " + l + " - " + c + "^2 = " + (L * l - c * c)) + " cm²." };
  },

  vitesse(d) {
    if (d === 1) {
      const v = 10 * R.int(3, 12), t = R.int(2, 5);
      return { fig: FIG.road(v * t + " km", t + " h"), q: "Une voiture parcourt " + M(v * t) + " km en " + M(t) + " h. Quelle est sa vitesse moyenne (en km/h) ?", spec: { kind: "value", value: v }, sol: M("v = \\frac{" + v * t + "}{" + t + "} = " + v) + " km/h." };
    }
    if (d === 2) {
      const v = R.pick([60, 72, 80, 90, 120]), mins = R.pick([15, 20, 30, 40, 45]), dist = (v * mins) / 60;
      return { fig: FIG.road(FIG.fmt(dist) + " km", v + " km/h"), q: "À " + M(v) + " km/h, combien de minutes faut-il pour parcourir " + M(dec(dist)) + " km ?", spec: { kind: "value", value: mins }, sol: M("t = \\frac{" + dec(dist) + "}{" + v + "}\\ \\text{h} = " + mins) + " min." };
    }
    const [v1, v2, dd] = R.pick([[40, 60, 120], [60, 120, 120], [30, 60, 60], [60, 90, 180], [40, 120, 120], [60, 40, 240], [90, 60, 180]]);
    const tt = dd / v1 + dd / v2, vm = (2 * dd) / tt;
    return { fig: FIG.road(dd + " km", "aller-retour"), q: "Une voiture fait un aller de " + M(dd) + " km à " + M(v1) + " km/h et le retour à " + M(v2) + " km/h. Quelle est sa vitesse moyenne sur l'ensemble du trajet (en km/h) ?", spec: { kind: "value", value: vm }, sol: "Durée totale " + M(dec(dd / v1) + " + " + dec(dd / v2) + " = " + dec(tt)) + " h pour " + M(2 * dd) + " km : " + M("v = \\frac{" + 2 * dd + "}{" + dec(tt) + "} = " + ratT(vm)) + " km/h (et non la moyenne des deux vitesses)." };
  },

  // ===== CO 10e =====
  disque(d) {
    const r = R.int(2, 12);
    if (d === 1) return { fig: FIG.disk("r = " + r + " cm"), q: "Calcule le périmètre d'un cercle de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: 2 * Math.PI * r, round: 0.01, exactOk: true }, sol: M("P = 2\\pi r = " + 2 * r + "\\pi \\approx " + dec((2 * Math.PI * r).toFixed(2))) + " cm." };
    if (d === 2) {
      if (R.rand() < 0.5) return { fig: FIG.disk("r = " + r + " cm"), q: "Calcule l'aire d'un disque de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r, round: 0.01, exactOk: true }, sol: M("A = \\pi r^2 = " + r * r + "\\pi \\approx " + dec((Math.PI * r * r).toFixed(2))) + " cm²." };
      const D = 2 * r; return { fig: FIG.disk("d = " + D + " cm"), q: "Un disque a un diamètre de " + M(D) + " cm. Calcule son aire (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r, round: 0.01, exactOk: true }, sol: "Rayon " + M(r) + " cm ; " + M("A = \\pi \\cdot " + r + "^2 = " + r * r + "\\pi \\approx " + dec((Math.PI * r * r).toFixed(2))) + " cm²." };
    }
    const a = R.pick([30, 45, 60, 72, 90, 120, 135, 150, 240]);
    if (R.rand() < 0.5) return { fig: FIG.sector("r = " + r, a, a + "°"), q: "Calcule l'aire d'un secteur circulaire de rayon " + M(r) + " cm et d'angle " + M(a + "°") + " (au centième, en cm²).", spec: { kind: "value", value: (Math.PI * r * r * a) / 360, round: 0.01, exactOk: true }, sol: M("A = \\pi r^2 \\cdot \\frac{" + a + "}{360} = " + ratT((r * r * a) / 360) + "\\pi \\approx " + dec(((Math.PI * r * r * a) / 360).toFixed(2))) + " cm²." };
    return { fig: FIG.sector("r = " + r, a, a + "°"), q: "Calcule la longueur de l'arc d'un secteur de rayon " + M(r) + " cm et d'angle " + M(a + "°") + " (au centième, en cm).", spec: { kind: "value", value: (2 * Math.PI * r * a) / 360, round: 0.01, exactOk: true }, sol: M("\\ell = 2\\pi r \\cdot \\frac{" + a + "}{360} = " + ratT((2 * r * a) / 360) + "\\pi \\approx " + dec(((2 * Math.PI * r * a) / 360).toFixed(2))) + " cm." };
  },

  vol(d) {
    if (d === 1) {
      const a = R.int(2, 12), b = R.int(2, 9), c = R.int(2, 9);
      if (R.rand() < 0.3) return { fig: FIG.box(a + " cm", a + " cm", a + " cm"), q: "Calcule le volume d'un cube d'arête " + M(a) + " cm (en cm³).", spec: { kind: "value", value: a ** 3 }, sol: M("V = " + a + "^3 = " + a ** 3) + " cm³." };
      return { fig: FIG.box(a + " cm", b + " cm", c + " cm"), q: "Calcule le volume d'un pavé droit de " + M(a) + " cm × " + M(b) + " cm × " + M(c) + " cm (en cm³).", spec: { kind: "value", value: a * b * c }, sol: M(a + " \\cdot " + b + " \\cdot " + c + " = " + a * b * c) + " cm³." };
    }
    if (d === 2) {
      const b = 2 * R.int(2, 7), h = R.int(3, 9), H = R.int(4, 15);
      return { fig: FIG.prism(b + " cm", h + " cm", H + " cm"), q: "Un prisme droit a pour base un triangle de base " + M(b) + " cm et de hauteur " + M(h) + " cm. Sa hauteur (longueur du prisme) est " + M(H) + " cm. Calcule son volume (en cm³).", spec: { kind: "value", value: (b * h * H) / 2 }, sol: "Aire de la base " + M("\\frac{" + b + " \\cdot " + h + "}{2} = " + (b * h) / 2) + " cm² ; " + M("V = " + (b * h) / 2 + " \\cdot " + H + " = " + (b * h * H) / 2) + " cm³." };
    }
    const r = R.int(2, 9), h = R.int(3, 20);
    if (R.rand() < 0.5) return { fig: FIG.cylinder("r = " + r, "h = " + h), q: "Calcule le volume d'un cylindre de rayon " + M(r) + " cm et de hauteur " + M(h) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: Math.PI * r * r * h, round: 0.01, exactOk: true }, sol: M("V = \\pi r^2 h = " + r * r * h + "\\pi \\approx " + dec((Math.PI * r * r * h).toFixed(2))) + " cm³." };
    const L = R.int(2, 9);
    return { fig: FIG.cylinder("r = " + r + " cm", "h = ?"), q: "Un cylindre de rayon " + M(r) + " cm contient " + M(dec(L)) + " L. Quelle est sa hauteur, en cm, au dixième ?", spec: { kind: "value", value: (L * 1000) / (Math.PI * r * r), round: 0.1 }, sol: M(dec(L) + "\\ \\text{L} = " + L * 1000 + "\\ \\text{cm}^3") + " ; " + M("h = \\frac{" + L * 1000 + "}{\\pi \\cdot " + r * r + "} \\approx " + dec(((L * 1000) / (Math.PI * r * r)).toFixed(1))) + " cm." };
  },

  polyreg(d) {
    const n = R.pick([5, 6, 8, 9, 10, 12]);
    if (d === 1) return { fig: FIG.regPoly(n, "?"), q: "Quelle est la mesure de l'angle au centre d'un polygone régulier à " + M(n) + " côtés (en degrés) ?", spec: { kind: "value", value: 360 / n }, sol: M("\\frac{360°}{" + n + "} = " + dec(360 / n) + "°") + "." };
    if (d === 2) return { fig: FIG.regPoly(n, ""), q: "Quelle est la mesure d'un angle intérieur d'un polygone régulier à " + M(n) + " côtés (en degrés) ?", spec: { kind: "value", value: ((n - 2) * 180) / n }, sol: "Somme des angles : " + M("(" + n + " - 2) \\cdot 180° = " + (n - 2) * 180 + "°") + " ; un angle : " + M(dec(((n - 2) * 180) / n) + "°") + "." };
    const m = R.pick([5, 6, 8, 9, 10, 12, 15, 18, 20]), a = ((m - 2) * 180) / m;
    return { q: "Un angle intérieur d'un polygone régulier mesure " + M(dec(a) + "°") + ". Combien le polygone a-t-il de côtés ?", spec: { kind: "value", value: m }, sol: "L'angle au centre vaut " + M("180° - " + dec(a) + "° = " + dec(180 - a) + "°") + " ; " + M("n = \\frac{360}{" + dec(180 - a) + "} = " + m) + "." };
  },

  // ===== CO 11e =====
  volcone(d) {
    if (d === 1) {
      const c = R.int(2, 9), h = 3 * R.int(1, 5);
      return { fig: FIG.pyramid(c + " cm", "h = " + h), q: "Calcule le volume d'une pyramide à base carrée de côté " + M(c) + " cm et de hauteur " + M(h) + " cm (en cm³).", spec: { kind: "value", value: (c * c * h) / 3 }, sol: M("V = \\frac{1}{3} \\cdot " + c + "^2 \\cdot " + h + " = " + (c * c * h) / 3) + " cm³." };
    }
    if (d === 2) {
      const r = R.int(1, 8), h = 3 * R.int(1, 5);
      if (R.rand() < 0.5) return { fig: FIG.cone("r = " + r, "h = " + h), q: "Calcule le volume d'un cône de rayon " + M(r) + " cm et de hauteur " + M(h) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: (Math.PI * r * r * h) / 3, round: 0.01, exactOk: true }, sol: M("V = \\frac{1}{3}\\pi r^2 h = " + (r * r * h) / 3 + "\\pi \\approx " + dec(((Math.PI * r * r * h) / 3).toFixed(2))) + " cm³." };
      return { fig: FIG.sphere("r = " + r), q: "Calcule le volume d'une boule de rayon " + M(r) + " cm (valeur exacte avec π, ou au centième).", spec: { kind: "value", value: (4 / 3) * Math.PI * r ** 3, round: 0.01, exactOk: true }, sol: M("V = \\frac{4}{3}\\pi r^3 = " + ratT((4 * r ** 3) / 3) + "\\pi \\approx " + dec(((4 / 3) * Math.PI * r ** 3).toFixed(2))) + " cm³." };
    }
    if (R.rand() < 0.5) {
      const r = R.int(3, 9), g = r + R.int(2, 6), h = Math.sqrt(g * g - r * r);
      return { fig: FIG.cone("r = " + r, "g = " + g), q: "Un cône a un rayon de " + M(r) + " cm et une génératrice de " + M(g) + " cm. Calcule son volume, au centième (en cm³).", spec: { kind: "value", value: (Math.PI * r * r * h) / 3, round: 0.01 }, sol: "Hauteur par Pythagore : " + M("h = \\sqrt{" + g + "^2 - " + r + "^2} = \\sqrt{" + (g * g - r * r) + "}") + " ; " + M("V = \\frac{1}{3}\\pi \\cdot " + r * r + " \\cdot h \\approx " + dec(((Math.PI * r * r * h) / 3).toFixed(2))) + " cm³." };
    }
    const r = R.int(2, 6), h = R.int(4, 12), hc = 3 * R.int(1, 3);
    const v = Math.PI * r * r * h + (Math.PI * r * r * hc) / 3;
    return { fig: FIG.cylinder("r = " + r, "h = " + h), q: "Une fusée est formée d'un cylindre (rayon " + M(r) + " cm, hauteur " + M(h) + " cm) surmonté d'un cône de même rayon et de hauteur " + M(hc) + " cm. Calcule son volume total, au centième (en cm³).", spec: { kind: "value", value: v, round: 0.01, exactOk: true }, sol: M(r * r * h + "\\pi + " + (r * r * hc) / 3 + "\\pi = " + (r * r * h + (r * r * hc) / 3) + "\\pi \\approx " + dec(v.toFixed(2))) + " cm³." };
  },

  gquot(d) {
    if (d === 1) {
      if (R.rand() < 0.5) { const v = 18 * R.int(1, 7); return { q: "Convertis " + M(v) + " km/h en m/s.", spec: { kind: "value", value: v / 3.6 }, sol: M("1\\ \\text{m/s} = 3{,}6\\ \\text{km/h}") + " : " + M(v + " : 3{,}6 = " + dec(v / 3.6)) + " m/s." }; }
      const v = 5 * R.int(1, 8); return { q: "Convertis " + M(v) + " m/s en km/h.", spec: { kind: "value", value: v * 3.6 }, sol: M(v + " \\cdot 3{,}6 = " + dec(v * 3.6)) + " km/h." };
    }
    if (d === 2) {
      const m = R.pick([[2.7, "d'aluminium", "de l'aluminium"], [7.9, "de fer", "du fer"], [11.3, "de plomb", "du plomb"], [0.9, "de glace", "de la glace"], [19.3, "d'or", "de l'or"]]), V = R.int(5, 80);
      if (R.rand() < 0.5) return { fig: FIG.box("", "", ""), q: "Un bloc " + m[1] + " a un volume de " + M(V) + " cm³ et une masse de " + M(dec(+(m[0] * V).toFixed(2))) + " g. Calcule sa masse volumique (en g/cm³).", spec: { kind: "value", value: m[0] }, sol: M("\\rho = \\frac{m}{V} = \\frac{" + dec(+(m[0] * V).toFixed(2)) + "}{" + V + "} = " + dec(m[0])) + " g/cm³." };
      return { fig: FIG.box("", "", ""), q: "La masse volumique " + m[2] + " est " + M(dec(m[0])) + " g/cm³. Quelle est la masse d'un bloc de " + M(V) + " cm³ (en g) ?", spec: { kind: "value", value: +(m[0] * V).toFixed(4) }, sol: M("m = \\rho \\cdot V = " + dec(m[0]) + " \\cdot " + V + " = " + dec(+(m[0] * V).toFixed(4))) + " g." };
    }
    const q = R.pick([5, 8, 10, 12, 15, 20, 25]), V = R.int(2, 9) * 60;
    return { q: "Un robinet a un débit de " + M(q) + " L/min. Combien de minutes faut-il pour remplir une cuve de " + M(dec(V / 1000)) + " m³ ?", spec: { kind: "value", value: V / q }, sol: M(dec(V / 1000) + "\\ \\text{m}^3 = " + V + "\\ \\text{L}") + " ; " + M("t = \\frac{" + V + "}{" + q + "} = " + dec(V / q)) + " min." };
  },

  formule(d) {
    const F = d === 1
      ? R.pick([
          { f: "v = \\frac{d}{t}", ask: "d", ans: "v*t", sol: "On multiplie par " + M("t") + " : " + M("d = v \\cdot t") },
          { f: "P = 4c", ask: "c", ans: "P/4", sol: M("c = \\frac{P}{4}") },
          { f: "U = R \\cdot I", ask: "I", ans: "U/R", sol: M("I = \\frac{U}{R}") },
          { f: "y = 3x + b", ask: "b", ans: "y - 3x", sol: M("b = y - 3x") },
        ])
      : d === 2
      ? R.pick([
          { f: "A = \\frac{b \\cdot h}{2}", ask: "h", ans: "2A/b", sol: "On multiplie par 2 puis on divise par " + M("b") + " : " + M("h = \\frac{2A}{b}") },
          { f: "P = 2(x + y)", ask: "y", ans: "P/2 - x", sol: M("\\frac{P}{2} = x + y") + " donc " + M("y = \\frac{P}{2} - x") },
          { f: "v = \\frac{d}{t}", ask: "t", ans: "d/v", sol: M("t = \\frac{d}{v}") },
          { f: "y = mx + h", ask: "m", ans: "(y - h)/x", sol: M("mx = y - h") + " donc " + M("m = \\frac{y - h}{x}") },
        ])
      : R.pick([
          { f: "V = \\frac{1}{3}\\pi r^2 h", ask: "h", ans: "3V/(pi*r^2)", sol: M("h = \\frac{3V}{\\pi r^2}") },
          { f: "A = \\pi r^2", ask: "r", ans: "sqrt(A/pi)", sol: M("r^2 = \\frac{A}{\\pi}") + " donc " + M("r = \\sqrt{\\frac{A}{\\pi}}") + " (un rayon est positif)" },
          { f: "A = \\frac{(c + b) \\cdot h}{2}", ask: "b", ans: "2A/h - c", sol: M("c + b = \\frac{2A}{h}") + " donc " + M("b = \\frac{2A}{h} - c") },
          { f: "c^2 = a^2 + b^2", ask: "a", ans: "sqrt(c^2 - b^2)", sol: M("a = \\sqrt{c^2 - b^2}") + " (une longueur est positive)" },
        ]);
    return { q: "Dans la formule " + M(F.f) + ", exprime " + M(F.ask) + " en fonction des autres lettres. (Écris par exemple « " + F.ask + " = … » ou seulement l'expression.)", spec: { kind: "expr", expr: F.ans, pos: true }, canon: F.ans, sol: F.sol + "." };
  },

  simil(d) {
    const k = R.pick([1.5, 2, 2.5, 3, 4]);
    if (d === 1) {
      const a = R.int(2, 8), b = R.int(3, 9), c = R.int(3, 9);
      return { fig: FIG.simTri([a, b, c].map((v) => v + ""), [dec(a * k), "?", ""]), q: "Deux triangles sont semblables. Les côtés du petit mesurent " + M(a) + ", " + M(b) + " et " + M(c) + " cm. Le côté du grand qui correspond à " + M(a) + " cm mesure " + M(dec(a * k)) + " cm. Combien mesure le côté du grand qui correspond à " + M(b) + " cm ?", spec: { kind: "value", value: b * k }, sol: "Rapport " + M("k = \\frac{" + dec(a * k) + "}{" + a + "} = " + dec(k)) + " ; " + M(b + " \\cdot " + dec(k) + " = " + dec(b * k)) + " cm." };
    }
    if (d === 2) {
      const A = R.int(3, 20);
      return { fig: FIG.scaling(k, ""), q: "On agrandit une figure de rapport " + M(dec(k)) + ". Son aire était de " + M(A) + " cm². Quelle est la nouvelle aire (en cm²) ?", spec: { kind: "value", value: A * k * k }, sol: "Les aires sont multipliées par " + M("k^2 = " + dec(k * k)) + " : " + M(dec(A * k * k)) + " cm²." };
    }
    const kk = R.pick([2, 3, 4, 5]), A1 = R.int(2, 12);
    if (R.rand() < 0.5) return { q: "Deux figures semblables ont pour aires " + M(A1) + " cm² et " + M(A1 * kk * kk) + " cm². Le périmètre de la petite vaut " + M(A1 + 7) + " cm. Quel est le périmètre de la grande (en cm) ?", spec: { kind: "value", value: (A1 + 7) * kk }, sol: M("k^2 = \\frac{" + A1 * kk * kk + "}{" + A1 + "} = " + kk * kk) + " donc " + M("k = " + kk)+ " ; les longueurs sont multipliées par " + M(kk) + " : " + M((A1 + 7) * kk) + " cm." };
    return { fig: FIG.box("", "", ""), q: "Une maquette est à l'échelle " + M("1 : " + kk * 10) + ". Le volume de la maquette est de " + M(A1) + " cm³. Quel est le volume réel, en litres ?", spec: { kind: "value", value: (A1 * (kk * 10) ** 3) / 1000 }, sol: "Les volumes sont multipliés par " + M("k^3 = " + (kk * 10) ** 3) + " : " + M(A1 * (kk * 10) ** 3 + "\\ \\text{cm}^3 = " + dec((A1 * (kk * 10) ** 3) / 1000) + "\\ \\text{L}") + "." };
  },

  proba(d) {
    if (d === 1) {
      const c = { rouges: R.int(2, 6), bleues: R.int(2, 6), vertes: R.int(1, 4) }, n = c.rouges + c.bleues + c.vertes, col = R.pick(["rouges", "bleues", "vertes"]);
      return { fig: FIG.urn(c), q: "Une urne contient " + M(c.rouges) + " boules rouges, " + M(c.bleues) + " bleues et " + M(c.vertes) + " vertes. On tire une boule au hasard. Quelle est la probabilité qu'elle soit " + col.slice(0, -1) + " ? (fraction acceptée)", spec: { kind: "value", value: c[col] / n }, sol: "Cas favorables sur cas possibles : " + M("\\frac{" + c[col] + "}{" + n + "}" + (gcd(c[col], n) > 1 ? " = " + frac(c[col], n) : "")) + "." };
    }
    if (d === 2) {
      const s = R.int(3, 11), cnt = 6 - Math.abs(7 - s);
      return { q: "On lance deux dés équilibrés et on additionne les points. Quelle est la probabilité d'obtenir " + M(s) + " ? (fraction acceptée)", spec: { kind: "value", value: cnt / 36 }, sol: "Tableau 6 × 6 : " + M(cnt) + " cases donnent " + M(s) + " sur 36, soit " + M(frac(cnt, 36)) + "." };
    }
    const r = R.int(3, 6), b = R.int(2, 5), n = r + b;
    return { fig: FIG.urn({ rouges: r, bleues: b }), q: "Une urne contient " + M(r) + " boules rouges et " + M(b) + " bleues. On tire deux boules sans remise. Quelle est la probabilité d'obtenir deux boules de la même couleur ? (fraction acceptée)", spec: { kind: "value", value: (r * (r - 1) + b * (b - 1)) / (n * (n - 1)) }, sol: "Arbre : " + M("\\frac{" + r + "}{" + n + "} \\cdot \\frac{" + (r - 1) + "}{" + (n - 1) + "} + \\frac{" + b + "}{" + n + "} \\cdot \\frac{" + (b - 1) + "}{" + (n - 1) + "} = " + frac(r * (r - 1) + b * (b - 1), n * (n - 1))) + "." };
  },

  probeq(d) {
    if (d === 1) {
      const n = R.int(5, 40), s = 3 * n + 3;
      return { q: "La somme de trois nombres entiers consécutifs vaut " + M(s) + ". Quel est le plus petit ?", spec: { kind: "value", value: n }, sol: M("n + (n + 1) + (n + 2) = " + s + " \\iff 3n + 3 = " + s + " \\iff n = " + n) + "." };
    }
    if (d === 2) {
      if (R.rand() < 0.5) {
        const k = 3 * R.int(4, 40), n = (5 * k) / 3;
        return { q: "Une personne possède une somme en pièces de 2 francs. Elle l'échange contre des pièces de 5 francs et a alors " + M(k) + " pièces de moins. Quelle somme possède-t-elle (en francs) ?", spec: { kind: "value", value: 2 * n }, sol: M("n") + " pièces de 2 : " + M("2n = 5(n - " + k + ") \\iff 3n = " + 5 * k + " \\iff n = " + n) + " ; somme " + M(2 * n) + " francs." };
      }
      const a = R.int(8, 16), age = R.int(30, 45), y = R.int(3, 12); // dans y ans, le parent aura le double de l'âge de l'enfant
      const e = age + y - 2 * y; if (e <= 0 || (age + y) % 2) return GEN.probeq(2);
      const enf = (age + y) / 2 - y; if (enf < 1 || enf >= age) return GEN.probeq(2);
      return { q: "Un parent a " + M(age) + " ans et son enfant " + M("x") + " ans. Dans " + M(y) + " ans, le parent aura le double de l'âge de l'enfant. Quel âge a l'enfant aujourd'hui ?", spec: { kind: "value", value: enf }, sol: M(age + " + " + y + " = 2(x + " + y + ") \\iff x = " + enf) + "." };
    }
    if (R.rand() < 0.5) {
      const n = R.int(3, 15);
      return { q: "Le produit de deux entiers naturels consécutifs vaut " + M(n * (n + 1)) + ". Quel est le plus petit ?", spec: { kind: "value", value: n }, sol: M("n(n + 1) = " + n * (n + 1) + " \\iff n^2 + n - " + n * (n + 1) + " = 0") + " ; " + M("n = " + n) + " (l'autre solution, " + M(-(n + 1)) + ", n'est pas naturelle)." };
    }
    const L = R.int(4, 15), l = R.int(2, L - 1);
    return { fig: FIG.rectFig(L, l, "?", "?"), q: "Un rectangle a un périmètre de " + M(2 * (L + l)) + " cm et une aire de " + M(L * l) + " cm². Quelle est sa longueur (le plus grand côté, en cm) ?", spec: { kind: "value", value: L }, sol: M("x(" + (L + l) + " - x) = " + L * l + " \\iff x^2 - " + (L + l) + "x + " + L * l + " = 0") + " : " + M("x = " + l) + " ou " + M("x = " + L) + " ; la longueur vaut " + M(L) + " cm." };
  },

  // ===== Collège 1re =====
  polyop(d) {
    let cs, q, sol;
    if (d === 1) {
      const a = R.nz(-4, 4), b = R.nz(-7, 7), c = R.nz(-4, 4), e = R.nz(-7, 7);
      cs = pmul([a, b], [c, e]);
      q = "(" + lin(a, b) + ")(" + lin(c, e) + ")";
      sol = "Double distributivité : " + M(poly(cs));
    } else if (d === 2) {
      const a = R.int(2, 5), b = R.nz(-6, 6), c = R.int(1, 4), e = R.int(1, 7);
      cs = padd(pmul([a, b], [a, b]), pscale(pmul([c, e], [c, -e]), -1));
      q = "(" + lin(a, b) + ")^2 - (" + lin(c, e) + ")(" + lin(c, -e) + ")";
      sol = M("(" + lin(a, b) + ")^2 = " + poly(pmul([a, b], [a, b]))) + " et " + M("(" + lin(c, e) + ")(" + lin(c, -e) + ") = " + poly(pmul([c, e], [c, -e]))) + " ; on soustrait : " + M(poly(cs));
    } else {
      const a = R.pick([1, 2]), b = R.nz(-3, 3), p = R.nz(-4, 4), r = R.nz(-5, 5), s = R.nz(-5, 5);
      cs = padd(pmul(pmul([a, b], [a, b]), [a, b]), pscale(pmul([1, p], [1, 0, r]), -1));
      q = "(" + lin(a, b) + ")^3 - (" + lin(1, p) + ")(" + poly([1, 0, r]) + ")";
      sol = M("(" + lin(a, b) + ")^3 = " + poly(pmul(pmul([a, b], [a, b]), [a, b]))) + " ; " + M("(" + lin(1, p) + ")(" + poly([1, 0, r]) + ") = " + poly(pmul([1, p], [1, 0, r]))) + " ; différence : " + M(poly(ptrim(cs)));
      void s;
    }
    cs = ptrim(cs);
    return { q: "Développe et réduis : " + M(q) + ".", spec: { kind: "expr", expr: poly(cs), form: "expanded" }, canon: poly(cs), sol: sol + "." };
  },

  factor2(d) {
    let ex, fac, sol;
    if (d === 1) {
      if (R.rand() < 0.5) { const a = R.int(2, 6), k = R.int(1, 9); ex = poly([a, 0, -a * k * k]); fac = a + "(x - " + k + ")(x + " + k + ")"; sol = "Mise en évidence de " + M(a) + ", puis " + M("x^2 - " + k * k) + " (différence de carrés)"; }
      else { const a = R.int(2, 6), m = R.nz(-9, 9); ex = poly([a, a * m, 0]); fac = a + "x(" + lin(1, m) + ")"; sol = "Mise en évidence de " + M(a + "x"); }
    } else if (d === 2) {
      const p = R.nz(-7, 7), q = R.nz(-7, 7), a = R.pick([1, 1, 2, 3]);
      if (p === q || p === -q) return GEN.factor2(2);
      ex = poly(pscale(pmul([1, -p], [1, -q]), a));
      fac = (a > 1 ? a : "") + "(" + xm(p) + ")(" + xm(q) + ")";
      sol = (a > 1 ? "Mise en évidence de " + M(a) + ", puis " : "") + "deux nombres de somme " + M(-(p + q)) + " et de produit " + M(p * q) + " : " + M(-p) + " et " + M(-q);
    } else {
      if (R.rand() < 0.5) {
        const p = R.nz(-5, 5), q = R.int(1, 5);
        if (Math.abs(p) === q) return GEN.factor2(3);
        ex = poly([1, p, -q * q, -p * q * q]);
        fac = "(" + lin(1, p) + ")(x - " + q + ")(x + " + q + ")";
        sol = "Groupements : " + M("x^2(" + lin(1, p) + ") - " + q * q + "(" + lin(1, p) + ") = (" + lin(1, p) + ")(x^2 - " + q * q + ")") + ", puis différence de carrés";
      } else {
        let a, b, c, e; do { a = R.int(2, 4); b = R.nz(-5, 5); c = R.int(1, 3); e = R.nz(-5, 5); } while (gcd(a, Math.abs(b)) !== 1 || gcd(c, Math.abs(e)) !== 1 || a * e === b * c);
        ex = poly(pmul([a, b], [c, e]));
        fac = "(" + lin(a, b) + ")(" + lin(c, e) + ")";
        sol = "Trinôme : discriminant (ou méthode « produit-somme »), racines " + M(ratT(-b / a)) + " et " + M(ratT(-e / c));
      }
    }
    return { q: "Factorise au maximum : " + M(ex) + ".", spec: { kind: "expr", expr: fac, form: "product" }, canon: fac, sol: sol + " : " + M(fac.replace(/\*/g, "")) + "." };
  },

  sys2(d) {
    const x = R.nz(-6, 8), y = R.nz(-6, 8);
    const term = (c, v) => (c === 1 ? v : c === -1 ? "-" + v : c + v);
    const row = (a, b, r) => term(a, "x") + (b < 0 ? " - " + term(-b, "y") : " + " + term(b, "y")) + " = " + r;
    if (d === 1) {
      let a, b, c, e; do { a = R.nz(-4, 4); b = R.nz(-4, 4); c = R.nz(-4, 4); e = R.nz(-4, 4); } while (a * e - b * c === 0 || (Math.abs(a) !== 1 && Math.abs(b) !== 1 && Math.abs(c) !== 1 && Math.abs(e) !== 1));
      return { q: "Résous le système " + M("\\begin{cases} " + row(a, b, a * x + b * y) + " \\\\ " + row(c, e, c * x + e * y) + " \\end{cases}") + ". Réponds « x ; y ».", spec: { kind: "pair", values: [x, y] }, sol: "Par substitution (un coefficient vaut ±1) ou par combinaison : " + M("(x ; y) = (" + x + " ; " + y + ")") + "." };
    }
    if (d === 2) {
      let a, b, c, e; do { a = R.nz(-7, 7); b = R.nz(-7, 7); c = R.nz(-7, 7); e = R.nz(-7, 7); } while (a * e - b * c === 0 || Math.abs(a) < 2 || Math.abs(b) < 2 || Math.abs(c) < 2 || Math.abs(e) < 2);
      const X = R.nz(-5, 5) / 2, Y = R.nz(-6, 6);
      const r1 = a * X + b * Y, r2 = c * X + e * Y;
      if (!Number.isInteger(r1) || !Number.isInteger(r2)) return GEN.sys2(2);
      return { q: "Résous le système " + M("\\begin{cases} " + row(a, b, r1) + " \\\\ " + row(c, e, r2) + " \\end{cases}") + ". Réponds « x ; y » (fractions acceptées).", spec: { kind: "pair", values: [X, Y] }, sol: "Combinaison linéaire (multiplier les équations pour éliminer une inconnue) : " + M("x = " + ratT(X)) + ", " + M("y = " + Y) + "." };
    }
    const n1 = R.int(4, 9), n2 = n1 + R.int(3, 8), a = R.int(3, 9), b = 5 * R.int(2, 8);
    return { q: "Un cinéma propose un abonnement annuel fixe plus un prix réduit par film. Un client qui a vu " + M(n1) + " films a payé " + M(a * n1 + b) + " CHF ; un autre qui en a vu " + M(n2) + " a payé " + M(a * n2 + b) + " CHF. Donne le prix d'un film puis celui de l'abonnement : « prix ; abonnement ».", spec: { kind: "pair", values: [a, b] }, sol: M("\\begin{cases} " + n1 + "a + b = " + (a * n1 + b) + " \\\\ " + n2 + "a + b = " + (a * n2 + b) + " \\end{cases}") + " : soustraction, " + M((n2 - n1) + "a = " + a * (n2 - n1)) + ", donc " + M("a = " + a) + " CHF et " + M("b = " + b) + " CHF." };
  },

  sys3(d) {
    const x = R.nz(-4, 5), y = R.nz(-4, 5), z = R.nz(-4, 5);
    const T = (c, v, first) => (c === 0 ? "" : (first ? (c < 0 ? "-" : "") : c < 0 ? " - " : " + ") + (Math.abs(c) === 1 ? "" : Math.abs(c)) + v);
    const row = (c) => { const s = T(c[0], "x", true) + T(c[1], "y", c[0] === 0) + T(c[2], "z", c[0] === 0 && c[1] === 0); return s + " = " + (c[0] * x + c[1] * y + c[2] * z); };
    const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    let m;
    if (d === 1) m = [[1, 1, 1], [0, 1, R.nz(-3, 3)], [0, 0, R.nz(-3, 3)]];
    else if (d === 2) { do m = [[1, R.int(-2, 2), R.int(-2, 2)], [R.int(-2, 3), R.nz(-2, 3), R.int(-2, 2)], [R.int(-2, 3), R.int(-2, 2), R.nz(-3, 3)]]; while (det(m) === 0); }
    else { do m = [0, 1, 2].map(() => [R.nz(-4, 4), R.nz(-4, 4), R.nz(-4, 4)]); while (det(m) === 0 || m.some((r) => r.every((v) => Math.abs(v) === 1))); }
    if (d === 3 && R.rand() < 0.5) {
      const a = R.int(8, 20), e = R.int(4, 12), s = R.int(5, 10), na = R.int(1, 4), ne = R.int(1, 4), ns = R.int(1, 4);
      const t1 = 2 * a + 3 * e + s, t2 = a + 2 * e + 2 * s, t3 = na * a + ne * e + ns * s;
      const mm = [[2, 3, 1], [1, 2, 2], [na, ne, ns]]; if (det(mm) === 0) return GEN.sys3(3);
      return { q: "Au cinéma : 2 adultes, 3 enfants et 1 senior paient " + M(t1) + " CHF ; 1 adulte, 2 enfants et 2 seniors paient " + M(t2) + " CHF ; " + na + " adulte" + (na > 1 ? "s" : "") + ", " + ne + " enfant" + (ne > 1 ? "s" : "") + " et " + ns + " senior" + (ns > 1 ? "s" : "") + " paient " + M(t3) + " CHF. Prix adulte, enfant, senior : « a ; e ; s ».", spec: { kind: "pair", values: [a, e, s] }, sol: "Système 3 × 3 (Gauss) : " + M("a = " + a + ",\\ e = " + e + ",\\ s = " + s) + " CHF." };
    }
    return { q: "Résous le système " + M("\\begin{cases} " + m.map(row).join(" \\\\ ") + " \\end{cases}") + ". Réponds « x ; y ; z ».", spec: { kind: "pair", values: [x, y, z] }, sol: (d === 1 ? "Le système est triangulaire : on trouve " + M("z") + ", puis " + M("y") + ", puis " + M("x") : "Méthode de Gauss (éliminer " + M("x") + " dans deux équations, puis " + M("y") + ")") + " : " + M("(x ; y ; z) = (" + x + " ; " + y + " ; " + z + ")") + "." };
  },

  domaine(d) {
    const r = R.nz(-7, 7);
    if (d === 1) {
      if (R.rand() < 0.5) return { q: "Détermine le domaine de définition de " + M("f(x) = \\frac{" + R.nz(-9, 9) + "}{" + xm(r) + "}") + ". (Écris par exemple « R \\ {2} » ou « x ≠ 2 ».)", spec: solsetSpec([[-Infinity, false, r, false], [r, false, Infinity, false]]), sol: "On ne divise pas par 0 : " + M("x \\ne " + r) + ", donc " + M("D = \\mathbb{R} \\setminus \\{" + r + "\\}") + "." };
      return { q: "Détermine le domaine de définition de " + M("f(x) = \\sqrt{" + xm(r) + "}") + ". (Écris par exemple « x >= 2 ».)", spec: solsetSpec([[r, true, Infinity, false]]), sol: "Sous une racine, il faut " + M(xm(r) + " \\ge 0") + " : " + M("D = [" + r + " \\, ; +\\infty[") + "." };
    }
    if (d === 2) {
      if (R.rand() < 0.5) { const k = R.int(1, 7); return { q: "Détermine le domaine de définition de " + M("f(x) = \\frac{x}{x^2 - " + k * k + "}") + ".", spec: solsetSpec([[-Infinity, false, -k, false], [-k, false, k, false], [k, false, Infinity, false]]), sol: M("x^2 - " + k * k + " = 0 \\iff x = \\pm " + k) + " : " + M("D = \\mathbb{R} \\setminus \\{-" + k + " ; " + k + "\\}") + "." }; }
      const a = -R.int(2, 5), b = R.int(1, 12), z = -b / a;
      return { q: "Détermine le domaine de définition de " + M("f(x) = \\sqrt{" + lin(a, b) + "}") + ".", spec: solsetSpec([[-Infinity, false, z, true]]), sol: M(lin(a, b) + " \\ge 0 \\iff x \\le " + ratT(z)) + " (on divise par " + M(a) + " : on retourne le signe) : " + M("D = ]-\\infty \\, ; " + ratT(z) + "]") + "." };
    }
    if (R.rand() < 0.5) {
      const s = r + R.int(1, 6);
      return { q: "Détermine le domaine de définition de " + M("f(x) = \\frac{\\sqrt{" + xm(r) + "}}{" + xm(s) + "}") + ".", spec: solsetSpec([[r, true, s, false], [s, false, Infinity, false]]), sol: "Il faut " + M("x \\ge " + r) + " et " + M("x \\ne " + s) + " : " + M("D = [" + r + " ; " + s + "[ \\cup ]" + s + " ; +\\infty[") + "." };
    }
    const p = R.nz(-6, 4), q = p + R.int(1, 6);
    return { q: "Détermine le domaine de définition de " + M("f(x) = \\sqrt{" + poly([1, -(p + q), p * q]) + "}") + ".", spec: solsetSpec([[-Infinity, false, p, true], [q, true, Infinity, false]]), sol: M(poly([1, -(p + q), p * q]) + " = (" + xm(p) + ")(" + xm(q) + ")") + " est positif à l'extérieur des racines : " + M("D = ]-\\infty ; " + p + "] \\cup [" + q + " ; +\\infty[") + "." };
  },

  f2(d) {
    if (d === 1) {
      const p = R.nz(-6, 6), q = R.nz(-6, 6);
      return { fig: FIG.parabola((x) => (x - p) * (x - q) / 3, [], null, false), q: "Détermine les zéros de " + M("f(x) = " + poly([1, -(p + q), p * q])) + ".", spec: { kind: "set", values: [...new Set([p, q])] }, sol: "Produit-somme ou discriminant : " + M("f(x) = (" + xm(p) + ")(" + xm(q) + ")") + ", zéros " + M(p) + " et " + M(q) + "." };
    }
    if (d === 2) {
      const h = R.nz(-4, 4), k = R.int(-6, 6), a = R.pick([1, -1, 2, -2]);
      return { fig: FIG.parabola((x) => (a * (x - h) ** 2 + k) / 3, [], null, false), q: "Détermine le sommet de la parabole " + M("f(x) = " + poly([a, -2 * a * h, a * h * h + k])) + ". Réponds « x ; y ».", spec: { kind: "pair", values: [h, k] }, sol: M("x_S = -\\frac{b}{2a} = " + h) + " ; " + M("y_S = f(" + h + ") = " + k) + "." };
    }
    const a = R.pick([-2, -1, 2, 3, -3]), b = R.nz(-7, 7), c = R.int(-5, 5);
    const xs = -b / (2 * a), ys = a * xs * xs + b * xs + c;
    return { fig: FIG.parabola((x) => (a * x * x + b * x + c) / 4, [], null, false), q: "Détermine le sommet de " + M("f(x) = " + poly([a, b, c])) + ". Réponds « x ; y » (fractions acceptées).", spec: { kind: "pair", values: [xs, ys] }, sol: M("x_S = -\\frac{" + b + "}{" + 2 * a + "} = " + ratT(xs)) + " ; " + M("y_S = f(x_S) = " + ratT(ys)) + "." };
  },

  f2expr(d) {
    if (d === 1) {

  eqrat(d) {

  ineq(d) {

      if (Math.abs(a) === 1) return GEN.ineq(1);
      const f = (x) => a * (x - x0);
      return { q: "Résous : " + M(lin(a, b) + " " + OPT[op] + " " + (a * x0 + b)) + ".", spec: solsetSpec(signSet(f, [x0], [], op)), sol: M(a + "x " + OPT[op] + " " + a * x0) + (a < 0 ? " ; on divise par " + M(a) + " (négatif) : on retourne le signe" : "") + " ; " + M("S = " + SolSet.show(signSet(f, [x0], [], op))) + "." };
    }
    if (d === 2) {
      const p = R.nz(-6, 5), q = R.nz(-6, 6); if (p === q) return GEN.ineq(2);
      const f = (x) => (x - p) / (x - q);
      return { q: "Résous " + M("\\frac{" + xm(p) + "}{" + xm(q) + "} " + OPT[op] + " 0") + ".", spec: solsetSpec(signSet(f, [p], [q], op)), sol: "Tableau des signes (zéro " + M(p) + ", valeur interdite " + M(q) + ") : " + M("S = " + SolSet.show(signSet(f, [p], [q], op))) + "." };
    }
    let p, q, r, s; do { p = R.nz(-5, 5); q = R.nz(-5, 5); r = R.nz(-6, 6); s = R.nz(-6, 6); } while (new Set([p, q, r, s]).size < 4);
    const f = (x) => ((x - p) * (q - x)) / ((x - r) * (x - s));
    const den = poly(pmul([1, -r], [1, -s]));
    return { q: "Résous " + M("\\frac{(" + xm(p) + ")(" + q + " - x)}{" + den + "} " + OPT[op] + " 0") + ".", spec: solsetSpec(signSet(f, [p, q], [r, s], op)), sol: "Dénominateur " + M("(" + xm(r) + ")(" + xm(s) + ")") + " ; tableau des signes avec " + M(p) + ", " + M(q) + " (zéros) et " + M(r) + ", " + M(s) + " (interdites) : " + M("S = " + SolSet.show(signSet(f, [p, q], [r, s], op))) + "." };
  },

  homog(d) {
    let a, b, c, e; do { a = R.nz(-5, 5); b = R.int(-8, 8); c = R.nz(-3, 3); e = R.int(-8, 8); } while (a * e - b * c === 0);
    const f = (x) => (a * x + b) / (c * x + e), txt = "f(x) = \\frac{" + lin(a, b) + "}{" + lin(c, e) + "}";
    const fig = FIG.plot([{ f }], [], { grid: false, ticks: false, label: "hyperbole" });
    if (d === 1) return { fig, q: "Soit " + M(txt) + ". Quelle est l'équation de l'asymptote verticale ? Donne la valeur de " + M("x") + ".", spec: { kind: "value", value: -e / c }, sol: "Le dénominateur s'annule en " + M("x = " + ratT(-e / c)) + " (et pas le numérateur) : asymptote " + M("x = " + ratT(-e / c)) + "." };
    if (d === 2) return { fig, q: "Soit " + M(txt) + ". Quelle est l'équation de l'asymptote horizontale ? Donne la valeur de " + M("y") + ".", spec: { kind: "value", value: a / c }, sol: "Quand " + M("x") + " devient grand, " + M("f(x) \\approx \\frac{" + cx(a) + "x}{" + cx(c) + "x}") + " : asymptote " + M("y = " + ratT(a / c)) + "." };
    const inv = "(" + lin(-e, b) + ")/(" + lin(c, -a) + ")";
    return { fig, q: "Soit " + M(txt) + ". Détermine la réciproque " + M("f^{-1}(x)") + ".", spec: { kind: "expr", expr: inv }, canon: inv, sol: M("y = \\frac{" + lin(a, b) + "}{" + lin(c, e) + "} \\iff y(" + lin(c, e) + ") = " + lin(a, b)) + " ; on isole " + M("x") + " : " + M("f^{-1}(x) = \\frac{" + lin(-e, b) + "}{" + lin(c, -a) + "}") + "." };
  },

  trigfn(d) {
    const A = R.pick([1, 2, 3, 4, 0.5]), k = R.pick([1, 2, 3, 4]), m = R.int(-2, 2), fn = R.pick(["sin", "cos"]);
    const txt = "f(x) = " + (A === 1 ? "" : dec(A)) + "\\" + fn + "(" + (k === 1 ? "" : k) + "x)" + (m ? sg(m) : "");
    const fig = FIG.plot([{ f: (x) => A * Math[fn](k * x) + m }], [], { xr: [-1, 7], yr: [-6, 6], grid: false, ticks: false, label: "sinusoïde" });
    if (d === 1) return { fig, q: "Quelle est l'amplitude de " + M(txt) + " ?", spec: { kind: "value", value: A }, sol: "L'amplitude est le coefficient devant " + M("\\" + fn) + " : " + M(dec(A)) + "." };
    if (d === 2) return { fig, q: "Quelle est la période de " + M(txt) + " ? (avec π)", spec: { kind: "value", value: (2 * Math.PI) / k }, sol: M("T = \\frac{2\\pi}{k}" + " = " + ["", "2\\pi", "\\pi", "\\frac{2\\pi}{3}", "\\frac{\\pi}{2}"][k]) + " (ici " + M("k = " + k) + ")." };
    return { fig, q: "Quelle est la valeur maximale de " + M(txt) + ", et en quel plus petit " + M("x \\ge 0") + " est-elle atteinte ? Réponds « x ; max » (avec π).", spec: { kind: "pair", values: [fn === "cos" ? 0 : Math.PI / (2 * k), A + m] }, sol: "Le maximum vaut " + M(dec(A) + (m ? sg(m) : "") + " = " + dec(A + m)) + " ; il est atteint quand " + M("\\" + fn + "(" + (k === 1 ? "" : k) + "x) = 1") + ", soit " + M("x = " + (fn === "cos" ? "0" : "\\frac{\\pi}{" + 2 * k + "}")) + "." };
  },

  droites(d) {
    const m = R.nz(-3, 3), h = R.nz(-5, 5);
    if (d === 1) {
      const x1 = R.int(-3, 0), x2 = x1 + R.int(1, 3);
      return { fig: FIG.plot([{ f: (x) => m * x + h }], [[x1, m * x1 + h, "A"], [x2, m * x2 + h, "B"]], { numbers: true, yr: [-8, 8], squash: 0.7 }), q: "Donne l'équation de la droite passant par " + M("A(" + x1 + " ; " + (m * x1 + h) + ")") + " et " + M("B(" + x2 + " ; " + (m * x2 + h) + ")") + ". Écris « y = … ».", spec: { kind: "expr", expr: lin(m, h) }, canon: lin(m, h), sol: "Pente " + M("m = \\frac{" + (m * x2 + h) + " - " + par(m * x1 + h) + "}{" + x2 + " - " + par(x1) + "} = " + m) + " ; ordonnée à l'origine " + M(h) + " : " + M("y = " + lin(m, h)) + "." };
    }
    if (d === 2) {
      const x0 = R.nz(-4, 4), y0 = R.int(-5, 5), perp = R.rand() < 0.6, mm = perp ? -1 / m : m, hh = y0 - mm * x0;
      const ex = rat(mm) + "*x" + (hh < 0 ? " - " + rat(-hh) : " + " + rat(hh));
      return { q: "Donne l'équation de la droite " + (perp ? "perpendiculaire" : "parallèle") + " à " + M("y = " + lin(m, h)) + " passant par " + M("P(" + x0 + " ; " + y0 + ")") + ". Écris « y = … ».", spec: { kind: "expr", expr: ex }, canon: ex, sol: (perp ? "Pentes perpendiculaires : " + M("m \\cdot m' = -1") + " donc " + M("m' = " + ratT(mm)) : "Même pente " + M(m)) + " ; avec " + M("P") + " : " + M("h = " + ratT(hh)) + "." };
    }
    let a, b, c, e; do { a = R.nz(-4, 4); b = R.nz(-4, 4); c = R.nz(-4, 4); e = R.nz(-4, 4); } while (a * e - b * c === 0);
    const x = R.nz(-5, 5), y = R.nz(-5, 5);
    const T = (u, v, w) => (u === 1 ? "" : u === -1 ? "-" : u) + "x " + (v < 0 ? "- " + (v === -1 ? "" : -v) : "+ " + (v === 1 ? "" : v)) + "y = " + w;
    return { q: "Donne le point d'intersection des droites " + M(T(a, b, a * x + b * y)) + " et " + M(T(c, e, c * x + e * y)) + ". Réponds « x ; y ».", spec: { kind: "pair", values: [x, y] }, sol: "On résout le système : " + M("I(" + x + " ; " + y + ")") + "." };
  },

  cercle(d) {
    const a = R.int(-5, 5), b = R.int(-5, 5), r = R.int(1, 7);
    const sq = (v, n) => (v === 0 ? n + "^2" : "(" + n + sg(-v) + ")^2");
    if (d === 1) return { fig: FIG.plot([], [], { grid: true, ticks: false }), q: "Le cercle " + M(sq(a, "x") + " + " + sq(b, "y") + " = " + r * r) + " a pour centre " + M("C(a ; b)") + " et pour rayon " + M("r") + ". Réponds « a ; b ; r ».", spec: { kind: "pair", values: [a, b, r] }, sol: "Forme " + M("(x - a)^2 + (y - b)^2 = r^2") + " : " + M("C(" + a + " ; " + b + ")") + ", " + M("r = " + r) + "." };
    if (d === 2) {
      const D = -2 * a, E = -2 * b, F = a * a + b * b - r * r;
      const T = "x^2 + y^2" + (D ? sg(D) + "x" : "") + (E ? sg(E) + "y" : "") + (F ? sg(F) : "") + " = 0";
      return { q: "Détermine le rayon du cercle " + M(T) + ".", spec: { kind: "value", value: r }, sol: "On complète les carrés : " + M(sq(a, "x") + " + " + sq(b, "y") + " = " + r * r) + ", donc " + M("r = " + r) + "." };
    }
    const pts = [[3, 4], [4, 3], [5, 0], [0, 5], [-3, 4], [-4, 3], [-5, 0], [0, -5], [3, -4], [4, -3], [-3, -4], [-4, -3]];
    let P, Q; do { P = R.pick(pts); Q = R.pick(pts); } while (P[0] === Q[0]);
    const A = Q[1] - P[1], B = -(Q[0] - P[0]), C = A * P[0] + B * P[1], g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    const a2 = A / g, b2 = B / g, c2 = C / g;
    return { q: "Détermine les abscisses des points d'intersection du cercle " + M("x^2 + y^2 = 25") + " et de la droite " + M((a2 === 1 ? "" : a2 === -1 ? "-" : a2) + "x " + (b2 < 0 ? "- " + (b2 === -1 ? "" : -b2) : "+ " + (b2 === 1 ? "" : b2)) + "y = " + c2) + ".", spec: { kind: "set", values: [P[0], Q[0]] }, sol: "On isole une inconnue dans l'équation de la droite et on substitue : équation du 2e degré, " + M("x = " + P[0]) + " ou " + M("x = " + Q[0]) + " (points " + M("(" + P.join(" ; ") + ")") + " et " + M("(" + Q.join(" ; ") + ")") + ")." };
  },
});

const day = (d = new Date()) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return day(d); };
const INTERVALS = [0, 1, 3, 7, 14, 30];
const TARGET = { drill: -300, app: -100, defi: 80, defi4: 80, rev: -150 }; // écart visé au Mathélo (≈ 85 %, 65 %, 40 % de réussite)
const KIND_LABEL = { drill: "🔁 Automatisme", app: "🧩 Application", defi: "🏔 Défi", rev: "🔄 Révision" };
// Programme du jour : le format change d'un jour à l'autre ; l'équilibre se fait sur 7 jours.
const FORMATS = {
  defi: { label: "🏔 Défi du jour", slots: ["defi4"], text: "Un seul problème, à ton niveau. Prends ton temps." },
  auto: { label: "🔁 Série d'automatismes", slots: ["drill", "drill", "drill", "drill", "drill", "drill", "drill", "drill"], text: "8 calculs rapides, enchaînés." },
  app: { label: "🧩 Applications", slots: ["app", "app", "app"], text: "Trois questions de fond sur tes notions actuelles." },
  mixte: { label: "⚖️ Mixte", slots: ["drill", "app", "defi"], text: "Un automatisme, une application, un défi." },
  revision: { label: "🔄 Révision", slots: ["rev", "rev", "rev", "rev"], text: "Les notions à revoir aujourd'hui, pour ne pas les oublier." },
};
const WEEK = { defi: 2, auto: 2, app: 1, mixte: 1, revision: 1 };

// ---------- Mathélo : score de type Elo ----------
// Année HarmoS équivalente : CH 9e–11e = 9–11 ; FR 6e = 8 … 3e = 11.
const harmos = (system, grade) => (system === "FR" ? grade + 2 : grade);
// Score d'une question : niveau scolaire de la notion + difficulté.
function itemRating(profile, id, d) {
  const n = NOTIONS.find((x) => x.id === id);
  // Niveau propre à la notion : l'année où elle apparaît au CO / Collège. Reprise plus tard en MP : demi-écart en plus.
  const pl = placeOf(n, profile) || n.CH || n.MP || n.FR, base = profile.system === "CH" && n.CH ? n.CH[0] : pl[0];
  const g = base + Math.max(0, pl[0] - base) / 2;
  return 700 + (harmos(profile.system, g) - 8) * 150 + 40 + (d - 1) * 130;
}
// Échelle de référence (sans données partagées) : Mathélo typique en fin d'année par niveau HarmoS.
const ELO_REF = [[8, 850], [9, 1000], [10, 1150], [11, 1300], [12, 1450], [13, 1600]];
function eloLabel(profile, r) {
  const sys = SYSTEMS[profile.system];
  const name = (h) => { const g = sys.grades.find(([gg]) => harmos(profile.system, gg) === h); return g ? g[1] : h === 12 ? (profile.system === "FR" ? "2nde" : "1re du Collège") : h === 13 ? (profile.system === "FR" ? "1re" : "2e du Collège") : h + "e"; };
  let lvl = ELO_REF[0];
  for (const ref of ELO_REF) if (r >= ref[1] - 75) lvl = ref;
  const h = lvl[0], gap = r - lvl[1];
  const adj = gap >= 60 ? "solide" : gap <= -40 ? "en route vers la fin" : "typique de fin";
  return r < ELO_REF[0][1] - 75 ? "En route vers la fin de " + name(8) : "Niveau " + adj + (adj === "solide" ? " de " : " de ") + name(h);
}

const Engine = {
  newState(profile) {
    const h = harmos(profile.system, profile.grade);
    const start = 700 + (h - 8) * 150 + 100;
    return { v: 1, profile, notions: {}, streak: { count: 0, last: null }, history: [], created: day(), elo: { r: Math.round(start), n: 0, log: [] } };
  },

  // Notions du programme jusqu'à l'année de l'élève, avec statut proposé selon la date.
  catalog(profile, date = new Date()) {
    const mo = schoolMonth(date);
    return NOTIONS.filter((n) => { const pl = placeOf(n, profile); return pl && pl[0] <= profile.grade; }).map((n) => {
      const [g, m] = placeOf(n, profile);
      // Année en cours : l'élève dit ce qu'il a vu (pas de calendrier commun). MP : semestre du PEE.
      let status = "vu";
      if (g === profile.grade) status = m === "S1" ? (mo <= 4 ? "encours" : "vu") : m === "S2" ? (mo <= 4 ? "nonvu" : "encours") : typeof m === "number" ? (mo > m ? "vu" : mo === m ? "encours" : "nonvu") : "nonvu";
      return { ...n, defaultStatus: status, current: g === profile.grade };
    });
  },

  // Catalogue modifié depuis la création du profil : ajoute les notions manquantes (anciennes = vues, année en cours = à cocher).
  migrate(state) {
    let changed = false;
    for (const c of this.catalog(state.profile)) if (!state.notions[c.id]) {
      const status = c.defaultStatus;
      state.notions[c.id] = { status, m: status === "vu" ? 0.55 : status === "encours" ? 0.4 : 0, box: status === "vu" ? 1 : 0, due: day(), seen: 0, ok: 0 };
      changed = true;
    }
    for (const id of Object.keys(state.notions)) { const n = NOTIONS.find((x) => x.id === id); if (!n || !placeOf(n, state.profile)) { delete state.notions[id]; changed = true; } }
    return changed;
  },

  initNotions(state, statuses) {
    state.notions = {};
    for (const [id, status] of Object.entries(statuses)) {
      state.notions[id] = { status, m: status === "vu" ? 0.55 : status === "encours" ? 0.4 : 0, box: status === "vu" ? 1 : 0, due: day(), seen: 0, ok: 0 };
    }
  },

  eligible(state) {
    return Object.entries(state.notions).filter(([, s]) => s.status !== "nonvu").map(([id]) => id);
  },

  // Difficulté : visée ≈ 70 % de réussite (question ≈ 150 points sous le Mathélo), corrigée par la maîtrise de la notion.
  difficulty(state, id) {
    const cap = difficultyCap(state.profile), m = state.notions[id].m;
    let best = 1, bestGap = Infinity;
    for (let d = 1; d <= cap; d++) {
      const gap = Math.abs(itemRating(state.profile, id, d) - (state.elo.r - 150));
      if (gap < bestGap) { bestGap = gap; best = d; }
    }
    if (m < 0.3) best = Math.max(1, best - 1);
    if (m > 0.8) best = Math.min(cap, best + 1);
    // Niveau 4 (problème) : notion solide, Mathélo suffisant, environ une fois sur trois.
    if (hasProb(id) && m >= 0.7 && state.elo.r >= itemRating(state.profile, id, 4) - 250 && Math.random() < 0.35) return 4;
    return best;
  },

  // Mise à jour du Mathélo. score : 1, 0,5 ou 0. K plus grand au début (positionnement rapide).
  updateElo(state, id, d, score, weight = 1) {
    const e = state.elo, q = itemRating(state.profile, id, d);
    const expected = 1 / (1 + Math.pow(10, (q - e.r) / 400));
    const K = (e.n < 20 ? 48 : e.n < 60 ? 32 : 20) * weight; // calibrage progressif : provisoire tant que n < 20
    const delta = Math.round(K * (score - expected));
    e.r = Math.max(400, e.r + delta);
    e.n++;
    const today = day(), last = e.log[e.log.length - 1];
    if (last && last[0] === today) last[1] = e.r; else e.log.push([today, e.r]);
    e.log = e.log.slice(-90);
    return delta;
  },

  make(state, id, d, seed) {
    const level = d || this.difficulty(state, id);
    return this.build(id, level, seed);
  },
  // Question reproductible : même notion, niveau et graine → même question.
  build(id, level, seed) {
    seed = seed || Math.floor(Math.random() * 46655) + 1;
    R.seed(seed * 7919 + level * 104729 + [...id].reduce((a, c) => a + c.charCodeAt(0), 0));
    const code = id + "-" + level + "-" + seed.toString(36);
    if (level === 4 && hasProb(id)) { const p = probFor(id)(); return { ...p, id, d: 4, seed, code, spec: { kind: "multi" }, hint: p.hints[0] }; }
    const q = GEN[id](level);
    return { ...q, id, d: level, seed, code, hint: q.hint || HINTS[id] };
  },
  // Lecture d'un code « eq2disc-2-k3f » → question exacte (ou null).
  fromCode(code) {
    const m = /^([a-z0-9]+)-([1-4])-([a-z0-9]+)$/.exec(String(code).trim().toLowerCase());
    if (!m || !GEN[m[1]] || (m[2] === "4" && !hasProb(m[1]))) return null;
    return this.build(m[1], +m[2], parseInt(m[3], 36));
  },

  // Positionnement : premier repère rapide (5 notions vues ou en cours) ; le niveau se précise ensuite au fil des séances, en variant les thèmes, notions récentes d'abord.
  placementPlan(state) {
    const all = this.eligible(state), recent = all.filter((id) => this.isRecent(state, id));
    const ids = recent.length >= 3 ? recent : all;
    const byTheme = {};
    for (const id of ids) {
      const n = NOTIONS.find((x) => x.id === id);
      (byTheme[n.theme] = byTheme[n.theme] || []).push(n);
    }
    const pl = (n) => placeOf(n, state.profile);
    Object.values(byTheme).forEach((arr) => arr.sort((a, b) => pl(b)[0] - pl(a)[0] || pl(b)[1] - pl(a)[1]));
    const plan = [];
    while (plan.length < 5 && Object.values(byTheme).some((a) => a.length)) {
      for (const arr of Object.values(byTheme)) if (arr.length && plan.length < 5) plan.push(arr.shift().id);
    }
    return plan;
  },

  // Résultat d'une question de positionnement : true, false ou null (« je ne sais pas »).
  placementResult(state, id, ok, d = 2) {
    this.updateElo(state, id, d, ok === true ? 1 : 0);
    const s = state.notions[id];
    if (ok === true) Object.assign(s, { m: 0.75, box: 2, due: addDays(day(), 3) });
    else if (ok === false) Object.assign(s, { m: 0.3, box: 0, due: day() });
    else Object.assign(s, { m: 0.2, box: 0, due: day() });
    s.placed = true;
  },

  // Séance du jour : notions dues et fragiles d'abord, puis « en cours », puis rappels espacés.
  // Notion « actuelle » : année en cours ou précédente. Les plus anciennes ne reviennent qu'en remédiation.
  isRecent(state, id) {
    const pl = placeOf(NOTIONS.find((n) => n.id === id), state.profile);
    return pl && pl[0] >= state.profile.grade - 1;
  },
  // Toutes les notions vues sont candidates ; les anciennes sont filtrées par niveau dans oldLevels.
  pool(state, kind) {
    return this.eligible(state);
  },
  // Notion ancienne : jamais triviale. Niveau 3 ou problème, assez proche de la cible ;
  // ou niveau ≥ 2 si l'élève l'a ratée (fragile), car alors elle n'est pas triviale pour lui.
  oldLevels(state, id, levels, target) {
    const s = state.notions[id], weak = s.m < 0.45;
    return levels.filter((d) => weak ? d >= 2 : d >= 3 && itemRating(state.profile, id, d) >= target - 150);
  },

  // Format du jour : le plus en retard sur l'équilibre des 7 derniers jours, jamais celui de la veille.
  chooseFormat(state, exclude = [], today = day()) {
    const since = addDays(today, -7), log = (state.formats || []).filter((f) => f.date >= since && f.date < today);
    const recentRev = log.some((x) => x.f === "revision" && x.date >= addDays(today, -3));
    const yesterday = (state.formats || []).filter((f) => f.date < today).slice(-1)[0];
    const due = this.eligible(state).filter((id) => state.notions[id].due <= today).length;
    let best = null;
    for (const f of Object.keys(FORMATS)) {
      if (exclude.includes(f)) continue;
      let sc = WEEK[f] - log.filter((x) => x.f === f).length;
      if (yesterday && yesterday.f === f) sc -= 3;
      if (f === "revision") sc += due >= 4 && !recentRev ? 1 : due >= 4 ? 0 : -1;
      if (f === "defi" && !this.eligible(state).some((id) => hasProb(id) && this.isRecent(state, id))) sc -= 0.5;
      sc += Math.random() * 0.4;
      if (!best || sc > best.sc) best = { f, sc };
    }
    return best ? best.f : "mixte";
  },

  planSession(state, format) {
    const f = format || this.todayFormat(state);
    return this.planSlots(state, FORMATS[f].slots);
  },
  // Format retenu pour aujourd'hui (stable dans la journée, sauf « Autre format »).
  todayFormat(state) {
    const today = day();
    if (!state.today || state.today.date !== today) state.today = { date: today, f: this.chooseFormat(state) };
    return state.today.f;
  },
  otherFormat(state) {
    const cur = this.todayFormat(state);
    state.today = { date: day(), f: this.chooseFormat(state, [cur]) };
    return state.today.f;
  },
  // Trace du format fait (pour l'équilibre sur 7 jours).
  logFormat(state, f) {
    const today = day();
    state.formats = (state.formats || []).filter((x) => x.date >= addDays(today, -30));
    if (!state.formats.some((x) => x.date === today && x.f === f)) state.formats.push({ date: today, f });
  },

  // Remplit des créneaux : pour chacun, la notion ET le niveau les plus proches de la cible fixée par le Mathélo.
  planSlots(state, slots) {
    const today = day(), elo = state.elo.r, cap = difficultyCap(state.profile), used = new Set(), plan = [];
    const maxOld = slots.includes("rev") ? 2 : 1;
    let old = 0;
    // Créneau « Rappel » : une notion ancienne, jamais triviale. Une séance sur trois environ ;
    // en révision, chaque fois qu'une notion ancienne est fragile. Sans candidate valable : créneau normal.
    const weakOld = this.eligible(state).some((id) => !this.isRecent(state, id) && state.notions[id].m < 0.45);
    const wantRappel = slots.length > 1 && ((slots.includes("rev") && weakOld) || Math.random() < 0.35);
    const rappelAt = wantRappel ? slots.length - 1 - Math.floor(Math.random() * Math.min(2, slots.length)) : -1;
    const choose = (kind, base, rappel) => {
      let best = null, pool = this.pool(state, base);
      if (kind === "rev") { const due = pool.filter((id) => state.notions[id].due <= today || state.notions[id].m < 0.5); if (due.length) pool = due; }
      for (const id of pool) {
        const s = state.notions[id], recent = this.isRecent(state, id), target = elo + TARGET[kind] + (s.easy || 0) * 120;
        if (rappel ? recent : !recent) continue; // les anciennes notions ne passent que par le créneau Rappel
        let levels = [1, 2, 3].filter((d) => d <= cap && (base !== "defi" || d >= 2) && (kind !== "drill" || d <= 2 || !recent));
        if ((kind === "defi4" || kind === "defi") && hasProb(id)) levels.push(4);
        if (!recent) levels = this.oldLevels(state, id, levels, target);
        for (const d of levels) {
          let sc = Math.abs(itemRating(state.profile, id, d) - target) / 100;
          if (rappel) sc = (s.m < 0.45 ? -1 : 0) + Math.max(0, itemRating(state.profile, id, d) - target) / 200;
          if (s.due <= today && base !== "defi") sc -= 0.6;
          if (kind === "app" || kind === "rev") sc -= (1 - s.m) * 0.8;
          if (s.status === "encours") sc -= 0.4;
          if (this.prepActive(state) && state.prep.ids.includes(id)) sc -= 1.2;
          if (used.has(id)) sc += 2;
          if (d === 4) sc -= kind === "defi4" ? 3 : 0.3;
          sc += Math.random() * 0.5;
          if (!best || sc < best.sc) best = { id, d, sc };
        }
      }
      return best;
    };
    for (const [si, kind] of slots.entries()) {
      const base = kind === "defi4" ? "defi" : kind;
      let best = si === rappelAt && old < maxOld ? choose(kind, base, true) : null;
      if (best) old++; else best = choose(kind, base, false);
      if (!best) best = choose(kind, base, true); // aucune notion de l'année disponible
      if (!best) continue;
      used.add(best.id);
      plan.push(best.id + "|" + best.d + "|" + base);
    }
    return plan;
  },

  // « Trop facile » : l'élève passe la question. Demi-victoire au Mathélo (sans répondre, on ne compte pas plein),
  // la notion monte, et son niveau visé est relevé (décalage par notion, qui retombe si l'élève échoue ensuite).
  tooEasy(state, id, d, kind) {
    const s = state.notions[id];
    s.easy = Math.min(3, (s.easy || 0) + 1);
    s.m = Math.min(1, s.m + (1 - s.m) * 0.25);
    s.box = Math.min(5, s.box + 1);
    s.due = addDays(day(), INTERVALS[s.box]);
    if (s.status === "encours" && s.m > 0.7) s.status = "vu";
    const delta = this.updateElo(state, id, d, 1, 0.5);
    // Remplaçante : même notion, un cran au-dessus (si possible), sinon la question suivante du programme.
    const cap = difficultyCap(state.profile), top = hasProb(id) && kind !== "drill" ? 4 : Math.min(3, cap);
    return { delta, next: d < top && d < 4 ? id + "|" + (d + 1) + "|" + (kind === "drill" ? "app" : kind || "app") : null };
  },

  // Score Moodle : 1 au premier essai, 0,5 au deuxième, 0 ensuite.
  record(state, id, d, tries, solved, partial) {
    const s = state.notions[id];
    if (partial !== undefined) { // problème : score partiel 0..1
      s.seen++;
      s.m = Math.min(1, Math.max(0, s.m + (partial - 0.5) * 0.2));
      if (partial >= 0.99) { s.box = Math.min(5, s.box + 1); s.ok++; } else if (partial < 0.5) s.box = 0;
      s.due = addDays(day(), partial >= 0.99 ? INTERVALS[s.box] : 1);
      return partial;
    }
    const today = day();
    s.seen++;
    if (solved && tries === 1) {
      s.m = Math.min(1, s.m + (1 - s.m) * (0.18 + 0.06 * d));
      s.box = Math.min(5, s.box + 1);
      s.ok++;
    } else if (solved) {
      s.m = Math.min(1, s.m + (1 - s.m) * 0.06);
    } else {
      s.m = s.m * 0.6;
      s.box = 0;
      if (s.easy) s.easy--;
    }
    s.due = addDays(today, solved && tries === 1 ? INTERVALS[s.box] : 1);
    if (s.status === "encours" && s.m > 0.7) s.status = "vu";
    return solved ? (tries === 1 ? 1 : 0.5) : 0;
  },

  finishDay(state, answered, score) {
    const today = day();
    if (answered > 0) {
      if (state.streak.last !== today) state.streak.count = state.streak.last === addDays(today, -1) ? state.streak.count + 1 : 1;
      state.streak.last = today;
      const h = state.history.find((x) => x.date === today);
      if (h) { h.n += answered; h.score += score; } else state.history.push({ date: today, n: answered, score });
      state.history = state.history.slice(-120);
    }
  },

  // « Je prépare mon test » : notions choisies, actif jusqu'au jour du test inclus.
  prepActive(state) { return !!(state.prep && state.prep.ids.length && state.prep.date >= day()); },
  planPrep(state) {
    const ids = state.prep.ids.filter((id) => state.notions[id]);
    const n = 7;
    const order = [...ids].sort((a, b) => state.notions[a].m - state.notions[b].m);
    const plan = [];
    for (let i = 0; plan.length < n - 1; i++) plan.push(order[i % order.length]);
    const withProb = order.filter((id) => hasProb(id));
    plan.push(withProb.length ? "PROB:" + withProb[0] : order[0]);
    return plan;
  },

  // Problème de la semaine : une notion « à problème » parmi celles vues, fixée par la semaine.
  weeklyProblem(state) {
    const ids = this.eligible(state).filter((id) => hasProb(id));
    if (!ids.length) return null;
    const d = new Date(), week = Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 6048e5);
    return ids[week % ids.length];
  },

  isProvisional(state) { return state.elo.n < 20; },

  themeLevels(state) {
    const out = {};
    for (const [id, s] of Object.entries(state.notions)) {
      if (s.status === "nonvu") continue;
      const th = NOTIONS.find((n) => n.id === id).theme;
      (out[th] = out[th] || []).push(s.m);
    }
    return Object.fromEntries(Object.entries(out).map(([k, v]) => [k, v.reduce((a, b) => a + b, 0) / v.length]));
  },
};

// ---------------- Entrée ----------------
let draft = { system: "CH", grade: 11, track: "college", minutes: 5 };

function screenWelcome() {

function screenLevel() {
  const sys = SYSTEMS[draft.system];
  if (!sys.grades.some(([g]) => g === draft.grade)) draft.grade = sys.grades[sys.grades.length - 2][0];
  const sec2 = draft.system === "CH" && draft.grade >= 12;
  h(`${brand}<div class="eyebrow">Étape 1 sur 3</div><h2>Où en es-tu ?</h2>
  <div class="card flat stack">${Object.keys(SYSTEMS).length > 1 ? `<h3>Ton école</h3><div class="seg" id="sys">${Object.entries(SYSTEMS).map(([k, v]) => `<button aria-pressed="${k === draft.system}" data-v="${k}">${v.label}</button>`).join("")}</div>` : ""}
  <h3>Ta classe cette année</h3><div class="seg" id="grade">${sys.grades.map(([g, n]) => `<button aria-pressed="${g === draft.grade}" data-v="${g}">${n}</button>`).join("")}</div>
  ${sec2 ? `<h3>Ta voie</h3><div class="seg" id="track"><button aria-pressed="${draft.track === "college"}" data-v="college">Collège (maturité gymnasiale)</button><button aria-pressed="${draft.track === "mp"}" data-v="mp">Maturité professionnelle</button></div>` : ""}</div>
  <p class="small muted">Chaque jour, l'app te propose un programme différent (un défi, une série d'automatismes, des applications…), équilibré sur la semaine. Pas de chrono : l'important, c'est de venir chaque jour.</p>
  <button class="btn-primary btn-big" id="next">Continuer</button>`);
  const bind = (id, key, num) => app.querySelectorAll("#" + id + " button").forEach((b) => (b.onclick = () => { draft[key] = num ? +b.dataset.v : b.dataset.v; screenLevel(); }));
  bind("sys", "system"); bind("grade", "grade", true); bind("track", "track");
  document.getElementById("next").onclick = () => { draft.statuses = null; screenNotions(); };
}

function screenNotions(editing = false) {
  const prof = editing ? state.profile : draft;
  const cat = Engine.catalog(prof);
  const st = editing ? Object.fromEntries(Object.entries(state.notions).map(([k, v]) => [k, v.status])) : (draft.statuses ||= Object.fromEntries(cat.map((c) => [c.id, c.defaultStatus])));
  // On ne demande que les notions de l'année : celles des années précédentes sont vues, sans poser la question.
  const groups = {};
  Object.keys(THEMES).forEach((th) => { const l = cat.filter((c) => c.current && c.theme === th); if (l.length) groups[th] = l; });
  const label = { vu: "déjà vu", encours: "en cours", nonvu: "pas encore" };
  h(`${brand}${editing ? "" : '<div class="eyebrow">Étape 2 sur 3</div>'}<h2>${editing ? "Mes notions" : "Qu'as-tu déjà étudié ?"}</h2>
  <p class="muted">${editing ? "Tu as vu une nouvelle notion en classe ? Mets-la à jour : elle entrera dans tes questions." : "Seulement les notions de cette année : indique celles que tu as déjà vues en classe. Tu pourras mettre à jour quand tu veux."}</p>
  ${Object.keys(groups).length ? "" : '<div class="card flat"><p class="muted">Rien à cocher : tout ce qui te concerne vient des années précédentes.</p></div>'}
  ${Object.entries(groups).map(([th, list]) => `<div class="card flat"><h3>${THEMES[th]}</h3>${list.map((c) => `<div class="notion"><div><b>${c.label}</b></div><div class="ex">\\(${c.ex}\\)</div>
    <div class="tri" data-id="${c.id}">${["vu", "encours", "nonvu"].map((s) => `<button aria-pressed="${st[c.id] === s}" data-v="${s}">${label[s]}</button>`).join("")}</div></div>`).join("")}</div>`).join("")}
  <button class="btn-primary btn-big" id="next">${editing ? "Enregistrer" : "Continuer"}</button>${editing ? '<button class="btn-ghost" id="back">Annuler</button>' : ""}`);
  app.querySelectorAll(".tri").forEach((tri) => tri.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    st[tri.dataset.id] = b.dataset.v;
    tri.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  })));
  document.getElementById("next").onclick = () => {
    if (editing) {
      for (const [id, s] of Object.entries(st)) {
        const n = state.notions[id];
        if (n.status === "nonvu" && s !== "nonvu") Object.assign(n, { m: 0.4, box: 0, due: day() });
        n.status = s;
      }
      save(); screenHome();
    } else {
      state = Engine.newState({ system: draft.system, grade: draft.grade, track: draft.track, minutes: draft.minutes });
      Engine.initNotions(state, st);
      save(); startPlacement();
    }
  };
  if (editing) document.getElementById("back").onclick = screenHome;
}

// ---------------- Positionnement ----------------
function startPlacement() {
  const plan = Engine.placementPlan(state);
  let i = 0;
  const next = () => {
    if (i >= plan.length) { state.placed = true; save(); return screenPlacementDone(); }
    const id = plan[i], q = Engine.make(state, id, Math.min(2, difficultyCap(state.profile)));
    renderQuestion(q, {
      eyebrow: "Étape 3 sur 3 · positionnement " + (i + 1) + "/" + plan.length, single: true,
      onDone: (res) => { Engine.placementResult(state, id, res.solved ? true : res.dontKnow ? null : false, q.d); save(); },
      onNext: () => { i++; next(); },
    });
  };
  next();
}

function screenPlacementDone() {
  const lv = Engine.themeLevels(state);
  h(`${brand}<h2>Ton <span class="mark">point de départ</span></h2>
  <div class="card">${eloBlock()}</div>
  <div class="card flat"><h3>Par thème</h3><div class="bars">${themeBars(lv)}</div>
  <p class="small muted">Ton niveau va se préciser au fil des séances : les 20 premières questions servent de calibrage.</p></div>
  <button class="btn-primary btn-big" id="go">Voir ma première séance</button>`);
  document.getElementById("go").onclick = screenHome;
}

// ---------------- Accueil ----------------
function eloBlock() {
  const e = state.elo, prev = e.log.length > 1 ? e.log[e.log.length - 2][1] : null, d = prev === null ? 0 : e.r - prev;
  const pts = e.log.slice(-30).map((x) => x[1]);
  let spark = "";
  if (pts.length > 1) {
    const lo = Math.min(...pts) - 10, hi = Math.max(...pts) + 10, X = (i) => (i / (pts.length - 1)) * 300, Y = (v) => 52 - ((v - lo) / (hi - lo)) * 48;
    const line = pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
    spark = `<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none"><path class="a" d="${line} L300,56 L0,56 Z"/><path class="l" d="${line}"/><circle cx="300" cy="${Y(pts[pts.length - 1]).toFixed(1)}" r="3.5"/></svg>`;
  }
  return `<div class="elo"><div><div class="eyebrow">Mathélo ${Engine.isProvisional(state) ? '<span class="badge">provisoire</span>' : ""}</div><div class="num">${e.r}</div>
  ${d ? `<div class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲ +" : "▼ "}${d} depuis hier</div>` : ""}</div>
  <div class="stack"><b>${eloLabel(state.profile, e.r)}</b>${spark}</div></div>`;
}
function themeBars(lv) {
  return Object.entries(lv).map(([th, m]) => `<div class="bar"><span>${THEMES[th]}</span><span class="track"><i style="width:${Math.round(m * 100)}%"></i></span></div>`).join("");
}

function screenHome() {
  if (!state) return screenWelcome();
  const today = day(), done = state.history.find((x) => x.date === today);
  const s = state.streak, alive = s.last === today || s.last === addDays(today, -1), wp = Engine.weeklyProblem(state), fmt = Engine.todayFormat(state);
  save();
  h(`<div class="spread">${brand}<span class="small muted">${SYSTEMS[state.profile.system].label} · ${gradeName(state.profile)}</span></div>
  <div class="card flat streak"><span class="flame" aria-hidden="true">${alive && s.count ? "🔥" : "✏️"}</span><div><b>${alive ? s.count : 0} ${(alive ? s.count : 0) > 1 ? "jours" : "jour"}</b> <span class="muted">d'affilée</span><div class="small muted">${done ? "Séance du jour faite : " + done.n + " question" + (done.n > 1 ? "s" : "") + ". Tu peux en refaire une." : "Ta séance du jour t'attend."}</div></div></div>

  <div class="spread"><span class="small muted">Varié d'un jour à l'autre, équilibré sur la semaine.</span><button class="btn-ghost small" id="other">Autre format</button></div></div>
  ${Engine.prepActive(state) ? (() => { const left = Math.round((new Date(state.prep.date) - new Date(today)) / 864e5); return `<div class="card flat stack"><div class="eyebrow">Je prépare mon test</div><h3>${left === 0 ? "Test aujourd'hui" : left === 1 ? "Test demain" : "Test dans " + left + " jours"} · ${state.prep.ids.length} notion${state.prep.ids.length > 1 ? "s" : ""}</h3><p class="small muted">${state.prep.ids.map((id) => NOTIONS.find((n) => n.id === id).label).join(" · ")}</p><div class="row"><button class="btn-primary" id="prepgo">Séance de révision</button><button class="btn-ghost" id="prepedit">Modifier</button></div></div>`; })() : ""}
  ${wp ? `<div class="card flat stack"><div class="eyebrow">Problème de la semaine</div><h3>${NOTIONS.find((n) => n.id === wp).label}</h3><p class="small muted">Un problème en plusieurs étapes, avec indices. Facultatif, et il rapporte gros.</p><button id="wp">Relever le défi</button></div>` : ""}
  <div class="card flat"><h3>Mes thèmes</h3><div class="bars">${themeBars(Engine.themeLevels(state))}</div></div>
  <div class="stack">${Engine.prepActive(state) ? "" : '<button id="prep">Je prépare un test</button>'}<button id="notions">J'ai vu une nouvelle notion en classe</button><button id="level">Changer de classe ou d'école</button>
  <div class="confirm" id="reset"><button class="btn-ghost" id="r1">Tout effacer</button></div></div>`);
  document.getElementById("go").onclick = startSession;
  document.getElementById("other").onclick = () => { Engine.otherFormat(state); save(); screenHome(); };
  if (wp) document.getElementById("wp").onclick = () => { session = { plan: [wp], i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), weekly: true }; nextQuestion(); };
  document.getElementById("notions").onclick = () => screenNotions(true);
  const byId = (x) => document.getElementById(x);
  if (byId("prep")) byId("prep").onclick = screenPrep;
  if (byId("prepedit")) byId("prepedit").onclick = screenPrep;
  if (byId("prepgo")) byId("prepgo").onclick = () => { session = { plan: Engine.planPrep(state), i: 0, score: 0, answered: 0, start: Date.now(), elo0: state.elo.r, ids: new Set(), prep: true }; nextQuestion(); };
  document.getElementById("level").onclick = () => { draft = { ...state.profile }; screenLevel(); };
  document.getElementById("r1").onclick = () => {
    document.getElementById("reset").innerHTML = '<span class="small">Effacer ta progression et ton Mathélo ?</span><button id="r2">Oui, effacer</button><button class="btn-ghost" id="r3">Non</button>';
    document.getElementById("r2").onclick = () => { Store.clear(); state = null; screenWelcome(); };
    document.getElementById("r3").onclick = screenHome;
  };
}

// ---------------- Je prépare mon test ----------------
function screenPrep() {
  const cat = Engine.catalog(state.profile).filter((c) => state.notions[c.id] && state.notions[c.id].status !== "nonvu");
  const chosen = new Set(state.prep && Engine.prepActive(state) ? state.prep.ids : []);
  // On ne demande que les notions de l'année : celles des années précédentes sont vues, sans poser la question.
  const groups = {};
  Object.keys(THEMES).forEach((th) => { const l = cat.filter((c) => c.current && c.theme === th); if (l.length) groups[th] = l; });
  const date = state.prep && Engine.prepActive(state) ? state.prep.date : addDays(day(), 7);
  h(`${brand}<h2>Je prépare <span class="mark">un test</span></h2>
  <p class="muted">Choisis les notions de ton test et sa date. Jusqu'à ce jour-là, tes séances porteront surtout sur elles, avec un problème pour finir.</p>
  <div class="card flat stack"><label for="pdate"><h3>Date du test</h3></label><input type="date" id="pdate" value="${date}" min="${day()}" class="datein"></div>
  ${Object.keys(groups).length ? "" : '<div class="card flat"><p class="muted">Rien à cocher : tout ce qui te concerne vient des années précédentes.</p></div>'}
  ${Object.entries(groups).map(([th, list]) => `<div class="card flat"><h3>${THEMES[th]}</h3><div class="checks">${list.map((c) => `<label class="check"><input type="checkbox" value="${c.id}" ${chosen.has(c.id) ? "checked" : ""}> <span>${c.label}</span></label>`).join("")}</div></div>`).join("")}
  <p class="small muted" id="perr"></p>
  <button class="btn-primary btn-big" id="save">Enregistrer mon test</button>
  <div class="row"><button class="btn-ghost" id="back">Annuler</button>${chosen.size ? '<button class="btn-ghost" id="del">Supprimer ce test</button>' : ""}</div>`);
  document.getElementById("save").onclick = () => {
    const ids = [...app.querySelectorAll(".check input:checked")].map((i) => i.value), dt = document.getElementById("pdate").value;
    if (!ids.length) { document.getElementById("perr").textContent = "Coche au moins une notion."; return; }
    if (!dt || dt < day()) { document.getElementById("perr").textContent = "Choisis une date à partir d'aujourd'hui."; return; }
    state.prep = { ids, date: dt }; save(); screenHome();
  };
  document.getElementById("back").onclick = screenHome;
  const del = document.getElementById("del");
  if (del) del.onclick = () => { state.prep = null; save(); screenHome(); };
}
